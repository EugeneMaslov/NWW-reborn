l_russian:
 NWW_1936_NAME: "Без мировой войны"
 NWW_1936_DESC: "1 января 1936 года. Великая война закончилась двадцать лет назад, и мир затаил дыхание в тревожном перемирии."
 NWW_GER_DESC: "Германская империя стоит незыблемо под властью кайзера Вильгельма II."
 NWW_FRA_DESC: "Франция избежала мировой войны и сохранила людей, предприятия и научные школы. Но Третья республика погрязла в кабинетных кризисах, депрессия расколола общество, а заморские территории требуют нового договора. Реформировать парламент, вернуть корону, передать власть трудовым организациям или доверить страну военному кабинету — выбор определит, какую Францию встретит следующий европейский конфликт."
 NWW_ENG_DESC: "Британская империя."
 NWW_SOV_DESC: "Союз Советских Социалистических Республик."
 NWW_ITA_DESC: "Королевство Италия."
 NWW_JAP_DESC: "Японская империя."
 NWW_USA_DESC: "Соединённые Штаты Америки."
 NWW_CHI_DESC: "Китайская республика — единая и неделимая."
 NWW_AUS_DESC: "Австрийская республика."
 NWW_HUN_DESC: "Королевство Венгрия."
 NWW_TUR_DESC: "Османская империя."
 NWW_YUG_DESC: "Королевство Югославия."
 NWW_CRO_DESC: "Государство Хорватия."
 NWW_UKR_DESC: "Украинская ССР — союзник Москвы."
 NWW_POL_DESC:0 "Польша возродилась во время Великой смуты 1918–1922 годов и заняла Галицию, но осталась без моря. Познань, Данциг и Силезия принадлежат Германии. После смерти Пилсудского режим Санации расколот между Замком и полковниками; германские инвестиции поддерживают заводы ценой зависимости. Австрия требует Галицию, а спор за Вильно мешает соглашению с ЛитБелом. Сохранит ли республика независимость, выберет ли сделку с Берлином, национальную революцию или Красную Вислу?"
 NWW_ROM_DESC: "Королевство Румыния."
 NWW_OTHER_DESC: "Остальной мир."
 GER_WILHELM_II_DESC: "Император и король Пруссии, последний кайзер."
 GER_WILHELM_III_DESC: "Наследник престола Гогенцоллернов."
