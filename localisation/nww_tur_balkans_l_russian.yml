l_russian:
 NWW_TUR_sultans_shadow:0 "Авторитет султана и халифа"
 NWW_TUR_sultans_shadow_desc:0 "Султанат пережил десятилетия реформ, но двор, улемы и армия по-разному понимают его будущее. Признаем духовный авторитет султана, сохранив профессиональные военные и гражданские учреждения."
 NWW_TUR_ottoman_bourgeoisie:0 "Османская буржуазия"
 NWW_TUR_ottoman_bourgeoisie_desc:0 "Меджлис закрепит единые правила торговли и собственности для всех общин. Капитал Стамбула послужит развитию городов, а не новым завоеваниям."
 NWW_TUR_agrarian_reform:0 "Аграрная реформа"
 NWW_TUR_agrarian_reform_desc:0 "Земельные комитеты перераспределят крупные поместья и обеспечат крестьян кредитом и техникой. Рабочая федерация должна опираться и на Анатолию, и на провинции."
 NWW_TUR_rumelian_logistics:0 "Снабжение Румелийского фронта"
 NWW_TUR_rumelian_logistics_desc:0 "Расширим склады, дороги и аэродромы Восточной Фракии. Балканская кампания требует надёжного снабжения, а не одних имперских лозунгов."
 NWW_TUR_war_industry_program:0 "Имперская программа вооружений"
 NWW_TUR_war_industry_program_desc:0 "Государственные заказы и долгосрочные соглашения с промышленниками дадут армии современное оружие. Новый арсенал и военная промышленная программа поддержат подготовку кампании."
 NWW_TUR_greek_settlement:0 "Греческое урегулирование"
 NWW_TUR_greek_settlement_desc:0 "После завоевания Греции восстановим порты и местное управление. Провинции получат гражданские гарантии; местная администрация и гарнизоны по-прежнему необходимы."
 NWW_TUR_balkan_mandate:0 "Османская балканская доктрина"
 NWW_TUR_balkan_mandate_desc:0 "Болгарская и греческая кампании открыли путь на север и запад. Порта предъявит претензии на балканские земли; отдельные решения Генерального штаба позволят перейти к новым войнам. Мирное исчезновение соседнего государства не передаёт нам его земли."
 NWW_TUR_serbian_campaign:0 "На Белград"
 NWW_TUR_serbian_campaign_desc:0 "Сербское королевство перекрывает дорогу к Дунаю. Подготовим самостоятельную кампанию за его полное подчинение. Союзников империи эта программа не затрагивает."
 NWW_TUR_albanian_campaign:0 "Албанский плацдарм"
 NWW_TUR_albanian_campaign_desc:0 "Албанские порты дадут империи выход к Адриатике. Генеральный штаб разработает план их захвата и полного присоединения Албании."
 NWW_TUR_romanian_campaign:0 "К нижнему Дунаю"
 NWW_TUR_romanian_campaign_desc:0 "Плодородные земли, нефть и дунайские переправы Румынии имеют стратегическое значение. После побед на юге мы можем начать новую северную кампанию."
 NWW_TUR_adriatic_campaign:0 "Босния и Адриатика"
 NWW_TUR_adriatic_campaign_desc:0 "Предъявим хорватскому государству имперские претензии на Боснию и адриатическое побережье. Если эти земли уже захватила другая держава, претензии балканской доктрины сохраняются, но этот фокус не начинает войну с новым владельцем автоматически."
 NWW_TUR_rumelian_governorates:0 "Румелийские генерал-губернаторства"
 NWW_TUR_rumelian_governorates_desc:0 "Создадим постоянную гражданскую администрацию балканских провинций, согласуем местные хартии и снабжение гарнизонов. Сопротивление снизится, а подчинение будет расти; провинции не получат национальный статус одним указом."
 NWW_TUR_modern_war_ministry_tt:0 "Завершён фокус «Турецкая армия»."
 NWW_TUR_BUL_campaign_tt:0 "Получить претензии на земли Болгарии и бессрочную цель войны за полное завоевание. При капитуляции этой страны перед османами после данного фокуса она будет полностью присоединена. Победа другой державы не передаёт нам её земли."
 NWW_TUR_GRE_campaign_tt:0 "Получить претензии на земли Греции и бессрочную цель войны за полное завоевание. При капитуляции этой страны перед османами после данного фокуса она будет полностью присоединена. Победа другой державы не передаёт нам её земли."
 NWW_TUR_YUG_campaign_tt:0 "Получить претензии на земли Сербии и бессрочную цель войны за полное завоевание. При капитуляции этой страны перед османами после данного фокуса она будет полностью присоединена. Победа другой державы не передаёт нам её земли."
 NWW_TUR_ALB_campaign_tt:0 "Получить претензии на земли Албании и бессрочную цель войны за полное завоевание. При капитуляции этой страны перед османами после данного фокуса она будет полностью присоединена. Победа другой державы не передаёт нам её земли."
 NWW_TUR_ROM_campaign_tt:0 "Получить претензии на земли Румынии и бессрочную цель войны за полное завоевание. При капитуляции этой страны перед османами после данного фокуса она будет полностью присоединена. Победа другой державы не передаёт нам её земли."
