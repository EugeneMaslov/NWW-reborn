l_english:
 MKN_focus: "Makhnovist Free Territory"
 MKN_the_free_territory: "The Free Territory"
 MKN_the_free_territory_desc: "No masters, no states - only free soviets of peasants and workers."
 MKN_farmers_and_workers: "Farmers and Workers"
 MKN_farmers_and_workers_desc: "The Free Territory stands on the hands that labor, not on the crowns of the old world."
 MKN_shadow_republic: "Shadow Republic"
 MKN_shadow_republic_desc: "The state that never quite appears, but is always felt."
 MKN_free_soviets: "Free Soviets"
 MKN_free_soviets_desc: "Every village its own commune, every commune its own voice."
 MKN_tachanka_columns: "Tachanka Columns"
 MKN_tachanka_columns_desc: "The tachanka columns program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_nabat_federation: "The Nabat Federation"
 MKN_nabat_federation_desc: "Anarchist federations from Kharkov to Odessa look to Gulyai-Polye."
 MKN_gulyai_polye_commune: "Gulyai-Polye Commune"
 MKN_gulyai_polye_commune_desc: "The capital of anarchy will show the world a different way to live."
 MKN_railway_war: "Railway Warfare"
 MKN_railway_war_desc: "The railway warfare program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_black_banner_east: "Black Banner East"
 MKN_black_banner_east_desc: "Kiev bows to Moscow. The east must be freed from both."
 MKN_makhno_moves_south: "Makhno Moves South"
 MKN_makhno_moves_south_desc: "To the sea, to the ports, to the ships that carry our grain."
 MKN_the_steppe_holds: "The Steppe Holds"
 MKN_the_steppe_holds_desc: "Three years of war and the Free Territory still stands. Let them come."
 MKN_free_territory: "Free Territory"
 MKN_free_territory_desc: "Mutual aid and voluntary defence unite the communes. The detachments know their native steppe and fight for their land; congresses must make shared obligations equally reliable."
 MKN_tachanka_warfare: "Tachanka Warfare"
 MKN_tachanka_warfare_desc: "Speed is armor on the steppe."
 MKN_railway_guards: "Railway Guards"
 MKN_railway_guards_desc: "Who holds the rails holds the south."
 MKN_BELASH_DESC: "Chief of staff of the Insurgent Army."
 MKN_SHCHUS_DESC: "Dashing cavalry ataman."
 MKN_focus_desc: "The national focus tree of the Makhnovist Free Territory."
 MKN_NESTOR_MAKHNO_DESC: "Ataman of the Revolutionary Insurgent Army of Ukraine."
 MKN_black_sea_flotilla: "Black Sea Flotilla"
 MKN_black_sea_flotilla_desc: "The black sea flotilla program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_dnieper_patrol: "Dnieper Patrol"
 MKN_dnieper_patrol_desc: "The dnieper patrol program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_steppe_hawks: "Steppe Hawks"
 MKN_steppe_hawks_desc: "The steppe hawks program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_free_soviets_idea: "Organized Free Soviets"
 MKN_free_soviets_idea_desc: "Recallable delegates build trust in common decisions while preserving communal autonomy."
 MKN_soviet_press: "Soviet Press"
 MKN_soviet_press_desc: "Nabat and Golos print the truth daily."
 MKN_anarchist_schools: "Anarchist Schools"
 MKN_anarchist_schools_desc: "Ferrer schools for free children."
 MKN_peasant_militias: "Peasant Militias"
 MKN_peasant_militias_desc: "Every village its own sotnya."
 MKN_batko_guards: "Batko Guards"
 MKN_batko_guards_desc: "The old man's personal guard."
 MKN_SHCHUS_LEADER_DESC: "Ataman turned statesman. Or the other way around."
 MKN_EMPEROR_DESC: "By the grace of tachanka, Emperor of the Steppe."
 MKN_VOLIN_DESC: "Theorist of free soviets and free elections."
 MKN_border_tensions: "Border Tensions"
 MKN_border_tensions_desc: "Kiev holds what the steppe needs. Probe their border."
 MKN_everlasting_makhnovshchina: "Everlasting Makhnovshchina"
 MKN_everlasting_makhnovshchina_desc: "No gods, no masters, no end."
 MKN_soviets_forever: "Soviets Forever"
 MKN_soviets_forever_desc: "The commune is eternal."
 MKN_tachanka_guards: "Tachanka Guards"
 MKN_tachanka_guards_desc: "The elite of the Insurgent Army."
 MKN_council_communism: "Council Communism"
 MKN_council_communism_desc: "Marx without Moscow."
 MKN_workers_control: "Workers Control"
 MKN_workers_control_desc: "The factory to those who work it."
 MKN_commune_federation: "Commune Federation"
 MKN_commune_federation_desc: "A thousand communes, one federation."
 MKN_constituent_assembly: "Constituent Assembly"
 MKN_constituent_assembly_desc: "Even anarchists vote sometimes."
 MKN_free_elections_steppe: "Free Elections on the Steppe"
 MKN_free_elections_steppe_desc: "Ballots instead of bullets. Mostly."
 MKN_open_markets: "Open Markets"
 MKN_open_markets_desc: "Trade is not a crime."
 MKN_red_banner_steppe: "Red Banner over the Steppe"
 MKN_red_banner_steppe_desc: "The black fades to red."
 MKN_hand_to_moscow: "Hand to Moscow"
 MKN_hand_to_moscow_desc: "An ally, at last, against Kiev."
 MKN_collectivize_the_steppe: "Collectivize the Steppe"
 MKN_collectivize_the_steppe_desc: "Voluntarily. Mostly."
 MKN_black_hundreds: "Black Hundreds"
 MKN_black_hundreds_desc: "Order will be restored. Brutally."
 MKN_order_through_tachanka: "Order through Tachanka"
 MKN_order_through_tachanka_desc: "The machine gun is the best argument."
 MKN_steppe_legions: "Steppe Legions"
 MKN_steppe_legions_desc: "March in step, or else."
 MKN_nestor_the_first: "Nestor the First"
 MKN_nestor_the_first_desc: "Why not? Everyone else has a tsar."
 MKN_imperial_coronation: "Imperial Coronation"
 MKN_imperial_coronation_desc: "A crown of wheat and steel."
 MKN_steppe_empire: "Steppe Empire"
 MKN_steppe_empire_desc: "From sea to sea, by decree."
 MKN_border_raids: "Border Incursions"
 MKN_border_raid: "Launch a border raid"
 MKN_border_raid_desc: "Start a limited border battle, beginning with Mykolaiv and advancing along the front. After the third raid, Kiev declares war."
 MKN: "Makhnovists"
 MKN_DEF: "Makhnovist Ukraine"
 MKN_ADJ: "Makhnovist"
 NWW_MKN_DESC: "The Makhnovist Free Territory."
 MKN_manganese_nikopol: "Nikopol Manganese"
 MKN_manganese_nikopol_desc: "The ores of the Nikopol basin are metal for free factories and coin for free hands."
 MKN_dneprostroi: "Dnieper Industrial Program"
 MKN_dneprostroi_desc: "Communes choose major factories and a shared industrial plan. The first agreement eases the economic crisis and excludes the free cooperatives program."
 MKN_kichkas_bridge: "Kichkas Bridge"
 MKN_kichkas_bridge_desc: "Restore infrastructure and agree through routes. This eases supply disruptions, but a dispatch network is still needed."
 MKN_zaporizhstal: "Zaporizhstal"
 MKN_zaporizhstal_desc: "With transport restored, engineering delegates agree a steel program. Economic penalties fall by another tier."
 MKN_steppe_electrification: "Steppe Electrification"
 MKN_steppe_electrification_desc: "A shared grid connects factories and villages. Electrification reduces factory energy consumption."
 MKN_steppe_general_staff: "Steppe Army Staff"
 MKN_steppe_general_staff_desc: "The steppe army staff program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_steel_horses: "Iron Horses"
 MKN_steel_horses_desc: "Major formations gain light armour, motorized supply and a shared staff. This choice commits resources to mechanization and excludes the free cavalry column program."
 MKN_batko_cavalry: "Batkos Cavalry"
 MKN_batko_cavalry_desc: "Cavalry, village reserves and independent junior commanders support flanking operations and economical supply. The mechanized army model becomes unavailable."
 MKN_black_guard_veterans: "Black Guard Veterans"
 MKN_black_guard_veterans_desc: "Develop our chosen fighting methods through joint exercises. New equipment and tactics are tested with the detachments that must use them on the steppe."
 MKN_steppe_quartermasters: "Steppe Quartermaster School"
 MKN_steppe_quartermasters_desc: "Develop our chosen fighting methods through joint exercises. New equipment and tactics are tested with the detachments that must use them on the steppe."
 MKN_village_airfields: "Village Airfields"
 MKN_village_airfields_desc: "The village airfields program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_gulyaipole_pilot_school: "Gulyai Polye Pilot School"
 MKN_gulyaipole_pilot_school_desc: "The gulyai polye pilot school program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_black_swarm: "Black Swarm"
 MKN_black_swarm_desc: "Prioritize river crossings, factories and home airfields. Fighter artels and the air watch network take priority over the strike support program."
 MKN_kherson_shipyard: "Kherson Shipyards"
 MKN_kherson_shipyard_desc: "The kherson shipyards program establishes trained personnel and reliable local supply. Communes assign responsibilities so new capabilities rest on functioning services."
 MKN_black_sea_smugglers: "Black Sea Raider School"
 MKN_black_sea_smugglers_desc: "Turn knowledge of coves and trade routes into a school of stealth raiding. Submarines and torpedo craft take priority over the coastal escort program."
 MKN_coastal_defense_steppe: "Coastal Defence Belt"
 MKN_coastal_defense_steppe_desc: "Shipyards produce escorts while the flotilla protects grain convoys and harbour approaches. The independent raider program becomes unavailable."
 MKN_dnieper_gun_flotilla: "Dnieper Gunboats"
 MKN_dnieper_gun_flotilla_desc: "Shared charts, signals and training sorties coordinate crews. Local sailors know the coast but need procedures for joint operations."
 MKN_dneprostroi_power: "Dnieper Power Network"
 MKN_dneprostroi_power_desc: "A shared grid reduces factory energy consumption and speeds construction."
 MKN_electrified_steppe: "The Electrified Steppe"
 MKN_electrified_steppe_desc: "A hut with a lamp and an alphabet book in every volost."
 MKN_steel_horses_idea: "Iron Horses"
 MKN_steel_horses_idea_desc: "Armor and speed instead of horseflesh."
 MKN_batko_cavalry_idea: "Batko's Cavalry"
 MKN_batko_cavalry_idea_desc: "Mounted hundreds of the volost: the steppe's eyes, ears and gun."
 MKN_black_guard_veterans_idea: "Veterans of the Black Guard"
 MKN_black_guard_veterans_idea_desc: "Those who survived the chains and the tachankas lead the new hundreds."
 MKN_steppe_quartermasters_idea: "Steppe Quartermasters"
 MKN_steppe_quartermasters_idea_desc: "An army marches on its stomach, ours also."
 MKN_free_airmen: "Free Airmen"
 MKN_free_airmen_desc: "Chase air currents, not orders."
 MKN_black_swarm_idea: "The Black Swarm"
 MKN_black_swarm_idea_desc: "Slow — but above everything, everywhere."
 MKN_smuggling_network: "Smuggling Networks"
 MKN_smuggling_network_desc: "The Black Sea feeds the Free Territory around every blockade."
 MKN_free_industry_modifier: "Economy of the Free Territory"
 MKN_free_industry_modifier_desc: "Communal agreements, production and supply develop together. Congresses overcome initial limitations and secure the benefits of their chosen program."
 MKN_free_industry_tt: "§HFree Industrial Upswing:§!\nThe communes' industry grows with every completed focus of the industry branches."
 MKN_fi_capacity: "Factory output"
 MKN_fi_construction: "Construction speed"
 MKN_fi_research: "Research speed"
 MKN_kommunar_tractor: "Kommunar Tractor Works"
 MKN_kommunar_tractor_desc: "Zaporizhzhia's Kommunar will build tractors, and when needed — gun carriages."
 MKN_dnepro_aluminium: "Dnieper Aluminium Works"
 MKN_dnepro_aluminium_desc: "Dneprostroi's currents smelt bauxite. The Free Territory's wings will be light."
 MKN_nikopol_tube_zavod: "Nikopol Tube Works"
 MKN_nikopol_tube_zavod_desc: "Standardize blanks and tooling. Common parts ease workshop fragmentation."
 MKN_steppe_mech_works: "Volost Machine Workshops"
 MKN_steppe_mech_works_desc: "Machine tools on free land, run by free hands."
 MKN_grain_export: "Grain Export"
 MKN_grain_export_desc: "The communes' grain goes abroad — for machinery and hard cash."
 MKN_steel_volnitsa: "Steel Free Territory"
 MKN_steel_volnitsa_desc: "Complete the industrial program after production reform, family funds and an economic compact. Prepared depots and timetables turn supply disruptions into an advantage."
 MKN_free_cooperatives: "Free Cooperatives"
 MKN_free_cooperatives_desc: "Independent artels accept mutual obligations. The economic crisis eases and the Dnieper industrial program becomes unavailable."
 MKN_salt_artsels: "Salt Artels"
 MKN_salt_artsels_desc: "Steppe salt is the volosts' trusted currency."
 MKN_village_smithies: "Village Smithies"
 MKN_village_smithies_desc: "Catalogue village machines and skills. Armament artels begin the reform of fragmented production."
 MKN_grain_brokers: "Grain Exchanges"
 MKN_grain_brokers_desc: "Grain is politics too."
 MKN_wind_mills_steppe: "Windmills of Free Khutors"
 MKN_wind_mills_steppe_desc: "Steppe wind is free, like freedom."
 MKN_mobile_workshops: "Mobile Workshops"
 MKN_mobile_workshops_desc: "Exchanged tools and travelling repair teams strengthen shared contracts. Economic penalties fall by another tier."
 MKN_free_bazaars: "Free Bazaars"
 MKN_free_bazaars_desc: "Trade without the state settles daily life. Everyone waits for market day."
 MKN_steppe_mint: "Steppe Mint"
 MKN_steppe_mint_desc: "Free coinage on free land — and a reserve of bootleg bills when Moscow's money fails."
 MKN_freight_artels: "Freight Artels"
 MKN_freight_artels_desc: "Carriers map depots and routes together. Supply disruptions ease, while the congress must still agree regular services."
 MKN_workshop_airplane_artels: "Artel Aviation Workshops"
 MKN_workshop_airplane_artels_desc: "Itinerant aviation workshops repair and assemble machines in the open air."
 MKN_craft_federation: "Federation of Craft Communes"
 MKN_craft_federation_desc: "Shared orders, insurance and a mutual aid charter complete the program. The supply network removes remaining disruptions and reduces equipment losses."
 MKN_free_mint_idea: "Free Mint"
 MKN_free_mint_idea_desc: "The free currency of the steppe gives the free land agility and a juggling treasurer."
 MKN_anarchic_economy_idea: "Uncoordinated Communal Economy"
 MKN_anarchic_economy_idea_desc: "Each commune decides for itself, but shared accounting and reliable settlement are absent. Congresses must establish workable economic agreements."
 MKN_anarchic_economy_tt: "Artels and bazaars decide what to build; no central supply lines."
 MKN_industry_concern_1: "Concern of Free Steel"
 MKN_industry_concern_2: "Concern of Free Steel"
 MKN_rifle_concern_1: "Small Arms Artels"
 MKN_rifle_concern_2: "Small Arms Artels"
 MKN_steel_concern: "Concern of Free Steel"
 MKN_steel_concern_desc: "Steppe steel-masters join into a concern of free factories. Strengthen it through industry focuses.\n\n§YAn industrial concern is available. Hire it in the advisors panel.§!"
 MKN_steel_concern_union: "Union of Factories"
 MKN_steel_concern_union_desc: "Linked rates and shared stockpiles make the concern stronger."
 MKN_steel_concern_union_tt: "§GConcern of Free Steel improved:§! industry research +5%, construction speed +3%, factory output +5%"
 MKN_rifle_concern: "Small Arms Artels"
 MKN_rifle_concern_desc: "The gunsmith artels of Gulyai-Polye unite under a single standard of quality.\n\n§YAn infantry weapons concern is available. Hire it in the advisors panel.§!"
 MKN_rifle_concern_union: "Expand the Gunsmith Artels"
 MKN_rifle_concern_union_desc: "Shared tooling and master schools upgrade the artels."
 MKN_rifle_concern_union_tt: "§GSmall Arms Artels improved:§! infantry weapons research +5%, factory output +3%"
 MKN_fi_b_cap1: "Free Industrial Upswing: factory output §G+1%§!"
 MKN_fi_b_cap2: "Free Industrial Upswing: factory output §G+2%§!"
 MKN_fi_b_cap3: "Free Industrial Upswing: factory output §G+3%§!"
 MKN_fi_b_cons1: "Free Industrial Upswing: construction speed §G+1%§!"
 MKN_fi_b_cons2: "Free Industrial Upswing: construction speed §G+2%§!"
 MKN_fi_b_cons3: "Free Industrial Upswing: construction speed §G+3%§!"
 MKN_fi_b_res1: "Free Industrial Upswing: research speed §G+1%§!"
 MKN_fi_b_res2: "Free Industrial Upswing: research speed §G+2%§!"
 MKN_fi_b_res3: "Free Industrial Upswing: research speed §G+3%§!"
 MKN_economic_coordination: "First Economic Agreements"
 MKN_economic_coordination_desc: "The communes recognize shared obligations, but grain, machinery and labour still arrive late."
 MKN_economic_recovery: "An Economy in Recovery"
 MKN_economic_recovery_desc: "Agreed orders reduce waste. Settlement rules and support for workers' families still need lasting institutions."
 MKN_fragmented_workshops: "Fragmented Workshops"
 MKN_fragmented_workshops_desc: "Each artel uses its own drawings and calibres. Serial production stalls and technical knowledge rarely leaves the workshop."
 MKN_catalogued_workshops: "Catalogued Workshops"
 MKN_catalogued_workshops_desc: "Machines and specialists have entered a shared register, but parts are still incompatible."
 MKN_standardized_workshops: "Workshops in Transition"
 MKN_standardized_workshops_desc: "Shared drawings are in use. The remaining bottlenecks need a lasting system of orders and quality control."
 MKN_broken_supply: "Disrupted Steppe Supply"
 MKN_broken_supply_desc: "Trains stand idle, local agreements scatter wagon convoys and depots cannot anticipate neighbouring detachments' needs."
 MKN_mapped_supply: "Agreed Supply Routes"
 MKN_mapped_supply_desc: "Stations and depots have been mapped, but dispatchers and artels still dispute transport priorities."
 MKN_coordinated_supply: "Supply Taking Shape"
 MKN_coordinated_supply_desc: "Regular services arrive on time. Reserve depots and military transport rules will complete the reform."
 MKN_untrained_militias: "Untrained Militias"
 MKN_untrained_militias_desc: "Courage cannot replace communications, training and accountable command. Village detachments fight well alone but struggle in joint operations."
 MKN_accountable_militias: "Accountable Militia Commanders"
 MKN_accountable_militias_desc: "Detachments have agreed on commanders' responsibilities. They must now learn to operate together."
 MKN_drilled_militias: "Militias on Joint Exercises"
 MKN_drilled_militias_desc: "Instructors have provided common training. A permanent reserve organization will secure these gains."
 MKN_dnieper_economy: "Dnieper Economic Compact"
 MKN_dnieper_economy_desc: "A shared plan rests on communal mandates, public budgets and family support. Major projects no longer depend on improvised collections."
 MKN_mutual_aid_economy: "Mutual Aid Economy"
 MKN_mutual_aid_economy_desc: "Credit, harvest insurance and transparent contracts unite independent artels without compulsory subordination."
 MKN_serial_production: "Dnieper Serial Production"
 MKN_serial_production_desc: "Common tolerances and production cycles sustain long armament runs at major factories."
 MKN_cooperative_production: "Federation of Production Artels"
 MKN_cooperative_production_desc: "Shared orders and exchanged tooling let workshops adopt new designs quickly."
 MKN_dnieper_logistics: "Dnieper Transport Service"
 MKN_dnieper_logistics_desc: "A dispatch network and grain reserves sustain large formations on distant routes."
 MKN_artel_logistics: "Mutual Aid Supply Trains"
 MKN_artel_logistics_desc: "Artels maintain alternate routes and repair posts, reducing equipment losses in the field."
 MKN_worker_battalions_idea: "Trained Worker Battalions"
 MKN_worker_battalions_idea_desc: "Factory shifts and military training are coordinated. Elected commanders are accountable for readiness and joint operations."
 MKN_mobile_self_defence_idea: "Mobile Communal Self Defence"
 MKN_mobile_self_defence_idea_desc: "Village reserves train regularly and assemble quickly into mobile detachments."
 MKN_construction_drive: "Intensive Construction Season"
 MKN_construction_drive_desc: "The congress temporarily commits extra resources to construction. Consumer production bears the cost of acceleration."
 MKN_careful_investment: "Careful Retooling"
 MKN_careful_investment_desc: "Factories retool gradually without emergency collections."
 MKN_export_contracts: "Artel Export Contracts"
 MKN_export_contracts_desc: "Exports pay for machinery, but negotiations and inspections occupy the delegates."
 MKN_local_reserves: "Local Insurance Reserves"
 MKN_local_reserves_desc: "Surpluses remain in shared granaries until the next harvest."
 MKN_dnieper_audit: "Public Dnieper Budgets"
 MKN_dnieper_audit_desc: "The congress audits costs before major construction begins. Delegates choose an intensive building season or careful retooling; either policy lasts one year."
 MKN_engineering_delegates: "Engineers with Communal Mandates"
 MKN_engineering_delegates_desc: "Communes send engineers with accountable mandates. A shared machine register becomes the basis of the steel program."
 MKN_elected_brigadiers: "Elected Brigadiers"
 MKN_elected_brigadiers_desc: "Workers and village detachments elect commanders who report regularly. Recall rights remain compatible with clear responsibilities in battle."
 MKN_factory_instructors: "Factory Instructors"
 MKN_factory_instructors_desc: "Training shifts teach communications and cooperation. The communities producing weapons must also know how to use them."
 MKN_steppe_coal_contracts: "Steppe Coal Workings"
 MKN_steppe_coal_contracts_desc: "Small workings and fuel deliveries provide energy for the new factories. Coal extraction serves industry independently of oil reserves."
 MKN_dnieper_dispatch: "Dnieper Dispatch Network"
 MKN_dnieper_dispatch_desc: "Stations agree timetables and priorities for coal and military trains. Shared communications reduce supply disruptions."
 MKN_worker_battalions: "Worker Reserve Battalions"
 MKN_worker_battalions_desc: "Regular exercises, accountable command and protected civilian jobs establish a trained reserve and complete military reform."
 MKN_dnieper_standards: "Common Tolerances and Calibres"
 MKN_dnieper_standards_desc: "Factory councils adopt common standards to end incompatible batches. Artels retain their workshops while using shared drawings."
 MKN_production_cycles: "Coordinated Production Cycles"
 MKN_production_cycles_desc: "Reliable deliveries and common standards enable long production runs. Fragmented workshops become a stable armaments industry."
 MKN_workers_welfare: "Workers Family Funds"
 MKN_workers_welfare_desc: "Shared funds support builders and reservists' families. The industrial compact needs measures of success beyond tonnes of steel."
 MKN_industrial_compact: "Dnieper Economic Compact"
 MKN_industrial_compact_desc: "Ratify a public order plan, factory obligations and family protections. The congress removes the last economic penalties and secures the benefits of major industry."
 MKN_artel_register: "Register of Mutual Obligations"
 MKN_artel_register_desc: "Artels record their resources and promises to neighbours. Accounting needs no overseer above every workshop."
 MKN_recallable_commanders: "Recallable Commanders"
 MKN_recallable_commanders_desc: "Village assemblies set terms and responsibilities for field commanders. Voluntary service still needs clear orders."
 MKN_field_schools: "Communal Field Schools"
 MKN_field_schools_desc: "Travelling instructors teach communications, concealment and joint manoeuvres without keeping villages away from sowing for months."
 MKN_harvest_reserves: "Grain for Trade and Reserves"
 MKN_harvest_reserves_desc: "The congress chooses export contracts or insurance granaries for the surplus. The selected measure lasts one year."
 MKN_mutual_credit: "Credit without Usury"
 MKN_mutual_credit_desc: "Mutual aid funds lend against accountable artel contracts. Harvests and tools provide a basis for settlement."
 MKN_mobile_self_defence: "Mobile Self Defence"
 MKN_mobile_self_defence_desc: "Village reserves become trained mobile detachments with joint exercises and accountable command."
 MKN_repair_exchanges: "Tool and Repair Exchanges"
 MKN_repair_exchanges_desc: "Artels exchange tooling, spare parts and workshop fuel. Small coal workings support local energy supplies."
 MKN_workshop_standards: "Interchangeability Agreement"
 MKN_workshop_standards_desc: "Armament artels adopt common calibres and parts. Standards become an agreement among producers rather than a single factory's command."
 MKN_supply_congress: "Congress of Supply Artels"
 MKN_supply_congress_desc: "Carriers agree alternate routes and assistance for damaged supply trains. Military transport gains reliable procedures."
 MKN_shared_orders: "Shared Order Book"
 MKN_shared_orders_desc: "Common standards and exchanged tooling allow orders to be shared among workshops. Fragmentation gives way to flexible production."
 MKN_social_fund: "Communal Insurance Fund"
 MKN_social_fund_desc: "Artel contributions protect families against failed harvests, injuries and lost earners. Shared security makes mutual aid more reliable than occasional donations."
 MKN_communal_compact: "Charter of Economic Mutual Aid"
 MKN_communal_compact_desc: "Voluntary contracts, credit funds and insurance establish a lasting network of independent communes and resolve the economic crisis."
 mkn.30.t: "The Budget Belongs to the Congress"
 mkn.30.d: "Dnieper delegates have audited the budgets. An intensive season speeds construction but requires more resources from consumer production. Gradual retooling improves production efficiency without emergency collections. Which policy shall govern the coming year?"
 mkn.30.a: "Accelerate construction and accept the cost."
 mkn.30.b: "Retool factories gradually."
 mkn.31.t: "What Shall We Do with the Surplus?"
 mkn.31.d: "Artels have counted grain and salt available for common use. Export contracts pay for machinery but occupy delegates in lengthy negotiations. Insurance granaries strengthen trust and supply detachments. The congress chooses a policy for the coming year."
 mkn.31.a: "Sign export contracts."
 mkn.31.b: "Fill the insurance granaries."
