l_russian:
 NWW_GER_campaign_safety_tt:0 "Германия восстанавливает силы или цель втянет её в неподготовленную войну. ИИ ведёт одну наступательную кампанию за раз; после мира требуется 180 дней восстановления, после капитуляции — два года."
 nww_GER_ai_can_prepare_campaign:0 "ИИ должен завершить текущую войну и восстановить армию и внутреннюю устойчивость."
 nww_GER_ai_can_target_AUS:0 "ИИ должен завершить восстановление и оценить силы Австрии, её союзников и гарантов."
 nww_GER_ai_can_target_LTB:0 "ИИ: мир, восстановление и оценка риска кампании против Литовско-Белорусского союза."
 nww_GER_ai_can_target_POL:0 "ИИ: мир, восстановление и оценка риска польской кампании."
 nww_GER_ai_can_target_MKN:0 "ИИ: мир, восстановление и оценка риска кампании против Вольной территории."
 nww_GER_ai_can_target_UKR:0 "ИИ: мир, восстановление и оценка риска украинской кампании."
 nww_GER_ai_can_target_SOV:0 "ИИ: мир, восстановление и оценка сил Советской России и её союзников."
 nww_GER_ai_can_target_FRA:0 "ИИ: мир, восстановление и оценка сил Франции и её союзников."
 nww_GER_ai_can_target_ENG:0 "ИИ: мир, восстановление и оценка сил Британии и её союзников."
