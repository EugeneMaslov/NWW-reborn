 AUS_nww_crown_lands:0 "Bohemia and the Crown Lands"
 AUS_nww_crown_lands_desc:0 "Vienna and Prague dispute the future of the Crown of Saint Wenceslas. Keep tension below ten: negotiations and reforms can preserve the monarchy. Hover over the panel for details."
