 nww_aus_diplomacy.1.b:0 "Decline the proposal"
 nww_aus_diplomacy.2.t:0 "Industrial contract accepted"
 nww_aus_diplomacy.2.d:0 "Our partner approved the technical mission. Paid equipment will support factory construction and specialists will share production knowledge."
 nww_aus_diplomacy.2.a:0 "Begin the joint programme"
 nww_aus_diplomacy.3.t:0 "A Danubian research treaty"
 nww_aus_diplomacy.3.d:0 "[FROM.GetName] proposes a joint research network. Both participants retain their own governments, armies and territories."
