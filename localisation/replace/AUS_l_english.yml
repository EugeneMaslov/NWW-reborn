 nww_aus_diplomacy.1.t:0 "Industrial cooperation proposal"
 nww_aus_diplomacy.1.d:0 "[FROM.GetName] offers to pay for a technical mission and equipment deliveries. Acceptance helps the partner establish a military enterprise and learn new production methods."
 nww_aus_diplomacy.1.a:0 "Accept the contract"
 nww_aus_diplomacy.1.b:0 "Decline the proposal"
 nww_aus_diplomacy.2.t:0 "Industrial contract accepted"
 nww_aus_diplomacy.2.d:0 "Our partner approved the technical mission. Paid equipment will support factory construction and specialists will share production knowledge."
 nww_aus_diplomacy.2.a:0 "Begin the joint programme"
 nww_aus_diplomacy.3.t:0 "A Danubian research treaty"
 nww_aus_diplomacy.3.d:0 "[FROM.GetName] proposes a joint research network. Both participants retain their own governments, armies and territories."
 nww_aus_diplomacy.3.a:0 "Sign the voluntary agreement"
 nww_aus_diplomacy.3.b:0 "Keep separate programmes"
 nww_aus_diplomacy.4.t:0 "Proposal declined"
 nww_aus_diplomacy.4.d:0 "Our partner declined the proposed treaty. Its rewards and joint programmes will not take effect."
 nww_aus_diplomacy.4.a:0 "Continue independent development"
 nww_aus_diplomacy.5.t:0 "Danubian treaty signed"
 nww_aus_diplomacy.5.d:0 "Both countries agreed to the research network. The treaty accelerates research into technologies already known to the other participant."
 nww_aus_diplomacy.5.a:0 "Open the research exchange"
 AUS_war_with_hun_desc:0 "The Hungarian ultimatum demands the entire kingdom. Claims cover all its territory. Hungary is fully annexed if it capitulates to Austria in this campaign."
 AUS_war_with_croatia_desc:0 "The Croatian lands must enter the restored monarchy as a whole. Croatia is fully annexed if it capitulates to Austria in this campaign."
 NWW_AUS_HUN_full_conquest_tt:0 "Claim all Hungarian territory and gain a permanent full-annexation war goal. Hungary is fully annexed if it capitulates to Austria in this campaign."
 NWW_AUS_CRO_full_conquest_tt:0 "Claim all Croatian territory and gain a permanent full-annexation war goal. Croatia is fully annexed if it capitulates to Austria in this campaign."
 NWW_AUS_restore_dual_monarchy:0 "Restore Austria-Hungary"
 NWW_AUS_restore_dual_monarchy_desc:0 "After fully annexing Hungary and Croatia, conclude a new crown-land settlement. The country becomes Austria-Hungary and the incorporated Hungarian and Croatian lands become its cores."
