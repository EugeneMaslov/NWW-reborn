 nww_tur_diplomacy.1.t:0 "Industrial cooperation proposal"
 nww_tur_diplomacy.1.d:0 "[FROM.GetName] offers to pay for a technical mission and equipment deliveries. Acceptance helps the partner establish a military enterprise and learn new production methods."
 nww_tur_diplomacy.1.a:0 "Accept the contract"
 nww_tur_diplomacy.1.b:0 "Decline the proposal"
 nww_tur_diplomacy.2.t:0 "Industrial contract accepted"
 nww_tur_diplomacy.2.d:0 "Our partner approved the technical mission. Paid equipment will support factory construction and specialists will share production knowledge."
 nww_tur_diplomacy.2.a:0 "Begin the joint programme"
 nww_tur_diplomacy.3.t:0 "A Danubian research treaty"
 nww_tur_diplomacy.3.d:0 "[FROM.GetName] proposes a joint research network. Both participants retain their own governments, armies and territories."
 nww_tur_diplomacy.3.a:0 "Sign the voluntary agreement"
 nww_tur_diplomacy.3.b:0 "Keep separate programmes"
 nww_tur_diplomacy.4.t:0 "Proposal declined"
 nww_tur_diplomacy.4.d:0 "Our partner declined the proposed treaty. Its rewards and joint programmes will not take effect."
 nww_tur_diplomacy.4.a:0 "Continue independent development"
 nww_tur_diplomacy.5.t:0 "Danubian treaty signed"
 nww_tur_diplomacy.5.d:0 "Both countries agreed to the research network. The treaty accelerates research into technologies already known to the other participant."
 nww_tur_diplomacy.5.a:0 "Open the research exchange"
