 NWW_HUN_political_campaigns:0 "Политические кампании"
 NWW_HUN_political_campaigns_desc:0 "Для смены государственного курса требуется поддержка соответствующей партии не менее 40%."
 NWW_HUN_campaign_democratic:0 "Республиканские собрания"
 NWW_HUN_campaign_democratic_desc:0 "Кампания стоит 50 политической власти, длится 60 дней и добавляет 10 процентных пунктов поддержки по завершении. Одновременно проводится одна кампания."
 NWW_HUN_campaign_neutrality:0 "Собрания сторонников короны"
