 NWW_Danubian_research_name:0 "Дунайская исследовательская сеть"
 NWW_Danubian_research_desc:0 "Австрия и Венгрия обмениваются исследованиями на основе добровольного договора. Во время войны между участниками обмен не действует."
 NWW_AUS_political_campaigns:0 "Политические кампании"
 NWW_AUS_political_campaigns_desc:0 "Для смены государственного курса требуется поддержка соответствующей партии не менее 40%."
 NWW_AUS_campaign_democratic:0 "Республиканские собрания"
 NWW_AUS_campaign_democratic_desc:0 "Кампания стоит 50 политической власти, длится 60 дней и добавляет 10 процентных пунктов поддержки по завершении. Одновременно проводится одна кампания."
