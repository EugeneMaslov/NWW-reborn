 AUS_nww_crown_lands:0 "Богемия и коронные земли"
 AUS_nww_crown_lands_desc:0 "Вена и Прага спорят о будущем короны Святого Вацлава. Удерживайте напряжённость ниже десяти: переговоры и реформы сохранят единство монархии. Подробности — при наведении на панель."
 AUS_nww_bohemian_drift:0 "Богемия желает отделиться: [?AUS_bohemian_tension|0]/10"
 AUS_nww_bohemian_drift_desc:0 "Каждые 60 дней напряжённость растёт на 1. При 10 Богемия отделяется. Переговоры снижают её на 2 после 20 дней; инвестиции создают фабрику и снижают напряжённость на 2 после 35 дней."
 AUS_nww_prague_negotiations:0 "Переговоры с Прагой"
 AUS_nww_prague_negotiations_desc:0 "Каждые 60 дней напряжённость растёт на 1. При 10 Богемия отделяется. Переговоры снижают её на 2 после 20 дней; инвестиции создают фабрику и снижают напряжённость на 2 после 35 дней."
 AUS_nww_prague_investment:0 "Инвестировать в Богемию"
 AUS_nww_prague_investment_desc:0 "Каждые 60 дней напряжённость растёт на 1. При 10 Богемия отделяется. Переговоры снижают её на 2 после 20 дней; инвестиции создают фабрику и снижают напряжённость на 2 после 35 дней."
 AUS_nww_political_mandate:0 "Борьба за государственный строй"
 AUS_nww_political_mandate_desc:0 "Будущее государственного строя решается в сеймах, кабинетах и на собраниях. Кампании укрепляют поддержку выбранной партии; для перехода необходимы подготовительные фокусы и не менее 40% популярности."
 nww_aus_overhaul.1.t:0 "Богемия объявляет независимость"
 nww_aus_overhaul.1.d:0 "Переговоры сорваны. Пражский сейм отверг власть Вены и провозгласил независимое государство коронных земель."
