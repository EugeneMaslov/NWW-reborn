 AUS_nww_bohemian_question:0 "Богемия желает отделиться"
 AUS_nww_bohemian_question_desc:0 "С ростом напряжённости падают стабильность и выпуск заводов. На уровне 10 Богемия выходит из состава государства."
 AUS_nww_campaign_neutrality:0 "Кампания сторонников монархии"
 AUS_nww_campaign_neutrality_desc:0 "За 20 дней кампания добавит 10 процентных пунктов поддержки."
