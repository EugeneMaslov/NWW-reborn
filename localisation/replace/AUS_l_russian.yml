 NWW_legacy_campaign_active:0 "Проводится другая политическая кампания"
 NWW_AUS_officer_corps:0 "Австрийский офицерский корпус"
 NWW_AUS_officer_corps_desc:0 "Училища готовят командиров для наступательной армии: +10% к организации и скорости планирования."
 nww_aus_diplomacy.1.t:0 "Предложение промышленного сотрудничества"
 nww_aus_diplomacy.1.d:0 "Государство [FROM.GetName] предлагает оплатить техническую миссию и поставку оборудования. Согласие позволит партнёру открыть военное предприятие и освоить новые производственные методы."
 nww_aus_diplomacy.1.a:0 "Согласиться на контракт"
 nww_aus_diplomacy.1.b:0 "Отклонить предложение"
 nww_aus_diplomacy.2.t:0 "Промышленный договор принят"
 nww_aus_diplomacy.2.d:0 "Партнёр одобрил техническую миссию. Оплаченное оборудование направляется на строительство предприятия, а специалисты приступают к передаче производственных знаний."
 nww_aus_diplomacy.2.a:0 "Начать совместную программу"
 nww_aus_diplomacy.3.t:0 "Дунайский научный договор"
 nww_aus_diplomacy.3.d:0 "Государство [FROM.GetName] предлагает совместную исследовательскую сеть. Участники сохранят собственные правительства, армии и территории."
 nww_aus_diplomacy.3.a:0 "Подписать добровольное соглашение"
 nww_aus_diplomacy.3.b:0 "Сохранить отдельные программы"
 nww_aus_diplomacy.4.t:0 "Предложение отклонено"
 nww_aus_diplomacy.4.d:0 "Партнёр отказался от предлагаемого договора. Согласованные награды и совместные программы не вступят в силу."
 nww_aus_diplomacy.4.a:0 "Продолжить самостоятельное развитие"
 nww_aus_diplomacy.5.t:0 "Дунайский договор подписан"
 nww_aus_diplomacy.5.d:0 "Обе страны согласились на совместную исследовательскую сеть. Договор ускорит изучение технологий, уже известных другому участнику."
 nww_aus_diplomacy.5.a:0 "Открыть научный обмен"
 AUS_war_with_hun_desc:0 "Венгерский ультиматум требует полного присоединения королевства. Претензии охватывают все его земли. Если Венгрия капитулирует перед Австрией в этой войне, она полностью входит в состав нашей страны."
 AUS_war_with_croatia_desc:0 "Хорватские земли должны войти в восстановленную монархию целиком. Капитуляция Хорватии перед Австрией в войне по этому фокусу приводит к полному присоединению страны."
 NWW_AUS_HUN_full_conquest_tt:0 "Предъявить претензии на все венгерские земли и получить постоянную цель войны на полное присоединение. Капитуляция Венгрии перед Австрией в этой кампании означает полную аннексию."
 NWW_AUS_CRO_full_conquest_tt:0 "Предъявить претензии на все хорватские земли и получить постоянную цель войны на полное присоединение. Капитуляция Хорватии перед Австрией в этой кампании означает полную аннексию."
 NWW_AUS_restore_dual_monarchy:0 "Восстановить Австро-Венгрию"
 NWW_AUS_restore_dual_monarchy_desc:0 "После полного присоединения Венгрии и Хорватии заключим новый договор коронных земель. На карте появится Австро-Венгрия, а включённые венгерские и хорватские земли станут национальными территориями общего государства."
 AUS_nww_rebuild:0 "Дунайская корона в 1936 году"
 AUS_nww_rebuild_desc:0 "Отто I удерживает венский престол, но прежняя общая монархия распалась. Определим отношения короны, общества и национальностей, прежде чем возвращать утраченные земли."
 AUS_political_power:0 "Совещание коронного совета"
 AUS_political_power_desc:0 "Двор, партии и коронные земли должны получить возможность изложить свои требования. Итоги совещания станут отправной точкой пяти политических проектов."
 AUS_nww2_absolute_debate:0 "Восстановить авторитет короны"
 AUS_nww2_absolute_debate_desc:0 "Восстановить авторитет короны. Программа получает отдельное финансирование и вводится через учреждения коронных земель."
 AUS_reinstate_the_imperial_council:0 "Вся власть кайзеру"
