 nww_afg_diplomacy.1.t:0 "Предложение промышленного сотрудничества"
 nww_afg_diplomacy.1.d:0 "Государство [FROM.GetName] предлагает оплатить техническую миссию и поставку оборудования. Согласие позволит партнёру открыть военное предприятие и освоить новые производственные методы."
 nww_afg_diplomacy.1.a:0 "Согласиться на контракт"
 nww_afg_diplomacy.1.b:0 "Отклонить предложение"
 nww_afg_diplomacy.2.t:0 "Промышленный договор принят"
 nww_afg_diplomacy.2.d:0 "Партнёр одобрил техническую миссию. Оплаченное оборудование направляется на строительство предприятия, а специалисты приступают к передаче производственных знаний."
 nww_afg_diplomacy.2.a:0 "Начать совместную программу"
 nww_afg_diplomacy.3.t:0 "Дунайский научный договор"
 nww_afg_diplomacy.3.d:0 "Государство [FROM.GetName] предлагает совместную исследовательскую сеть. Участники сохранят собственные правительства, армии и территории."
 nww_afg_diplomacy.3.a:0 "Подписать добровольное соглашение"
 nww_afg_diplomacy.3.b:0 "Сохранить отдельные программы"
 nww_afg_diplomacy.4.t:0 "Предложение отклонено"
 nww_afg_diplomacy.4.d:0 "Партнёр отказался от предлагаемого договора. Согласованные награды и совместные программы не вступят в силу."
 nww_afg_diplomacy.4.a:0 "Продолжить самостоятельное развитие"
 nww_afg_diplomacy.5.t:0 "Дунайский договор подписан"
 nww_afg_diplomacy.5.d:0 "Обе страны согласились на совместную исследовательскую сеть. Договор ускорит изучение технологий, уже известных другому участнику."
 nww_afg_diplomacy.5.a:0 "Открыть научный обмен"
