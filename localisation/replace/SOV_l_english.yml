l_english:
 SOV_the_revolution_endures:0 "After the Great Tumult"
 SOV_the_revolution_endures_desc:0 "Land disputes, hungry cities and failing authority broke the empire during 1918–1922. The soviets retained its industrial heartland, but the civil-war settlement has yet to become a durable state."
 SOV_russian_socialism:0 "Rebuild the Republic First"
 SOV_russian_socialism_desc:0 "Before new campaigns, restore taxation, city supplies and trust in public institutions. The revolution must demonstrate that it can govern."
 SOV_the_new_constitution:0 "Constitution of the Soviet Republics"
 SOV_the_new_constitution_desc:0 "Define central and republican powers. Rights and budget obligations will replace the temporary orders of the civil war."
 SOV_brotherhood_of_peoples:0 "Representation of the Republics"
 SOV_brotherhood_of_peoples_desc:0 "National councils gain permanent representation. Kharkiv, Riga and Tallinn remain negotiating partners rather than territories annexed by decree."
 NWW_SOV_union_congress:0 "Congress of the Union Treaty"
 NWW_SOV_union_congress_desc:0 "Agree on common supplies, military coordination and revenue. The allied republics retain their own governments."
 NWW_SOV_party_coordination:0 "Party Coordination"
 NWW_SOV_party_coordination_desc:0 "Use coordinated party institutions to reconcile central and local decisions. This excludes the alternative republican charter model."
 NWW_SOV_republican_charters:0 "Republican Charters"
 NWW_SOV_republican_charters_desc:0 "Use negotiated republican charters to reconcile central and local decisions. This excludes the alternative party coordination model."
 NWW_SOV_budget_accountability:0 "Accountability of the Commissariats"
 NWW_SOV_budget_accountability_desc:0 "A common budget and enforceable responsibilities will replace overlapping emergency commissions with a permanent civil service."
 NWW_SOV_civil_peace:0 "Complete the Civil Settlement"
 NWW_SOV_civil_peace_desc:0 "Complete the civil settlement through functioning institutions and common rules. Disputes over the Union Treaty will cease to paralyse government."
 SOV_second_five_year_plan:0 "Revise the Economic Plan"
 SOV_second_five_year_plan_desc:0 "Transport, grain supplies and machinery lag behind heavy industry. Revise the plan to correct these imbalances."
 NWW_SOV_industrial_survey:0 "Survey Factories and Deliveries"
 NWW_SOV_industrial_survey_desc:0 "Audit machinery, fuel and freight. Production targets must reflect actual capacity."
 NWW_SOV_agricultural_credit:0 "Rural Credit and Machine Stations"
 NWW_SOV_agricultural_credit_desc:0 "Tractors, credit and predictable purchase prices will restore rural supplies. A new civilian factory provides the necessary workshops."
 SOV_magnitogorsk:0 "The Magnitogorsk Industrial Hub"
 SOV_magnitogorsk_desc:0 "Connect metallurgy with machinery production. Two civilian factories and coordinated deliveries improve the economic plan."
 SOV_urals_industry:0 "Ural Armaments Plants"
 SOV_urals_industry_desc:0 "Ural manufacturers receive actual military contracts and new capacity. Two armaments plants reduce reliance on improvised workshops."
 NWW_SOV_railway_bottlenecks:0 "Clear Railway Bottlenecks"
 NWW_SOV_railway_bottlenecks_desc:0 "Coordinate freight schedules and expand infrastructure in our industrial heartland."
 NWW_SOV_power_stations:0 "Electrify the Industrial Districts"
 NWW_SOV_power_stations_desc:0 "Expand civilian capacity and coordinate the electricity supply of industrial districts."
 NWW_SOV_standardized_armaments:0 "Standardize Armaments"
 NWW_SOV_standardized_armaments_desc:0 "Common drawings and acceptance standards simplify repairs and raise armaments output."
 NWW_SOV_plan_fulfilled:0 "A Balanced Economic Programme"
 NWW_SOV_plan_fulfilled_desc:0 "Civilian capacity, military contracts and transport now form a working plan. The final starting economic penalties become lasting advantages."
 NWW_SOV_scientific_network:0 "Network of Scientific Institutes"
 NWW_SOV_scientific_network_desc:0 "Restore engineering education and laboratory networks while retaining experienced research teams."
 NWW_SOV_technical_colleges:0 "Technical Colleges"
 NWW_SOV_technical_colleges_desc:0 "Train the technicians and engineers needed by modern industry."
 NWW_SOV_research_council:0 "Council of Applied Research"
 NWW_SOV_research_council_desc:0 "Connect universities, factory laboratories and proving grounds. Research slots remain capped at five."
 NWW_SOV_atomic_laboratories:0 "Atomic Physics Laboratories"
 NWW_SOV_atomic_laboratories_desc:0 "A long-term physics programme requires functioning institutions and laboratories."
 NWW_SOV_rocket_bureau:0 "Rocket Design Bureau"
 NWW_SOV_rocket_bureau_desc:0 "Test stands and engineering teams will begin developing rocket technology."
 SOV_deep_battle:0 "Lessons of the Civil War"
 SOV_deep_battle_desc:0 "Examine mobile fronts, armoured trains and rival headquarters. Civil-war experience requires a new military organisation."
 NWW_SOV_unified_command:0 "Unified Operational Command"
 NWW_SOV_unified_command_desc:0 "Replace competing headquarters with common operational rules and a professional chain of command."
 SOV_workers_and_peasants_army:0 "A Regular Workers and Peasants Army"
 SOV_workers_and_peasants_army_desc:0 "Introduce common establishments and training programmes. A manpower reserve cannot substitute for trained formations."
 SOV_red_artillery:0 "Red Artillery"
 SOV_red_artillery_desc:0 "Train observers and gun crews, and organise the supply of artillery formations."
 NWW_SOV_professional_officers:0 "Professional Officer Corps"
 NWW_SOV_professional_officers_desc:0 "Military colleges, staff training and promotion by qualification replace improvisation. Mass purges are not part of this programme."
 NWW_SOV_mechanized_reserve:0 "Mechanized Reserve"
 NWW_SOV_mechanized_reserve_desc:0 "Concentrate modern equipment in properly supplied reserve formations."
 NWW_SOV_field_radios:0 "Field Headquarters Radio"
 NWW_SOV_field_radios_desc:0 "Give headquarters, artillery observers and supply services a common communications network."
 NWW_SOV_motorized_columns:0 "Motorized Columns"
 NWW_SOV_motorized_columns_desc:0 "Motor vehicles give reserve formations the mobility required for modern operations."
 NWW_SOV_army_logistics:0 "Logistics of the Regular Army"
 NWW_SOV_army_logistics_desc:0 "Make supply, repair and route preparation integral parts of operational planning."
 NWW_SOV_army_maneuvers:0 "Combined Arms Manoeuvres"
 NWW_SOV_army_maneuvers_desc:0 "Test unified command, artillery and logistics together. The final penalties of the Civil War Army will be removed."
 NWW_SOV_regular_army:0 "Army of the New State"
 NWW_SOV_regular_army_desc:0 "Consolidate officer training and establish a sustainable mobilisation reserve."
 SOV_red_wings:0 "Red Wings"
 SOV_red_wings_desc:0 "An aviation school will coordinate the training of crews and technical services."
 NWW_SOV_fighter_schools:0 "Fighter Schools"
 NWW_SOV_fighter_schools_desc:0 "Organise fighter pilot training and aircraft testing."
 NWW_SOV_ground_support:0 "Battlefield Aviation"
 NWW_SOV_ground_support_desc:0 "Develop coordination between aviation and ground headquarters."
 SOV_ilya_muromets_spirit:0 "Long Range Bomber Corps"
 SOV_ilya_muromets_spirit_desc:0 "Experienced heavy-aircraft designers will support a new long-range bomber programme."
 NWW_SOV_air_service:0 "Unified Air Service"
 NWW_SOV_air_service_desc:0 "Unify aircraft repair, crew training and airfield preparation."
 SOV_red_banner_fleet:0 "Red Banner Fleet"
 SOV_red_banner_fleet_desc:0 "Restore naval training and the administration of maritime bases."
 NWW_SOV_baltic_bases:0 "Baltic Bases"
 NWW_SOV_baltic_bases_desc:0 "Develop shipbuilding on our own coastline."
 NWW_SOV_black_sea_bases:0 "Black Sea Programme"
 NWW_SOV_black_sea_bases_desc:0 "New dockyards and coastal supplies will support the southern squadron."
 NWW_SOV_escort_fleet:0 "Escort Groups"
 NWW_SOV_escort_fleet_desc:0 "Light ships, cruisers and anti-submarine training will protect maritime communications."
 NWW_SOV_coastal_submarines:0 "Submarine Force"
 NWW_SOV_coastal_submarines_desc:0 "Train submarine crews and develop new underwater equipment."
 NWW_SOV_fleet_readiness:0 "Fleet Readiness"
 NWW_SOV_fleet_readiness_desc:0 "Joint exercises will test the command of escort and submarine formations."
 SOV_comintern_calls:0 "A Common Revolutionary Front"
 SOV_comintern_calls_desc:0 "Coordinate the foreign policy of the Soviet republics. External demands must follow domestic reconstruction."
 NWW_SOV_strategic_pause:0 "Reconstruction before Expansion"
 NWW_SOV_strategic_pause_desc:0 "The army, economy and Union institutions must be ready before an external crisis."
 NWW_SOV_frontier_review:0 "Review the Western Frontier"
 NWW_SOV_frontier_review_desc:0 "Prepare political and military demands towards the buffer states. A calendar date cannot replace domestic reforms."
 NWW_SOV_western_command:0 "Western Operational Command"
 NWW_SOV_western_command_desc:0 "Prepare operational objectives and supplies for the western front."
 NWW_SOV_litbel_ultimatum:0 "Demands to the Lithuanian Belarusian Union"
 NWW_SOV_litbel_ultimatum_desc:0 "Request military access and neutrality guarantees. The Union decides whether to accept our terms or resist."
 NWW_SOV_litbel_campaign:0 "The Western Campaign"
 NWW_SOV_litbel_campaign_desc:0 "After refusal, the prepared headquarters receives a permanent war goal. Allies and states that accepted a peaceful settlement are excluded."
 NWW_SOV_steppe_conference:0 "Negotiations with the Free Steppe"
 NWW_SOV_steppe_conference_desc:0 "Offer the Free Territory equipment and grain exchange and a non-aggression pact. Existing recognition of equal autonomy and alliances remain in force."
 NWW_SOV_steppe_campaign:0 "Resolve the Steppe Conflict"
 NWW_SOV_steppe_campaign_desc:0 "War requires refusal, a prepared regular army and the absence of alliance commitments. Recognized equal autonomy prevents this campaign."
 NWW_SOV_state_0:0 "The Unfinished Union Treaty"
 NWW_SOV_state_0_desc:0 "Stage 1 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_state_1:0 "The Unfinished Union Treaty"
 NWW_SOV_state_1_desc:0 "Stage 2 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_state_2:0 "The Unfinished Union Treaty"
 NWW_SOV_state_2_desc:0 "Stage 3 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_state_3:0 "A Working Union Treaty"
 NWW_SOV_state_3_desc:0 "Stage 4 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_economy_0:0 "Imbalances in the Economic Plan"
 NWW_SOV_economy_0_desc:0 "Stage 1 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_economy_1:0 "Imbalances in the Economic Plan"
 NWW_SOV_economy_1_desc:0 "Stage 2 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_economy_2:0 "Imbalances in the Economic Plan"
 NWW_SOV_economy_2_desc:0 "Stage 3 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_economy_3:0 "A Balanced Economic Plan"
 NWW_SOV_economy_3_desc:0 "Stage 4 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_army_0:0 "The Civil War Army"
 NWW_SOV_army_0_desc:0 "Stage 1 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_army_1:0 "The Civil War Army"
 NWW_SOV_army_1_desc:0 "Stage 2 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_army_2:0 "The Civil War Army"
 NWW_SOV_army_2_desc:0 "Stage 3 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_army_3:0 "The Regular Red Army"
 NWW_SOV_army_3_desc:0 "Stage 4 of 4. Reconstruction progressively changes this spirit. Random purges and paranoia are not used."
 NWW_SOV_party_coordination_idea:0 "Party Coordination"
 NWW_SOV_party_coordination_idea_desc:0 "A lasting programme established by actual reforms and agreements of the new state."
 NWW_SOV_republican_charters_idea:0 "Republican Charters"
 NWW_SOV_republican_charters_idea_desc:0 "A lasting programme established by actual reforms and agreements of the new state."
 NWW_SOV_regular_logistics:0 "Regular Army Logistics"
 NWW_SOV_regular_logistics_desc:0 "A lasting programme established by actual reforms and agreements of the new state."
 NWW_SOV_air_service_idea:0 "Unified Air Service"
 NWW_SOV_air_service_idea_desc:0 "A lasting programme established by actual reforms and agreements of the new state."
 NWW_SOV_steppe_exchange:0 "Huliaipole Economic Protocol"
 NWW_SOV_steppe_exchange_desc:0 "A lasting programme established by actual reforms and agreements of the new state."
 NWW_SOV_disabled_subsystems:0 "Inactive Compatibility Subsystems"
 NWW_SOV_general_secretary:0 "General Secretary of the Reconstructed Republic"
 nww_sov.1.t:0 "The Republic after the Tumult"
 nww_sov.1.d:0 "There was no world war, yet peace was insufficient. Land disputes, food shortages and strikes broke the empire during 1918–1922. The soviets held the industrial centres, but the western borderlands became independent and the Ukrainian steppe rejected central authority. The republic must now settle powers, balance its economic plan and turn civil-war formations into a regular army before pressing new demands abroad."
 nww_sov.1.a:0 "Build a state that can survive its revolution."
 nww_sov.10.t:0 "Soviet Demands to the Union"
 nww_sov.10.d:0 "Moscow demands military access and neutrality guarantees from the Lithuanian Belarusian Union. Acceptance preserves our government and borders but admits Soviet forces. Refusal permits a prepared Soviet campaign. Our internal federal compromise remains our own affair."
 nww_sov.10.a:0 "Accept the guarantees and retain independence."
 nww_sov.10.b:0 "The Union determines its own policy."
 nww_sov.20.t:0 "Moscow and the Free Steppe"
 nww_sov.20.d:0 "The Soviet delegation proposes machinery and grain exchange, access to technical work and a non-aggression pact. The protocol changes neither our government nor our sovereignty. Refusal leaves the dispute open; existing recognition and alliances are retained."
 nww_sov.20.a:0 "Cooperate while preserving independent councils."
 nww_sov.20.b:0 "Do not bind the steppe to Moscow's agreement."
 NWW_SOV_doctrine_bonus:0 "Soviet Doctrine Programme"
 NWW_SOV_reconstruction_ready_tt:0 "The Union Treaty, Magnitogorsk, Ural industry and professional officer corps are ready."
 NWW_SOV_campaign_ready_tt:0 "The civil settlement and combined arms manoeuvres are complete."
 NWW_SOV_LTB_rejected:0 "The Union rejected Soviet demands"
 NWW_SOV_MKN_rejected:0 "The Makhnovist Congress rejected the economic protocol"
 NWW_SOV_LTB_settlement:0 "A peaceful settlement with the Union is in force"
 NWW_SOV_MKN_settlement:0 "The Huliaipole economic protocol is in force"
 NWW_SOV_litbel_war_tt:0 "Gain claims and a permanent war goal against Lithuania-Belarus after its refusal. A peaceful settlement or alliance prevents the reward."
 NWW_SOV_steppe_war_tt:0 "Gain claims and a permanent war goal against Makhnovshchina after refusal, from 1940. Recognized autonomy and an alliance prevent the reward."
