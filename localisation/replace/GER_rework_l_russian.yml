l_russian:
 GER_nww_industrial_program:0 "Имперская промышленная программа"
 GER_nww_industry_construction_tt:0 "Имперская промышленная программа: скорость строительства §G+5%§!."
 GER_nww_industry_output_tt:0 "Имперская промышленная программа: выпуск военных заводов §G+5%§!."
 GER_nww_industry_efficiency_tt:0 "Имперская промышленная программа: прирост эффективности производства §G+5%§!."
 GER_nww_industry_maximum_tt:0 "Имперская промышленная программа: предел эффективности производства §G+5%§!."
 GER_nww_industry_research_tt:0 "Имперская промышленная программа: скорость исследований §G+5%§!."
 GER_nww_industry_energy_tt:0 "Имперская промышленная программа: прирост энергии §G+10%§!."
 GER_nww_industrial_program_desc:0 "Согласованные вложения земель, предприятий и технических школ соединяют энергетику, станкостроение и долгосрочные государственные заказы. Промышленные реформы последовательно развивают эту программу."
 GER_nww_bohemian_operation_unlock_tt:0 "Открывает операцию §Y«Поддержать богемских автономистов»§! в разведывательном агентстве против §YАвстрии§! (требуется La Résistance). Операция длится §Y45 дней§!, требует одного агента, сеть §Y35§!, две гражданские фабрики, 100 единиц пехотного и 25 единиц дополнительного оснащения."
 GER_nww_bohemian_autonomists:0 "Поддержать богемских автономистов"
 GER_nww_bohemian_autonomists_desc:0 "Финансирование местных организаций, подпольная печать и посредники усилят требования суверенитета.\n\nНапряжённость: §Y[?AUS.AUS_bohemian_tension|0]/10§!. Немецкий вклад: §Y[?AUS.AUS_bohemian_german_share|1]%§!.\n\nКаждое завершение добавляет §R+2§! напряжённости (до предела 10). При отделении Богемия становится нашим вассалом, если текущий немецкий вклад §Yстрого больше 60%§!. Австрийские уступки пропорционально уменьшают наш вклад. После урегулирования или отделения операция недоступна."
 GER_nww_bohemian_operation_reward_tt:0 "§R+2§! к богемской напряжённости, но не выше 10. Фактически добавленное давление учитывается как вклад Германии. Если это вызывает отделение при немецкой доле §Yболее 60%§!, новая Богемия становится германским вассалом. Ровно 60% недостаточно."
 GER_nww_austrian_1939_tt:0 "Ультиматум Австрии доступен §Yне ранее 1 января 1939 года§!."
 GER_nww_historical_pressure_ready:0 "Исторический ИИ начинает давление на Миттельевропу с §Y1939 года§!."
 GER_nww_historical_eastern_war_ready:0 "Исторический ИИ переходит к восточным военным целям с §Y1940 года§!."
 nww_ger_bohemia.1.t:0 "Богемия принимает германское покровительство"
 nww_ger_bohemia.1.d:0 "Наша разведывательная работа обеспечила решающую долю давления, приведшего к разрыву между Прагой и Веной. Новое богемское правительство зависит от германской поддержки и принимает положение вассала империи."
 nww_ger_bohemia.1.a:0 "Прага входит в нашу сферу влияния."
