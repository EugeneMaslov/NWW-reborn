 NWW_TUR_campaign_safety_tt:0 "Османское государство восстанавливает силы или цель втянет его в опасную войну. ИИ не нападает на великие державы, участников фракций и страны под гарантиями; новая кампания требует мира и превосходства сил. После мира — 180 дней восстановления, после капитуляции — два года."
