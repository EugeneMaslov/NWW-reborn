 AUS_nww_meter_help:0 "§YНапряжённость между Веной и Прагой§!\nКаждые 60 дней: §R+1§!. При §R10§! Богемия отделяется.\nКаждое очко: §R-1%§! стабильности и выпуска заводов.\nПереговоры: §G-2§! через 20 дней за 50 политвласти.\nИнвестиции: §G-2§! через 35 дней за 75 политвласти (до трёх раз).\nФокусы богемского урегулирования снижают напряжённость; окончательное соглашение прекращает её рост."
