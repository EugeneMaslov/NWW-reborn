 AUS_nww_crownland_development_desc:0 "Имперский орёл отмечает принадлежащие нам регионы без коронной хартии. Хартия стоит 75 политвласти; следующая выдаётся через 30 дней. Она не предоставляет национальных территорий. Бонусы действуют только под австрийским управлением."
