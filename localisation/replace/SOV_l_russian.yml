l_russian:
 SOV_the_revolution_endures:0 "После Великой смуты"
 SOV_the_revolution_endures_desc:0 "В 1918–1922 годах империю разрушили земельный вопрос, голодные города и распад власти. Советы удержали промышленный центр, но мир гражданской войны ещё не стал устойчивым государством."
 SOV_russian_socialism:0 "Сначала восстановить республику"
 SOV_russian_socialism_desc:0 "Прежде новых походов восстановим налоговую систему, снабжение городов и доверие к учреждениям. Революция должна доказать, что умеет управлять."
 SOV_the_new_constitution:0 "Конституция советских республик"
 SOV_the_new_constitution_desc:0 "Определим полномочия центра и республиканских органов. Права и бюджетные обязательства заменят временные распоряжения гражданской войны."
 SOV_brotherhood_of_peoples:0 "Представительство республик"
 SOV_brotherhood_of_peoples_desc:0 "Национальные советы получат постоянное представительство в общих учреждениях. Харьков, Рига и Таллин остаются участниками переговоров, а не территориями для бесплатного присоединения."
 NWW_SOV_union_congress:0 "Съезд союзного договора"
 NWW_SOV_union_congress_desc:0 "Согласуем общее снабжение, военную координацию и распределение доходов. Собственные правительства союзных республик сохраняются."
 NWW_SOV_party_coordination:0 "Партийная координация"
 NWW_SOV_party_coordination_desc:0 "Выберем постоянный способ согласования решений центра и местных советов. Этот институциональный выбор исключает противоположный вариант."
 NWW_SOV_republican_charters:0 "Хартии республик"
 NWW_SOV_republican_charters_desc:0 "Выберем постоянный способ согласования решений центра и местных советов. Этот институциональный выбор исключает противоположный вариант."
 NWW_SOV_budget_accountability:0 "Ответственность комиссариатов"
 NWW_SOV_budget_accountability_desc:0 "Единый бюджет и проверка исполнения решений сократят дублирование аппарата. Заменим чрезвычайные комиссии постоянной государственной службой."
 NWW_SOV_civil_peace:0 "Завершить гражданское урегулирование"
 NWW_SOV_civil_peace_desc:0 "Гражданское урегулирование заканчивается действующими учреждениями и общими правилами. Противоречия союзного договора больше не парализуют государство."
 SOV_second_five_year_plan:0 "Пересмотр хозяйственного плана"
 SOV_second_five_year_plan_desc:0 "Транспорт, хлебозаготовки и выпуск оборудования отстают от тяжёлой промышленности. Новая программа исправит эти диспропорции."
 NWW_SOV_industrial_survey:0 "Учёт заводов и поставок"
 NWW_SOV_industrial_survey_desc:0 "Составим проверяемый баланс оборудования, топлива и перевозок. Плановые задания будут опираться на реальные мощности."
 NWW_SOV_agricultural_credit:0 "Сельский кредит и машинные станции"
 NWW_SOV_agricultural_credit_desc:0 "Тракторы и предсказуемые закупочные цены восстановят сельское снабжение городов. Новая гражданская фабрика даст мастерские для этой программы."
 SOV_magnitogorsk:0 "Магнитогорский промышленный узел"
 SOV_magnitogorsk_desc:0 "Свяжем металлургию с выпуском оборудования. Два гражданских предприятия и сбалансированные поставки улучшат состояние хозяйственного плана."
 SOV_urals_industry:0 "Уральские оружейные заводы"
 SOV_urals_industry_desc:0 "Уральские предприятия получат реальные военные заказы и новые мощности. Производство перестанет зависеть от импровизированных мастерских."
 NWW_SOV_railway_bottlenecks:0 "Устранить железнодорожные узкие места"
 NWW_SOV_railway_bottlenecks_desc:0 "Согласуем графики грузов и расширим инфраструктуру центральных промышленных областей."
 NWW_SOV_power_stations:0 "Электрификация промышленных районов"
 NWW_SOV_power_stations_desc:0 "Увеличим мощность гражданских предприятий и согласуем энергоснабжение заводов."
 NWW_SOV_standardized_armaments:0 "Стандарты вооружения"
 NWW_SOV_standardized_armaments_desc:0 "Общие чертежи и нормы приёмки позволят ремонтировать технику и наращивать выпуск."
 NWW_SOV_plan_fulfilled:0 "Сбалансированная хозяйственная программа"
 NWW_SOV_plan_fulfilled_desc:0 "Гражданские мощности, военные заказы и транспорт теперь связаны одним действующим планом. Последние стартовые хозяйственные штрафы сменятся преимуществами."
 NWW_SOV_scientific_network:0 "Сеть научных институтов"
 NWW_SOV_scientific_network_desc:0 "Восстановим подготовку инженеров и сеть лабораторий, сохранив исследовательские коллективы."
 NWW_SOV_technical_colleges:0 "Технические училища"
 NWW_SOV_technical_colleges_desc:0 "Промышленности нужны подготовленные мастера и инженеры."
 NWW_SOV_research_council:0 "Совет прикладных исследований"
 NWW_SOV_research_council_desc:0 "Соединим университеты, заводские лаборатории и испытательные полигоны. Число исследовательских ячеек ограничено пятью."
 NWW_SOV_atomic_laboratories:0 "Лаборатории атомной физики"
 NWW_SOV_atomic_laboratories_desc:0 "Долгосрочная программа физики требует действующих институтов, а не разовых обещаний."
 NWW_SOV_rocket_bureau:0 "Ракетное конструкторское бюро"
 NWW_SOV_rocket_bureau_desc:0 "Испытательные стенды и инженерные коллективы начнут исследование ракетной техники."
 SOV_deep_battle:0 "Уроки гражданской войны"
 SOV_deep_battle_desc:0 "Разберём опыт манёвренных фронтов, бронепоездов и разрозненных штабов. Боевой опыт гражданской войны требует новой организации."
 NWW_SOV_unified_command:0 "Единое оперативное командование"
 NWW_SOV_unified_command_desc:0 "Устраним конкурирующие штабы и установим общие оперативные правила. Командование больше не зависит от личных связей гражданской войны."
 SOV_workers_and_peasants_army:0 "Регулярная рабоче-крестьянская армия"
 SOV_workers_and_peasants_army_desc:0 "Воинские части получат общие штаты и учебные программы. Мобилизационный резерв не заменяет подготовленные подразделения."
 SOV_red_artillery:0 "Красная артиллерия"
 SOV_red_artillery_desc:0 "Подготовим наблюдателей, расчёты и снабжение артиллерии."
 NWW_SOV_professional_officers:0 "Профессиональный офицерский корпус"
 NWW_SOV_professional_officers_desc:0 "Военные училища, штабная подготовка и продвижение по квалификации заменят военную импровизацию. Массовые чистки не являются частью этой программы."
 NWW_SOV_mechanized_reserve:0 "Механизированный резерв"
 NWW_SOV_mechanized_reserve_desc:0 "Сосредоточим современную технику в оснащённых резервных частях."
 NWW_SOV_field_radios:0 "Радиосвязь полевых штабов"
 NWW_SOV_field_radios_desc:0 "Свяжем штабы, артиллерию и службы снабжения общими средствами связи."
 NWW_SOV_motorized_columns:0 "Моторизованные колонны"
 NWW_SOV_motorized_columns_desc:0 "Автомобильные подразделения дадут резервам необходимую подвижность."
 NWW_SOV_army_logistics:0 "Тыл регулярной армии"
 NWW_SOV_army_logistics_desc:0 "Снабжение, ремонт и подготовка маршрутов станут частью оперативного плана."
 NWW_SOV_army_maneuvers:0 "Общевойсковые манёвры"
 NWW_SOV_army_maneuvers_desc:0 "Проверим единое командование, работу артиллерии и тыла в общих манёврах. Последние штрафы армии гражданской войны будут устранены."
 NWW_SOV_regular_army:0 "Армия нового государства"
 NWW_SOV_regular_army_desc:0 "Закрепим подготовку кадров и сформируем устойчивый мобилизационный резерв."
 SOV_red_wings:0 "Красные крылья"
 SOV_red_wings_desc:0 "Авиационная школа объединит подготовку экипажей и технических служб."
 NWW_SOV_fighter_schools:0 "Истребительные школы"
 NWW_SOV_fighter_schools_desc:0 "Организуем подготовку истребительных экипажей и испытание самолётов."
 NWW_SOV_ground_support:0 "Авиация поля боя"
 NWW_SOV_ground_support_desc:0 "Разработаем взаимодействие авиации и наземных штабов."
 SOV_ilya_muromets_spirit:0 "Дальний бомбардировочный корпус"
 SOV_ilya_muromets_spirit_desc:0 "Опыт конструкторов тяжёлых самолётов послужит новой программе дальних машин."
 NWW_SOV_air_service:0 "Единая авиационная служба"
 NWW_SOV_air_service_desc:0 "Объединим ремонт, обучение и подготовку аэродромов."
 SOV_red_banner_fleet:0 "Краснознамённый флот"
 SOV_red_banner_fleet_desc:0 "Восстановим кадровую подготовку флота и управление морскими базами."
 NWW_SOV_baltic_bases:0 "Балтийские базы"
 NWW_SOV_baltic_bases_desc:0 "Развиваем судостроение на собственном побережье."
 NWW_SOV_black_sea_bases:0 "Черноморская программа"
 NWW_SOV_black_sea_bases_desc:0 "Новые верфи и береговое снабжение поддержат южную эскадру."
 NWW_SOV_escort_fleet:0 "Эскортные соединения"
 NWW_SOV_escort_fleet_desc:0 "Крейсеры, лёгкие корабли и противолодочная подготовка защитят морские коммуникации."
 NWW_SOV_coastal_submarines:0 "Подводные силы"
 NWW_SOV_coastal_submarines_desc:0 "Готовим экипажи и новую подводную технику."
 NWW_SOV_fleet_readiness:0 "Готовность флота"
 NWW_SOV_fleet_readiness_desc:0 "Общие учения проверят управление эскортами и подводными соединениями."
 SOV_comintern_calls:0 "Общий революционный фронт"
 SOV_comintern_calls_desc:0 "Согласуем общую политику советских республик. Внешние требования станут продолжением подготовки государства, а не заменой реформам."
 NWW_SOV_strategic_pause:0 "Реконструкция перед экспансией"
 NWW_SOV_strategic_pause_desc:0 "Армия, экономика и союзные учреждения должны быть готовы к внешнему кризису."
 NWW_SOV_frontier_review:0 "Пересмотр западной границы"
 NWW_SOV_frontier_review_desc:0 "Подготовим политические и военные требования к буферным государствам. Дата сама по себе не заменяет внутренних реформ."
 NWW_SOV_western_command:0 "Западное оперативное командование"
 NWW_SOV_western_command_desc:0 "Разработаем ограниченные оперативные задачи и снабжение западного фронта."
 NWW_SOV_litbel_ultimatum:0 "Требования к Литовско-Белорусскому Союзу"
 NWW_SOV_litbel_ultimatum_desc:0 "Предложим Союзу военный доступ и внешнеполитические гарантии. Его правительство самостоятельно решит, принять требования или готовиться к сопротивлению."
 NWW_SOV_litbel_campaign:0 "Западная кампания"
 NWW_SOV_litbel_campaign_desc:0 "После отказа Союза подготовленный штаб получает бессрочную цель войны. Союзники и добровольно заключившие урегулирование государства исключены из кампании."
 NWW_SOV_steppe_conference:0 "Переговоры с вольной степью"
 NWW_SOV_steppe_conference_desc:0 "Съезд вольной территории получит предложение о хозяйственном обмене и ненападении. Признанные договоры равноправия и существующие союзы сохраняются."
 NWW_SOV_steppe_campaign:0 "Разрешить степной конфликт"
 NWW_SOV_steppe_campaign_desc:0 "Война возможна после отказа от протокола, при готовности регулярной армии и отсутствии союзных обязательств. Новая ветка не отменяет признанное равноправие махновских советов."
 NWW_SOV_state_0:0 "Незавершённый союзный договор"
 NWW_SOV_state_0_desc:0 "Этап 1 из 4. Реформы последовательно меняют этот дух; случайные чистки и паранойя не используются."
