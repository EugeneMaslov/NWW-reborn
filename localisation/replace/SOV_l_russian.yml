 NWW_SOV_party_coordination_idea:0 "Партийная координация"
 NWW_SOV_party_coordination_idea_desc:0 "Постоянная программа, созданная реальными решениями и договорённостями нового государства."
 NWW_SOV_republican_charters_idea:0 "Хартии республик"
 NWW_SOV_republican_charters_idea_desc:0 "Постоянная программа, созданная реальными решениями и договорённостями нового государства."
 NWW_SOV_regular_logistics:0 "Тыл регулярной армии"
 NWW_SOV_regular_logistics_desc:0 "Постоянная программа, созданная реальными решениями и договорённостями нового государства."
 NWW_SOV_air_service_idea:0 "Единая авиационная служба"
 NWW_SOV_air_service_idea_desc:0 "Постоянная программа, созданная реальными решениями и договорённостями нового государства."
 NWW_SOV_steppe_exchange:0 "Гуляйпольский хозяйственный протокол"
 NWW_SOV_steppe_exchange_desc:0 "Постоянная программа, созданная реальными решениями и договорённостями нового государства."
 NWW_SOV_disabled_subsystems:0 "Недействующие подсистемы совместимости"
 NWW_SOV_general_secretary:0 "Генеральный секретарь восстановленной республики"
 nww_sov.1.t:0 "Республика после Смуты"
 nww_sov.1.d:0 "Мировой войны не было, но мира оказалось недостаточно. Земельный кризис, продовольственные перебои и стачки разрушили империю в 1918–1922 годах. Советы удержали промышленные узлы, однако западные окраины стали независимыми, а украинская степь отвергла власть центра. Теперь республика должна согласовать полномочия, исправить хозяйственный план и превратить армию гражданской войны в регулярную. Только после этого Москва сможет предъявить новые требования соседям."
 nww_sov.1.a:0 "Построить государство, способное пережить революцию."
 nww_sov.10.t:0 "Советские требования к Союзу"
 nww_sov.10.d:0 "Москва требует военного доступа и гарантий нейтралитета Литовско-Белорусского Союза. Согласие сохранит наше правительство и границы, но даст советским войскам доступ. Отказ позволит Москве открыть военную кампанию после необходимой подготовки. Компромисс между народами Союза остаётся нашим внутренним делом."
 nww_sov.10.a:0 "Принять гарантии, сохранив самостоятельность."
 nww_sov.10.b:0 "Союз сам определяет свою политику."
 nww_sov.20.t:0 "Предложение Москве и вольной степи"
 nww_sov.20.d:0 "Советская делегация предлагает обмен оборудованием и зерном, доступ к техническим разработкам и договор о ненападении. Протокол не меняет наше правительство и не превращает общины в советскую провинцию. Отказ оставит конфликт открытым; уже признанное равноправие и союз Москва не отменяет этим предложением."
 nww_sov.20.a:0 "Сотрудничать на основе самостоятельности советов."
 nww_sov.20.b:0 "Не связывать степь московским договором."
 NWW_SOV_doctrine_bonus:0 "Советская программа доктрин"
 NWW_SOV_reconstruction_ready_tt:0 "Согласован союзный договор, развиты Магнитогорск и Урал, подготовлен профессиональный офицерский корпус."
 NWW_SOV_campaign_ready_tt:0 "Завершены гражданское урегулирование и общевойсковые манёвры."
