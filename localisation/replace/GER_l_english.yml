l_english:
 NWW_GER_quality:0 "Industrial standardisation"
 NWW_GER_quality_desc:0 "The government funds this programme and sustains it through public institutions."
 GER_the_kaiser_endures:0 "The Kaiser Endures"
 GER_the_kaiser_endures_desc:0 "Strengthen the imperial institutions and production system."
 GER_prussian_traditions:0 "Prussian Traditions"
 GER_prussian_traditions_desc:0 "Strengthen the imperial institutions and production system."
 GER_krupp_and_thyssen:0 "Imperial Industrial Council"
 GER_krupp_and_thyssen_desc:0 "Krupp, Thyssen, electrical firms and the states coordinate investment. Industrial research and construction improve through a lasting program financed without conquest debt."
 GER_the_fleet_question:0 "The Fleet Question"
 GER_the_fleet_question_desc:0 "Strengthen the imperial institutions and production system."
 GER_mitteleuropa_trade:0 "Mitteleuropa Chambers of Commerce"
 GER_mitteleuropa_trade_desc:0 "Supply contracts and chambers of commerce expand civilian production. Economic cooperation does not itself subjugate neighboring states."
 GER_the_eastern_question:0 "The Eastern Question"
 GER_the_eastern_question_desc:0 "Strengthen the imperial institutions and production system."
 GER_guardians_of_the_reich:0 "Guardians Of The Reich"
 GER_guardians_of_the_reich_desc:0 "Strengthen the imperial institutions and production system."
 GER_1:0 "Modernize the Ruhr Basin"
 GER_1_desc:0 "Modern shafts and processing plants expand Ruhr coal extraction. The resource investment requires ownership and control of the Ruhr."
 GER_2:0 "Overseas Enterprise Concessions"
 GER_2_desc:0 "Develop overseas rubber and chromium enterprises only in regions we actually own and control. Indigenous claims remain intact."
 GER_3:0 "Eastern Industrial Orders"
 GER_3_desc:0 "State orders support new military production on owned and controlled German core territory."
 GER_4:0 "Common Armament Standards"
 GER_4_desc:0 "Common tolerances and interchangeable parts improve production efficiency growth and support infantry weapon research."
 GER_5:0 "Rhineland Investment Banks"
 GER_5_desc:0 "Long-term investment supports a new civilian enterprise on owned and controlled German core territory."
 GER_6:0 "State Industrial Bonds"
 GER_6_desc:0 "Voluntary state industrial bonds direct savings into equipment and construction, permanently improving the industrial program."
 GER_7:0 "Precision Manufacturing"
 GER_7_desc:0 "Train master craftsmen and strengthen quality control to raise the production efficiency cap."
 GER_8:0 "Coordinate the Industrial Program"
 GER_8_desc:0 "Bring military standardization and technical education together. An additional research slot is granted only below five slots."
 GER_9:0 "Next-Generation Arsenals"
 GER_9_desc:0 "New military factories and improved output build on the completed industrial and engineering program."
 GER_10:0 "Automated Armament Lines"
 GER_10_desc:0 "Automatic tooling supports infantry weapon research without directly granting technologies from a later era."
 GER_nww_electrical_grid:0 "Connect Regional Power Grids"
 GER_nww_electrical_grid_desc:0 "Link regional generating stations and industrial grids to improve energy supply. Coal extraction and efficient distribution must support new factories."
 GER_nww_silesian_steel:0 "Silesian Steelworks"
 GER_nww_silesian_steel_desc:0 "Modernize Silesian furnaces to supply steel for machinery, railways and armaments. The steel is added only while we own and control the region."
 GER_nww_arsenal_contracts:0 "Long-Term Arsenal Contracts"
 GER_nww_arsenal_contracts_desc:0 "Give arsenals predictable long-term contracts, improving the output of existing military factories."
 GER_nww_machine_tools:0 "Machine Tool Cooperation"
 GER_nww_machine_tools_desc:0 "Coordinate machine tools, fixtures and spare parts to speed the development of new production lines and industrial technology."
 GER_nww_industrial_standards:0 "National Technical Standards"
 GER_nww_industrial_standards_desc:0 "Common technical standards integrate private designs with public orders, raising the production efficiency cap."
 GER_nww_technical_colleges:0 "State Technical Colleges"
 GER_nww_technical_colleges_desc:0 "Technical colleges train engineers and laboratory staff, providing a lasting research bonus."
 GER_nww_freight_corridors:0 "Imperial Freight Corridors"
 GER_nww_freight_corridors_desc:0 "Improve infrastructure twice in eligible owned and controlled German core regions so industry can receive coal and components."
 GER_nww_merchant_contracts:0 "Merchant Shipping Contracts"
 GER_nww_merchant_contracts_desc:0 "Long-term shipping contracts supply twenty convoys for trade between the metropole and overseas possessions."
 GER_nww_export_credit:0 "Export Credit"
 GER_nww_export_credit_desc:0 "Export guarantees support another civilian enterprise. Trade prepares the ground for diplomacy rather than an immediate war."
 GER_nww_investment_guarantees:0 "Long-Term Investment Guarantees"
 GER_nww_investment_guarantees_desc:0 "Predictable procurement completes the states investment program and permanently improves construction speed."
 GER_nww_industrial_research:0 "Imperial Research Association"
 GER_nww_industrial_research_desc:0 "Unite universities, arsenals and private laboratories in applied research, improving the lasting industrial program."
 GER_nww_balanced_orders:0 "Balanced Procurement"
 GER_nww_balanced_orders_desc:0 "Balance civilian and military orders by building one enterprise of each kind on owned and controlled German core territory."
 GER_nww_synthetic_fuels:0 "Coal-Based Synthetic Fuels"
 GER_nww_synthetic_fuels_desc:0 "Build a synthetic refinery in an eligible domestic core region. Fuel security complements coal extraction and the electrical grid."
 GER_nww_colonial_ports:0 "Overseas Port Warehouses"
 GER_nww_colonial_ports_desc:0 "Expand civilian storage and processing capacity for overseas shipping without transferring territory or creating colonial cores."
 GER_nww_energy_keystones:0 "Ruhr Energy Infrastructure"
 GER_nww_energy_keystones_desc:0 "Build an energy-infrastructure installation, prioritizing the Ruhr when eligible. The project requires an owned and controlled core region with room for the building."
 GER_nww_worker_housing:0 "Industrial Workers Housing"
 GER_nww_worker_housing_desc:0 "Housing programs reduce tensions in growing industrial towns and improve national stability."
 GER_nww_electromechanical_labs:0 "Electromechanical Laboratories"
 GER_nww_electromechanical_labs_desc:0 "Electromechanical laboratories support electronics research and the development of industrial communications."
 GER_nww_supply_resilience:0 "Resilient Supply Chains"
 GER_nww_supply_resilience_desc:0 "Provide twenty locomotives to support resilient supply chains and reliable freight transport."
 GER_nww_prague_network:0 "Contacts with Bohemian Autonomists"
 GER_nww_prague_network_desc:0 "Intelligence contacts with Bohemian autonomists unlock an agency operation against Austria with La Resistance. Each completion adds two tension and counts toward German influence."
