l_russian:
 NWW_GER_quality:0 "Промышленная стандартизация"
 NWW_GER_quality_desc:0 "Правительство финансирует эту программу и поддерживает её действие через государственные учреждения."
 GER_the_kaiser_endures:0 "GER_the_kaiser_endures"
 GER_the_kaiser_endures_desc:0 "Укрепим государственные и производственные учреждения империи."
 GER_prussian_traditions:0 "GER_prussian_traditions"
 GER_prussian_traditions_desc:0 "Укрепим государственные и производственные учреждения империи."
 GER_krupp_and_thyssen:0 "Имперский промышленный совет"
 GER_krupp_and_thyssen_desc:0 "Крупп, Тиссен, электротехнические концерны и земли согласуют программу инвестиций. Это начало развития единого промышленного комплекса, а не схема долгов ради завоеваний."
 GER_the_fleet_question:0 "GER_the_fleet_question"
 GER_the_fleet_question_desc:0 "Укрепим государственные и производственные учреждения империи."
 GER_mitteleuropa_trade:0 "Торговые палаты Миттельевропы"
 GER_mitteleuropa_trade_desc:0 "Договоры поставок и торговые палаты расширят гражданское производство. Экономическое сотрудничество само по себе не подчиняет соседей."
 GER_the_eastern_question:0 "GER_the_eastern_question"
 GER_the_eastern_question_desc:0 "Укрепим государственные и производственные учреждения империи."
 GER_guardians_of_the_reich:0 "GER_guardians_of_the_reich"
 GER_guardians_of_the_reich_desc:0 "Укрепим государственные и производственные учреждения империи."
 GER_1:0 "Модернизировать Рурский бассейн"
 GER_1_desc:0 "Новые шахтные стволы и обогатительные установки увеличат добычу рурского угля. Рост промышленности должен опираться на реальную энергетическую базу."
 GER_2:0 "Концессии заморских предприятий"
 GER_2_desc:0 "Вложения в заморские предприятия увеличат добычу только в принадлежащих нам и контролируемых регионах. Коренное население сохраняет национальные территории; германские колониальные коры не добавляются."
 GER_3:0 "Восточные промышленные заказы"
 GER_3_desc:0 "Государственные заказы поддержат оборонные предприятия германских земель. Заводы строятся на собственных контролируемых национальных территориях."
 GER_4:0 "Единые стандарты вооружения"
 GER_4_desc:0 "Единые допуски и взаимозаменяемые детали ускорят освоение серийного оружия. Военные технологии опираются на развитие станочного производства."
 GER_5:0 "Рейнские инвестиционные банки"
 GER_5_desc:0 "Привлечём долгосрочные вложения к рейнским и общегерманским предприятиям. Производственные мощности растут без МЕФО и завоевательной долговой экономики."
 GER_6:0 "Промышленные облигации земель"
 GER_6_desc:0 "Добровольные облигации земель направят сбережения в оборудование, коммуникации и новые корпуса. Неограниченных денежных или фабричных наград эта программа не даёт."
 GER_7:0 "Культура точного производства"
 GER_7_desc:0 "Обучение мастеров и контроль качества дадут устойчивый рост производственной эффективности. Программа развивает общий промышленный дух."
 GER_8:0 "Согласовать промышленную программу"
 GER_8_desc:0 "Военная стандартизация и гражданские технические школы должны сойтись в общей исследовательской программе. Дополнительная ячейка предоставляется только до пяти исследовательских ячеек."
 GER_9:0 "Арсеналы нового поколения"
 GER_9_desc:0 "Новые военные предприятия опираются на уже подготовленную производственную и инженерную базу. Это завершение подготовки, а не ранний скачок к массовой агрессии."
 GER_10:0 "Автоматизация оружейных линий"
 GER_10_desc:0 "Внедрим автоматическую оснастку в оружейное производство. Бонус исследований не выдаёт технологии другой эпохи напрямую."
 GER_nww_electrical_grid:0 "Соединить региональные энергосистемы"
 GER_nww_electrical_grid_desc:0 "Объединим региональные электростанции и промышленные сети. Уголь и генерация останутся основой энергетики, а единая сеть уменьшит потери."
 GER_nww_silesian_steel:0 "Силезская металлургия"
 GER_nww_silesian_steel_desc:0 "Модернизация силезских домен даст сталь для станков, рельсов и вооружения. Награда предоставляется только при нашем владении и контроле над Силезией."
 GER_nww_arsenal_contracts:0 "Долгосрочные контракты арсеналов"
 GER_nww_arsenal_contracts_desc:0 "Вместо чрезвычайных займов арсеналы получат предсказуемые многолетние заказы. Это повышает выпуск уже существующих военных заводов."
 GER_nww_machine_tools:0 "Станкостроительная кооперация"
 GER_nww_machine_tools_desc:0 "Машиностроительные фирмы согласуют выпуск станков, оснастки и запасных частей. Это ускорит развёртывание новых производственных линий."
 GER_nww_industrial_standards:0 "Общегерманские технические нормы"
 GER_nww_industrial_standards_desc:0 "Унификация деталей и производственных норм позволит совместить разработки частных фирм с государственными заказами."
 GER_nww_technical_colleges:0 "Технические училища земель"
 GER_nww_technical_colleges_desc:0 "Инженерные школы подготовят специалистов для заводов и лабораторий. Их постоянный вклад выражается в общем промышленном духе."
 GER_nww_freight_corridors:0 "Грузовые коридоры империи"
 GER_nww_freight_corridors_desc:0 "Улучшим инфраструктуру двух собственных германских промышленных регионов. Заводы должны получать уголь и комплектующие до начала новой гонки вооружений."
 GER_nww_merchant_contracts:0 "Контракты торгового флота"
 GER_nww_merchant_contracts_desc:0 "Долгосрочные контракты дадут торговому флоту транспорты для устойчивых поставок между метрополией и заморскими владениями."
 GER_nww_export_credit:0 "Экспортное кредитование"
 GER_nww_export_credit_desc:0 "Государственные гарантии экспортных контрактов поддержат гражданские предприятия. Торговля станет подготовкой к переговорам, а не поводом для немедленной войны."
 GER_nww_investment_guarantees:0 "Гарантии долгосрочных вложений"
 GER_nww_investment_guarantees_desc:0 "Прозрачные гарантии заказов завершают инвестиционную программу земель. Рост строительства не требует запуска ванильной экономики завоеваний."
 GER_nww_industrial_research:0 "Имперское исследовательское объединение"
 GER_nww_industrial_research_desc:0 "Университеты, арсеналы и частные лаборатории объединят прикладные программы. Результат сохраняется в общем промышленном духе."
 GER_nww_balanced_orders:0 "Сбалансированная система заказов"
 GER_nww_balanced_orders_desc:0 "Гражданские и военные предприятия получают сбалансированную программу заказов. Имперская промышленность должна выдержать длительное напряжение без долговых миссий."
 GER_nww_synthetic_fuels:0 "Синтетическое топливо из угля"
 GER_nww_synthetic_fuels_desc:0 "Разовьём синтетическую переработку в собственном промышленном регионе. Топливная безопасность дополняет, но не заменяет энергетическую систему угля и сетей."
 GER_nww_colonial_ports:0 "Складские узлы заморских портов"
 GER_nww_colonial_ports_desc:0 "Складские и перерабатывающие мощности поддержат заморские перевозки. Программа не передаёт чужие территории и не создаёт германские колониальные коры."
 GER_nww_energy_keystones:0 "Энергетическая инфраструктура Рура"
 GER_nww_energy_keystones_desc:0 "Построим энергетическую инфраструктуру в собственном контролируемом регионе, где её ещё нет. Используется инфраструктурный объект установленной версии игры."
 GER_nww_worker_housing:0 "Жильё для промышленных рабочих"
 GER_nww_worker_housing_desc:0 "Жилищные программы снизят напряжённость в растущих промышленных городах. Развитие производственной базы должно сопровождаться улучшением быта."
 GER_nww_electromechanical_labs:0 "Электромеханические лаборатории"
 GER_nww_electromechanical_labs_desc:0 "Электромеханика и связь дадут основу для следующего поколения промышленного оборудования. Гражданское применение технологий предшествует массовому перевооружению."
 GER_nww_supply_resilience:0 "Устойчивые цепочки поставок"
 GER_nww_supply_resilience_desc:0 "Резерв локомотивов и согласованные контракты укрепят снабжение. Программа создаёт реальный транспорт, не заменяя его абстрактной наградой людскими ресурсами."
 GER_nww_prague_network:0 "Связи с богемскими автономистами"
 GER_nww_prague_network_desc:0 "Разведка установит контакты с богемскими автономистами. При наличии La Résistance в агентстве откроется операция против Австрии: каждое завершение даёт +2 к напряжённости и учитывается как немецкий вклад."
