 GER_nww_industry_research_tt:0 "Imperial Industrial Program: research speed §G+5%§!."
 GER_nww_industry_energy_tt:0 "Imperial Industrial Program: energy gain §G+10%§!."
 GER_nww_industrial_program_desc:0 "Coordinated investment by the states, enterprises and technical colleges links energy supply, machine tools and long-term public procurement. Industrial reforms progressively develop this program."
 GER_nww_bohemian_operation_unlock_tt:0 "Unlocks §YSupport Bohemian Autonomists§! in the intelligence agency against §YAustria§! (La Résistance required). The operation takes §Y45 days§!, one operative, a §Y35§! network, two civilian factories, 100 infantry equipment and 25 support equipment."
 GER_nww_bohemian_autonomists:0 "Support Bohemian Autonomists"
 GER_nww_bohemian_autonomists_desc:0 "Funding local organizations, clandestine presses and intermediaries strengthens demands for sovereignty.\n\nTension: §Y[?AUS.AUS_bohemian_tension|0]/10§!. German contribution: §Y[?AUS.AUS_bohemian_german_share|1]%§!.\n\nEach completion adds §R+2§! tension, capped at 10. Upon secession, Bohemia becomes our puppet if the current German share is §Ystrictly greater than 60%§!. Austrian concessions proportionally reduce our contribution. The operation ends with settlement or secession."
 GER_nww_bohemian_operation_reward_tt:0 "§R+2§! Bohemian tension, capped at 10. Only the pressure actually added counts as Germany's contribution. If this causes secession with a German share §Yabove 60%§!, the new Bohemia becomes Germany's puppet. Exactly 60% is insufficient."
 GER_nww_austrian_1939_tt:0 "The Austrian ultimatum is available §Yno earlier than 1 January 1939§!."
 GER_nww_historical_pressure_ready:0 "Historical AI begins coercive pressure in Mitteleuropa in §Y1939§!."
 GER_nww_historical_eastern_war_ready:0 "Historical AI pursues eastern war goals in §Y1940§!."
 nww_ger_bohemia.1.t:0 "Bohemia Accepts German Protection"
 nww_ger_bohemia.1.d:0 "Our intelligence work supplied the decisive share of pressure behind the break between Prague and Vienna. Dependent on German support, the new Bohemian government accepts its place as a puppet of the empire."
 nww_ger_bohemia.1.a:0 "Prague enters our sphere."
