l_english:
 LTB_focus: "Union of Lithuania and Belarus"
 LTB_consolidate_the_union: "Consolidate the Union"
 LTB_consolidate_the_union_desc: "Kaunas and Minsk must speak with one voice before the giants around us decide our fate for us."
 ltb.112.a: "The Union can no longer hold"
 LTB_rebuild_the_bridge: "Rebuild the Bridge"
 LTB_rebuild_the_bridge_desc: "The Union is only as strong as the roads, factories, and trust between Vilnius and Minsk."
 LTB_baltic_bridgehead: "Baltic Bridgehead"
 LTB_baltic_bridgehead_desc: "A compact and armed Union can still become a pivot of the Baltic."
 LTB_the_vilnius_compromise: "The Vilnius Compromise"
 LTB_the_vilnius_compromise_desc: "Broad autonomy for Belarus within the Union. The schools of Minsk will teach in Belarusian."
 LTB_vilnius_compromise_deadline:0 "Implement the Vilnius Compromise"
 LTB_vilnius_compromise_deadline_desc:0 "From the beginning of the campaign the Union has 210 days to complete the Vilnius Compromise national focus. Complete it before the timer expires. If the compromise is not accepted, the crisis forces a choice of successor state."
 LTB_choose_lithuania:0 "Continue as Lithuania"
 LTB_choose_lithuania_desc:0 "Dissolve the Union and continue the campaign as Lithuania."
 LTB_choose_belarus:0 "Continue as Belarus"
 LTB_choose_belarus_desc:0 "Dissolve the Union and continue the campaign as Belarus."
 LTB_kaunas_first: "Kaunas First"
 LTB_kaunas_first_desc: "The Union holds only if Kaunas holds the reins. Lithuania leads, Belarus follows."
 LTB_belarusian_schools: "Belarusian Schools"
 LTB_belarusian_schools_desc: "A literate peasant is a loyal citizen."
 LTB_land_for_the_tillers: "Land for the Tillers"
 LTB_land_for_the_tillers_desc: "Break the great estates. The man who owns his field will defend it."
 LTB_the_seimas_of_kaunas: "The Seimas of Kaunas"
 LTB_the_seimas_of_kaunas_desc: "Gather the notables and give the central government a proper mandate."
 LTB_mobilize_the_sauliai: "Mobilize the Sauliai"
 LTB_mobilize_the_sauliai_desc: "The Riflemen's Union will be the backbone of the national army."
 LTB_face_the_crisis: "Face the Crisis"
 LTB_face_the_crisis_desc: "The national question can no longer be postponed. Decide the fate of the Union."
 LTB_union_general_staff: "Union General Staff"
 LTB_union_general_staff_desc: "After the Vilnius compromise and resolution of the crisis, establish common command for both republics. A joint staff will overcome army disorganisation and coordinate officer training."
 LTB_the_minsk_school: "The Minsk School"
 LTB_the_minsk_school_desc: " Belorussian officers bring the hard lessons of the eastern wars."
 LTB_timoshenkos_doctrine: "Timoshenko's Doctrine"
 LTB_timoshenkos_doctrine_desc: "Deep defense, fast reserves, and no step back on native soil."
 LTB_officers_of_two_nations: "Officers of Two Nations"
 LTB_officers_of_two_nations_desc: "Mixed cadet schools will forge a single officer corps."
 LTB_fortify_the_dvina: "Fortify the Dvina"
 LTB_fortify_the_dvina_desc: "The Western Dvina must become a wall against any invader."
 LTB_minsk_arsenal_works: "Minsk Arsenal Works"
 LTB_minsk_arsenal_works_desc: "A union that cannot arm itself is a union on paper only."
 LTB_electrify_the_union: "Electrify the Union"
 LTB_electrify_the_union_desc: "Power lines from Kaunas to Vitebsk."
 LTB_neman_trade_company: "Neman Trade Company"
 LTB_neman_trade_company_desc: "The Neman carries our timber and flax to the sea."
 LTB_workers_of_minsk_and_kaunas: "Workers of Minsk and Kaunas"
 LTB_workers_of_minsk_and_kaunas_desc: "Bread and order will keep the factories loyal."
 LTB_balance_between_giants: "Balance Between Giants"
 LTB_balance_between_giants_desc: "With the Union preserved, establish a diplomatic service for talks with Moscow, Warsaw and Berlin. Each treaty needs the other country's consent. Cooperation offers trade, equipment and security while retaining an independent Union policy."
 LTB_overture_to_moscow: "A Pact with Moscow"
 LTB_overture_to_moscow_desc: "Offer Moscow a non-aggression pact and technical exchange. Acceptance opens an eastern trade programme; refusal leaves other diplomatic directions available."
 LTB_the_polish_question: "The Polish Question"
 LTB_the_polish_question_desc: "Offer Warsaw recognition of the existing border and withdrawal of mutual territorial claims. If Poland accepts, a non-aggression pact becomes the basis for mutual-guarantee negotiations."
 LTB_german_engineers: "German Engineers"
 LTB_german_engineers_desc: "Offer German companies an industrial agreement. If Berlin agrees, the Union funds an engineering mission and gains machine tools, technology and a modernization programme for Minsk."
 LTB_unresolved_national_question: "Unresolved National Question"
 LTB_unresolved_national_question_desc: "Lithuanians and Belarusians share a state but not yet a nation."
 LTB_vilnius_compromise: "Vilnius Compromise"
 LTB_vilnius_compromise_desc: "Autonomy has bought the loyalty of Minsk."
 LTB_kaunas_centralism: "Kaunas Centralism"
 LTB_kaunas_centralism_desc: "Order from above, in Lithuanian."
 LTB_minsk_arsenal: "Minsk Arsenal"
 LTB_minsk_arsenal_desc: "The Union's own military industry."
 LTB_union_army_tradition: "Union Army Tradition"
 LTB_union_army_tradition_desc: "Two nations, one officer corps."
 LTB_ZARETCHKY_DESC: "President of the Union, a cautious democrat."
 LTB_GARUN_DESC: "Prime minister, master of compromise."
 LTB_MELEZH_DESC: "Voice of the Belarusian communists."
 LTB_LEVITSKY_DESC: "Leader of the Lithuanian nationalists."
 LTB_TIMOSHENKO_DESC: "Builder of the Union army."
 LTB_BELYATSKY_DESC: "Old cavalryman of three wars."
 LTB_ABRAMIENKA_DESC: "Defender of Minsk."
 LTB_focus_desc: "The joint national focus tree of Lithuania and Belarus."
 LTB_observe_the_skies: "Observe the Skies"
 LTB_observe_the_skies_desc: "A few planes today, an air force tomorrow."
 LTB_kaunas_air_club: "Kaunas Air Club"
 LTB_kaunas_air_club_desc: "Sport pilots make the best fighter pilots."
 LTB_vitebsk_airfield: "Vitebsk Airfield"
 LTB_vitebsk_airfield_desc: "A concrete strip on the eastern frontier."
 LTB_memel_shipyards:0 "Courland Shipyards"
 LTB_memel_shipyards_desc:0 "Courland ports will serve as the Union fleet base and build small escort ships."
 LTB_baltic_patrols:0 "Baltic Patrols"
 LTB_baltic_patrols_desc:0 "Protect the Union's trade routes and coastal approaches."
 LTB_coastal_flotilla:0 "Coastal Flotilla"
 LTB_coastal_flotilla_desc:0 "A modest force of patrol craft will make the Baltic coast harder to raid."
 LTB_the_union_endures: "The Union Endures"
 LTB_the_union_endures_desc: "Against all odds, Kaunas and Minsk still stand together."
 LTB_the_pbmat_pact: "The PBMAT Pact"
 LTB_the_pbmat_pact_desc: "A military alliance of the lands between Germany and Russia."
 LTB_fortress_vitebsk: "Fortress Vitebsk"
 LTB_fortress_vitebsk_desc: "The eastern gate of the Union must hold."
 LTB_two_nations_one_voice: "Two Nations, One Voice"
 LTB_two_nations_one_voice_desc: "The compromise generation takes power."
 LTB_the_1926_legacy: "Legacy of 1926"
 LTB_the_1926_legacy_desc: "The coup generation hands over a stable republic."
 LTB_cavalry_inspectorate: "Cavalry Inspectorate"
 LTB_cavalry_inspectorate_desc: "Horses still matter on the eastern plains."
 LTB_border_guard_corps: "Border Guard Corps"
 LTB_border_guard_corps_desc: "Every verst of the frontier watched."
 LTB_vilnius_radio: "Vilnius Radio"
 LTB_vilnius_radio_desc: "The voice of the Union on every wave."
 LTB_kaunas_textile: "Kaunas Textile"
 LTB_kaunas_textile_desc: "Linen for uniforms, linen for export."
 LTB_crown_the_regency: "Crown the Regency"
 LTB_crown_the_regency_desc: "With at least 40% public support, the crown's supporters can establish a union monarchy. Coronation will secure common authority over both republics."
 LTB_restore_the_grand_duchy: "Restore the Grand Duchy"
 LTB_restore_the_grand_duchy_desc: "From the Baltic to the Black Sea - as it once was."
 LTB_order_and_tradition: "Order and Tradition"
 LTB_order_and_tradition_desc: "What held for centuries will hold again."
 LTB_free_elections_now: "Free Elections Now"
 LTB_free_elections_now_desc: "The democratic movement must secure at least 40% public support. This mandate will allow free elections and the transfer of power to an elected government."
 LTB_landtag_democracy: "Landtag Democracy"
 LTB_landtag_democracy_desc: "Parliaments in Kaunas and Minsk, united in Vilnius."
 LTB_free_press_free_union: "Free Press, Free Union"
 LTB_free_press_free_union_desc: "Censorship belongs to empires."
 LTB_the_iron_wolf_calls: "The Iron Wolf Calls"
 LTB_the_iron_wolf_calls_desc: "The national movement calls for common authority and mobilisation. Adopting its course requires at least 40% public support."
 LTB_steel_and_blood: "Steel and Blood"
 LTB_steel_and_blood_desc: "The nation will be forged, not debated."
 LTB_one_people_one_leader: "One People, One Leader"
 LTB_one_people_one_leader_desc: "Two nations, one will, one leader."
 LTB_red_dawn_over_minsk: "Red Dawn over Minsk"
 LTB_red_dawn_over_minsk_desc: "Workers' unions and left-wing organisations must secure at least 40% public support. This mandate will allow the formation of a union government of labour."
 LTB_soviets_of_workers: "Soviets of Workers"
 LTB_soviets_of_workers_desc: "All power to the working people."
 LTB_international_brigades: "International Brigades"
 LTB_international_brigades_desc: "Volunteers of the world revolution."
 LTB: "Lithuania-Belarus"
 LTB_DEF: "Lithuania-Belarus"
 LTB_ADJ: "Lithuanian-Belarusian"
 NWW_LTB_DESC: "The Union of Lithuania and Belarus."
 NWW_LTB_Ales_Garun:0 "Ales Garun"
 NWW_LTB_Michael_Zaretchky:0 "Michael Zaretchky"
 NWW_LTB_Ivan_Melezh:0 "Ivan Melezh"
 LTB_semi_agrarian_economy:0 "Semi-Agrarian Economy"
 LTB_semi_agrarian_economy_desc:0 "Most of the Union still depends on low-yield farms and scattered workshops. Modern machinery and connected markets are needed to industrialize."
 LTB_semi_agrarian_economy_1:0 "Semi-Agrarian Economy"
 LTB_semi_agrarian_economy_1_desc:0 "Mechanization has begun to raise output, but farms and workshops still limit industrial growth."
 LTB_semi_agrarian_economy_2:0 "Semi-Agrarian Economy"
 LTB_semi_agrarian_economy_2_desc:0 "Cooperative farming and rural electrification are steadily releasing labor and resources for industry."
 LTB_semi_agrarian_economy_3:0 "Semi-Agrarian Economy"
 LTB_semi_agrarian_economy_3_desc:0 "Only the final stage of the industrial plan remains before the agrarian production penalty is fully removed."
 LTB_depression_legacy:0 "Depression Legacy"
 LTB_depression_legacy_desc:0 "The Great Depression left factories idle, credit scarce, and public confidence shaken. Recovery requires deliberate investment."
 LTB_depression_legacy_1:0 "Depression Legacy"
 LTB_depression_legacy_1_desc:0 "Public works have restarted production, though the last effects of the Depression remain."
 LTB_disorganized_army:0 "Disorganized Army"
 LTB_disorganized_army_desc:0 "The Union's divided administration has left its armed forces without a unified command system."
 LTB_agricultural_mechanization:0 "Mechanize Agriculture"
 LTB_agricultural_mechanization_desc:0 "Tractors, fertilizer, and cooperative depots can free labor for factories and raise the countryside's output."
 LTB_cooperative_farms:0 "Cooperative Farms"
 LTB_cooperative_farms_desc:0 "Shared equipment and storage reduce waste while improving the flow of produce to urban centers."
 LTB_rural_electrification:0 "Rural Electrification"
 LTB_rural_electrification_desc:0 "Power the countryside and connect its workshops to the industrial grid."
 LTB_depression_recovery:0 "Recover from the Depression"
 LTB_depression_recovery_desc:0 "Public works and steady contracts will bring idle workshops back to life."
 LTB_factory_reconstruction:0 "Reconstruct the Factories"
 LTB_factory_reconstruction_desc:0 "Modern equipment and stable orders will finish restoring production after the Depression."
 LTB_minsk_machine_works:0 "Minsk Machine Works"
 LTB_minsk_machine_works_desc:0 "Build the tools that build everything else."
 LTB_armaments_plant:0 "Union Armaments Plant"
 LTB_armaments_plant_desc:0 "Dedicate production capacity to rifles, shells, and military contracts."
 LTB_military_contracts:0 "Military Contracts"
 LTB_military_contracts_desc:0 "Guarantee long-term orders for the Union's new arms industry."
 LTB_union_industrial_plan:0 "Union Industrial Plan"
 LTB_union_industrial_plan_desc:0 "Coordinate investment across both republics and direct it toward the Union's long-term needs."
