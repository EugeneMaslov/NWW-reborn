l_english:
 NWW_TUR_sultans_shadow:0 "Authority of the Sultan and Caliph"
 NWW_TUR_sultans_shadow_desc:0 "The empire has survived decades of reform, but the palace, ulema and army disagree over its future. Recognize the Sultan's spiritual authority while preserving professional military and civil institutions."
 NWW_TUR_ottoman_bourgeoisie:0 "The Ottoman Bourgeoisie"
 NWW_TUR_ottoman_bourgeoisie_desc:0 "The Majlis will establish common trade and property rights for every community. Constantinople's capital will develop our cities."
 NWW_TUR_agrarian_reform:0 "Agrarian Reform"
 NWW_TUR_agrarian_reform_desc:0 "Land committees will redistribute large estates and provide credit and machinery to farmers. The workers' federation must represent Anatolia and the provinces alike."
 NWW_TUR_rumelian_logistics:0 "Supply the Rumelian Front"
 NWW_TUR_rumelian_logistics_desc:0 "Expand depots, roads and airfields in Eastern Thrace. A Balkan campaign requires reliable supplies."
 NWW_TUR_war_industry_program:0 "Imperial Armaments Programme"
 NWW_TUR_war_industry_program_desc:0 "State contracts and long-term agreements with manufacturers will supply modern weapons. A new arsenal and military production programme will sustain our campaign."
 NWW_TUR_greek_settlement:0 "The Greek Settlement"
 NWW_TUR_greek_settlement_desc:0 "After conquering Greece, restore the ports and local administration. Civil guarantees improve compliance without turning occupied provinces into Ottoman cores."
 NWW_TUR_balkan_mandate:0 "The Ottoman Balkan Doctrine"
 NWW_TUR_balkan_mandate_desc:0 "The Bulgarian and Greek campaigns have opened the routes north and west. The Porte will assert Balkan claims; separate military plans authorize further wars. A neighbour's disappearance does not transfer its territory to us."
 NWW_TUR_serbian_campaign:0 "March on Belgrade"
 NWW_TUR_serbian_campaign_desc:0 "The Serbian kingdom blocks the road to the Danube. Prepare a campaign to conquer it in full, provided it is not our ally."
 NWW_TUR_albanian_campaign:0 "The Albanian Bridgehead"
 NWW_TUR_albanian_campaign_desc:0 "Albanian ports provide access to the Adriatic. The General Staff will prepare the conquest and annexation of Albania."
 NWW_TUR_romanian_campaign:0 "Towards the Lower Danube"
 NWW_TUR_romanian_campaign_desc:0 "Romania's farmland, oil and Danube crossings are strategic objectives. Victories in the south allow a new northern campaign."
 NWW_TUR_adriatic_campaign:0 "Bosnia and the Adriatic"
 NWW_TUR_adriatic_campaign_desc:0 "Press imperial claims against Croatia over Bosnia and the Adriatic coast. If another power has already conquered these lands, our Balkan claims remain; this focus does not automatically declare war on their new owner."
 NWW_TUR_rumelian_governorates:0 "The Rumelian Governorates"
 NWW_TUR_rumelian_governorates_desc:0 "Establish permanent civil administration, provincial charters and garrison supply in the Balkans. Resistance falls and compliance grows without automatic core status."
 NWW_TUR_modern_war_ministry_tt:0 "The Turkish Army focus has been completed."
 NWW_TUR_BUL_campaign_tt:0 "Gain claims and a permanent war goal to conquer Bulgaria. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
 NWW_TUR_GRE_campaign_tt:0 "Gain claims and a permanent war goal to conquer Greece. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
 NWW_TUR_YUG_campaign_tt:0 "Gain claims and a permanent war goal to conquer Serbia. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
 NWW_TUR_ALB_campaign_tt:0 "Gain claims and a permanent war goal to conquer Albania. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
 NWW_TUR_ROM_campaign_tt:0 "Gain claims and a permanent war goal to conquer Romania. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
 NWW_TUR_CRO_campaign_tt:0 "Gain claims and a permanent war goal to conquer Croatia. Its capitulation to the Ottomans after this focus fully annexes the country. Victory by another power does not transfer its land to us."
