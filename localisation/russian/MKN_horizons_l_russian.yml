l_russian:
 MKN_nabat_abroad:0 "Возрождение Набата на рубежах"
 MKN_nabat_abroad_desc:0 "После Великой смуты Набат должен говорить с крестьянами и рабочими по обе стороны границы. Связные создадут сеть солидарности, а не новую государственную канцелярию."
 MKN_agitation_in_litbel:0 "Агитация в ЛитБеле"
 MKN_agitation_in_litbel_desc:0 "Виленский компромисс не отменяет тяжбы батрака с помещиком. Мы предложим профсоюзам ЛитБела оружие и средства для самостоятельной борьбы."
 MKN_galician_peasants:0 "Защита галицких крестьян"
 MKN_galician_peasants_desc:0 "Габсбурги могут собирать коронные земли, но не могут владеть трудом их жителей. Сельские союзы Галиции и Буковины получат нашу помощь."
 MKN_fund_the_underground:0 "Спонсирование подполья"
 MKN_fund_the_underground_desc:0 "Местные проводники, тайники и добровольные комитеты помогут нашим колоннам действовать за пределами родной земли."
 MKN_congress_of_free_peoples:0 "Конгресс вольных народов"
 MKN_congress_of_free_peoples_desc:0 "Советы соседних стран не станут нашими филиалами. Общий конгресс установит добровольность соглашений и право каждого отказаться."
 MKN_global_syndicalist_pact:0 "Глобальный синдикалистский пакт"
 MKN_global_syndicalist_pact_desc:0 "Чёрный Интернационал станет союзом по согласию, а не империей под новым флагом. Наши добровольцы помогут коммунистическим и демократическим участникам гражданских войн."
 MKN_death_or_freedom:0 "Смерть или Свобода!"
 MKN_death_or_freedom_desc:0 "Мажор наступает, родные коммуны заняты врагом. Чрезвычайный призыв потребует тяжёлых жертв и расколет мирные собрания."
 MKN_hide_the_machines:0 "Спрятать станки в подвалах"
 MKN_hide_the_machines_desc:0 "Цеха уходят в подвалы, амбары и лесные укрытия. Три подпольных арсенала обеспечат устойчивое производство, ценой остановленных строек."
 MKN_marusya_womens_battalions:0 "Женские батальоны Маруси"
 MKN_marusya_womens_battalions_desc:0 "Маруся стала символом для нового поколения доброволиц. Тридцать тысяч защитниц коммун вступят в строй, а их отряды научат армию быстрее собираться после боя."
 MKN_evacuation_soviets:0 "Советы эвакуации"
 MKN_evacuation_soviets_desc:0 "Санитарные подводы и местные советы должны вернуть раненых в строй. На ближайшие полгода создаётся единая сеть эвакуации."
 MKN_shadows_in_the_forests:0 "Тени в лесах"
 MKN_shadows_in_the_forests_desc:0 "Оккупационные гарнизоны не получат спокойного тыла. Лесные связные и подпольные советы удвоят урон сопротивления на нашей занятой земле."
 MKN_black_vengeance:0 "Чёрная Месть"
 MKN_black_vengeance_desc:0 "Шесть месяцев на возвращение домой. Колонны ударят по оккупантам на родной земле и ускорят наступление, пока сохраняется общий порыв."
 MKN_free_science_network:0 "Сеть вольных институтов"
 MKN_free_science_network_desc:0 "К 1943 году коммунам нужны собственные научные институты. Освоение сантиметрового радара и передовых станков позволит начать программу раньше."
 MKN_open_peer_review:0 "Открытые лаборатории"
 MKN_open_peer_review_desc:0 "Советы учёных публикуют результаты и проверяют друг друга. Общие лаборатории ускорят исследования без ведомственных барьеров."
 MKN_jet_tachankas:0 "Реактивные тачанки"
 MKN_jet_tachankas_desc:0 "Старую идею подвижной огневой точки продолжат реактивные батареи. Две исследовательские программы получат общее финансирование коммун."
 MKN_dnieper_jet_falcons:0 "Реактивные соколы Днепра"
 MKN_dnieper_jet_falcons_desc:0 "Днепровские мастерские переходят от поршней к реактивной тяге. Общая программа даст скидку на реактивные технологии и улучшит манёвренность авиации."
 MKN_reactor_safety_councils:0 "Советы атомной безопасности"
 MKN_reactor_safety_councils_desc:0 "Новая энергия требует проверяемых правил, обученных инженеров и права коммун на надзор. Подготовим их прежде, чем запускать реактор."
 MKN_the_absolute_argument:0 "Абсолютный аргумент"
 MKN_the_absolute_argument_desc:0 "Империи должны знать цену вторжения. Исследования реактора откроют проект в Гуляйполе; до настоящего ядерного оружия ещё предстоит пройти научный и промышленный путь."
 MKN_military_reform_cooldown:0 "Внедрение военной реформы"
 MKN_military_reform_cooldown_desc:0 "Штаб занят внедрением текущей реформы. Мы пока не можем начать новые масштабные преобразования в других родах войск."
 MKN_nabat_foreign_cells:0 "Зарубежные ячейки Набата"
 MKN_nabat_foreign_cells_desc:0 "Связные коммун прокладывают агентурные сети за границей. Доступно при La Résistance."
 MKN_hidden_workshops:0 "Подпольные арсеналы"
 MKN_hidden_workshops_desc:0 "Три внекарточных военных завода работают в укрытиях. Строительство замедлено на 20%. Дух сохраняет производство и строительный штраф после окончания войны."
 MKN_evacuation_columns:0 "Санитарные колонны советов"
 MKN_evacuation_columns_desc:0 "В течение 180 дней советы возвращают больше раненых бойцов домой."
 MKN_black_vengeance_spirit:0 "Порыв Чёрной Мести"
 MKN_black_vengeance_spirit_desc:0 "На 180 дней: +20% к атаке на национальной территории и +10% к скорости армии."
 MKN_open_laboratories:0 "Открытые лаборатории коммун"
 MKN_open_laboratories_desc:0 "Свободный обмен результатами ускоряет исследования на 5%."
 MKN_nabat_abroad_unlock_tt:0 "Открывает зарубежную работу Набата. С La Résistance: +1 ячейка оперативников и +10% скорости создания сетей. Без DLC: +50 политической власти."
 MKN_litbel_agitation_unlock_tt:0 "Открывает спонсирование стачек в ЛитБеле: 50 PP и 200 винтовок, 45 дней. Успех снижает стабильность на 5 п.п. и повреждает один военный завод. Союзники и партнёры по пакту исключены."
 MKN_galician_agitation_unlock_tt:0 "Открывает помощь сельским союзам Галиции и Буковины: 50 PP и 200 винтовок на 45 дней. Подготовленный австрийский регион при общей границе может стать целью пограничного конфликта за 100 PP."
 MKN_underground_combat_tt:0 "Общий дух армии: +10% к атаке и защите на чужой, ненациональной для нас территории."
 MKN_free_peoples_congress_tt:0 "Подготавливает добровольный пакт. Вступление других стран потребует отдельного приглашения и их согласия."
 MKN_syndicalist_pact_unlock_tt:0 "Общий дух армии: +3 к размеру добровольческих сил. Открывает создание Чёрного Интернационала за 100 PP и приглашения за 50 PP. Добровольцев можно отправлять коммунистическим и демократическим участникам гражданской войны."
 MKN_volunteer_recipients_tt:0 "Добровольческая солидарность: получатель ведёт гражданскую войну и имеет коммунистическое или демократическое правительство."
 MKN_death_or_freedom_tt:0 "Общий дух армии: военнообязанное население +5 п.п. Стабильность −10 п.п. Все фокусы ветки доступны только при войне с мажором и прогрессе капитуляции выше 10%."
 MKN_hidden_workshops_tt:0 "Постоянный дух: +3 внекарточных военных завода и −20% к скорости строительства."
 MKN_womens_battalions_tt:0 "30 000 людских ресурсов. Общий дух армии: +10% к восстановлению организации."
 MKN_forest_resistance_tt:0 "Общий дух армии: +100% к урону гарнизонам на нашей оккупированной территории."
 MKN_jet_falcons_tt:0 "Общий дух авиации: +5% к манёвренности. Один исследовательский бонус +100% к реактивным технологиям; специальные проекты сохраняют собственные требования."
 MKN_reactor_project_unlock_tt:0 "Открывает в Хозяйственном конгрессе один реакторный проект в Гуляйполе: 100 PP и 5 гражданских фабрик на 90 дней. Требуются владение, контроль и свободное место; отмена возвращает PP."
 MKN_horizons_200_rifles:0 "£infantry_equipment_text_icon §Y200§!"
 MKN_horizons_international_category:0 "Набат за рубежом"
 MKN_horizons_international_category_desc:0 "Стачки, сельские союзы и добровольная дипломатия Чёрного Интернационала. Вооружённая поддержка требует средств и времени; друзья и участники пактов защищены."
 MKN_sponsor_litbel_strike:0 "Спонсировать стачку в ЛитБеле"
 MKN_sponsor_litbel_strike_desc:0 "45 дней, 50 PP и 200 винтовок: −5 п.п. стабильности и повреждение одного военного завода. Повторное финансирование — через 180 дней. Отмена возвращает PP и оружие базового образца."
 MKN_support_galician_unions:0 "Вооружить сельские союзы: [FROM.GetName]"
 MKN_support_galician_unions_desc:0 "За 45 дней, 50 PP и 200 винтовок подготовим союзы против Габсбургов: −5 п.п. стабильности Австрии, повреждение инфраструктуры и подготовка региона к пограничному выступлению. Отмена возвращает PP и базовое оружие."
 MKN_galician_border_action:0 "Поддержать восстание: [FROM.GetName]"
 MKN_galician_border_action_desc:0 "100 PP. Требуются вооружённые сельские союзы, австрийское владение и контроль региона, общая граница и мир между сторонами. Победа в пограничном конфликте передаёт спорный регион без национализации."
 MKN_found_black_international:0 "Учредить Чёрный Интернационал"
 MKN_found_black_international_desc:0 "За 100 PP создадим собственный альянс, если свободны от обязательств перед другой фракцией. Мы не разрываем существующие союзы за другие страны."
 MKN_horizons_black_international:0 "Чёрный Интернационал"
 MKN_invite_free_councils:0 "Пригласить [FROM.GetName] в Интернационал"
 MKN_invite_free_councils_desc:0 "50 PP за дипломатическую миссию. Независимая коммунистическая или демократическая страна вне альянса сама решит, принимать ли приглашение."
 MKN_huliaipole_reactor_project:0 "Реакторный проект Гуляйполя"
 MKN_huliaipole_reactor_project_desc:0 "Один проект за кампанию: 100 PP и 5 гражданских фабрик на 90 дней. По завершении в Гуляйполе появится один ядерный реактор. Потеря владения, контроля или места отменяет проект с возвратом PP; фабрики освобождаются."
 MKN_jet_tachankas_bonus:0 "Реактивные батареи коммун"
 MKN_jet_falcons_bonus:0 "Реактивная программа Днепра"
 MKN_reactor_safety_bonus:0 "Атомные советы коммун"
 mkn_horizons.1.t:0 "Приглашение Чёрного Интернационала"
 mkn_horizons.1.d:0 "Делегаты Вольной территории предлагают нам место в общем конгрессе и оборонном союзе. Они обещают равное представительство, но принятие приглашения свяжет нашу внешнюю политику с судьбой коммун. Решение остаётся за нами."
 mkn_horizons.1.a:0 "Примем приглашение."
 mkn_horizons.1.b:0 "Мы выберем свой путь."
 UKR_mkn_escalation_required_tt:0 "Нападение на Махновщину возможно только после завершения пограничной эскалации."
