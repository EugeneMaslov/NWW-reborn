 FRA_nww_extraction_desc:0 "Порядок и концессии: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_representation:0 "Инвестиции и представительство"
 FRA_nww_representation_desc:0 "Инвестиции и представительство: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_selfdetermination:0 "Самоопределение по соглашению"
 FRA_nww_selfdetermination_desc:0 "Отказ от прямого господства требует договориться о собственности, торговле и безопасности. Будущие независимые правительства смогут согласиться на сотрудничество или выбрать другой путь."
 FRA_nww_colonial_schools:0 "Школы и местные администрации"
 FRA_nww_colonial_schools_desc:0 "Школы и местные администрации: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_overseas_credit:0 "Банк заморского развития"
 FRA_nww_overseas_credit_desc:0 "Банк заморского развития: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_central_overseas_plan:0 "Единый план метрополии и колоний"
 FRA_nww_central_overseas_plan_desc:0 "Общий хозяйственный план обещает колониальным обществам школы, работу и инфраструктуру. Пока право окончательного решения остаётся в Париже, национальный вопрос этим не исчерпывается."
 FRA_nww_overseas_compact:0 "Заморский договор"
 FRA_nww_overseas_compact_desc:0 "Заморский договор: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
