 FRA_nww_security_offer:0 "Предложить договор: [FROM.GetName]"
 FRA_nww_security_offer_desc:0 "35-дневные переговоры о ненападении и научном сотрудничестве. Получатель самостоятельно принимает или отклоняет предложение; членство в союзе не меняется."
 nww_fra.200.t:0 "Предложение Парижа"
 nww_fra.200.d:0 "Франция предлагает договор о ненападении и, при готовности её научной сети, участие в совместных исследованиях. Мы сохраняем собственное правительство и внешнеполитические обязательства."
 nww_fra.200.a:0 "Принять договор."
 nww_fra.200.b:0 "Отклонить предложение."
 nww_fra.201.t:0 "Договор принят"
 nww_fra.201.d:0 "Наше предложение принято. Договор не передаёт Франции территории или право распоряжаться армией партнёра."
 nww_fra.201.a:0 "Сотрудничество начинается."
 nww_fra.202.t:0 "Предложение отклонено"
 nww_fra.202.d:0 "Переговоры не дали соглашения. Отказ не создаёт повода к войне."
 nww_fra.202.a:0 "Принять к сведению."
 FRA_nww_alliance_offer:0 "Предложить оборонный союз: [FROM.GetName]"
 FRA_nww_alliance_offer_desc:0 "Партнёр должен отдельно одобрить оборонный союз. Франция должна возглавлять свой союз или не состоять в другом. Существующие союзы получателя сохраняются."
 nww_fra.203.t:0 "Оборонный союз с Францией"
 nww_fra.203.d:0 "Париж предлагает перейти от договора к общему оборонному союзу. Это отдельное решение нашего правительства."
 nww_fra.203.a:0 "Вступить в союз."
 nww_fra.203.b:0 "Сохранить самостоятельность."
 nww_fra.204.t:0 "Французский ультиматум на Рейне"
 nww_fra.204.d:0 "Париж требует отказаться от давления на соседей и заключить договор о ненападении. Французские националисты готовы использовать отказ как основание для войны. Уступка не передаёт территории."
 nww_fra.204.a:0 "Заключить договор."
 nww_fra.204.b:0 "Отвергнуть ультиматум."
