 FRA_nww_confidence_vote:0 "Вотум доверия: 90 дней"
 FRA_nww_confidence_vote_desc:0 "Поднимите мандат до 40. Провал означает отставку кабинета. Вооружённое столкновение возможно лишь при напряжённости от 80 и организованных противниках."
 FRA_nww_emergency_mandate:0 "Срок чрезвычайного мандата"
 FRA_nww_emergency_mandate_desc:0 "За 270 дней подготовьте возвращение к выборам или законное продление чрезвычайных полномочий. При провале предстоит политическая развязка."
