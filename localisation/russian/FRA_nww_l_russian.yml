 FRA_nww_military_cabinet:0 "Кабинет национальной обороны"
 FRA_nww_military_cabinet_desc:0 "Чрезвычайное правительство получает ограниченный срок, а не бессрочную собственность на государство. Армия обещает восстановить гражданское управление или представить законное основание для нового порядка."
