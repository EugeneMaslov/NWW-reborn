 FRA_mandate_help:0 "Мандат ниже 25 открывает 90-дневный вотум доверия: восстановите его до 40. Без урегулирования -2 мандата за 30 дней. Каждый завершённый фокус даёт +1 и исполняет коалиционное обещание. Невыполненное обещание: -5 мандата и +5 напряжённости. Гражданская война требует напряжённости от 80, вооружённых организаций и провала урегулирования."
 FRA_overseas_help:0 "Проверка каждые 30 дней. Без вложений давление +2; после вложений -3; при концессиях +5. От 80 начинается кризис на 120 дней: заключите договор или снизьте давление ниже 60. Инвестиции требуют 70 дней, 50 политвласти и 3 гражданских завода. Территории передаются только из фактически управляемых французских владений."
