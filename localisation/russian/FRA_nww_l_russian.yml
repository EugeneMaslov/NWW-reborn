 FRA_nww_garrisons:0 "Нейтралитет гарнизонов"
 FRA_nww_garrisons_desc:0 "Командование не обязано разделять убеждения комитетов. Но без обещания сохранить порядок и армейскую иерархию гарнизоны не останутся в казармах во время политической развязки."
 FRA_nww_powers_crisis:0 "Кризис полномочий"
 FRA_nww_powers_crisis_desc:0 "Кризис полномочий: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_orleanists:0 "Соглашение с орлеанистами"
 FRA_nww_orleanists_desc:0 "Соглашение с орлеанистами: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_directory:0 "Директория национального спасения"
