 FRA_nww_renewal:0 "Мандат на обновление"
 FRA_nww_renewal_desc:0 "Комиссии, арбитраж и государственная служба получили постоянные полномочия. Теперь правительство может предлагать стране программу, срок которой превышает жизнь одного кабинета."
 FRA_nww_rights:0 "Гарантии гражданских прав"
