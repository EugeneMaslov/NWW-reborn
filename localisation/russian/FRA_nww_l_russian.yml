 FRA_nww_coalition:0 "Коалиционное соглашение"
 FRA_nww_coalition_desc:0 "Переговоры оплачиваются заранее и идут последовательно. Результат выдаётся после завершения; при капитуляции политвласть возвращается. Коалиционное соглашение требует завершить фокус в течение следующих 30 дней."
