 FRA_nww_crown_law:0 "Корона и основной закон"
 FRA_nww_crown_law_desc:0 "Реставрация должна определить полномочия короны, правительства и представительных учреждений. Без основного закона трон останется заложником тех лиг, которые расчистили к нему дорогу."
 FRA_nww_league_state:0 "Государство национальных лиг"
 FRA_nww_league_state_desc:0 "Лиги требуют собственной власти, а не места в свите претендента. Национальная директория заменит партийные переговоры единым центром решений и примет ответственность за сопротивление этому порядку."
 FRA_nww_royal_cabinet:0 "Королевское правительство"
