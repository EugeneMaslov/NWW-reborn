 FRA_nww_rhine_preparations:0 "Подготовить рейнскую кампанию"
 FRA_nww_rhine_preparations_desc:0 "Подготовить рейнскую кампанию: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_rhine_ultimatum:0 "Рейнский ультиматум"
 FRA_nww_rhine_ultimatum_desc:0 "Националисты готовы подкрепить требования силой. Германия получит возможность заключить договор; отказ откроет военную развязку, за которую Франции придётся отвечать собственной армией."
 FRA_nww_extraction_unlock_tt:0 "Заморские концессии: +10% к добыче ресурсов и +5 давления каждые 30 дней в управляемых колониях. Открывает усиление гарнизонов."
 FRA_nww_representation_unlock_tt:0 "На региональных конференциях становится доступно предложение представительства и местного бюджета."
 FRA_nww_selfdetermination_unlock_tt:0 "На региональных конференциях становится доступно предложение независимости. Дальнейшие договоры требуют согласия получателя."
 FRA_nww_overseas_compact_unlock_tt:0 "Открывает предложения автономного соглашения на региональных конференциях."
 FRA_nww_western_security_unlock_tt:0 "Открывает переговоры о договоре с демократическими Британией, Бельгией и LTB."
 FRA_nww_latin_accord_unlock_tt:0 "Открывает переговоры с совместимыми правыми правительствами Италии и Испании."
 FRA_nww_continental_accord_unlock_tt:0 "Открывает переговоры с нейтральными правительствами Германии и Австрии."
 FRA_nww_workers_diplomacy_unlock_tt:0 "Открывает переговоры с совместимыми правительствами SOV, UKR и MKN. Каждое государство вправе отказаться."
 FRA_nww_common_markets_unlock_tt:0 "После принятия договора независимым заморским партнёром становится доступен постоянный бонус к торговым отношениям. Сам фокус не принуждает партнёра к соглашению."
