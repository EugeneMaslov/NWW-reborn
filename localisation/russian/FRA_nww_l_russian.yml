 nww_fra.3.t:0 "Полномочия военного кабинета истекли"
 nww_fra.3.d:0 "Обещанный срок чрезвычайного управления истёк. Продление без нового законного основания разрушит доверие к командованию."
 nww_fra.3.a:0 "Вернуть власть гражданскому кабинету."
 nww_fra.3.b:0 "Удержать власть чрезвычайным декретом."
