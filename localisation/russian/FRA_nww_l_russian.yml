 nww_fra.1.t:0 "Республика на распутье"
 nww_fra.1.d:0 "Великая война не состоялась. Но заводы работают неполную неделю, парламентские кабинеты живут от голосования до голосования, а улица перестаёт верить обещаниям. Наши люди и предприятия сохранились. Предстоит вернуть государству способность действовать."
 nww_fra.1.a:0 "Открыть работу Палаты."
 FRA_check_tension_greater_than_or_equals_80_tt:0 "Уличная напряжённость: не менее 80."
 nww_fra.2.t:0 "Кабинет утратил доверие"
 nww_fra.2.d:0 "Палата отказала правительству в поддержке. Новая коалиция может получить временный кредит доверия. Если вооружённые организации готовы к столкновению, остаётся последняя возможность созвать согласительную конференцию."
 nww_fra.2.a:0 "Сформировать новый кабинет."
 nww_fra.2.b:0 "Созвать оплачиваемую согласительную конференцию."
 nww_fra.2.c:0 "Противостояние выходит из-под контроля."
