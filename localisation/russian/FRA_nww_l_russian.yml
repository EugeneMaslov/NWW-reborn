 FRA_nww_invest_algeria:0 "Инвестиции: Алжир"
 FRA_nww_invest_algeria_desc:0 "70 дней, 50 политвласти и 3 гражданских завода на время работ. После завершения: один местный завод, -20 давления, далее -3 давления за 30 дней. При отмене политвласть возвращается."
