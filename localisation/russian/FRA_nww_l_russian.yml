l_russian:
 FRA_meter_mandate_gain_1_tt:0 "Мандат кабинета: +1."
 FRA_nww_session:0 "Открыть парламентскую сессию"
 FRA_nww_session_desc:0 "Франция избежала мировой войны, но не кризиса представительства. Палата должна определить, кто оплатит восстановление хозяйства и подготовку обороны."
 FRA_meter_mandate_gain_10_tt:0 "Мандат кабинета: +10."
 FRA_nww_accounts:0 "Опубликовать государственные счета"
 FRA_nww_accounts_desc:0 "Слухи о скрытых обязательствах государства разрушают кредит быстрее банкротств. Опубликуем счета ведомств и дадим Палате возможность спорить о настоящем бюджете."
 FRA_meter_tension_loss_5_tt:0 "Уличная напряжённость: -5."
 FRA_nww_consultations:0 "Национальные консультации"
 FRA_nww_consultations_desc:0 "Профсоюзы, предприниматели, муниципалитеты и командование должны назвать условия, на которых готовы поддержать правительство. Одного большинства на день голосования недостаточно."
 FRA_nww_republic:0 "Республика способна управлять"
 FRA_nww_republic_desc:0 "Республике не требуется отрекаться от собственного имени. Ей требуется кабинет, способный выполнить обещания, и Палата, готовая отвечать за принятые решения."
 FRA_nww_right:0 "Соглашение национальных комитетов"
 FRA_nww_right_desc:0 "Монархические общества и национальные лиги объединяет ненависть к бессилию Палаты. Их согласие пока скрывает главный вопрос: кому достанется власть после победы?"
 FRA_nww_front:0 "Пакт левых организаций"
 FRA_nww_front_desc:0 "Левым необходимо договориться до выборов: о заработной плате, кредите, свободе организаций и судьбе колоний. Без общей программы кабинет станет продолжением межпартийного спора."
 FRA_nww_emergency:0 "Подготовить чрезвычайный мандат"
 FRA_nww_emergency_desc:0 "Подготовить чрезвычайный мандат: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_meter_tension_gain_5_tt:0 "Уличная напряжённость: +5."
 FRA_nww_commission:0 "Парламентская следственная комиссия"
 FRA_nww_commission_desc:0 "Парламентская следственная комиссия: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_contracts:0 "Открытые государственные контракты"
 FRA_nww_contracts_desc:0 "Открытые государственные контракты: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_meter_mandate_gain_15_tt:0 "Мандат кабинета: +15."
 FRA_nww_responsible:0 "Ответственный кабинет"
 FRA_nww_responsible_desc:0 "Вотум недоверия должен открывать путь новому кабинету, а не оставлять страну без управления. Большинство, свергающее министров, обязуется представить замену."
 FRA_meter_tension_loss_15_tt:0 "Уличная напряжённость: -15."
 FRA_nww_oversight:0 "Гарантии парламентского контроля"
 FRA_nww_oversight_desc:0 "Сильное правительство нуждается в убедительных ограничениях. Постоянные комиссии и публичная отчётность позволят удерживать широкую коалицию без передачи ей неограниченной власти."
 FRA_meter_tension_loss_10_tt:0 "Уличная напряжённость: -10."
