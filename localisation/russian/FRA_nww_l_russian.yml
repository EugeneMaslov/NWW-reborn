 nww_fra.140.t:0 "Ответ представителей: Алжир"
 nww_fra.140.d:0 "Представители рассмотрели предложение. При давлении ниже 80 соглашение утверждается; на пороге восстания делегация уже не может гарантировать его исполнение. Сначала потребуется снизить напряжение."
