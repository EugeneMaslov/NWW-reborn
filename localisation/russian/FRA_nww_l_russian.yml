 FRA_nww_bank_audit:0 "Аудит банков"
 FRA_nww_bank_audit_desc:0 "Сбережения есть, но вкладчики не доверяют балансам, а банки не доверяют будущим доходам предприятий. Проверка задолженности должна вернуть различие между временной нехваткой кредита и настоящим банкротством."
