 FRA_nww_public_works:0 "Общественные работы"
 FRA_nww_public_works_desc:0 "Общественные работы: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_labour_charter:0 "Хартия труда"
 FRA_nww_labour_charter_desc:0 "Коллективные договоры требуют согласованных правил и переходного периода для предприятий. Рабочие должны увидеть гарантии, а заводы — знать, как оплачивать новую организацию труда."
 FRA_nww_social_republic:0 "Социальная республика"
 FRA_nww_social_republic_desc:0 "Социальная республика: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_councils:0 "Республика трудовых советов"
 FRA_nww_councils_desc:0 "Трудовые советы предлагают связать политическое представительство с производственными коллективами. Их съезду предстоит установить пределы полномочий центра и самостоятельности предприятий."
 FRA_nww_central_plan:0 "Централизованная социалистическая республика"
 FRA_nww_central_plan_desc:0 "Правительство предлагает сосредоточить кредит и инвестиции в едином плане. Оно получает возможность направлять капитал, но принимает на себя риск ошибок, саботажа и бюрократической неподвижности."
 FRA_nww_collective_contracts:0 "Коллективные договоры"
 FRA_nww_collective_contracts_desc:0 "Коллективные договоры: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_social_insurance:0 "Социальное страхование"
 FRA_nww_social_insurance_desc:0 "Социальное страхование: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_social_arbitration:0 "Социальный арбитраж"
 FRA_nww_social_arbitration_desc:0 "Переговоры оплачиваются заранее и идут последовательно. Результат выдаётся после завершения; при капитуляции политвласть возвращается. Коалиционное соглашение требует завершить фокус в течение следующих 30 дней."
 FRA_nww_cooperatives:0 "Производственные кооперативы"
