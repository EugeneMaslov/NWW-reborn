 FRA_nww_latin_accord:0 "Латинское согласие"
 FRA_nww_latin_accord_desc:0 "Латинское согласие: согласовать полномочия, кадры и финансирование программы. Её результат станет частью постоянных институтов Франции."
 FRA_nww_continental_accord:0 "Континентальное соглашение"
 FRA_nww_continental_accord_desc:0 "Сходство общественного устройства не отменяет соперничества держав. Соглашение с Берлином и Веной потребует переговоров, взаимного признания интересов и готовности услышать отказ."
 FRA_nww_rhine_stand:0 "Никакого примирения на Рейне"
