 MKN_air_hq_decisions:0 "Полевые штабы: авиация"
 MKN_air_hq_decisions_desc:0 "Полевые штабы закрепляют опыт колонн, авиакооперативов и морских артелей. Каждая тактика и каждый тип проекта доступны один раз за кампанию. Место проекта выбирается на карте. Одновременно ведётся один проект; при потере региона затраты политической власти и командного ресурса возвращаются, а проект закрывается."
