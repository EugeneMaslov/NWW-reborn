l_russian:
 MKN_steppe_horde:0 "Степная Орда"
 MKN_steppe_horde_desc:0 "Сохраним мобильность конницы, вложившись в вооружение и связь вместо дорогой брони.\n\nСельские сборные пункты заранее распределят людей по отрядам.\n\nОбщие конюшни и запас верховых лошадей поддержат темп похода.\n\nПулемётные тачанки дадут конным отрядам огневую опору."
 MKN_hidden_supply_bases_focus:0 "Схроны и базы снабжения"
 MKN_hidden_supply_bases_focus_desc:0 "Местные проводники найдут броды и обходные тропы раньше противника.\n\nВетеринарная служба снизит потери лошадей в длительных переходах."
 MKN_free_column_command_focus:0 "Связь вольных колонн"
 MKN_free_column_command_focus_desc:0 "Разведывательные партии расчистят путь основной колонне.\n\nСигнальные команды свяжут волости и выведут резерв на нужный участок."
 MKN_motorized_vanguard:0 "Моторизованный авангард"
 MKN_motorized_vanguard_desc:0 "Тракторные артели освоят бронетехнику для прорыва, но ей нужны экипажи и горючее.\n\nЭкипаж должен уметь чинить машину и действовать вместе с пехотой.\n\nКвартирмейстеры сведут потребности моторизованных частей в единый реестр.\n\nГрузовики и заправщики будут следовать за наступающей бронёй."
 MKN_armored_trains_and_repair_focus:0 "Бронепоезда и ремонтные базы"
 MKN_armored_trains_and_repair_focus_desc:0 "Эвакуационные тягачи вернут повреждённые машины в мастерские.\n\nРемонтная база Днепра обеспечит запасные узлы и восстановление техники."
 MKN_communal_fire_support_focus:0 "Огневая поддержка коммун"
 MKN_communal_fire_support_focus_desc:0 "Никопольские артели наладят орудия для сопровождения наступающей пехоты.\n\nЕдиные таблицы стрельбы свяжут огонь батарей с планами танковых командиров."
 MKN_combined_arms_command_focus:0 "Штаб общевойсковых соединений"
 MKN_combined_arms_command_focus_desc:0 "Радиосвязь позволит подкреплениям вступать в бой по команде штаба."
 MKN_steppe_hawks_and_schools:0 "Степные соколы и школы"
 MKN_steppe_hawks_and_schools_desc:0 "Создадим воздушную службу коммун с общей диспетчерской и правилами полётов.\n\nПолевые полосы приблизят авиацию к войскам и сократят бесполезные перелёты.\n\nШкола лётчиков даст общую подготовку перед выбором боевой специализации.\n\nОткрывает одноразовые тактики полевого штаба за опыт и командный ресурс."
 MKN_interceptor_cooperatives:0 "Авиакооперативы перехвата"
 MKN_interceptor_cooperatives_desc:0 "Истребители станут щитом коммун; ударная авиация останется второстепенной.\n\nЛёгкие планеры артели «Степной сокол» приспособят для манёвренного перехвата.\n\nЛучшие инструкторы покажут молодым пилотам приёмы боя в паре.\n\nВедущий прикрывает ведомого: одиночный герой уступит место слаженной паре."
 MKN_communal_aa_defense_focus:0 "Эшелонированное ПВО коммун"
 MKN_communal_aa_defense_focus_desc:0 "Наблюдатели передадут предупреждение до появления бомбардировщиков над городами.\n\nЕдиная тревога поднимет нужные звенья вместо всей авиации сразу."
 MKN_airframe_standardization_focus:0 "Единый стандарт авиамастерских"
 MKN_airframe_standardization_focus_desc:0 "Радиомаяки помогут перехватчикам вернуться даже в плохую погоду.\n\nСерийная оснастка обеспечит точную сборку и вооружение истребителей.\n\nЭвакуационные бригады вернут повреждённые машины и спасут ремонтный фонд."
 MKN_flying_artillery_focus:0 "Летающая артиллерия"
 MKN_flying_artillery_focus_desc:0 "Авиация станет летающей артиллерией для вольных колонн.\n\n«Днепровское крыло» приспособит лёгкие самолёты для ударов по наземным целям.\n\nТяжёлое вооружение штурмовиков поможет разрушать узлы сопротивления.\n\nНа полигонах экипажи научатся поражать цель рядом со своими войсками."
 MKN_forward_airstrips_focus:0 "Передовые посадочные полосы"
 MKN_forward_airstrips_focus_desc:0 "Передовые полосы сократят время между запросом поддержки и ударом.\n\nСвязные передадут запросы пехоты прямо на аэродром."
 MKN_air_ground_coordination_focus:0 "Карта для вольных колонн"
 MKN_air_ground_coordination_focus_desc:0 "Карты, фотосъёмка и единая сетка координат избавят экипажи от поиска цели вслепую.\n\nДымовые сигналы и условные полотнища обозначат передний край."
 MKN_cas_workshop_network_focus:0 "Сеть штурмовых авиамастерских"
 MKN_cas_workshop_network_focus_desc:0 "Прифронтовые мастерские восстановят повреждения от наземного огня."
 MKN_black_sea_flotilla_and_yards:0 "Черноморская флотилия и верфи"
 MKN_black_sea_flotilla_and_yards_desc:0 "Создадим малую флотилию с задачами, посильными бюджету коммун.\n\nДнепровские дозоры станут школой будущих морских экипажей.\n\nХерсонские верфи дадут флотилии собственную строительную и ремонтную базу.\n\nОткрывает одноразовые тактики полевого штаба за опыт и командный ресурс."
 MKN_sea_escort_service:0 "Служба морского эскорта"
 MKN_sea_escort_service_desc:0 "Защитим подходы к портам и сделаем зерновую торговлю главной задачей флота.\n\nЛёгкие эскорты Херсонской артели будут держать строй вокруг конвоя.\n\nЭкипажи отработают охранение медленных транспортов вместо погони за славой.\n\nГидроакустики и расчёты глубинных бомб будут работать одной командой."
 MKN_coastal_fortifications_focus:0 "Береговые укрепления"
 MKN_coastal_fortifications_focus_desc:0 "Речные экипажи перейдут на лёгкие мореходные корабли для прибрежной службы.\n\nБереговые посты предупредят капитанов о появлении противника."
 MKN_escort_repair_network_focus:0 "Ремонтные артели эскорта"
 MKN_escort_repair_network_focus_desc:0 "Расчищенные фарватеры ускорят оборот кораблей и портовое снабжение.\n\nСудоремонтные артели освоят замену повреждённых секций и переоборудование.\n\nОбщие расписания и новые транспорты позволят сопровождать торговлю организованными группами."
 MKN_torpedo_artels_focus:0 "Торпедные артели"
 MKN_torpedo_artels_focus_desc:0 "Малые подлодки и рейдеры сделают вражеские перевозки уязвимыми без гонки линкоров.\n\nТорпедные мастерские займутся качеством оружия для скрытных атак.\n\nЭкипажи научатся выбирать цель и момент атаки, а не искать открытого боя.\n\nИспытания устранят отказы и уточнят дистанцию атаки."
 MKN_hidden_smuggler_bases_focus:0 "Тайные базы контрабандистов"
 MKN_hidden_smuggler_bases_focus_desc:0 "Тайные стоянки позволят подготовить выход, не выдавая расположение рейдеров.\n\nКарты торговых маршрутов укажут ценные цели и безопасные районы ожидания.\n\nЛиманские мастерские наладят серийное строительство малых подлодок.\n\nНочные выходы сократят время, когда рейдер виден береговым наблюдателям.\n\nСкрытые топливные запасы увеличат время охоты на торговых путях."
 MKN_tactic_night_marches:0 "Ночные переходы"
 MKN_tactic_night_marches_desc:0 "Отряды научатся уходить из-под удара ночью без распада колонны.\n\nВыборный командир тоже нуждается в тактической школе и понятной ответственности.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_steppe_camouflage:0 "Степная маскировка"
 MKN_tactic_steppe_camouflage_desc:0 "Маскировка степных позиций поможет переждать превосходство противника в огне.\n\nСеть тайных складов поддержит колонны вдали от железной дороги.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_militia_engineers:0 "Сапёрные десятки"
 MKN_tactic_militia_engineers_desc:0 "Сапёрные десятки подготовят переправы и укрытия лёгкими средствами.\n\nОбщины организуют эвакуацию раненых и восстановление бойцов.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_flexible_orders:0 "Задача вместо длинного приказа"
 MKN_tactic_flexible_orders_desc:0 "Командир получит цель и свободу исполнения вместо цепочки мелких приказов.\n\nСменяемый резерв позволит сельским общинам содержать армию и продолжать посевную.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_tachanka_tactics:0 "Тачанки и пеший заслон"
 MKN_tactic_tachanka_tactics_desc:0 "Пеший заслон прикроет отход тачанок и сорвёт преследование.\n\nПодвижный арьергард задержит врага, пока обозы меняют стоянку.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_free_column_exercises:0 "Сборы вольных колонн"
 MKN_tactic_free_column_exercises_desc:0 "Сборы сведут конные и пешие отряды в согласованные колонны.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_motorized_infantry:0 "Пехота вслед за бронёй"
 MKN_tactic_motorized_infantry_desc:0 "Подвижная пехота закрепит захваченные танками переправы и населённые пункты.\n\nСборные мосты позволят колоннам продолжать наступление за Днепром.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_fuel_discipline:0 "Учёт горючего в походе"
 MKN_tactic_fuel_discipline_desc:0 "Запас горючего и маршруты заправки избавят наступление от пустых баков.\n\nПроверим планы на штабных играх прежде, чем проверять их людьми.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_mobile_medical:0 "Подвижные санитарные пункты"
 MKN_tactic_mobile_medical_desc:0 "Санитарные автомобили вернут раненых в строй и сохранят кадры.\n\nБроня, артиллерия и пехота научатся действовать в одном боевом порядке.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_armoured_manoeuvres:0 "Резерв второго эшелона"
 MKN_tactic_armoured_manoeuvres_desc:0 "Второй эшелон получит оружие заранее, чтобы поддерживать прорыв без пауз.\n\nМастерские прорыва будут выпускать бронетехнику по требованиям полевых экипажей.\n\nБольшие манёвры отработают смену направления без потери управления.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_air_dispersal:0 "Рассредоточенные аэродромы"
 MKN_tactic_air_dispersal_desc:0 "Рассредоточим самолёты по запасным полосам и защитим домашнее небо.\n\nПатрули над переправами прикроют связь между промышленными районами.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_night_interceptors:0 "Школа радиолокации"
 MKN_tactic_night_interceptors_desc:0 "Радиолокационная школа научит расчёты сопровождать цели и наводить истребители.\n\nНочные звенья отработают перехват по командам с земли.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_fighter_conversion:0 "Общий запас авиационных деталей"
 MKN_tactic_fighter_conversion_desc:0 "Общий запас моторов сократит простои и аварии изношенных самолётов.\n\nПереучивание позволит быстро освоить следующее поколение истребителей.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_air_rescue:0 "Спасение сбитых лётчиков"
 MKN_tactic_air_rescue_desc:0 "Спасённый лётчик вернётся к полётам и передаст опыт новым экипажам.\n\nДиспетчеры распределят звенья по целям, исключая бесполезное дублирование.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_sky_watch_exercises:0 "Защита промышленных районов"
 MKN_tactic_sky_watch_exercises_desc:0 "Зенитные батареи и истребители разделят зоны защиты промышленных коммун.\n\nУчения проверят цепочку от обнаружения цели до посадки перехватчика.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_tactical_recon:0 "Тактическая воздушная разведка"
 MKN_tactic_tactical_recon_desc:0 "Воздушная разведка укажет колоннам обходные пути и вражеские резервы.\n\nШтурманы обеспечат поддержку за пределами знакомых аэродромов.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_air_supply_lift:0 "Доставка срочных грузов"
 MKN_tactic_air_supply_lift_desc:0 "Воздушные перевозки восполнят самые срочные нужды оторвавшихся колонн.\n\nПриморские эскадрильи прикроют переправы и ударят по кораблям противника.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_replacement_crews:0 "Резерв экипажей штурмовиков"
 MKN_tactic_replacement_crews_desc:0 "Резерв подготовленных экипажей позволит сохранять темп вылетов.\n\nСменяемые группы распределят нагрузку между людьми, машинами и складами горючего.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_weather_service:0 "Топливные склады эскадрилий"
 MKN_tactic_weather_service_desc:0 "Наладим заправку, чтобы ударные группы не пропускали решающий вылет.\n\nМетеопосты помогут выбирать окно для удара вместо отмены всей операции.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_joint_target_planning:0 "Совместное планирование ударов"
 MKN_tactic_joint_target_planning_desc:0 "Штабы армии и авиации составят общие списки целей перед наступлением.\n\nСовместные учения проверят взаимодействие пилотов, артиллеристов и передовых наблюдателей.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_damage_control:0 "Артели аварийного ремонта"
 MKN_tactic_damage_control_desc:0 "Аварийные команды спасут корабль после попадания и вернут его в порт.\n\nПостоянный дозор закроет промежутки между портовыми районами.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_sweeper_sections:0 "Тральные отряды"
 MKN_tactic_sweeper_sections_desc:0 "Тральные команды очистят торговые фарватеры от мин.\n\nОбщая частота охранения позволит быстро перестроить защитный экран.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_coastal_depots:0 "Портовые склады снабжения"
 MKN_tactic_coastal_depots_desc:0 "Прибрежные склады поддержат длительное патрулирование без дальних переходов на заправку.\n\nСогласуем речные перевозки, морской эскорт и береговую разведку.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_convoy_rescue:0 "Противолодочные патрули"
 MKN_tactic_convoy_rescue_desc:0 "Охотничьи группы будут прочёсывать район перед выходом конвоев.\n\nСпасательные суда подберут людей и возьмут повреждённые транспорты на буксир.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_coastal_fleet_exercises:0 "Резерв портовых экипажей"
 MKN_tactic_coastal_fleet_exercises_desc:0 "Резерв экипажей и дополнительная верфь обеспечат замену потерь.\n\nПроверим охранение торгового каравана в условиях учебной атаки.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_submarine_listening:0 "Школа гидроакустиков"
 MKN_tactic_submarine_listening_desc:0 "Гидроакустики услышат цель раньше, чем противник заметит подлодку.\n\nБыстрые катера прикроют выход рейдеров и атакуют в тесных прибрежных водах.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_radio_discipline:0 "Радиодисциплина рейдеров"
 MKN_tactic_radio_discipline_desc:0 "Короткие зашифрованные передачи затруднят поиск рейдерских групп.\n\nРемонтные бригады восстановят механизмы между боевыми походами.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_raider_weather:0 "Погода как союзник"
 MKN_tactic_raider_weather_desc:0 "Метеосводки помогут использовать плохую видимость для подхода к цели.\n\nРезервные экипажи отработают аварийное погружение и уклонение от охотников.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_torpedo_ambushes:0 "Торпедные засады"
 MKN_tactic_torpedo_ambushes_desc:0 "Засады у узких проходов позволят сосредоточить торпедный залп.\n\nРаспределим районы охоты, чтобы лишать противника снабжения систематически.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_tactic_raider_escape_routes:0 "Маршруты отхода"
 MKN_tactic_raider_escape_routes_desc:0 "Заранее рассчитанные маршруты отхода спасут рейдеров от превосходящего флота.\n\nСовместные учения подготовят группы подлодок к согласованной атаке.\n\nОдноразовая подготовка. Цена: 20 опыта соответствующего рода войск и 10 командного ресурса. Постоянно усиливает его национальный дух."
 MKN_army_hq_decisions:0 "Полевые штабы: армия"
 MKN_army_hq_decisions_desc:0 "Полевые штабы закрепляют опыт колонн, авиакооперативов и морских артелей. Каждая тактика и каждый тип проекта доступны один раз за кампанию. Место проекта выбирается на карте. Одновременно ведётся один проект; при потере региона затраты политической власти и командного ресурса возвращаются, а проект закрывается."
 MKN_army_hq_unlock_tt:0 "Открывает решения полевого штаба этого рода войск; тактики требуют выбранной военной программы."
