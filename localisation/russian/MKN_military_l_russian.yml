 MKN_military_program_progress_tt:0 "Развивает постоянный национальный дух соответствующего рода войск."
 MKN_project_hidden_supply_node:0 "Скрытый узел снабжения"
 MKN_project_hidden_supply_node_desc:0 "Замаскированные склады и подводы свяжут колонны с тылом. За 50 политической власти через 30 дней в выбранном регионе появится один узел снабжения.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_hidden_supply_node_unlock_tt:0 "Открывает одноразовый проект на карте: «Скрытый узел снабжения»."
 MKN_project_front_railway:0 "Укладка рельс к фронту"
 MKN_project_front_railway_desc:0 "Железнодорожные артели проложат новую линию первого уровня от столицы к выбранному региону без существующего сообщения. Работы займут 15 дней и потребуют 20 командного ресурса. Маршрут проходит только по нашей территории.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_front_railway_unlock_tt:0 "Открывает одноразовый проект на карте: «Укладка рельс к фронту»."
 MKN_project_repair_infrastructure:0 "Ремонт инфраструктуры"
 MKN_project_repair_infrastructure_desc:0 "Ремонтные команды восстановят повреждённую инфраструктуру выбранного региона за 7 дней и 20 командного ресурса.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_repair_infrastructure_unlock_tt:0 "Открывает одноразовый проект на карте: «Ремонт инфраструктуры»."
 MKN_project_observation_posts:0 "Наблюдательные посты"
 MKN_project_observation_posts_desc:0 "После исследования радиолокации две гражданские фабрики за 45 дней оборудуют первую радарную станцию в выбранном регионе.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_observation_posts_unlock_tt:0 "Открывает одноразовый проект на карте: «Наблюдательные посты»."
 MKN_project_aa_batteries:0 "Зенитные батареи"
 MKN_project_aa_batteries_desc:0 "Две гражданские фабрики за 45 дней оборудуют один уровень стационарной ПВО для защиты коммун.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_aa_batteries_unlock_tt:0 "Открывает одноразовый проект на карте: «Зенитные батареи»."
 MKN_project_forward_airstrip:0 "Степной аэродром"
 MKN_project_forward_airstrip_desc:0 "За 30 политической власти артели за 15 дней добавят один уровень авиабазы в регионе, соседнем с территорией под контролем противника.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_forward_airstrip_unlock_tt:0 "Открывает одноразовый проект на карте: «Степной аэродром»."
 MKN_project_coastal_battery:0 "Береговая батарея"
 MKN_project_coastal_battery_desc:0 "За 50 политической власти через 45 дней одна прибрежная провинция выбранного региона получит один уровень береговых укреплений.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_coastal_battery_unlock_tt:0 "Открывает одноразовый проект на карте: «Береговая батарея»."
 MKN_project_hidden_cove:0 "Скрытая бухта"
 MKN_project_hidden_cove_desc:0 "За 30 политической власти через 30 дней одна прибрежная провинция выбранного региона получит один уровень морской базы.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_hidden_cove_unlock_tt:0 "Открывает одноразовый проект на карте: «Скрытая бухта»."
 MKN_project_fuel_cache:0 "Схрон топлива"
 MKN_project_fuel_cache_desc:0 "За 30 политической власти две гражданские фабрики за 30 дней построят одно топливохранилище в выбранном регионе.\n\nЭтот тип проекта доступен один раз за кампанию, в одном выбранном регионе. Требуется полное владение и контроль. При отмене PP/CP возвращаются; повторное начало невозможно."
 MKN_project_fuel_cache_unlock_tt:0 "Открывает одноразовый проект на карте: «Схрон топлива»."
