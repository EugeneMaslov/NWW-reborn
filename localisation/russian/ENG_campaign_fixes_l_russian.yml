 ENG_nww_constitutional_edward:0 "Эдуард VIII: конституционный монарх"
 ENG_nww_constitutional_edward_desc:0 "Король признал ответственность правительства перед парламентом. Спор о полномочиях короны урегулирован; еженедельная потеря стабильности прекращается."
 ENG_nww_revisit_crown:0 "Вернуться к вопросу о короне"
 ENG_nww_revisit_crown_desc:0 "Кабинет вновь обсудит положение Эдуарда VIII. Можно закрепить его конституционные обязательства или принять отречение в пользу Георга VI. Оба решения прекращают еженедельную потерю стабильности."
