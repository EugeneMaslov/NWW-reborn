l_russian:
 MKN_bank_raid_aftermath:0 "Последствия ограбления банка"
 MKN_bank_raid_aftermath_desc:0 "Пропавшие средства заморозили расчёты предприятий и подорвали доверие к власти. На 180 дней: фактор ТНП +20%, выпуск военных заводов −20%, ежедневная политическая власть −0,30."
 MKN_UKR_first_year_local_war:0 "Первый год двусторонней войны"
 MKN_UKR_first_year_local_war_desc:0 "В течение первых 12 месяцев войны Махновщины с Украиной обе стороны и их союзники под управлением ИИ не призывают союзников и не принимают призывы в эту войну. Членство во фракциях сохраняется."
 MKN_voucher_transition_idea_inactive:0 "Архив перехода к трудовым чекам"
 MKN_voucher_transition_idea_inactive_desc:0 "Реформа другой политической программы не действует. Срок адаптации продолжает истекать; при возвращении прежней партии восстанавливается только оставшееся время."
 MKN_betrayed_twice_inactive:0 "Архив мобилизации после предательства"
 MKN_betrayed_twice_inactive_desc:0 "Временная мера Ревкома не действует при другой правящей партии. Исходный срок не продлевается."
 MKN_grain_barter_factory_idea_inactive:0 "Приостановленный хлебный договор"
 MKN_grain_barter_factory_idea_inactive_desc:0 "Временная фабрика хлебного договора недоступна при другой правящей партии. Договор продолжает истекать и может восстановиться только на оставшийся срок."
 mkn_gameplay.1.t:0 "Степь пережила войну"
 mkn_gameplay.1.d:0 "Военный набат стих. Мы прятали станки, выводили людей из-под огня и собирали отряды там, где враг ожидал увидеть покорность. Коммуны сохранили волю к жизни. Теперь пора возвращать мастерские к мирному труду и с уверенностью смотреть в завтрашний день."
 mkn_gameplay.1.a:0 "Мы выстояли вместе!"
 MKN_council_selection_tt:0 "§YЕвген§! становится членом совета. Ещё два места получают армейские командиры с §Yнаибольшим навыком§! на момент выполнения фокуса; равные кандидаты выбираются случайно."
 MKN_party_reforms_enabled:0 "Политические программы открыты для действующей партии"
