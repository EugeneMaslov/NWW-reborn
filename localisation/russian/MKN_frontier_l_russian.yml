l_russian:
 MKN_ukrainian_frontier_root:0 "Украинский рубеж"
 MKN_ukrainian_frontier_root_desc:0 "Между сходами Гуляйполя и комиссариатами Харькова каждый железнодорожный узел стал предметом спора о самой революции. Съезд должен определить общую политику приграничных коммун, пока за него это не сделала винтовка случайного дозорного."
 MKN_ukrainian_frontier_root_tt:0 "Открывает панель Украинского рубежа. Приграничные приказы становятся доступны после инцидента вслед за смертью Махно. Каждая победа немедленно превращает захваченный регион в нашу национальную территорию."
 MKN_tachanka_deep_recon:0 "Глубокая разведка тачанок"
 MKN_tachanka_deep_recon_desc:0 "Повозку легко принять за крестьянский транспорт — пока с неё не сброшен брезент. Проверенные экипажи нанесут на карту красные дозоры, складские ворота и насыпи, чтобы пограничные комитеты действовали по сведениям, а не по дорогостоящим догадкам."
 MKN_tachanka_deep_recon_tt:0 "Снижает затраты политической власти на решения Украинского рубежа на §G50%§!."
 MKN_donbas_miners_agitation:0 "Агитация среди шахтёров Донбасса"
 MKN_donbas_miners_agitation_desc:0 "Комиссар может приказать шахте выполнить план, но не заставит шахтёров забыть, кто спускал клети. Наши связные доставят обращение коммун в угольные районы и обратят ритм приграничной промышленности против харьковского принуждения."
 MKN_donbas_miners_agitation_tt:0 "Нарушить работу соседней украинской промышленности на 180 дней. Открыть пограничные бои за Сталино, Харьков и Крым под властью РСФСР, пока действует пограничный кризис."
 MKN_right_of_first_shot:0 "Право первого выстрела"
 MKN_right_of_first_shot_desc:0 "Ни один пограничный сход не должен ждать, пока далёкая канцелярия признает начало стрельбы. Донесения разведки и выборные командиры определят час атаки прежде, чем красные отряды успеют сосредоточиться против нас."
 MKN_right_of_first_shot_tt:0 "Наши атакующие силы получают §G+15%§! к боевой силе в приграничных конфликтах Украинского рубежа, начатых после завершения этого фокуса."
 MKN_armored_train_interceptors:0 "Бронепоезда-перехватчики"
 MKN_armored_train_interceptors_desc:0 "Стальные дороги рубежа должны перевозить не только зерно и воззвания. Усиленные вагоны и зенитные пулемётные установки сохранят движение снабжения под налётами, а подвижные команды ответят на тревогу вдоль насыпей."
 MKN_frontier_train_effect_tt:0 "Открывает технологию бронепоездов и предоставляет §G10 бронепоездов§!. Их броня и зенитная атака повышаются на §G20%§!."
 MKN_dnieper_trenches:0 "Окопы Днепровского рубежа"
 MKN_dnieper_trenches_desc:0 "Степь даёт мало укрытий коммуне, попавшей под артиллерийский огонь. Земля, дерево и труд каждого села превратят открытые подступы в цепь опорных пунктов, где горстка защитников продержится до прибытия поездов."
 MKN_dnieper_trenches_tt:0 "Добавляет §G2 уровня§! наземных укреплений в подходящих провинциях на границе с Советской Украиной."
 MKN_conclude_total_war:0 "Война за степь"
 MKN_conclude_total_war_desc:0 "Вымысел об отдельных столкновениях дозоров сгорел. Харьков и Гуляйполе теперь стоят друг против друга как воюющие стороны, и каждой коммуне предстоит решить, чего требует её свобода. Пограничные комитеты станут советами снабжения общей войны."
 MKN_conclude_total_war_tt:0 "Завершает кризис на рубеже полной войной с Советской Украиной и закрепляет постоянный дух §Y«Война за степь»§! (§G+10%§! к атаке на национальной территории)."
 MKN_conclude_kharkiv_treaty:0 "Утвердить Харьковский договор"
 MKN_conclude_kharkiv_treaty_desc:0 "Подписи из Харькова не вернут погибших, но дадут уцелевшим приграничным сёлам два года мирного сева. Мастерские вернутся к гражданским заказам, а делегаты повезут договор домой по тем же путям, по которым прежде доставляли боеприпасы."
 MKN_soviet_intervention_category:0 "Тень интервенции"
 MKN_soviet_intervention_category_desc:0 "Четыре съезда сражаются за наследство Вольной территории, пока Москва и Харьков готовят свои требования. У нас сто дней на объединение степи, прежде чем чужие армии превратят нашу гражданскую войну в собственное завоевание."
 MKN_soviet_intervention_mission:0 "Угроза советской интервенции"
 MKN_soviet_intervention_mission_desc:0 "Пока братья убивают братьев, Красная армия собирается у границы. Если Вольная территория не объединится за §Y100 дней§!, Советы вмешаются, чтобы «восстановить порядок». Все уцелевшие стороны должны объединиться в одну — тогда миссия завершится. Иначе независимые SOV и UKR получат цели войны на аннексию и объявят войну каждому уцелевшему участнику раскола."
 mkn_crisis.200.t:0 "Красная Армия переходит Днепр"
 mkn_crisis.200.d:0 "Сто дней соперничающие съезды объявляли себя наследниками чёрного знамени, а сёла переходили из рук одних братьев в руки других. Теперь предупреждение советских республик стало приказом о наступлении. Москва говорит о восстановлении революционного порядка; Харьков требует обезопасить границу. Их колонны выступают против всех уцелевших претендентов на Вольную территорию, разрывая даже союзы, которые мешают походу. Наш раздор дал комиссарам возможность вмешаться. Степи предстоит встретить чужую войну прежде, чем закончится её собственная."
 mkn_crisis.200.a:0 "Степь ответит огнём."
 MKN_soviet_intervention_tt:0 "Существующие независимые §YСоветская Россия§! и §YСоветская Украина§! получают цели войны на аннексию и объявляют войну всем уцелевшим участникам раскола Вольной территории. Общие альянсы разрываются перед интервенцией."
 MKN_ukr_border_category:0 "Украинский рубеж"
 MKN_ukr_border_category_desc:0 "Сходы Вольной территории стоят против дозоров Советской Украины на рубеже хуторов, мастерских и железнодорожных разъездов. Тревога усиливает удар; отход даёт передышку. Три завершённых приграничных боя без 180-дневного затишья или пятый уровень эскалации приводят к полной войне. Через год после первого инцидента истощение навязывает двухлетнее перемирие, если война ещё не началась."
 mkn_escalate_steppe_alarm:0 "Поднять степную тревогу"
 mkn_escalate_steppe_alarm_desc:0 "Созвать конные отряды и выдать патроны приграничным коммунам. Эскалация возрастает на один уровень, а приграничная ярость действует четырнадцать дней. Разведка вдвое снижает политические затраты."
 mkn_deescalate_pull_back:0 "Отвести передовые дозоры"
 mkn_deescalate_pull_back_desc:0 "Отвести дозоры на 20 дней. По завершении эскалация снижается ровно на один уровень; решение сразу можно повторить. Счётчик недавних боёв сохраняется. Девяностодневная передышка ослабляет наступательную готовность."
 mkn_raid_soviet_depots:0 "Налёт на склады Советской Украины"
 mkn_raid_soviet_depots_desc:0 "Ударить по складу в соседнем регионе под контролем UKR. Четыреста винтовок из украинского запаса поступят к нам как трофейное базовое оружие; инфраструктура получит повреждение одного уровня. Эскалация возрастёт на один. Для налёта у противника должно быть четыреста винтовок в запасе."
 mkn_launch_border_battle:0 "Оспорить приграничный регион"
 mkn_launch_border_battle_desc:0 "При третьем уровне эскалации можно оспорить любой соседний регион Советской Украины, кроме Киева. Агитация шахтёров также открывает принадлежащие РСФСР Сталино, Харьков и Крым. Победа передаёт спорный регион нам и делает его национальным; поражение отдаёт наш участвовавший регион фактическому противнику без нового национального статуса. Завершённый бой сбрасывает эскалацию до одного. После завершения кризиса все столкновения отключаются."
 mkn_sign_kharkiv_pact:0 "Предложить Харьковский пакт"
 mkn_sign_kharkiv_pact_desc:0 "При минимальной эскалации и удержании Николаева и Черкасс предложить Советской Украине признать рубеж. Согласие прекращает столкновения, подтверждает наши захваченные национальные регионы и устанавливает двухлетний пакт о ненападении. Годовой отсчёт продолжается до полномасштабной войны или установленного срока."
 MKN_border_fury_buff:0 "Приграничная ярость"
 MKN_border_fury_buff_desc:0 "Железнодорожные гудки разносят тревогу от коммуны к коммуне. Конные дозоры устремляются к огневому рубежу, решив закончить столкновение прежде, чем комиссары соберут резервы."
 MKN_border_relaxation_debuff:0 "Дозоры возвращаются домой"
 MKN_border_relaxation_debuff_desc:0 "Поля забирают работников с рубежа. Жизнь сёл успокаивается, но рассредоточенным отрядам потребуется больше времени для восстановления боевого порядка."
 MKN_war_for_the_steppe:0 "Война за степь"
 MKN_war_for_the_steppe_desc:0 "Спор на рубеже стал войной за существование коммун. Каждая знакомая тропа и насыпь открывает нашим бойцам ещё один путь во фланг врага."
 MKN_ukr_miners_state_disruption:0 "Агитация приграничных шахтёров"
 MKN_ukr_miners_state_disruption_desc:0 "Связные Вольной территории согласуют отказы, замедление работы и остановки приграничных предприятий."
 MKN_frontier_core_integration_tt:0 "Регион немедленно интегрируется в Федерацию Вольных Советов и становится национальным."
 MKN_frontier_war_locked_tt:0 "§RРегулирование эскалации невозможно: Идет полномасштабная война!§!"
 MKN_frontier_frozen_tt:0 "§YФронтир заморожен де-факто перемирием§!"
 MKN_frontier_incident_required_tt:0 "Произошёл первый инцидент на рубеже."
 MKN_frontier_gui_title:0 "УКРАИНСКИЙ РУБЕЖ"
 MKN_frontier_current_level:0 "Эскалация: [?mkn_ukr_escalation_level|0]/5"
 MKN_frontier_stage_1:0 "I — Тревожное затишье"
 MKN_frontier_stage_2:0 "II — Провокации дозоров"
 MKN_frontier_stage_3:0 "III — Приграничные бои"
 MKN_frontier_stage_4:0 "IV — Мобилизация рубежа"
 MKN_frontier_stage_5:0 "V — Полномасштабная война"
 MKN_frontier_meter_tt:0 "Эскалация изменяется от одного до пяти. Пятый уровень или три завершённых боя без 180-дневного затишья приводят к полной войне. Во время войны или после замораживания рубежа все приграничные приказы заблокированы."
 MKN_frontier_native_orders_hint:0 "Приграничные приказы и их стоимость указаны ниже."
 MKN_frontier_year_countdown_mission:0 "Год на рубеже"
 MKN_frontier_year_countdown_mission_desc:0 "Первая провокация Советской Украины начинает §Y365 дней§! приграничного кризиса. При полной войне с UKR или SOV отсчёт прекращается. Иначе по истечении срока вводится пакт о ненападении с UKR на §Y730 дней§!, сохраняются все захваченные национальные регионы MKN и замораживаются дальнейшие столкновения."
 mkn_ukr_border.1.t:0 "Граница больше не сдерживает войну"
 mkn_ukr_border.1.d:0 "Списки погибших больше не помещаются под заголовком «отдельные инциденты». Колонны Советской Украины выходят из казарм, а делегаты рубежа узнают о приказе Харькова начать общее наступление. Пятая тревога или третий подряд бой — война пришла в степь. Теперь советам предстоит снабжать армию, а не дозор."
 mkn_ukr_border.1.a:0 "Бить тревогу в каждой коммуне."
 mkn_ukr_border.2.t:0 "Рубеж переходит из рук в руки"
 mkn_ukr_border.2.win:0 "Наши отряды выиграли бой за регион [?mkn_ukr_last_contested_state.GetName]. Чёрное знамя поднимается над железнодорожной конторой, пока делегаты созывают сельские сходы. Территория уже передана нашему управлению и стала национальным регионом Федерации Вольных Советов. Орудия замолкают, но в пограничную книгу внесён ещё один бой."
 mkn_ukr_border.2.loss:0 "Спорный регион перешёл под управление нашего советского противника. Уцелевшие возвращаются в общины, а пограничная тревога временно стихает. Наша неудача не даёт победителю нового национального статуса региона."
 mkn_ukr_border.2.a:0 "Отправить делегатов в сёла."
 mkn_ukr_border.3.t:0 "Предложение пакта из Гуляйполя"
 mkn_ukr_border.3.d:0 "Приграничные коммуны предлагают на два года признать нынешнюю линию. Их делегаты настаивают, что территории, завоёванные под чёрным знаменем, останутся национальными регионами их федерации. Мы можем принять передышку или отправить их домой без подписей."
 mkn_ukr_border.3.a:0 "Подписать пакт."
 mkn_ukr_border.3.b:0 "Соглашения не будет."
 mkn_ukr_border.4.t:0 "Харьков ставит подпись"
 mkn_ukr_border.4.d:0 "Делегаты вернулись с подписями Советской Украины. На два года пакт о ненападении признаёт линию, удерживаемую нашими коммунами; уже завоёванные регионы остаются национальной территорией. Железнодорожные мастерские вновь могут готовить орудия жатвы. Годовой срок рубежа сохраняется: если не начнётся война, он закрепит своё перемирие."
 mkn_ukr_border.4.a:0 "Пусть сёла сеют в мире."
 mkn_ukr_border.5.t:0 "Делегаты возвращаются ни с чем"
 mkn_ukr_border.5.d:0 "Харьков отверг предложенный пакт. Нынешний рубеж остаётся неурегулированным, и дозоры не складывают винтовки. Комитетам предстоит решить, как долго сохранять затишье, прежде чем искать другой выход."
 mkn_ukr_border.5.a:0 "Продолжать дозор."
 mkn_ukr_border.10.t:0 "Советы почуяли слабость"
 mkn_ukr_border.10.d:0 "Через семь дней после того, как Гуляйполе приспустило чёрные знамёна, советская разведка подтвердила смерть Батьки. Дозоры Советской Украины проверяют дороги вдоль нашего рубежа; донесения идут между Харьковом и штабами Красной армии. У часового отбирают оружие, зерновую повозку поворачивают назад, на предупредительный выстрел отвечают выстрелом. Советы встречают первую тревогу без Махно. У рубежа один год, прежде чем война или истощение определят его будущее."
 mkn_ukr_border.10.a:0 "Коммуны сохранят дозор."
 mkn_ukr_frontier_concluded:0 "Кризис на рубеже завершён"
 mkn_ukr_pact_signed:0 "Харьковский пакт подписан"
 mkn_ukr_total_war:0 "На рубеже началась полномасштабная война"
