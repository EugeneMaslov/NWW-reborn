l_russian:
 GER_the_gilded_colossus:0 "Позолоченный колосс"
 GER_the_gilded_colossus_desc:0 "Империя распоряжается рынками и колониями по всему миру, но её учреждения закоснели, а обязательства превышают возможности. Короне предстоит решить, как управлять этой неповоротливой гегемонией."
 GER_fund_the_reichswehr:0 "Финансировать рейхсвер"
 GER_fund_the_reichswehr_desc:0 "Предоставим имперской армии требуемые средства и доступ к власти. Генеральный штаб усилит влияние за счёт парламентского контроля."
 GER_empower_the_chancellor:0 "Расширить полномочия канцлера"
 GER_empower_the_chancellor_desc:0 "Канцлер должен согласовывать бюджет с рейхстагом, а не подчиняться двору и Генеральному штабу. Гражданские учреждения получат более весомый голос."
 GER_end_of_an_era:0 "Конец эпохи"
 GER_end_of_an_era_desc:0 "Вильгельм II олицетворял империю, не знавшую мировой войны. Его смерть положит конец долгому политическому застою и откроет борьбу за наследство. Фокус завершается только событием престолонаследия между августом и концом 1936 года."
 GER_the_potsdam_coup:0 "Потсдамский переворот"
 GER_the_potsdam_coup_desc:0 "Опираясь на Генеральный штаб, Вильгельм III сосредоточит в своих руках власть, ослабевшую при его отце. Необходимы предварительная поддержка армии, смещение баланса более чем на 10% влево от центра и не менее 40% поддержки монархистов."
 GER_dissolve_the_reichstag:0 "Распустить рейхстаг"
 GER_dissolve_the_reichstag_desc:0 "Парламент больше не будет препятствовать императорским указам. Корона и Верховное командование получают всю полноту власти; баланс сил закрепляется, а демократические политические советники лишаются должностей и доступа к ним."
 GER_reign_in_mitteleuropa:0 "Обуздать Миттельевропу"
 GER_reign_in_mitteleuropa_desc:0 "Потребуем полного подчинения Литвы-Беларуси и Польши. Наши зависимые страны станут интегрированными марионетками, если система автономии это допускает; независимые правительства могут принять статус марионетки или отказаться. Германия не сможет начать войну с ЛитБелом до 1939 года.\n\n$GER_eastern_1939_gate_tt$"
 GER_the_austrian_question:0 "Австрийский вопрос"
 GER_the_austrian_question_desc:0 "Вена должна признать верховенство Берлина и принять статус марионетки. Австрия может отказаться; в этом случае мы получим цель войны для её подчинения."
 GER_crush_eastern_syndicates:0 "Разгромить восточные синдикаты"
 GER_crush_eastern_syndicates_desc:0 "Подготовим уничтожение независимых синдикалистских центров на территории махновцев и Украины. Цели войны выдаются только против существующих независимых стран вне нашего союза.\n\n$GER_eastern_1939_gate_tt$"
 GER_gott_mit_uns:0 "С нами Бог"
 GER_gott_mit_uns_desc:0 "Железная империя объединяет корону, армию и нацию общей имперской целью. Дивизии получают +15% к защите на национальной территории, +10% к атаке и +10% к прорыву."
 ger_aging_monarch:0 "Стареющий монарх"
 ger_aging_monarch_desc:0 "Стареющий кайзер держится за привычных придворных, ослабляя стабильность и повышая стоимость назначения политических советников."
 GER_imperial_overstretch:0 "Имперское перенапряжение"
 GER_imperial_overstretch_desc:0 "Колониальные гарнизоны, континентальные гарантии и негибкий двор истощают империю, уже не способную нести все обязательства."
 GER_master_of_mitteleuropa:0 "Хозяин Миттельевропы"
 GER_master_of_mitteleuropa_desc:0 "Берлин определяет торговые правила Центральной Европы и распространяет имперское политическое влияние среди зависимых стран."
 GER_prussian_martial_spirit:0 "Прусский воинский дух"
 GER_prussian_martial_spirit_desc:0 "Поколения профессиональных военных сохраняют дисциплину и традиции планирования имперской армии."
 GER_kaiser_vs_reichstag:0 "Кайзер и рейхстаг"
 GER_ohl_and_crown_side:0 "Верховное командование и корона"
 GER_reichstag_side:0 "Рейхстаг"
 GER_bop_balanced:0 "Равновесие учреждений"
 GER_bop_total_ohl:0 "Полная власть Верховного командования"
 GER_bop_ohl_leaning:0 "Преобладание Верховного командования"
 GER_bop_ohl_influence:0 "Растущее влияние военных"
 GER_bop_reichstag_influence:0 "Растущее влияние парламента"
 GER_bop_reichstag_leaning:0 "Преобладание рейхстага"
 GER_bop_total_reichstag:0 "Верховенство парламента"
 GER_bop_decisions_category:0 "Корона, командование и парламент"
 GER_bop_decisions_category_desc:0 "Империя балансирует между властью короны и Генерального штаба и требованиями рейхстага. Военное командование находится слева, парламент — справа."
 GER_consult_the_general_staff:0 "Советоваться с Генеральным штабом"
 GER_consult_the_general_staff_desc:0 "Пригласим генералов определять имперскую политику. Сдвигает баланс на 10% влево и повышает поддержку монархистов на 5 процентных пунктов. Доступно повторно через 30 дней до роспуска рейхстага."
 GER_concede_to_parliament:0 "Уступить парламенту"
 GER_concede_to_parliament_desc:0 "Признаем рейхстаг партнёром в управлении. Сдвигает баланс на 10% вправо и повышает поддержку демократов на 5 процентных пунктов. Доступно повторно через 30 дней до роспуска рейхстага."
 GER_bop_frozen_tt:0 "Баланс сил навсегда закрепляется за Верховным командованием и короной. Оба решения по изменению влияния становятся недоступны."
 GER_litbel_war_guard_tt:0 "Имперские обязательства запрещают Германии объявлять войну Литве-Беларуси до 1 января 1939 года."
 GER_mitteleuropa_demand_tt:0 "Литва-Беларусь и Польша: автономия уже зависимых от Германии стран снижается; независимые правительства получают требование стать марионеткой и могут отказаться. Для интегрированной марионетки требуется Together for Victory; иначе используется обычный статус марионетки."
 GER_mitteleuropa_refusal_tt:0 "Отказ может дать Германии цель войны для подчинения страны. Для Литвы-Беларуси это возможно только с 1 января 1939 года, пока она независима и не входит в союз с Германией."
 GER_nww_historical_plan:0 "Железная империя"
 GER_nww_historical_plan_desc:0 "Престолонаследие, усиление военной власти и давление на германскую сферу влияния."
 ger_crisis.1.t:0 "Смерть кайзера Вильгельма II"
 ger_crisis.1.d:0 "Кайзер Вильгельм II скончался. Десятилетиями он возвышался над процветающей, но всё более неподвижной имперской системой: колониальные и континентальные обязательства росли, а политические реформы стояли на месте. Его сын восходит на престол как Вильгельм III. За всеобщим трауром Генеральный штаб и рейхстаг оценивают соотношение сил. Новому правлению предстоит ответить на вопросы, оставленные прежним."
 ger_crisis.1.a:0 "Кайзер умер. Да здравствует кайзер!"
 ger_news.1.t:0 "Уход последнего истинного императора"
 ger_news.1.d:0 "Берлин объявил о смерти кайзера Вильгельма II и восшествии на престол Вильгельма III. Покойный монарх стоял во главе долгой германской гегемонии, определившей облик Европы без мировой войны. Теперь правительства от Вены до восточной границы задаются вопросом: сохранит ли наследник прежние договорённости или направит военную мощь рейха на установление нового имперского порядка?"
 ger_news.1.a:0 "Европа следит за Берлином."
 ger_crisis.10.t:0 "Берлин требует подчинения Австрии"
 ger_crisis.10.d:0 "Вильгельм III требует от Австрии признать германское верховенство и принять статус марионетки. Согласие сохранит наше правительство под германским надзором. Отказ даст Берлину повод добиться подчинения силой."
 ger_crisis.10.a:0 "Принять германское покровительство."
 ger_crisis.10.b:0 "Австрия останется суверенной."
 ger_crisis.20.t:0 "Ультиматум Миттельевропы"
 ger_crisis.20.d:0 "Имперское правительство в Берлине требует, чтобы государство [ROOT.GetNameDef] официально подчинилось Германии в качестве марионетки. Наши учреждения сохранятся, но внешняя политика и стратегические решения будут зависеть от кайзера. Мы можем отвергнуть требование. Германия обязана не начинать войну с Литвой-Беларусью до 1939 года, хотя отказ оставит затяжной спор."
 ger_crisis.20.a:0 "Принять имперские условия."
 ger_crisis.20.b:0 "Наш суверенитет не обсуждается."
 GER_pan_german_leagues:0 "Пангерманские союзы"
 GER_pan_german_leagues_desc:0 "Объединим националистические общества в организованное движение. Их митинги позволят собрать необходимые 40% поддержки для выхода из парламентского тупика."
 GER_organize_ruhr_workers:0 "Организовать рабочих Рура"
 GER_organize_ruhr_workers_desc:0 "Восстановим рабочие советы и подготовим спартакистский вызов имперскому порядку. Через советы можно нарастить поддержку будущего восстания."
 GER_parliamentary_spring:0 "Парламентская весна"
 GER_parliamentary_spring_desc:0 "При поддержке демократов не менее 40%, усиленном канцлере и балансе правее +0,10 парламент возьмёт престолонаследие под контроль. Ганс Фогель сформирует социал-демократическое правительство; баланс закрепится за рейхстагом."
 GER_true_constitutional_monarchy:0 "Подлинная конституционная монархия"
 GER_true_constitutional_monarchy_desc:0 "Вильгельм III сохраняет корону как конституционный символ, а исполнительная власть переходит избранным министрам. Парламентские институты дают +15% стабильности и +0,20 политической власти в день."
 GER_mitteleuropa_economic_community:0 "Экономическое сообщество Миттельевропы"
 GER_mitteleuropa_economic_community_desc:0 "Предоставим независимость Литве-Беларуси и Польше, если они зависят от нас, и пригласим их в добровольный союз Миттельевропы. Согласие каждого партнёра даёт одну внемаповую гражданскую фабрику, всего не более двух. Отказ не даёт цели войны."
 GER_the_austrian_referendum:0 "Австрийский референдум"
 GER_the_austrian_referendum_desc:0 "Предложим Вене мирное объединение при демократическом правительстве или союз суверенных государств. Австрия самостоятельно принимает решение и должна находиться в мире; отказ не имеет военных последствий."
 GER_arsenal_of_democracy:0 "Арсенал демократии"
 GER_arsenal_of_democracy_desc:0 "Укрепим конституционные институты оборонной промышленной программой: +20% выпуска фабрик и +10% защиты дивизий с сохранением бонусов стабильности и политической власти. Гарантируем независимость суверенных Литвы-Беларуси и Польши от внешней агрессии."
 GER_the_pan_germanic_triumph:0 "Пангерманский триумф"
 GER_the_pan_germanic_triumph_desc:0 "При поддержке националистов не менее 40% и балансе в тупиковом диапазоне от −0,30 до +0,30 пангерманское движение захватит правительство. Вильгельм III останется номинальным главой до упразднения династии."
 GER_abolish_the_hohenzollerns:0 "Упразднить власть Гогенцоллернов"
 GER_abolish_the_hohenzollerns_desc:0 "Устраним Вильгельма III и последние династические ограничения. Альфред Гугенберг возглавит радикальное националистическое правительство; баланс между короной и рейхстагом будет окончательно упразднён."
 GER_anschluss_by_force:0 "Аншлюс силой"
 GER_anschluss_by_force_desc:0 "Потребуем от Австрии согласиться на присоединение к новому германскому государству. Отказ даёт цель войны для аннексии. Требование направляется только независимой Австрии, находящейся в мире."
 GER_lebensraum_in_the_east:0 "Экспансия на Восток"
 GER_lebensraum_in_the_east_desc:0 "Пангерманское руководство объявляет восточные приграничные земли сферой своей экспансии. Подготовим цели войны для аннексии независимых несоюзных Литвы-Беларуси и Польши только после открытия восточного направления.\n\n$GER_eastern_1939_gate_tt$"
 GER_the_new_reich:0 "Новый рейх"
 GER_the_new_reich_desc:0 "Милитаризованное националистическое государство готовит дивизии к наступательной войне: +15% атаки, +20% прорыва и +10% скорости дивизий."
 GER_the_spartacist_uprising:0 "Спартакистское восстание"
 GER_the_spartacist_uprising_desc:0 "При организованных рабочих и поддержке коммунистов не менее 40% выступим против монархии. Начнётся настоящая гражданская война; игрок перейдёт к коммунистическим повстанцам с 40% исходной военной силы. Для провозглашения республики необходима победа."
 GER_german_soviet_republic:0 "Германская советская республика"
 GER_german_soviet_republic_desc:0 "После победы спартакистов над имперскими лоялистами в гражданской войне учредим германскую республику советов во главе с Эрнстом Тельманом. Необходима победа восстания, а не просто прекращение боёв."
 GER_workers_militias:0 "Рабочие ополчения"
 GER_workers_militias_desc:0 "Создадим единую организацию ополчений на основе фабричных советов: +5 процентных пунктов военнообязанного населения и +10% восстановления организации."
 GER_dismantle_imperial_borders:0 "Демонтировать имперские границы"
 GER_dismantle_imperial_borders_desc:0 "Прекратим германское господство над Литвой-Беларусью и Польшей. Освобождаются только наши собственные зависимые страны; независимые государства и владения третьих держав не аннексируются и не передаются."
 GER_berlin_moscow_axis:0 "Ось Берлин — Москва"
 GER_berlin_moscow_axis_desc:0 "Предложим советскому правительству принять нашу республику в его союз или создать общий коммунистический альянс, если такого ещё нет. Необходимо согласие СССР; отказ не приводит к войне."
 GER_world_revolution:0 "Мировая революция"
 GER_world_revolution_desc:0 "Подготовим цели войны для аннексии независимых несоюзных Франции и Британии. Эти западные цели не отменяют ограничений Германии на восточном направлении."
 GER_eastern_1939_gate_tt:0 "§YМы не готовы к масштабной войне на Востоке. Этот фокус будет доступен только с 1 января 1939 года.§!"
 GER_eastern_war_guard_tt:0 "Германия не может объявлять войну Литве-Беларуси, Польше, Украине, махновцам или СССР до 1 января 1939 года."
 GER_reichstag_locked_tt:0 "Баланс сил навсегда закрепляется за рейхстагом. Решения об усилении военных становятся недоступны."
 GER_economic_community_tt:0 "Освобождаем зависимые от нас Литву-Беларусь и Польшу и приглашаем их в Миттельевропу. Согласие каждого партнёра один раз даёт одну внемаповую гражданскую фабрику."
 GER_constitutional_monarchy:0 "Конституционные институты"
 GER_constitutional_monarchy_desc:0 "Подотчётный парламенту кабинет управляет от имени символической короны. Эти институты развиваются в Арсенал демократии."
 GER_mitteleuropa_faction:0 "Миттельевропа"
 GER_berlin_moscow_faction:0 "Рабочий союз Берлина и Москвы"
 GER_rally_pan_german_leagues:0 "Собрать пангерманские союзы"
 GER_rally_pan_german_leagues_desc:0 "Потратить 50 политической власти, чтобы получить 10 процентных пунктов поддержки пангерманистов. Повторяется через 30 дней до выбора политического пути; баланс сил не меняется."
 GER_organize_workers_councils:0 "Организовать рабочие советы"
 GER_organize_workers_councils_desc:0 "Потратить 50 политической власти, чтобы получить 10 процентных пунктов поддержки спартакистов. Повторяется через 30 дней до выбора политического пути; баланс сил не меняется."
 ger_crisis.30.t:0 "Австрийский референдум"
 ger_crisis.30.d:0 "Парламентское правительство государства [FROM.GetNameDef] предлагает мирное урегулирование. Демократическая Австрия может добровольно выбрать объединение; альтернативой служит союз суверенных государств. Вена также вправе отказаться без угрозы войны."
 ger_crisis.30.a:0 "Выбрать демократическое объединение."
 ger_crisis.30.b:0 "Вступить в Миттельевропу как суверенный партнёр."
 ger_crisis.30.c:0 "Сохранить самостоятельный курс."
 ger_crisis.40.t:0 "Пангерманское требование аннексии"
 ger_crisis.40.d:0 "Радикальное националистическое правительство в Берлине требует немедленного включения Австрии в своё государство. Согласие означает аннексию; отказ даст Германии цель войны. Решение принимает Австрия, передача территории не происходит автоматически."
 ger_crisis.40.a:0 "Согласиться на включение в Германию."
 ger_crisis.40.b:0 "Австрия будет сопротивляться."
 ger_crisis.50.t:0 "Приглашение в Миттельевропу"
 ger_crisis.50.d:0 "Социал-демократическое правительство государства [FROM.GetNameDef] предлагает вступить в добровольное экономическое и оборонное сообщество. Наш суверенитет признаётся независимо от ответа. Согласие создаст общие экономические институты; отказ не повлечёт ультиматума."
 ger_crisis.50.a:0 "Присоединиться к сообществу."
 ger_crisis.50.b:0 "Предпочесть самостоятельные экономические отношения."
 ger_crisis.60.t:0 "Предложение Берлина Москве"
 ger_crisis.60.d:0 "Победившие германские спартакисты предлагают союз с СССР. Если мы возглавляем существующий альянс, они вступят в него; иначе можно создать общий рабочий союз. Решение остаётся за нашим правительством."
 ger_crisis.60.a:0 "Принять германских товарищей."
 ger_crisis.60.b:0 "Следовать собственной стратегии."
 GER_imperial_field_exercises:0 "Провести имперские манёвры"
 GER_imperial_field_exercises_desc:0 "Генеральный штаб демонстрирует готовность ценой общественного спокойствия. Усиливает Корону и временно улучшает планирование и восстановление организации."
 GER_reichstag_social_compact:0 "Согласовать социальный бюджет Рейхстага"
 GER_reichstag_social_compact_desc:0 "Парламент финансирует гражданское строительство и общественное согласие ценой снижения воинственных настроений."
 GER_publish_military_audit:0 "Опубликовать военные счета"
 GER_publish_military_audit_desc:0 "Открытая ревизия укрепляет доверие и влияние парламента. Офицеры недовольны проверкой и временно противятся наступательным инициативам."
 GER_mediate_crown_and_chamber:0 "Примирить Корону и палату"
 GER_mediate_crown_and_chamber_desc:0 "Дорогостоящее конституционное перемирие приближает баланс к центру. Обязательства по потребительским товарам снижаются вместе с военным энтузиазмом."
 GER_staff_manoeuvres:0 "Манёвры Генерального штаба"
 GER_staff_manoeuvres_desc:0 "Совместные учения улучшают планирование и восстановление частей."
 GER_social_budget:0 "Социальный бюджет парламента"
 GER_social_budget_desc:0 "Заказы на гражданское строительство поддерживают компромисс с Рейхстагом."
 GER_military_accounts:0 "Открытые военные счета"
 GER_military_accounts_desc:0 "Прозрачность счетов облегчает политическую работу, но недовольство военных ослабляет наступательные действия."
 GER_constitutional_truce:0 "Конституционное перемирие"
 GER_constitutional_truce_desc:0 "Временное соглашение высвобождает ресурсы, прежде уходившие на политические уступки."
