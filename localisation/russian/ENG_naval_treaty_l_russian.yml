l_russian:
 MTG_naval_treaty_adherent:0 "Лондонское морское соглашение"
 MTG_naval_treaty_adherent_desc:0 "Лондонский компромисс Британии, Италии, Германии, Франции, Японии, Китая и США сдерживает стоимость новых морских вооружений. Пределы стоимости проектов (крейсер / тяжёлый корабль / авианосец): 5300 / 10000 / 9500. Существующий флот не подлежит автоматическому списанию."
 MTG_naval_treaty_cheating:0 "Лондонское морское соглашение"
 MTG_naval_treaty_cheating_desc:0 "Лондонский компромисс Британии, Италии, Германии, Франции, Японии, Китая и США сдерживает стоимость новых морских вооружений. Пределы стоимости проектов (крейсер / тяжёлый корабль / авианосец): 5700 / 11500 / 10250. Существующий флот не подлежит автоматическому списанию."
 MTG_naval_treaty_adherent_reduced:0 "Лондонское морское соглашение — защитная оговорка"
 MTG_naval_treaty_adherent_reduced_desc:0 "Лондонский компромисс Британии, Италии, Германии, Франции, Японии, Китая и США сдерживает стоимость новых морских вооружений. Пределы стоимости проектов (крейсер / тяжёлый корабль / авианосец): 6000 / 12000 / 10500. Существующий флот не подлежит автоматическому списанию."
 MTG_naval_treaty_cheating_reduced:0 "Лондонское морское соглашение — защитная оговорка"
 MTG_naval_treaty_cheating_reduced_desc:0 "Лондонский компромисс Британии, Италии, Германии, Франции, Японии, Китая и США сдерживает стоимость новых морских вооружений. Пределы стоимости проектов (крейсер / тяжёлый корабль / авианосец): 6500 / 14000 / 10750. Существующий флот не подлежит автоматическому списанию."
 ENG_london_category:0 "Лондонское морское соглашение"
 ENG_london_category_desc:0 "Участники при открытии сценария: Великобритания, Италия, Германия, Франция, Япония, Китай и США. Действующих подписантов: [?global.ENG_london_members|0]. Ограничения относятся к стоимости новых проектов кораблей, а не к числу уже построенных кораблей. Выход одной страны не исключает остальные."
 ENG_london_withdraw:0 "Уведомить о выходе из соглашения"
 ENG_london_withdraw_desc:0 "75 политической власти, 35 дней. После истечения срока снимает наши ограничения. При отмене возвращает стоимость. Остальные подписанты сохраняют соглашение, пока их не станет меньше трёх или между ними не начнётся война."
 ENG_london_clause:0 "Применить защитную оговорку"
 ENG_london_clause_desc:0 "После выхода подписанта: 100 политической власти и 35 дней общей подготовки. Поднимает пределы стоимости проектов всем оставшимся участникам: крейсеры 5300 → 6000, тяжёлые корабли 10000 → 12000, авианосцы 9500 → 10500. Уже существующие корабли не уничтожаются."
 nww_london.1.t:0 "Выход из Лондонского соглашения"
 nww_london.1.d:0 "[FROM.GetNameDef] завершает процедуру выхода. Оставшиеся участники сохраняют ограничения и могут воспользоваться заранее согласованной защитной оговоркой."
 nww_london.1.a:0 "Принять к сведению"
 nww_london.2.t:0 "Защитная оговорка вступает в силу"
 nww_london.2.d:0 "Выход одного из участников изменил морской баланс. Для всех оставшихся подписантов действуют одинаковые повышенные пределы стоимости проектов."
 nww_london.2.a:0 "Принять к сведению"
