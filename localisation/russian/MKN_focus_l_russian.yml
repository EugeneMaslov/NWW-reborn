l_russian:
 MKN_the_free_territory:0 "Вольная территория"
 MKN_the_free_territory_desc:0 "Ни господ, ни государств — только вольные советы крестьян и рабочих."
 MKN_farmers_and_workers:0 "Крестьяне и рабочие"
 MKN_farmers_and_workers_desc:0 "Вольная территория держится на руках труда, а не на коронах старого мира."
 MKN_shadow_republic:0 "Теневое государство"
 MKN_shadow_republic_desc:0 "Государство, которое почти никогда не спорит вслух, но всегда чувствуется в воздухе."
 MKN_free_soviets:0 "Вольные советы"
 MKN_free_soviets_desc:0 "Каждому селу — свою коммуну, каждой коммуне — свой голос."
 MKN_nabat_federation:0 "Федерация «Набат»"
 MKN_nabat_federation_desc:0 "Анархистские федерации от Харькова до Одессы смотрят на Гуляй-Поле."
 MKN_gulyai_polye_commune:0 "Гуляйпольская коммуна"
 MKN_gulyai_polye_commune_desc:0 "Столица анархии покажет миру иной способ жить."
 MKN_black_banner_east:0 "Чёрное знамя на восток"
 MKN_black_banner_east_desc:0 "Киев кланяется Москве. Восток надо освободить от обоих."
 MKN_makhno_moves_south:0 "Махно идёт на юг"
 MKN_makhno_moves_south_desc:0 "К морю, к портам, к кораблям, что везут наш хлеб."
 MKN_the_steppe_holds:0 "Степь держится"
 MKN_the_steppe_holds_desc:0 "Три года войны, а Вольная территория стоит. Пусть приходят."
 MKN_soviet_press:0 "Советская печать"
 MKN_soviet_press_desc:0 "«Набат» и «Голос» ежедневно печатают правду."
 MKN_anarchist_schools:0 "Анархистские школы"
 MKN_anarchist_schools_desc:0 "Школы Феррера для свободных детей."
 MKN_peasant_militias:0 "Крестьянские милиции"
 MKN_peasant_militias_desc:0 "Каждому селу — свою сотню."
 MKN_border_tensions:0 "Напряжение на границе"
 MKN_border_tensions_desc:0 "Киев держит то, что нужно степи. Прощупать их границу."
 MKN_everlasting_makhnovshchina:0 "Махновская традиция"
 MKN_everlasting_makhnovshchina_desc:0 "Съезд может вновь пригласить Махно как гражданского делегата без восстановления его военной должности. Добровольная оборона и автономия общин усиливают советы на 0,20."
 MKN_soviets_forever:0 "Советы навсегда"
 MKN_soviets_forever_desc:0 "Коммуна вечна."
 MKN_tachanka_guards:0 "Тачаночная гвардия"
 MKN_tachanka_guards_desc:0 "Элита Повстанческой армии."
 MKN_council_communism:0 "Синдикалистская программа"
 MKN_council_communism_desc:0 "Заводские собрания и крестьянские коммуны согласуют производство через выборных делегатов. Этот вариант анархо-коммунизма усиливает советы на 0,20 без подчинения Москве."
 MKN_workers_control:0 "Рабочий контроль"
 MKN_workers_control_desc:0 "Завод — тем, кто на нём работает."
 MKN_commune_federation:0 "Федерация коммун"
 MKN_commune_federation_desc:0 "Тысяча коммун — одна федерация."
 MKN_constituent_assembly:0 "Съезд вольных советов"
 MKN_constituent_assembly_desc:0 "Для передачи власти отзывным делегатам советов нужна поддержка не менее 40%. Анархо-коммунизм использует демократическую группу идеологий, но общегосударственные парламентские выборы отключены. Баланс смещается на 0,45 к вольным советам."
 MKN_free_elections_steppe:0 "Отзывные мандаты общин"
 MKN_free_elections_steppe_desc:0 "Каждая коммуна избирает и отзывает своих делегатов. Федерация получает устойчивые мандаты без постоянного парламента. Вольные советы получают ещё 0,20 на шкале баланса."
 MKN_open_markets:0 "Кооперативный обмен"
 MKN_open_markets_desc:0 "Общинные мастерские обмениваются излишками через кооперативные договоры и общие технические стандарты."
 MKN_red_banner_steppe:0 "Красный компромисс"
 MKN_red_banner_steppe_desc:0 "При поддержке не менее 40% государственные социалисты создают центральное управление, признавая местные советы. Баланс смещается на 0,35 к советам. Независимая коммунистическая Москва получает предложение об оборонительном союзе, если страны не воюют друг с другом и Вольная территория не состоит в альянсе."
 MKN_hand_to_moscow:0 "Возобновить предложение Москве"
 MKN_hand_to_moscow_desc:0 "Отклонённое приглашение можно возобновить официальными переговорами. Решение о союзе принимает Москва; уже заключённый пакт пропускает повторный запрос без новой награды. Предательство прекращает дальнейшие переговоры."
 MKN_collectivize_the_steppe:0 "Коллективизировать степь"
 MKN_collectivize_the_steppe_desc:0 "Добровольно. Преимущественно."
 MKN_black_hundreds:0 "Власть атаманов"
 MKN_black_hundreds_desc:0 "При поддержке не менее 40% и после подготовки общественного мандата атаманы устанавливают анархо-милитаризм. Баланс смещается на 0,45 к командованию; согласие общин уступает место военным приказам."
 MKN_order_through_tachanka:0 "Единые боевые приказы"
 MKN_order_through_tachanka_desc:0 "Атаманы устанавливают общую цепь командования, смещая баланс ещё на 0,20 к военным."
 MKN_steppe_legions:0 "Степные легионы"
 MKN_steppe_legions_desc:0 "Постоянные соединения заменяют слабо согласованные отряды. Для этого учреждения требуется более 80% контроля командования; баланс смещается ещё на 0,10 к военным."
 MKN_nestor_the_first:0 "Крестьянский покровитель"
 MKN_nestor_the_first_desc:0 "При поддержке не менее 40% крестьянский съезд выбирает аграрный изоляционизм под покровительством Нестора I. Спор командования с советами упраздняется вместе со шкалой баланса и её модификаторами. Махно сохраняет корону и портрет, а его военные должности остаются доступны только при коммунизме."
 MKN_imperial_coronation:0 "Императорская коронация"
 MKN_imperial_coronation_desc:0 "Корона из пшеницы и стали."
 MKN_steppe_empire:0 "Оборона крестьянского края"
 MKN_steppe_empire_desc:0 "Покровительство готовится защищать деревни, не стремясь к внешним завоеваниям. Нестор остаётся монархом, связанным соглашениями крестьянского съезда."
 MKN_congress_1936:0 "Съезд 1936 года"
 MKN_congress_1936_desc:0 "Коммуны и повстанческие отряды должны согласовать порядок общих решений. Съезд открывает переговоры между армейским командованием и отзывными делегатами советов."
 MKN_departure_of_batko:0 "Батько отходит от дел"
 MKN_departure_of_batko_desc:0 "Махно покидает пост председателя съезда, чтобы коммуны сами выбрали своё будущее. Он остаётся жив; его военная служба и возможная крестьянская корона не связаны с передачей политических полномочий."
 MKN_ataman_directorate:0 "Директория атаманов"
 MKN_ataman_directorate_desc:0 "Директория учреждает постоянный совет командования. Требуется более 80% военного контроля; политические решения сохраняют возможность изменять баланс."
 MKN_recallable_delegates:0 "Хартия отзыва"
 MKN_recallable_delegates_desc:0 "При махновской традиции или синдикалистском согласовании съезд гарантирует право отзыва каждого делегата. Хартия требует более 80% контроля вольных советов."
 MKN_peasant_charter:0 "Крестьянская хартия"
 MKN_peasant_charter_desc:0 "Нестор I признаёт деревенские собрания, общинные земельные соглашения и ограничения внешних обязательств. Корона гарантирует аграрную замкнутость и не даёт права на завоевания."
 MKN_red_compromise_institutions:0 "Советская администрация"
 MKN_red_compromise_institutions_desc:0 "Местные советы проводят государственно-социалистическую программу через постоянное гражданское управление. Эти учреждения сохраняют жизнеспособность при отказе Москвы или её предательстве."
