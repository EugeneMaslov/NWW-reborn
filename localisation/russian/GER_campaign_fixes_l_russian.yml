 GER_nww_bohemian_civic_support:0 "Поддержать богемские автономные общества"
 GER_nww_bohemian_civic_support_desc:0 "Выделим 75 политической власти на 45-дневную программу консульских связей, печати и общественных объединений в Богемии. Если кризис остаётся открытым, его напряжённость и германский вклад вырастут на 2, до общего предела 10. При урегулировании кризиса, потере Богемии Австрией, союзе или войне финансирование возвращается. Новое финансирование возможно после 30-дневного перерыва."
