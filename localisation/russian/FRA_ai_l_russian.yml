 FRA_ai_GER_restraint_tt:0 "Исторический ИИ Франции придерживается оборонительной политики. На других маршрутах для объявления войны Германии нужны армейские реформы, подготовка, внутренняя стабильность и явное превосходство сухопутных сил."
 FRA_emergency_representation_tt:0 "При региональном давлении от 80 экстренные бюджетные гарантии стоят ещё 50 политвласти и снижают давление на 25 до ответа представителей."
