 mkn_crisis.1.t:0 "Последний вздох Батько"
 mkn_crisis.1.d:0 "Перед рассветом посыльный из Гуляйполя добрался до здания съезда. Он принёс не приказ, а потёртую шапку Махно. Батько умер. На станциях гудят паровозы, которые никуда не отправляются; в сёлах сходы стоят молча. Тратишов требует общего командования, Волин — федерации вольных советов, крестьяне — закрытой житницы, красные делегаты — революционной администрации. Похороны дали нам тишину, но не согласие. У нас 180 дней."
 mkn_crisis.100.t:0 "Степь горит: распад на четыре лагеря"
 mkn_crisis.100.d:0 "Срок урегулирования преемственности истёк. Сильнейшая оппозиционная партия бросила вызов действующей власти: Вольная территория раскололась на два вооружённых лагеря. В решениях можно поддержать действующее правительство или перейти к повстанцам. Победа откроет политическую программу победителя."
 mkn_crisis.20.t:0 "Посольство из степи"
 mkn_crisis.20.d:0 "Ревком Вольной территории предлагает зерновые поставки и взаимный военный транзит. Он просит локомотивы, помощь диспетчеров и железнодорожное соединение. Принятие первого соглашения не создаёт альянса или протектората."
 mkn_crisis.21.t:0 "Харьков открывает разъезды"
 mkn_crisis.21.d:0 "Советские республики приняли взаимный транзит. Наши инженеры теперь могут подготовить железнодорожное соединение через контролируемую общую границу, после чего начнутся два года сотрудничества в снабжении."
 mkn_crisis.22.t:0 "Советские ворота остаются закрытыми"
 mkn_crisis.22.d:0 "Делегация вернулась с вежливыми словами, но без соглашения. Мы сохраняем независимость и можем возобновить переговоры через решение."
 mkn_crisis.23.t:0 "Общий антиимпериалистический фронт?"
 mkn_crisis.23.d:0 "Вольная территория предлагает равноправный оборонительный союз против ЛитБела и имперской Германии. Её советы сохранят собственную администрацию и вооружённые силы. Примем ли мы предложение?"
 mkn_crisis.24.t:0 "Общий фронт подписан"
 mkn_crisis.24.d:0 "Советское правительство приняло нас в общий оборонительный фронт. Наш флаг по-прежнему реет над съездом; следующий вопрос — переживёт ли равноправие свою письменную хартию."
 mkn_crisis.25.t:0 "Общего фронта не будет"
 mkn_crisis.25.d:0 "Советское правительство отказало в союзе. Наши советы остаются независимыми, а посланники смогут повторить предложение, когда обстоятельства изменятся."
 mkn_crisis.30.t:0 "Чёрный флаг над заводскими воротами"
 mkn_crisis.30.d:0 "Листовки из Вольной территории всю ночную смену переходили из рук в руки. Рабочие требуют выборных комитетов мастерских и угрожают шестьюдесятью днями стачек. Мы можем переждать остановку или потратить политический капитал на подавление."
 mkn_crisis.40.t:0 "Роковой пленум"
 mkn_crisis.40.d:0 "Делегаты Вольной территории представили пленуму хартию автономии. Она требует равноправного суверенитета в общем фронте: никаких назначенных губернаторов, реквизиций без согласия и иностранной оккупации. Мы можем ратифицировать равноправие или изгнать территорию и навязать подчинение войной."
 mkn_crisis.41.t:0 "Хартия равных"
 mkn_crisis.41.d:0 "Пленум принял хартию. Наши советы сохраняют свою администрацию и суверенитет в общем фронте. На этот раз революционное обещание дошло до протокола без искажений."
 mkn_crisis.42.t:0 "Преданы дважды"
 mkn_crisis.42.d:0 "Посланники задержаны. За границей советские колонны идут к станциям, которые сами помогли соединить. Союз разорван, война началась. На съезде старый повстанец открывает зерновую книгу и пишет поперёк неё одно слово: предательство. Целый год каждое село будет давать на него ответ."
 mkn_crisis.1.a:0 "Приспустить чёрный флаг. Созвать делегатов."
 mkn_crisis.100.a:0 "Удержать свою землю."
 mkn_crisis.20.a:0 "Открыть транзит и переговоры о снабжении."
 mkn_crisis.20.b:0 "Мы не заключим такого соглашения."
 mkn_crisis.21.a:0 "Пусть диспетчеры приступают к работе."
 mkn_crisis.22.a:0 "Житница остаётся нашей."
 mkn_crisis.23.a:0 "Принять равноправных союзников."
 mkn_crisis.23.b:0 "Отказаться от фронта."
 mkn_crisis.24.a:0 "Ратифицировать общую оборону."
 mkn_crisis.25.a:0 "Придётся опираться на себя."
 mkn_crisis.30.a:0 "Переждать остановку."
 mkn_crisis.30.b:0 "Разгромить стачечные комитеты."
 mkn_crisis.40.a:0 "Ратифицировать равноправную автономию."
 mkn_crisis.40.b:0 "Изгнать их. Принудить к подчинению."
 mkn_crisis.40.c:0 "Переговоры стали невозможны."
 mkn_crisis.41.a:0 "Пусть хартия висит над каждым столом."
 mkn_crisis.42.a:0 "Они не найдут беззащитного села."
 mkn_news.1.t:0 "Чёрный флаг приспущен: смерть Нестора Махно"
 mkn_news.1.d:0 "В Гуляйполе Нестор Махно лежит в гробу под чёрным флагом. Гроб установлен на простых досках в зале, где сельские делегаты когда-то спорили с ним до рассвета. Железнодорожники принесли паровозный свисток; крестьянка оставила хлеб рядом с его потёртой шапкой. Церковные колокола не отсчитывают час. Это делают станционные гудки.\n\nПо всей украинской степи смерть основателя оставляет тишину, которую каждая фракция надеется заполнить. Штаб Тратишова говорит о дисциплине, вольные советы Волина — о нерушимом обещании; сельские делегаты считают зерно, красные комитеты — винтовки. Жизнь Махно окончена. Спор о том, чем должна стать его революция, — нет. Иностранные канцелярии следят за похоронной процессией, гадая, долго ли чёрный флаг останется единым знаменем."
 mkn_news.1.a:0 "Батько ушёл. Коммуны остаются."
 mkn_news.1.b:0 "Будущее степи теперь в руках советов."
 mkn_news.1.c:0 "Внимательно следить за преемственностью."
 mkn_news.1.e:0 "Ещё один тревожный рассвет над степью."
