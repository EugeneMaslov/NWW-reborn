 MKN_fascism_successor_desc:0 "Дмитрук Тратишов возглавляет анархо-милитаристов Чёрного штаба. Он обещает связать вольные отряды единым командованием, подчинить мастерские фронту и удержать территорию силой. Его власть требует подготовленного съезда и поддержки не менее 40% населения; армейская дисциплина не заменяет политического мандата."
 MKN_democratic_successor_desc:0 "Волин выступает от имени отзывных местных делегатов и свободных объединений."
 MKN_neutrality_successor_desc:0 "Выборный совет сёл управляет без монарха и постоянной городской бюрократии."
 MKN_communism_successor_desc:0 "Революционный комитет координирует самостоятельную государственно-социалистическую администрацию."
