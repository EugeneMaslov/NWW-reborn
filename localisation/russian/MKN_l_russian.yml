l_russian:
 MKN_congress_1936:0 "Съезд 1936 года"
 MKN_congress_1936_desc:0 "В зале пахнет мокрыми шинелями и типографской краской. Махно ещё способен заставить его замолчать одним взглядом, но никто не верит, что это будет длиться вечно. Дадим делегатам мандат и вынесем спор штаба Тратишова с советами Волина на съезд."
 MKN_question_of_supply:0 "Вопрос снабжения"
 MKN_question_of_supply_desc:0 "Винтовку не накормишь резолюцией. Коммуны проверят запасы зерна, боеприпасов и железнодорожные поставки; вольные советы усилят влияние на общее военное дело."
 MKN_question_of_discipline:0 "Вопрос дисциплины"
 MKN_question_of_discipline_desc:0 "Приказы умирают на пути из зала съезда в окопы. Штаб согласует движение колонн и работу складов, даже если делегаты назовут это первым камнем нового государства."
 MKN_departure_of_batko:0 "Уход Батько"
 MKN_departure_of_batko_desc:0 "Этот фокус завершается событием смерти Махно. Его гроб закрывает эпоху, но не спор. У нас 180 дней на решение вопроса о преемственности, прежде чем степь расколется на вооружённые лагеря."
 MKN_military_takes_charge:0 "Военные берут власть"
 MKN_military_takes_charge_desc:0 "Тратишов расстилает железнодорожную карту на столе съезда. Революции нужно единое оперативное командование. При поддержке не менее 40% населения и подготовленном съезде правящей программой станет анархо-милитаризм."
 MKN_arrest_demagogues:0 "Арестовать демагогов"
 MKN_arrest_demagogues_desc:0 "Штаб опечатывает фракционные типографии и задерживает организаторов соперничающих командований. Жестокое урегулирование останавливает 180-дневный отсчёт до гражданской войны."
 MKN_abolish_election_of_commanders:0 "Отменить выборность командиров"
 MKN_abolish_election_of_commanders_desc:0 "Бой не может ждать голосования об отзыве. Упраздним баланс сил и закрепим власть военных в существующей армейской организации: постоянный штаб улучшит планирование и сплочённость."
 MKN_militarize_communes:0 "Милитаризовать коммуны"
 MKN_militarize_communes_desc:0 "Каждая коммуна будет держать призывной список рядом с зерновой книгой. Расширим набор, заплатив за это новым ударом по доверию общин."
 MKN_standardize_workshops:0 "Стандартизировать мастерские"
 MKN_standardize_workshops_desc:0 "Дюжина несовместимых затворов — дюжина способов проиграть бой. Общие калибры и согласованные заказы повысят выпуск и эффективность производства в артелях."
 MKN_iron_fist_trains:0 "Железный кулак на рельсах"
 MKN_iron_fist_trains_desc:0 "Бронепоезда понесут волю штаба за горизонт. Сохраним культ железных дорог, ускорим изучение поездов и уменьшим потребности армии в снабжении."
 MKN_black_expansionism:0 "Чёрный экспансионизм"
 MKN_black_expansionism_desc:0 "Граница, проведённая канцелярией, не священна. Откроем пограничные столкновения с ЛитБелом и советскими республиками там, где наши территории действительно соприкасаются."
 MKN_the_black_horde:0 "Чёрная орда"
 MKN_the_black_horde_desc:0 "Под чёрным знаменем поднимаются штыки. Армия получит 25% к атаке и 30% к прорыву; независимые соседи вне нашего альянса станут целями аннексии. Штаб обещает свободу в конце каждого похода."
 MKN_triumph_of_free_soviets:0 "Торжество вольных советов"
 MKN_triumph_of_free_soviets_desc:0 "Волин спрашивает делегатов, кто дал штабу право править. При подготовленном съезде и поддержке не менее 40% анархо-коммунизм станет правящей программой местных советов с отзывными делегатами."
 MKN_pact_of_free_communes:0 "Пакт вольных коммун"
 MKN_pact_of_free_communes_desc:0 "Коммуны обязуются разрешать споры без создания соперничающих армий. Ратификация остановит отсчёт до гражданской войны и восстановит доверие к коллективному управлению."
 MKN_abolish_general_staff:0 "Упразднить генеральный штаб"
 MKN_abolish_general_staff_desc:0 "Штаб станет техническим бюро, подотчётным коммунам. Закрепим полный контроль советов на шкале баланса сил и улучшим взаимодействие местных боевых отрядов."
 MKN_arms_to_the_people:0 "Оружие народу"
 MKN_arms_to_the_people_desc:0 "Выдадим винтовки из общих складов и сформируем три оснащённых отряда коммунальной гвардии. Расширенная система набора сделает каждое село ответственным за свою оборону."
 MKN_black_international:0 "Чёрный интернационал"
 MKN_black_international_desc:0 "После ухода Батьки общий Чёрный Интернационал станет опорой внешней политики при любом правительстве. Открывает четыре приглашения иностранных специалистов, набор добровольцев и общую ветку представительств, хозяйственных соглашений и зарубежного Набата."
 MKN_propaganda_by_deed:0 "Пропаганда действием"
 MKN_propaganda_by_deed_desc:0 "Погасшая печь говорит громче манифеста. Откроем сети стачек в соседних странах; их правительства должны будут переждать остановку производства или заплатить за её подавление."
 MKN_autonomous_rail_crews:0 "Самоуправляемые железнодорожные бригады"
 MKN_autonomous_rail_crews_desc:0 "Расписание принадлежит тем, кто обеспечивает движение. Рабочие бригады снизят стоимость поездов и ускорят строительство железных дорог и инфраструктуры."
 MKN_beacon_of_statelessness:0 "Маяк безгосударственности"
 MKN_beacon_of_statelessness_desc:0 "Они могут занять станцию, но не сельский сход за ней. Получим ещё 35% к защите национальной территории и 75% к урону вражеским гарнизонам на нашей оккупированной земле."
 MKN_peasant_delegates:0 "Крестьянские делегаты"
 MKN_peasant_delegates_desc:0 "Новая корона не заменит шапку Батько. Избранный совет сёл возьмёт на себя ответственность за житницу. Аграрный изоляционизм требует подготовленного съезда и поддержки не менее 40%."
 MKN_grain_ultimatum:0 "Зерновой ультиматум"
 MKN_grain_ultimatum_desc:0 "Сёла прокормят общую оборону, но никогда — четыре соперничающих штаба. Их ультиматум разрешит вопрос преемственности и остановит отсчёт до гражданской войны."
 MKN_sever_urban_ties:0 "Разорвать связи с городом"
 MKN_sever_urban_ties_desc:0 "Закроем экспортные книги и распустим соперничающие делегации. Упраздним баланс сил, введём закрытую экономику и оставим больше продукции сёлам."
 MKN_every_farm_a_fortress:0 "Каждый хутор — крепость"
 MKN_every_farm_a_fortress_desc:0 "Подвалы станут складами боеприпасов, изгороди скроют огневые позиции. Построим два уровня сухопутных укреплений вдоль границ принадлежащих нам и контролируемых нами областей."
 MKN_steppe_snipers:0 "Степные снайперы"
 MKN_steppe_snipers_desc:0 "Борозда, терпеливый взгляд и один выстрел. Улучшим защиту и разведку, уменьшив преимущество противника от господства в воздухе."
 MKN_railway_sabotage:0 "Железнодорожные диверсии"
 MKN_railway_sabotage_desc:0 "Подготовим заряды до приказа об отступлении. Откроем намеренное разрушение инфраструктуры и железных дорог в пограничных областях под угрозой; ремонт займёт больше времени."
 MKN_cavalry_ambush:0 "Кавалерийская засада"
 MKN_cavalry_ambush_desc:0 "Тачанки ждут за холмом, их лошади тихо стоят во ржи. Добавим общему армейскому духу 30% к атаке кавалерийских и моторизованных батальонов."
 MKN_impregnable_granary:0 "Неприступная житница"
 MKN_impregnable_granary_desc:0 "Захватчику не достанется лёгкой жатвы. Получим ещё 50% к защите национальной территории и увеличим вражеские потери от истощения на нашей земле на 40%."
 MKN_emergency_revkom:0 "Чрезвычайный ревком"
 MKN_emergency_revkom_desc:0 "Красные делегаты требуют администрации, способной пережить своего основателя. При подготовленном съезде и поддержке не менее 40% государственный социализм станет правящей программой."
 MKN_purge_irreconcilables:0 "Устранить непримиримых"
 MKN_purge_irreconcilables_desc:0 "Ревком прикажет каждому вооружённому комитету сдать оружие и списки. Разрешим вопрос преемственности и остановим 180-дневный отсчёт."
 MKN_embassy_to_kharkov:0 "Посольство в Харьков"
 MKN_embassy_to_kharkov_desc:0 "Упраздним баланс сил и отправим делегацию в советские республики. Первое предложение предусматривает взаимный военный транзит и обмен зерна на снабжение; Харьков вправе отказать."
 MKN_integrate_steel_lines:0 "Объединить стальные магистрали"
 MKN_integrate_steel_lines_desc:0 "С согласия советской стороны и при контролируемой общей границе построим железнодорожное соединение второго уровня. Получим десять локомотивов и два года помощи в организации снабжения."
 MKN_red_military_specialists:0 "Красные военные специалисты"
 MKN_red_military_specialists_desc:0 "Прибывшие инструкторы привезут штатные таблицы, а не проповеди. Улучшим сплочённость и планирование армии, получим опыт и освоение сухопутной доктрины."
 MKN_tractors_for_grain:0 "Тракторы за зерно"
 MKN_tractors_for_grain_desc:0 "Зерновой договор даст нам станки вместе с тракторами. Получим бонусы к промышленным исследованиям, два военных завода и улучшение строительства."
 MKN_anti_imperialist_front:0 "Антиимпериалистический фронт"
 MKN_anti_imperialist_front_desc:0 "Предложим оборонительный союз против имперских дворов ЛитБела и Германии. Советское правительство должно дать согласие; ни одна чужая страна не вступит без собственного решения."
 MKN_the_fatal_plenum:0 "Роковой пленум"
 MKN_the_fatal_plenum_desc:0 "Последняя хартия ставит наши автономные советы рядом с советским правительством на равных. Харьков может ратифицировать её — или изгнать нас из общего фронта и вторгнуться. Преданная революция будет сражаться с временным духом «Преданы дважды»."
 MKN_decaying_batko:0 "Угасающий Батько"
 MKN_decaying_batko_desc:0 "Ухудшение здоровья основателя стало болезнью самой революции. Приказы запаздывают, советы ссорятся, походные колонны теряют сплочённость. Этот дух исчезнет со смертью Махно."
 MKN_steppes_freedom:0 "Свобода степей"
 MKN_steppes_freedom_desc:0 "Быстрая кавалерия и моторизованные колонны опираются на местное снабжение. Пять последовательных промышленных реформ снимают штраф разрозненных мастерских к выпуску продукции, каждый раз улучшая общий экономический дух на пять процентных пунктов."
 MKN_cult_of_railways:0 "Культ железных дорог"
 MKN_cult_of_railways_desc:0 "Рельсы связывают разрозненные коммуны в сражающуюся территорию. Бронепоезда дешевле на 35%, железнодорожные орудия — на 25%, а их обстрел эффективнее на 25%; строительство железных дорог и узлов снабжения ускорено на 35%."
 MKN_autonomous_rail_crews_idea:0 "Самоуправляемые железнодорожные бригады"
 MKN_autonomous_rail_crews_idea_desc:0 "Выборные бригады обмениваются чертежами и инструментами. Все поезда дешевле на 25%; строительство железных дорог и инфраструктуры ускорено на 25% и 20%."
 MKN_soviet_supply_agreement:0 "Советское соглашение о снабжении"
 MKN_soviet_supply_agreement_desc:0 "Совместные диспетчеры и снабженцы будут координировать поставки в течение двух лет."
 MKN_neighbor_strikes:0 "Стачки под чёрным знаменем"
 MKN_neighbor_strikes_desc:0 "Печи остывают, пока рабочие обсуждают листовку из Вольной территории. Выпуск продукции и строительство замедлятся на шестьдесят дней."
 MKN_betrayed_twice:0 "Преданы дважды"
 MKN_betrayed_twice_desc:0 "Они обещали общий фронт, а привели оккупационную армию. В течение года советы и бойцы будут вместе противостоять предательству."
 MKN_anarcho_militarism:0 "Анархо-милитаризм"
 MKN_anarcho_communism:0 "Анархо-коммунизм"
 MKN_agrarian_isolationism:0 "Аграрный изоляционизм"
 MKN_state_socialism:0 "Государственный синдикализм"
 MKN_power_balance:0 "Штаб и вольные советы"
 MKN_power_balance_desc:0 "Оперативное командование Тратишова и советы Волина с отзывными делегатами спорят о власти. Доля контроля стороны равна (1 ± значение баланса) / 2; середина означает 45–55% контроля для каждой стороны."
 MKN_bop_decisions_category:0 "Мандат Вольной территории"
 MKN_bop_decisions_category_desc:0 "Три повторяемых решения за 50 политической власти меняют баланс сил. Принятая хартия полного контроля советов запрещает дальнейшие изменения."
 MKN_succession_crisis_category:0 "После Батько"
 MKN_succession_crisis_category_desc:0 "Похороны окончены; спор только начался. Завершите фокус урегулирования до истечения срока задания."
 MKN_steppe_operations_category:0 "За околицей"
 MKN_steppe_operations_category_desc:0 "Железнодорожные бригады, добровольцы и подпольщики выносят борьбу коммуны за пределы её полей."
 MKN_empower_atamans:0 "Усилить атаманов"
 MKN_empower_atamans_desc:0 "За 50 политической власти сдвиньте баланс на 0,15 к военному командованию. Можно повторить через 60 дней."
 MKN_convene_local_communes:0 "Созвать местные коммуны"
 MKN_convene_local_communes_desc:0 "За 50 политической власти сдвиньте баланс на 0,15 к вольным советам. Можно повторить через 60 дней."
 MKN_joint_defence_congress:0 "Общий оборонительный съезд"
 MKN_joint_defence_congress_desc:0 "За 50 политической власти сдвиньте баланс на 0,10 к центру, не пересекая его. Можно повторить через 90 дней."
 MKN_civil_war_timer_mission:0 "Степь на краю пропасти"
 MKN_civil_war_timer_mission_desc:0 "У нас 180 дней, чтобы завершить «Арестовать демагогов», «Пакт вольных коммун», «Зерновой ультиматум» или «Устранить непримиримых». Одной смены правящей партии недостаточно. Если время истечёт, соперничающие лагеря разделят области и вооружённые силы по долям поддержки населения, с округлением до целых областей и минимальной территорией для каждого лагеря."
 MKN_recruit_international_volunteers:0 "Принять иностранных добровольцев"
 MKN_recruit_international_volunteers_desc:0 "За 50 политической власти примем 5000 добровольцев и 500 винтовок. Можно повторять каждые 90 дней, пока резерв людских ресурсов меньше 100 000."
 MKN_strike_networks:0 "Организовать стачки в [From.GetNameDef]"
 MKN_strike_networks_desc:0 "За 75 политической власти отправим призыв к стачке. Цель может переждать шестьдесят дней сбоев или потратить 50 политической власти и потерять 5% стабильности для подавления."
 MKN_scorched_railways:0 "Уничтожить пути в области [From.GetName]"
 MKN_scorched_railways_desc:0 "За 25 политической власти повредим два уровня инфраструктуры и железных дорог в этой области под угрозой. Ремонт замедлится на 50%. Повреждения сохранятся после смены контроля."
 MKN_clash_LTB:0 "Рейд на границу ЛитБела: [From.GetName]"
 MKN_clash_LTB_desc:0 "За 50 политической власти начнём настоящий пограничный бой. Победа передаст спорную область; обе страны должны быть в мире, а граница — общей и контролируемой."
 MKN_clash_SOV:0 "Рейд на советскую границу: [From.GetName]"
 MKN_clash_SOV_desc:0 "За 50 политической власти начнём настоящий пограничный бой. Победа передаст спорную область; обе страны должны быть в мире и не состоять в одном альянсе."
 MKN_renew_supply_talks:0 "Возобновить зерновые переговоры"
 MKN_renew_supply_talks_desc:0 "Попросим Харьков пересмотреть вопрос взаимного транзита и снабжения."
 MKN_renew_front_talks:0 "Возобновить переговоры о фронте"
 MKN_renew_front_talks_desc:0 "Попросим советские республики пересмотреть вопрос общего оборонительного союза."
 MKN_military_command_side:0 "Военный штаб — Тратишов"
 MKN_free_soviets_side:0 "Вольные советы — Волин"
 MKN_bop_total_military:0 "Штаб командует всем"
 MKN_bop_militarist_lean:0 "Перевес атаманов"
 MKN_bop_balanced:0 "Съезд удерживает равновесие"
 MKN_bop_soviet_lean:0 "Перевес коммун"
 MKN_bop_total_soviets:0 "Вся власть вольным советам"
 MKN_crisis_enabled:0 "Действует система преемственности 1936 года"
 MKN_crisis_settled:0 "Кризис преемственности разрешён"
 MKN_crisis_active:0 "Идёт отсчёт срока урегулирования"
 MKN_collapse_started:0 "Вольная территория распалась"
 MKN_crisis_legacy_settled:0 "Сохранено прежнее политическое урегулирование"
 MKN_bop_locked:0 "Вольные советы получили постоянные полномочия"
 MKN_soviet_trade_accepted:0 "Харьков принял соглашение о снабжении"
 MKN_soviet_front_pending:0 "Харьков рассматривает предложение общего фронта"
 MKN_plenum_pending:0 "Харьков рассматривает равноправную автономию"
 MKN_equal_autonomy:0 "Равноправная автономия ратифицирована"
 MKN_soviet_betrayal:0 "Советское правительство предало хартию"
 MKN_border_clash_active:0 "Идёт пограничное столкновение"
