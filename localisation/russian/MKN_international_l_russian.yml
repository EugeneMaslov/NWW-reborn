l_russian:
 mkn_expropriate_funds_operation:0 "Экспроприировать зарубежные средства"
 mkn_expropriate_funds_operation_desc:0 "Одна попытка против каждой иностранной европейской страны или Турции, включая провал и отмену. Нужны один оперативник, сила сети выше 30 и гражданские разведданные выше 20%; расходуются 200 ед. пехотного снаряжения, выполнение занимает 45 дней. Богатство определяется числом гражданских фабрик при запуске."
 MKN_valid_expropriation_target:0 "Допустимая европейская или турецкая цель, против которой ещё не запускалась экспроприация."
 MKN_expropriation_outcomes_tt:0 "§GУспех — 80%§!. Награда зависит от числа гражданских фабрик при запуске:\n§Y0–14§!: 25 ПВ, 300 ед. пехотного снаряжения, 1 внекартовая гражданская фабрика.\n§Y15–39§!: 50 ПВ, 500 ед. пехотного снаряжения, 2 внекартовые гражданские фабрики.\n§Y40+§!: 75 ПВ, 750 ед. пехотного снаряжения, 3 внекартовые гражданские фабрики.\nПервый срок — §Y180 дней§!. Новый успех во время действия духа добавляет фабрики и §Y90 дней к оставшемуся сроку§!. Все арендованные фабрики снимаются вместе по истечении срока.\n§RПровал — 20%§!: потеря 50 ПВ; цель получает цель войны на 60 дней, если ещё не имеет её и не воюет с нами. §YОдна попытка на страну; отмена также расходует попытку.§!"
 mkn_expropriation_infiltrate:0 "Разведать банк"
 mkn_expropriation_infiltrate_desc:0 "Оперативник привлекает местных сочувствующих, изучает смену караула и выбирает подходящую перевозку ценностей."
 mkn_expropriation_infiltrate_outcome:0 "Конспиративные квартиры и надёжное расписание подготовлены."
 mkn_expropriation_open_vault:0 "Захватить средства"
 mkn_expropriation_open_vault_desc:0 "Группа атакует хранилище или охраняемую перевозку, используя поддельные приказы и короткий решительный натиск."
 mkn_expropriation_open_vault_outcome:0 "Группа пытается овладеть ценностями до прибытия подкреплений."
 mkn_expropriation_escape:0 "Исчезнуть за границей"
 mkn_expropriation_escape_desc:0 "Ложные следы и связи на железной дороге прикроют отход. Лишь после эвакуации станет ясно, удалась ли экспроприация."
 mkn_expropriation_escape_outcome:0 "Уцелевшие участники покидают страну; поступает итоговый отчёт."
 MKN_expropriated_funds:0 "Экспроприированные средства"
 MKN_expropriated_funds_desc:0 "Зарубежные экспроприации оплачивают заказы независимым мастерским. Успешные налёты на разные страны суммируют аренду фабрик; каждый следующий успех во время её действия добавляет девяносто дней."
 MKN_expropriated_funds_factories_tt:0 "Арендованные внекартовые гражданские фабрики: §G+[?MKN_expropriation_factories|0]§!. Все снимаются по истечении срока духа."
 mkn_black_international_category:0 "Чёрный интернационал"
 mkn_black_international_category_desc:0 "Иностранных товарищей можно принять после фокуса «Чёрный интернационал» в синдикалистской или аграрной программе. Каждая группа стоит 50 единиц политической власти и принимается лишь один раз."
 MKN_welcome_cnt_fai_exiles:0 "Принять испанских изгнанников НКТ–ФАИ"
 MKN_welcome_cnt_fai_exiles_desc:0 "Предоставим убежище испанским анархистам, изгнанным репрессиями. Буэнавентура Дуррути станет генералом 4-го уровня — специалистом по городским штурмам, горным боям и диверсионным действиям."
 MKN_buenaventura_durruti:0 "Буэнавентура Дуррути"
 MKN_harbor_spartacist_engineers:0 "Укрыть немецких инженеров-спартаковцев"
 MKN_harbor_spartacist_engineers_desc:0 "Инженеры, спасающиеся от политического преследования, организуют оружейную мастерскую: одна вне-картовая военная фабрика на 180 дней."
 MKN_spartacist_engineers:0 "Мастерская спартаковцев"
 MKN_spartacist_engineers_desc:0 "Немецкие специалисты создали временный кооператив по выпуску вооружения."
 MKN_spartacist_factory_tt:0 "Вне-картовые военные фабрики: §G+1§! на время действия духа."
 MKN_accept_italian_mechanics:0 "Принять итальянских механиков-синдикалистов"
 MKN_accept_italian_mechanics_desc:0 "Итальянские организаторы мастерских делятся опытом работы с двигателями и ремонта машин. Даёт один общий бонус к исследованиям в 100% для моторизованного снаряжения или бронеавтомобилей."
 MKN_italian_mechanics_bonus:0 "Итальянские механики-синдикалисты"
 MKN_smuggle_kronstadt_sailors:0 "Тайно переправить кронштадтских моряков"
 MKN_smuggle_kronstadt_sailors_desc:0 "Переправим оппозиционно настроенных моряков и их семьи на вольную территорию тайными балтийскими маршрутами. Даёт 10 000 людских ресурсов и 15 единиц опыта флота."
 MKN_memory_of_atamansha_marusya:0 "Памяти атаманши Маруси"
 MKN_memory_of_atamansha_marusya_desc:0 "Маруся Никифорова превратила дерзость и инициативу в оружие повстанцев. Сохраним её наследие в постоянной подготовке к уличным боям, прорывам и быстрому восстановлению сил."
 MKN_marusyas_legacy:0 "Наследие Маруси"
 MKN_marusyas_legacy_desc:0 "Память о Марусе вдохновляет штурмовые группы, способные прорвать оборону улицы и перегруппироваться прежде, чем противник придёт в себя."
 MKN_marusya_urban_attack_tt:0 "Атака в городе: §G+15%§! для боевых сухопутных батальонов."
 MKN_marusya_assault_training:0 "Городская штурмовая подготовка Маруси"
 MKN_marusya_assault_training_desc:0 "Специальная штурмовая подготовка, предоставляемая национальным духом «Наследие Маруси»."
 MKN_the_black_guard_battalions:0 "Батальоны Чёрной гвардии"
 MKN_the_black_guard_battalions_desc:0 "Сформируем в Гуляйполе два ветеранских штурмовых отряда. В каждом — девять пехотных и два артиллерийских батальона, сапёры, разведка и полевой госпиталь. Элитный шаблон нельзя редактировать или набирать вручную. Гуляйполе должно принадлежать нам и быть под нашим контролем; необходимо исследовать все три технологии рот поддержки."
 MKN_marusya_shock_detachment:0 "Штурмовой отряд Маруси"
 MKN_marusya_guard_1:0 "1-й штурмовой отряд Маруси"
 MKN_marusya_guard_2:0 "2-й штурмовой отряд Маруси"
 mkn_espionage.1.t:0 "Анархисты ограбили центральный банк!"
 mkn_espionage.1.d:0 "Согласованный налёт лишил одну из перевозок центрального банка наличности и ценных бумаг. Налётчики оставили анархистские листовки и скрылись по цепочке конспиративных квартир. Следователи связывают организацию налёта с махновской вольной территорией. Выручка уже вне нашей досягаемости."
 mkn_espionage.1.a:0 "Найти виновных."
 mkn_espionage.2.t:0 "Налёт анархистов на банк сорван!"
 mkn_espionage.2.d:0 "Силы безопасности перехватили группу анархистов, готовившую захват банковских ценностей. Изъятые документы связывают операцию с махновской вольной территорией. Доказательства дают нам временное обоснование военных действий; уже имеющаяся цель войны сохраняется."
 mkn_espionage.2.a:0 "Они ответят за это."
 mkn_news.10.t:0 "Перестрелка у Рейхсбанка"
 mkn_news.10.d:0 "Поддельное распоряжение о переводе средств провело махновских налётчиков во двор Рейхсбанка. Когда служащий поднял тревогу, между тележками с ценностями завязалась перестрелка. Налётчики ушли на угнанном грузовике с наличностью и ценными бумагами. Берлину предстоит объяснить, как иностранные анархисты проникли в финансовое сердце страны."
 mkn_news.10.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.11.t:0 "Исчезнувший груз Банка Англии"
 mkn_news.11.d:0 "Груз Банка Англии исчез после того, как люди в казённой форме перенаправили охрану в служебный тоннель Лондона. В брошенном бронированном фургоне нашли лишь пустые ящики и чёрный флаг. Следствие подозревает, что махновская сеть вывезла средства через портовые связи прежде, чем тревога дошла до гаваней."
 mkn_news.11.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.12.t:0 "Взлом хранилища в Париже"
 mkn_news.12.d:0 "Анархисты проникли в банковское хранилище Парижа через подвал соседней мастерской. Ночью они прорезали стену, скрыв шум инструментов за строительными работами. К утру переносимые ценные бумаги исчезли. Послание о передаче денег вольным коммунам связало дерзкий взлом с махновскими оперативниками."
 mkn_news.12.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.13.t:0 "Засада на итальянский казначейский конвой"
 mkn_news.13.d:0 "Перекрытая дорога и поддельное извещение о железнодорожном объезде заманили итальянский казначейский конвой в ловушку под Римом. Налётчики захватили сейфовые ящики и рассеялись по маршрутам снабжения мастерских прежде, чем охрана перестроилась. Чёрные знамёна и перехваченная переписка указывают на махновскую группу с местными помощниками."
 mkn_news.13.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.14.t:0 "Венские кассиры обнаружили пустое хранилище"
 mkn_news.14.d:0 "Сотрудники венского банка открыли хранилище и обнаружили аккуратно запечатанные ящики с железным ломом. Ложная инспекционная группа подменила содержимое во время планового перевода. Власти полагают, что махновские агенты вывезли настоящие резервы в хозяйственных повозках, пока охрана следила не за теми дверями."
 mkn_news.14.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.15.t:0 "Опустошена балтийская расчётная палата"
 mkn_news.15.d:0 "Поддельные расчётные документы позволили анархистским курьерам забрать крупную партию ценностей из балтийского банковского депо. Обман раскрылся лишь с прибытием настоящих получателей. Полиция обыскивает станции и склады по всему региону; организаторы уже объявили деньги взносом в махновские вольные коммуны."
 mkn_news.15.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.16.t:0 "Захват банковского перевода в Варшаве"
 mkn_news.16.d:0 "Казначейская перевозка в Варшаве закончилась на складе людей с поддельными полицейскими удостоверениями. Охрану разоружили, средства перегрузили в гражданские грузовики, а склад подожгли, уничтожая следы. Найденные рядом листовки называют налёт экспроприацией в поддержку махновских коммун."
 mkn_news.16.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.17.t:0 "Уведён советский казначейский поезд"
 mkn_news.17.d:0 "Ложные диспетчерские распоряжения вывели советский казначейский вагон на тихий разъезд. Вооружённые экспроприаторы перерезали телеграф и захватили груз. Локомотив нашли спустя несколько часов, но деньги исчезли. Улики о причастности махновцев превратили постыдный железнодорожный провал в международный инцидент."
 mkn_news.17.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.18.t:0 "Чёрные флаги над украинским почтовым поездом"
 mkn_news.18.d:0 "Украинский почтовый поезд с банковскими резервами остановила ложная сигнальная бригада. Налётчики в масках отцепили казначейский вагон и увели его заранее поданным локомотивом. Пассажиров оставили невредимыми возле чёрного флага, а резервы исчезли на путях, ведущих к махновской вольной территории."
 mkn_news.18.a:0 "Чёрный интернационал наносит новый удар."
 mkn_news.19.t:0 "Исчез катер с резервами в Стокгольме"
 mkn_news.19.d:0 "Катер со шведскими банковскими резервами исчез среди островов у Стокгольма. Ложный портовый патруль направил его в уединённую бухту, где экспроприаторы перенесли сейфовые ящики на рыболовное судно. На пустом катере нашли анархистские воззвания; власти подозревают махновскую морскую сеть эвакуации."
 mkn_news.19.a:0 "Чёрный интернационал наносит новый удар."
 MKN_mobile_patrols:0 "Тачаночные дозорные колонны"
 MKN_mobile_patrols_desc:0 "Рассредоточенные дозоры быстро перемещаются, но требуют дополнительного снабжения."
 MKN_seed_cooperatives:0 "Общинные семенные кооперативы"
 MKN_seed_cooperatives_desc:0 "Общие резервы и устойчивое расписание мастерских смягчают гражданский дефицит."
 MKN_extra_workshop_shifts:0 "Реквизированные смены мастерских"
 MKN_extra_workshop_shifts_desc:0 "Выпуск вооружения растёт, пока общины несут дополнительные гражданские обязательства."
 MKN_recallable_front_delegates:0 "Отзывные фронтовые делегаты"
 MKN_recallable_front_delegates_desc:0 "Постоянный обмен между деревнями и частями улучшает восстановление, но требует политических усилий."
 MKN_tachanka_patrols:0 "Вывести тачанки в степные дозоры"
 MKN_tachanka_patrols_desc:0 "Расширим полномочия полевых командиров для патрулирования степи. Подвижность и поддержка войны растут вместе с расходами снабжения и общественным недовольством."
 MKN_communal_seed_reserves:0 "Объединить общинные семенные резервы"
 MKN_communal_seed_reserves_desc:0 "Поручим сельским сходам согласовать запасы семян и заказы мастерским. Усиливает советы и хозяйственную кооперацию, снижая военный энтузиазм."
 MKN_requisition_workshop_shifts:0 "Реквизировать дополнительные смены мастерских"
 MKN_requisition_workshop_shifts_desc:0 "Командиры требуют от мастерских больше оружия. Военное производство растёт ценой стабильности и гражданского потребления."
 MKN_reconcile_village_and_front:0 "Примирить деревню и фронт"
 MKN_reconcile_village_and_front_desc:0 "Направим отзывных деревенских делегатов в части. Приближает баланс к центру, обобщает военный опыт и улучшает восстановление ценой политических усилий."
 MKN_black_international_decisions_unlock_tt:0 "Открывает четыре одноразовых приглашения Чёрного интернационала: испанские анархисты, немецкие инженеры, итальянские механики и кронштадтские моряки."
 MKN_heist_unused_tt:0 "Против этой страны ещё не запускалась операция экспроприации."
