 MKN_bop_category:0 "Мандат Вольной территории"
 MKN_bop_category_desc:0 "Расходуйте политическую власть для изменения баланса командования и коммун. Решения повторяются после восстановления; аграрный путь упраздняет эту борьбу."
 MKN_moscow_request_pending:0 "Предложение ожидает ответа Москвы"
 MKN_moscow_betrayal:0 "Москва предала предложенный компромисс"
 MKN_moscow_alliance:0 "Оборонительный пакт с Москвой принят"
 MKN_bop_abandoned:0 "Аграрный съезд упразднил баланс сил"
 MKN_red_defence_pact:0 "Красный оборонительный пакт"
 mkn_bop.1.t:0 "Предложение Вольной территории"
 mkn_bop.1.d:0 "Государственные социалисты Вольной территории предлагают взаимную оборону, сохраняя местные советы и собственное правительство. Мы можем принять их как союзников, отказаться от соглашения или подготовить подчинение территории."
 mkn_bop.1.a:0 "Принять их как равноправных союзников."
 mkn_bop.1.b:0 "Подготовить подчинение территории."
 mkn_bop.1.c:0 "Отклонить предложение."
 mkn_bop.2.t:0 "Москва принимает пакт"
 mkn_bop.2.d:0 "Москва признала нашу самостоятельность в общем оборонительном пакте. Мы вступили в её альянс; управление Вольной территорией остаётся в наших руках."
 mkn_bop.2.a:0 "Утвердить соглашение."
 mkn_bop.3.t:0 "Предательство красного компромисса"
 mkn_bop.3.d:0 "В ответ на наше предложение Москва начала подготовку подчинения Вольной территории. Она получила цель войны против нас. Советам придётся организовать собственную оборону."
 mkn_bop.3.a:0 "Готовиться защищать самостоятельность."
 mkn_bop.4.t:0 "Москва отказывает"
 mkn_bop.4.d:0 "Союз не заключён. Нашим государственно-социалистическим учреждениям придётся действовать самостоятельно; последующий дипломатический фокус позволит повторить запрос, если переговоры ещё возможны."
 mkn_bop.4.a:0 "Продолжить внутреннюю программу."
 MKN_army_war_support_factor_tt:0 "Поддержка войны от армейских учреждений: §G+10%§!"
