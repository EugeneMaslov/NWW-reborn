 POL_institutional_politics_desc:0 "Выбранный путь требует учреждений и оплаченных решений. Взаимоисключающие проекты нельзя совместить; одновременно действует один проект."
 nww_pol.1.t:0 "Польша: непокорный буфер"
 nww_pol.1.d:0 "Независимость родилась в Великой смуте 1918–1922 годов. Галиция удержана, но Познань, Силезия и Данциг остаются германскими. У Польши нет порта и флота; германские инвестиции поддерживают заводы ценой зависимости. После смерти Пилсудского Замок и полковники спорят о будущем республики. Начните со «Смерти Маршала»: затем откроются подготовка, партийные кампании и четыре курса."
 nww_pol.1.a:0 "Республика должна выстоять."
 nww_pol.2.t:0 "Наследие Маршала"
 nww_pol.2.d:0 "Замок ищет соглашения с полковниками, Эндеция собирает национальные союзы, а рабочие Лодзи создают свои комитеты. Прогерманские прагматики предлагают обменять часть самостоятельности на безопасность. Выбор ещё не сделан: подготовьте движение, бюджетную комиссию и поддержку не менее 40%, прежде чем менять режим."
 nww_pol.2.a:0 "Республика должна выстоять."
 nww_pol.3.t:0 "Бюджетный компромисс"
 nww_pol.3.d:0 "Комиссия ослабила кризис Санации, но не разрешила спор о власти. Последнее слово остаётся за институтами выбранного режима. Нельзя одновременно обещать независимое Междуморье и политическое подчинение Берлину."
 nww_pol.3.a:0 "Республика должна выстоять."
 nww_pol.50.t:0 "Санация: президент и полковники"
 nww_pol.50.d:0 "Гражданская администрация работает, но вопрос о пределах военной власти остаётся открытым. Мосьцицкий требует отчётности перед Замком; полковники требуют свободы действий."
 nww_pol.50.a:0 "Президентский контроль бюджета (50 политической власти)"
 nww_pol.50.b:0 "Секретариат полковников (50 политической власти)"
 nww_pol.50.c:0 "Вернёмся к вопросу через решения."
 nww_pol.51.t:0 "Эндеция: государство и гражданство"
 nww_pol.51.d:0 "Национальный блок победил. Теперь предстоит решить, укреплять ли лояльность через гражданские учреждения или расширять принудительную администрацию."
 nww_pol.51.a:0 "Гражданская администрация меньшинств (50 политической власти)"
 nww_pol.51.b:0 "Принудительная администрация (50 политической власти)"
 nww_pol.51.c:0 "Вернёмся к вопросу через решения."
 nww_pol.52.t:0 "Сделка с Берлином: цена безопасности"
 nww_pol.52.d:0 "Таможенная комиссия готова к работе. Промышленники требуют облегчить транзит; военные настаивают на оборонных обязательствах. Союз с Германией всё ещё требует её согласия."
 nww_pol.52.a:0 "Польское транзитное управление (50 политической власти)"
 nww_pol.52.b:0 "Протокол оборонной координации (50 политической власти)"
 nww_pol.52.c:0 "Вернёмся к вопросу через решения."
 nww_pol.53.t:0 "Красная Висла: кому принадлежат советы?"
 nww_pol.53.d:0 "Гражданская война закончена. Местные советы требуют самостоятельности, а партийный аппарат — единого управления. Польская республика должна определить собственные институты."
 nww_pol.53.a:0 "Самоуправление местных советов (50 политической власти)"
 nww_pol.53.b:0 "Плановый комиссариат (50 политической власти)"
 nww_pol.53.c:0 "Вернёмся к вопросу через решения."
