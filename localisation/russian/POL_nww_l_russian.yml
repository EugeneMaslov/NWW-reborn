l_russian:
 POL_cop_plan:0 "План ЦИО"
 POL_cop_plan_desc:0 "Сосредоточим ограниченные средства на внутреннем промышленном округе, вдали от германских заводов.\n\nИзменение постоянной программы: Скорость строительства: +5%."
 POL_cop_plan_bonus_tt:0 "Скорость строительства: +5%."
 POL_industrial_census:0 "Промышленная перепись"
 POL_industrial_census_desc:0 "Учтём мощности и транзитные обязательства прежде, чем выдавать новые концессии."
 POL_accept_german_capital:0 "Принять германский капитал"
 POL_accept_german_capital_desc:0 "Две гражданские фабрики достанутся нам ценой более тяжёлых потребительских и торговых обязательств."
 POL_economic_independence:0 "Экономическая независимость"
 POL_economic_independence_desc:0 "Выкупим зависимые предприятия за 100 политической власти. Германские инвестиционные льготы исчезнут вместе с удавкой.\n\nИзменение постоянной программы: Скорость строительства: +10%."
 POL_economic_independence_bonus_tt:0 "Скорость строительства: +10%."
 POL_public_works_board:0 "Управление общественных работ"
 POL_public_works_board_desc:0 "Объединим ведомственные заказы и перестанем строить конкурирующие объекты в одних городах.\n\nИзменение постоянной программы: Скорость строительства: +5%."
 POL_public_works_board_bonus_tt:0 "Скорость строительства: +5%."
 POL_vistula_rail_corridor:0 "Вислинский железнодорожный коридор"
 POL_vistula_rail_corridor_desc:0 "Улучшим внутренние перевозки между Варшавой и промышленными областями."
 POL_southern_workshops:0 "Южные машиностроительные мастерские"
 POL_southern_workshops_desc:0 "Построим военный завод на собственной территории, а не на обещанной карте."
 POL_rural_electrification:0 "Электрификация села"
 POL_rural_electrification_desc:0 "Энергоснабжение отстаёт от промышленного плана; расширим собственную генерацию.\n\nИзменение постоянной программы: Выработка энергии: +10%."
 POL_rural_electrification_bonus_tt:0 "Выработка энергии: +10%."
 POL_domestic_coal_survey:0 "Разведка внутренних угольных пластов"
 POL_domestic_coal_survey_desc:0 "Разработаем собственные залежи, не рассчитывая на германскую Верхнюю Силезию."
 POL_lublin_arsenals:0 "Люблинские арсеналы"
 POL_lublin_arsenals_desc:0 "Расширим мощности военного округа ещё одним заводом."
 POL_precision_machine_tools:0 "Точное станкостроение"
 POL_precision_machine_tools_desc:0 "Поднимем качество серийного производства и освоим современные станки.\n\nИзменение постоянной программы: Рост эффективности производства: +10%."
 POL_precision_machine_tools_bonus_tt:0 "Рост эффективности производства: +10%."
 POL_university_consortium:0 "Университетский консорциум"
 POL_university_consortium_desc:0 "Свяжем университеты и заводские лаборатории: ещё одна исследовательская ячейка, до общего предела в пять."
 POL_export_diversification:0 "Диверсификация заказов"
 POL_export_diversification_desc:0 "Освоим альтернативные комплектующие и повысим выпуск военных заводов. Сухопутная торговля всё ещё требует реального маршрута.\n\nИзменение постоянной программы: Выпуск военных заводов: +5%."
 POL_export_diversification_bonus_tt:0 "Выпуск военных заводов: +5%."
 POL_four_year_balance_sheet:0 "Итоги четырёхлетнего плана"
 POL_four_year_balance_sheet_desc:0 "Закрепим производственную кооперацию и техническое образование.\n\nИзменение постоянной программы: Выпуск военных заводов: +5%; Скорость исследований: +5%."
 POL_four_year_balance_sheet_bonus_tt:0 "Выпуск военных заводов: +5%; Скорость исследований: +5%."
 POL_modernize_the_army:0 "Модернизировать армию"
 POL_modernize_the_army_desc:0 "Армии нужны обученные штабы и снабжение, а не новая легенда о кавалерии.\n\nИзменение постоянной программы: Скорость планирования: +5%."
 POL_modernize_the_army_bonus_tt:0 "Скорость планирования: +5%."
 POL_officer_academy:0 "Высшая военная школа"
 POL_officer_academy_desc:0 "Согласуем подготовку офицеров и управление соединениями.\n\nИзменение постоянной программы: Организация армии: +5%."
 POL_officer_academy_bonus_tt:0 "Организация армии: +5%."
 POL_cavalry_traditions:0 "Кавалерийские традиции"
 POL_cavalry_traditions_desc:0 "Сохраним разведывательную и манёвренную роль конницы, готовя её сотрудничество с моторизованной пехотой.\n\nИзменение постоянной программы: Атака кавалерии: +10%; Скорость кавалерии: +10%."
 POL_cavalry_traditions_bonus_tt:0 "Атака кавалерии: +10%; Скорость кавалерии: +10%."
 POL_defend_the_wisla:0 "Защитить Вислу"
 POL_defend_the_wisla_desc:0 "Укрепим национальные пограничные области и улучшим организацию и окапывание сухопутных войск.\n\nИзменение постоянной программы: Организация армии: +5%; Максимальная укреплённость: +10%."
 POL_defend_the_wisla_bonus_tt:0 "Организация армии: +5%; Максимальная укреплённость: +10%."
 POL_motorized_columns:0 "Моторизованные колонны"
 POL_motorized_columns_desc:0 "Дадим подвижным частям грузовики и стандарты взаимодействия с кавалерией.\n\nИзменение постоянной программы: Атака моторизованной пехоты: +10%; Скорость армии: +5%."
 POL_motorized_columns_bonus_tt:0 "Атака моторизованной пехоты: +10%; Скорость армии: +5%."
 POL_mobile_signals:0 "Связь подвижных соединений"
 POL_mobile_signals_desc:0 "Ускорим передачу приказов в манёвренной армии.\n\nИзменение постоянной программы: Скорость планирования: +10%."
 POL_mobile_signals_bonus_tt:0 "Скорость планирования: +10%."
 POL_fortress_engineers:0 "Крепостные инженеры"
 POL_fortress_engineers_desc:0 "Инженерные команды подготовят укрепления и полевые позиции.\n\nИзменение постоянной программы: Скорость окапывания: +10%."
 POL_fortress_engineers_bonus_tt:0 "Скорость окапывания: +10%."
 POL_vistula_reserve_battalions:0 "Вислинские резервные батальоны"
 POL_vistula_reserve_battalions_desc:0 "Организуем сменные части для обороны национальной территории.\n\nИзменение постоянной программы: Оборона национальных территорий: +10%."
 POL_vistula_reserve_battalions_bonus_tt:0 "Оборона национальных территорий: +10%."
 POL_unified_general_staff:0 "Единый генеральный штаб"
 POL_unified_general_staff_desc:0 "Подчиним выбранную доктрину единой системе планирования.\n\nИзменение постоянной программы: Скорость планирования: +5%."
 POL_unified_general_staff_bonus_tt:0 "Скорость планирования: +5%."
 POL_quartermaster_service:0 "Интендантская служба"
 POL_quartermaster_service_desc:0 "Сократим потери снабжения при внутренних перевозках.\n\nИзменение постоянной программы: Потребление снабжения: -10%."
 POL_quartermaster_service_bonus_tt:0 "Потребление снабжения: -10%."
 POL_reserve_officer_network:0 "Сеть офицеров запаса"
 POL_reserve_officer_network_desc:0 "Подготовленные инструкторы ускорят обучение пополнений.\n\nИзменение постоянной программы: Время подготовки армии: -10%."
 POL_reserve_officer_network_bonus_tt:0 "Время подготовки армии: -10%."
 POL_national_manoeuvres:0 "Общенациональные манёвры"
 POL_national_manoeuvres_desc:0 "Проверим реформы в учениях и закрепим управляемость армии.\n\nИзменение постоянной программы: Организация армии: +5%."
 POL_national_manoeuvres_bonus_tt:0 "Организация армии: +5%."
 POL_pzl_research_bureau:0 "Конструкторское бюро PZL"
 POL_pzl_research_bureau_desc:0 "Разовьём авиационные проекты собственного производства."
 POL_air_training_schools:0 "Лётные училища"
 POL_air_training_schools_desc:0 "Единая программа подготовки снизит аварийность.\n\nИзменение постоянной программы: Вероятность авиапроисшествий: -10%."
 POL_air_training_schools_bonus_tt:0 "Вероятность авиапроисшествий: -10%."
 POL_defence_of_the_skies:0 "Защита польского неба"
 POL_defence_of_the_skies_desc:0 "Подготовим истребительную авиацию к обороне внутренних промышленных районов.\n\nИзменение постоянной программы: Дальность авиации: +10%."
 POL_defence_of_the_skies_bonus_tt:0 "Дальность авиации: +10%."
 POL_army_air_liaison:0 "Связь авиации с армией"
 POL_army_air_liaison_desc:0 "Наладим обмен разведданными и вызов поддержки.\n\nИзменение постоянной программы: Эффективность авиазаданий: +5%."
 POL_army_air_liaison_bonus_tt:0 "Эффективность авиазаданий: +5%."
 POL_dispersed_air_workshops:0 "Рассредоточенные авиамастерские"
 POL_dispersed_air_workshops_desc:0 "Построим ещё один военный завод и защищённую внутреннюю авиабазу."
 POL_integrated_air_command:0 "Объединённое командование ВВС"
 POL_integrated_air_command_desc:0 "Закрепим взаимодействие воздушных округов.\n\nИзменение постоянной программы: Эффективность авиазаданий: +5%."
 POL_integrated_air_command_bonus_tt:0 "Эффективность авиазаданий: +5%."
 POL_baltic_fleet_program:0 "Программа Балтийского флота"
 POL_baltic_fleet_program_desc:0 "Пока мы не контролируем побережье, это лишь проект будущего флота. Этот фокус сам не создаёт кораблей."
 POL_baltic_fleet_program_reward_tt:0 "Подготовительный проект: открывает фокус первой верфи. Сам проект не создаёт кораблей, дивизий или зданий."
 POL_first_coastal_dockyard:0 "Первая прибрежная верфь"
 POL_first_coastal_dockyard_desc:0 "Перейдём от проекта к одной верфи в собственной контролируемой прибрежной области."
 POL_aftermath_of_the_marshal:0 "Смерть Маршала"
 POL_aftermath_of_the_marshal_desc:0 "Пилсудский умер. Независимость, добытая в годы Великой смуты, переживёт его лишь при новом государственном компромиссе."
 POL_aftermath_of_the_marshal_reward_tt:0 "Открывает хозяйственную и военную подготовку, кампании поддержки партий и событие о наследии Маршала."
 POL_castle_and_colonels_dialogue:0 "Диалог Замка и полковников"
 POL_castle_and_colonels_dialogue_desc:0 "Подготовим соглашение гражданского и военного крыла Санации."
 POL_castle_and_colonels_dialogue_reward_tt:0 "Открывает платную кампанию поддержки Санации; необходимы бюджетная комиссия и мандат 40%."
 POL_national_democratic_leagues:0 "Национал-демократические союзы"
 POL_national_democratic_leagues_desc:0 "Эндеция создаёт политическую организацию; одной уличной агитации для смены власти недостаточно."
 POL_national_democratic_leagues_reward_tt:0 "Открывает платную агитацию Эндеции для достижения поддержки 40%."
 POL_berlin_trade_delegation:0 "Торговая делегация в Берлин"
 POL_berlin_trade_delegation_desc:0 "Подготовим внутреннюю коалицию сторонников прагматической сделки с Германией."
 POL_berlin_trade_delegation_reward_tt:0 "Открывает кампанию прагматиков и подготовку переговоров с Германией."
 POL_workers_defence_committees:0 "Комитеты защиты рабочих"
 POL_workers_defence_committees_desc:0 "Создадим рабочую организацию Лодзи, способную добиваться массовой поддержки."
 POL_workers_defence_committees_reward_tt:0 "Открывает платную рабочую агитацию для достижения поддержки коммунистов 40%."
 POL_state_budget_commission:0 "Комиссия государственного бюджета"
 POL_state_budget_commission_desc:0 "Уменьшим остроту кризиса Санации, но окончательные институты ещё предстоит создать."
 POL_state_budget_commission_reward_tt:0 "Кризис Санации ослабляется: штраф стабильности меняется с −15% на −10%, политическая власть в день — с −0.20 на −0.10. Завершение кризиса требует институтов выбранного пути."
 POL_the_colonels_regime:0 "Режим полковников"
 POL_the_colonels_regime_desc:0 "Сохраним независимость и власть Санации при мандате не менее 40%.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_the_colonels_regime_bonus_tt:0 "Стабильность: +5%."
 POL_endecja_ascendant:0 "Триумф Эндеции"
 POL_endecja_ascendant_desc:0 "Национал-демократы сменят режим при поддержке не менее 40% и подготовленном политическом движении.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_endecja_ascendant_bonus_tt:0 "Стабильность: +5%."
 POL_pragmatic_deal:0 "Прагматическая сделка"
 POL_pragmatic_deal_desc:0 "Выберем переговоры с Берлином; политический союз всё ещё потребует согласия Германии."
 POL_pragmatic_deal_reward_tt:0 "Фиксирует прогерманский политический путь и открывает подготовку соглашения с Берлином. Союз и марионеточный статус этим фокусом не устанавливаются."
 POL_the_lodz_uprising:0 "Лодзинское восстание"
 POL_the_lodz_uprising_desc:0 "При поддержке коммунистов не менее 40% рабочее движение бросит вооружённый вызов режиму."
 POL_castle_compact:0 "Соглашение с Замком"
 POL_castle_compact_desc:0 "Уточним пределы власти президента и генерального инспектора.\n\nИзменение постоянной программы: Политическая власть в день: +0.10."
 POL_castle_compact_bonus_tt:0 "Политическая власть в день: +0.10."
 POL_professional_civil_service:0 "Профессиональная администрация"
 POL_professional_civil_service_desc:0 "Закончим кризис разделённого управления и закрепим бюджетную ответственность.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_professional_civil_service_bonus_tt:0 "Стабильность: +5%."
 POL_fortify_the_borders:0 "Укрепить границы"
 POL_fortify_the_borders_desc:0 "Подготовим реальные национальные пограничные области к обороне.\n\nИзменение постоянной программы: Оборона национальных территорий: +5%."
 POL_fortify_the_borders_bonus_tt:0 "Оборона национальных территорий: +5%."
 POL_intermarium_concept:0 "Концепция Междуморья"
 POL_intermarium_concept_desc:0 "Создадим собственный оборонительный альянс; соседи смогут принять или отклонить приглашение."
 POL_intermarium_concept_reward_tt:0 "Создаёт польскую оборонительную фракцию. Вступление Румынии и ЛитБела требует отдельных переговоров."
 POL_vilnius_settlement:0 "Виленское урегулирование"
 POL_vilnius_settlement_desc:0 "Предложим ЛитБелу взаимный отказ от пограничных претензий без автоматической передачи областей."
 POL_vilnius_settlement_reward_tt:0 "Направляет ЛитБелу предложение отказаться от взаимных претензий, если Союз сохранился после своего Виленского компромисса. Открывает платные повторные переговоры."
 POL_baltic_danubian_congress:0 "Балтийско-Дунайский конгресс"
 POL_baltic_danubian_congress_desc:0 "Пригласим Румынию и, после урегулирования спора, ЛитБел в Междуморье."
 POL_baltic_danubian_congress_reward_tt:0 "Направляет приглашения подходящим Румынии и ЛитБелу; каждое правительство вправе отказать."
 POL_agrarian_conciliation:0 "Соглашение с деревней"
 POL_agrarian_conciliation_desc:0 "Крестьянское представительство укрепит устойчивость независимой республики.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_agrarian_conciliation_bonus_tt:0 "Стабильность: +5%."
 POL_national_defence_fund_nww:0 "Национальный фонд обороны"
 POL_national_defence_fund_nww_desc:0 "Профинансируем ещё один собственный военный завод."
 POL_republic_survives:0 "Республика выстояла"
 POL_republic_survives_desc:0 "После 1941 года закрепим институты независимой оборонительной республики.\n\nИзменение постоянной программы: Политическая власть в день: +0.10; Оборона национальных территорий: +5%."
 POL_republic_survives_bonus_tt:0 "Политическая власть в день: +0.10; Оборона национальных территорий: +5%."
 POL_national_bloc:0 "Национальный блок"
 POL_national_bloc_desc:0 "Укрепим политическую организацию национального правительства.\n\nИзменение постоянной программы: Поддержка войны: +10%."
 POL_national_bloc_bonus_tt:0 "Поддержка войны: +10%."
 POL_radical_polonization:0 "Радикальная полонизация"
 POL_radical_polonization_desc:0 "Принудительная администрация ускорит подчинение оккупированных земель, но усилит сопротивление.\n\nИзменение постоянной программы: Рост подчинения на оккупированных нами территориях: +5%; Целевое сопротивление на оккупированных нами территориях: +10%."
 POL_radical_polonization_bonus_tt:0 "Рост подчинения на оккупированных нами территориях: +5%; Целевое сопротивление на оккупированных нами территориях: +10%."
 POL_western_claims_dossier:0 "Досье западных претензий"
 POL_western_claims_dossier_desc:0 "Сформулируем претензии на Познань, Померанию, Данциг и Верхнюю Силезию, не объявляя эти области своими владениями."
 POL_western_claims_dossier_reward_tt:0 "Добавляет претензии на Познань, Померанию, Данциг и Верхнюю Силезию. Владение и национальный статус не меняются."
 POL_wartime_conversion:0 "Военная конверсия"
 POL_wartime_conversion_desc:0 "Переориентируем промышленные заказы и окончательно расторгнем германские концессии.\n\nИзменение постоянной программы: Выпуск военных заводов: +10%."
 POL_wartime_conversion_bonus_tt:0 "Выпуск военных заводов: +10%."
 POL_march_to_the_sea:0 "Марш к морю"
 POL_march_to_the_sea_desc:0 "С 1939 года подготовим ограниченную цель войны против Германии за западные области. ИИ должен дождаться уязвимости противника."
 POL_secure_the_corridor:0 "Закрепить коридор"
 POL_secure_the_corridor_desc:0 "Восстановим управление только после фактического владения и контроля западных областей.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_secure_the_corridor_bonus_tt:0 "Стабильность: +5%."
 POL_silesian_reconstruction:0 "Силезская реконструкция"
 POL_silesian_reconstruction_desc:0 "Промышленные вложения поступят лишь в действительно возвращённые области."
 POL_continental_army:0 "Континентальная армия"
 POL_continental_army_desc:0 "Закрепим организацию и снабжение армии после западной кампании.\n\nИзменение постоянной программы: Организация армии: +5%; Потребление снабжения: -5%."
 POL_continental_army_bonus_tt:0 "Организация армии: +5%; Потребление снабжения: -5%."
 POL_sovereign_national_state:0 "Суверенное национальное государство"
 POL_sovereign_national_state_desc:0 "Закрепим институты государства, отказавшегося от германского протектората.\n\nИзменение постоянной программы: Политическая власть в день: +0.10; Поддержка войны: +5%."
 POL_sovereign_national_state_bonus_tt:0 "Политическая власть в день: +0.10; Поддержка войны: +5%."
 POL_customs_commission:0 "Таможенная комиссия"
 POL_customs_commission_desc:0 "Подготовим условия транзита и промышленного кредита.\n\nИзменение постоянной программы: Рост эффективности производства: +5%."
 POL_customs_commission_bonus_tt:0 "Рост эффективности производства: +5%."
 POL_guaranteed_transit:0 "Гарантированный транзит"
 POL_guaranteed_transit_desc:0 "Согласуем процедуры перевозок. Фокус не создаёт морских портов или несуществующих торговых маршрутов.\n\nИзменение постоянной программы: Выпуск военных заводов: +5%."
 POL_guaranteed_transit_bonus_tt:0 "Выпуск военных заводов: +5%."
 POL_join_mitteleuropa_officially:0 "Официально войти в Миттельевропу"
 POL_join_mitteleuropa_officially_desc:0 "При мандате 40% для идеологии Германии примем соответствующий режим и запросим у Берлина союз и гарантию. Германия может отказать."
 POL_join_mitteleuropa_officially_reward_tt:0 "При мандате 40% принимает идеологию действующего германского правительства и направляет предложение союза и гарантии. Берлин вправе отказать; доступны платные повторные переговоры."
 POL_licensed_machine_tools:0 "Лицензионное станкостроение"
 POL_licensed_machine_tools_desc:0 "Сохраним польское производство на базе согласованных технических лицензий.\n\nИзменение постоянной программы: Рост эффективности производства: +5%."
 POL_licensed_machine_tools_bonus_tt:0 "Рост эффективности производства: +5%."
 POL_staff_exchange:0 "Обмен штабными миссиями"
 POL_staff_exchange_desc:0 "Обучим офицеров работе с партнёрами, сохранив собственные соединения.\n\nИзменение постоянной программы: Скорость планирования: +10%."
 POL_staff_exchange_bonus_tt:0 "Скорость планирования: +10%."
 POL_recognize_the_western_frontier:0 "Признать западную границу"
 POL_recognize_the_western_frontier_desc:0 "Откажемся от политических претензий на германские западные области; чужая территория не будет передана автоматически."
 POL_recognize_the_western_frontier_reward_tt:0 "Снимает польские претензии на германские западные области без передачи территории."
 POL_galician_assurances:0 "Галицийские гарантии"
 POL_galician_assurances_desc:0 "Укрепим собственную оборону юга; союз с Германией не аннексирует Австрию.\n\nИзменение постоянной программы: Оборона национальных территорий: +5%."
 POL_galician_assurances_bonus_tt:0 "Оборона национальных территорий: +5%."
 POL_joint_armament_contracts:0 "Совместные оружейные контракты"
 POL_joint_armament_contracts_desc:0 "Расширим военное производство одной собственной фабрикой."
 POL_polish_institutions_in_mitteleuropa:0 "Польские институты в Миттельевропе"
 POL_polish_institutions_in_mitteleuropa_desc:0 "Закрепим административную устойчивость внутри германской системы.\n\nИзменение постоянной программы: Стабильность: +10%; Политическая власть в день: +0.10."
 POL_polish_institutions_in_mitteleuropa_bonus_tt:0 "Стабильность: +10%; Политическая власть в день: +0.10."
 POL_council_republic:0 "Республика советов"
 POL_council_republic_desc:0 "Только победа восставших в гражданской войне позволяет учредить новое государство.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_council_republic_bonus_tt:0 "Стабильность: +5%."
 POL_land_and_food_committees:0 "Земельные и продовольственные комитеты"
 POL_land_and_food_committees_desc:0 "Организуем снабжение городов и представительство деревни.\n\nИзменение постоянной программы: Стабильность: +5%."
 POL_land_and_food_committees_bonus_tt:0 "Стабильность: +5%."
 POL_nationalize_german_assets:0 "Национализировать германские активы"
 POL_nationalize_german_assets_desc:0 "Ликвидируем зависимость от германских концессий вместе с инвестиционными преимуществами.\n\nИзменение постоянной программы: Скорость строительства: +5%."
 POL_nationalize_german_assets_bonus_tt:0 "Скорость строительства: +5%."
 POL_workers_militias_nww:0 "Рабочие ополчения"
 POL_workers_militias_nww_desc:0 "Сформируем систему военной подготовки рабочих без бесплатного создания дивизий.\n\nИзменение постоянной программы: Время подготовки армии: -10%; Оборона национальных территорий: +5%."
 POL_workers_militias_nww_bonus_tt:0 "Время подготовки армии: -10%; Оборона национальных территорий: +5%."
 POL_alliance_with_the_east:0 "Союз с Востоком"
 POL_alliance_with_the_east_desc:0 "Предложим союз коммунистической России либо ЛитБелу. Получатель сохраняет право отказа."
 POL_alliance_with_the_east_reward_tt:0 "После реальной победы восставших направляет предложение союза коммунистической России либо подходящему ЛитБелу. Принятие не гарантировано."
 POL_socialist_constitution:0 "Социалистическая конституция"
 POL_socialist_constitution_desc:0 "Определим пределы центральной власти и полномочия местных советов.\n\nИзменение постоянной программы: Политическая власть в день: +0.10."
 POL_socialist_constitution_bonus_tt:0 "Политическая власть в день: +0.10."
 POL_eastern_trade_protocols:0 "Восточные торговые протоколы"
 POL_eastern_trade_protocols_desc:0 "Согласуем контракты с принявшим союз партнёром.\n\nИзменение постоянной программы: Выпуск военных заводов: +5%."
 POL_eastern_trade_protocols_bonus_tt:0 "Выпуск военных заводов: +5%."
 POL_red_logistics_service:0 "Красная служба снабжения"
 POL_red_logistics_service_desc:0 "Согласуем железнодорожные поставки и армейские склады.\n\nИзменение постоянной программы: Потребление снабжения: -10%."
 POL_red_logistics_service_bonus_tt:0 "Потребление снабжения: -10%."
 POL_red_wisla:0 "Красная Висла"
 POL_red_wisla_desc:0 "Завершим восстановление институтов и обороны польской советской республики.\n\nИзменение постоянной программы: Стабильность: +5%; Организация армии: +5%."
 POL_red_wisla_bonus_tt:0 "Стабильность: +5%; Организация армии: +5%."
 POL_cop_program:0 "Центральный индустриальный округ"
 POL_cop_program_desc:0 "Единая промышленная программа на основе выбранного финансирования."
 POL_army_program:0 "Программа Войска Польского"
 POL_army_program_desc:0 "Постоянная программа выбранной доктрины и общего военного управления."
 POL_air_program:0 "Программа польской авиации"
 POL_air_program_desc:0 "Общие стандарты подготовки, связи и управления авиацией."
 POL_state_program:0 "Государственное устройство Польши"
 POL_state_program_desc:0 "Учреждения и политические решения избранного пути."
 POL_german_economic_stranglehold:0 "Германская экономическая удавка"
 POL_german_economic_stranglehold_desc:0 "Германские инвестиции повышают выпуск заводов, но потребительские обязательства и дорогая смена торговой политики связывают Варшаву. Экономическая зависимость не делает Польшу марионеткой."
 POL_german_economic_stranglehold_2:0 "Германская удавка: новые концессии"
 POL_german_economic_stranglehold_2_desc:0 "Новые фабрики и более высокий выпуск оплачиваются усиленной зависимостью от германских заказов."
 POL_sanation_crisis:0 "Кризис режима Санации"
 POL_sanation_crisis_desc:0 "Смерть Пилсудского обострила борьбу Замка и полковников. До нового государственного соглашения страдают устойчивость и работа правительства."
 POL_sanation_crisis_2:0 "Кризис Санации: временный компромисс"
 POL_sanation_crisis_2_desc:0 "Бюджетная комиссия ограничила конфликт, но выбранному политическому пути ещё предстоит создать устойчивые институты."
 POL_landlocked_nation:0 "Государство без выхода к морю"
 POL_landlocked_nation_desc:0 "У Польши нет побережья и стартового флота. Морская программа требует контроля хотя бы одной прибрежной области; верфь — также владения этой областью. Сухопутная торговля подчиняется обычным правилам маршрутов игры."
 POL_native_event_disabled:0 "Ванильная цепочка заменена контентом NWW."
 POL_ai_restraint_tt:0 "Польский ИИ не начинает ранние войны. Западный поход Эндеции требует 1939 года, подготовки и уязвимости Германии."
 POL_civil_war_tt:0 "Начнётся настоящая гражданская война: коммунистам достанется около 40% страны. Игрок перейдёт на сторону восставших; их победа необходима для Республики советов."
 POL_nww_politics:0 "Политика и переговоры Польши"
 POL_nww_politics_desc:0 "Подготовка общественного мандата требует политической власти. Смена режима требует не менее 40% поддержки; дипломатические предложения могут быть отклонены."
 POL_campaign_neutrality:0 "Кампания за государственное соглашение"
 POL_campaign_neutrality_desc:0 "Потратим 50 политической власти на организованную кампанию: +10 пунктов поддержки соответствующей партии. Повтор доступен через 35 дней."
 POL_campaign_fascism:0 "Кампания за национал-демократов"
 POL_campaign_fascism_desc:0 "Потратим 50 политической власти на организованную кампанию: +10 пунктов поддержки соответствующей партии. Повтор доступен через 35 дней."
 POL_campaign_communism:0 "Кампания за рабочее движение"
 POL_campaign_communism_desc:0 "Потратим 50 политической власти на организованную кампанию: +10 пунктов поддержки соответствующей партии. Повтор доступен через 35 дней."
 POL_campaign_democratic:0 "Кампания за парламентское представительство"
 POL_campaign_democratic_desc:0 "Потратим 50 политической власти на организованную кампанию: +10 пунктов поддержки соответствующей партии. Повтор доступен через 35 дней."
 POL_retry_german_compact:0 "Возобновить переговоры с Берлином"
 POL_retry_german_compact_desc:0 "Новая дипломатическая попытка стоит 50 политической власти. Ожидающее предложение исключает повторную отправку; после попытки действует 180-дневный перерыв. Партнёр может отказать."
 POL_retry_vilnius_talks:0 "Возобновить виленские переговоры"
 POL_retry_vilnius_talks_desc:0 "Новая дипломатическая попытка стоит 50 политической власти. Ожидающее предложение исключает повторную отправку; после попытки действует 180-дневный перерыв. Партнёр может отказать."
 POL_retry_eastern_alliance:0 "Возобновить переговоры с Востоком"
 POL_retry_eastern_alliance_desc:0 "Новая дипломатическая попытка стоит 50 политической власти. Ожидающее предложение исключает повторную отправку; после попытки действует 180-дневный перерыв. Партнёр может отказать."
 POL_cancel_german_contracts:0 "Расторгнуть германские концессии"
 POL_cancel_german_contracts_desc:0 "За 100 политической власти выкупим зависимые предприятия, потеряв и инвестиционный бонус к выпуску. Прогерманский путь и германская зависимость исключают такой выход."
 POL_intermarium_faction:0 "Междуморье"
 POL_mitteleuropa_faction:0 "Миттельевропа"
 POL_eastern_faction:0 "Восточный союз советских республик"
 POL_plan_sanation:0 "Независимая Санация"
 POL_plan_sanation_desc:0 "Развитие избранных институтов, внутренней промышленности и армии."
 POL_plan_endecja:0 "Западная стратегия Эндеции"
 POL_plan_endecja_desc:0 "Развитие избранных институтов, внутренней промышленности и армии."
 POL_plan_german:0 "Германский компромисс"
 POL_plan_german_desc:0 "Развитие избранных институтов, внутренней промышленности и армии."
 POL_plan_communist:0 "Красная Висла"
 POL_plan_communist_desc:0 "Развитие избранных институтов, внутренней промышленности и армии."
 POL_rule_sanation:0 "Санация: независимый буфер"
 POL_rule_sanation_desc:0 "Исторический путь полковников: оборона, ЦИО и добровольное Междуморье. Германский протекторат будет отвергнут."
 POL_rule_endecja:0 "Эндеция: марш к морю"
 POL_rule_endecja_desc:0 "Национальная революция и подготовленный поход на Запад после 1939 года, когда Германия станет уязвимой."
 POL_rule_german:0 "Сделка с Германией"
 POL_rule_german_desc:0 "Прагматическая сделка, идеологическое согласование с Германией и согласительный германский блок. Поздний ультиматум о марионеточном статусе будет принят."
 POL_rule_communist:0 "Лодзинское восстание"
 POL_rule_communist_desc:0 "Подготовка коммунистического мандата, гражданская война и предложение союза Востоку."
 POL_rule_random:0 "Случайный путь NWW"
 POL_rule_random_desc:0 "Случайно выбирает один из четырёх польских путей независимо от DLC."
 nww_pol.10.t:0 "Предложение польско-германского соглашения"
 nww_pol.10.d:0 "Варшава предлагает официально присоединиться к нашей политической системе в обмен на союз и гарантию. Польша не передаёт территории и не становится марионеткой этим соглашением."
 nww_pol.10.a:0 "Принять союз и гарантировать Польшу."
 nww_pol.10.b:0 "Отклонить предложение."
 nww_pol.20.t:0 "Виленское урегулирование с Польшей"
 nww_pol.20.d:0 "Польская Санация предлагает пакт о ненападении и взаимный отказ от пограничных претензий. Ни одна область не передаётся, национальные территории сохраняются. Решение остаётся за нашим правительством."
 nww_pol.20.a:0 "Согласиться на урегулирование."
 nww_pol.20.b:0 "Не связывать себя соглашением."
 nww_pol.30.t:0 "Приглашение в Междуморье"
 nww_pol.30.d:0 "Независимая Польша приглашает нас в оборонительный альянс. Мы сохраним государственность; обязательства союза вступят в силу только с нашего согласия."
 nww_pol.30.a:0 "Вступить в Междуморье."
 nww_pol.30.b:0 "Сохранить внешнеполитическую самостоятельность."
 nww_pol.40.t:0 "Польские советы предлагают союз"
 nww_pol.40.d:0 "Победившие в гражданской войне польские коммунисты просят принять их в наш союз. Они не передают нам территории и не требуют изменения отношений с существующими партнёрами."
 nww_pol.40.a:0 "Принять польскую республику в союз."
 nww_pol.40.b:0 "Отказаться от новых обязательств."
