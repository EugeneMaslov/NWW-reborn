 POL_policy_colonels_secretariat:0 "Секретариат полковников"
 POL_policy_colonels_secretariat_desc:0 "Проект занимает 60 дней и стоит 50 политической власти. Постоянные изменения: Политическая власть в день: +0.10; Стабильность: -5%."
 POL_policy_colonels_secretariat_tt:0 "Политическая власть в день: +0.10; Стабильность: -5%."
 POL_policy_civic_administration:0 "Гражданская администрация меньшинств"
