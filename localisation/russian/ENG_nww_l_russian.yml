 ENG_nww_fascist_campaign_desc:0 "35 политической власти; 35 дней подготовки. Даёт 10 пунктов программного мандата либо 10 процентных пунктов поддержки партии."
 ENG_nww_directory_campaign:0 "Союз сторонников порядка"
 ENG_nww_directory_campaign_desc:0 "35 политической власти; 35 дней подготовки. Даёт 10 пунктов программного мандата либо 10 процентных пунктов поддержки партии."
 ENG_nww_socialist_campaign:0 "Социалистические комитеты"
 ENG_nww_socialist_campaign_desc:0 "35 политической власти; 35 дней подготовки. Даёт 10 пунктов программного мандата либо 10 процентных пунктов поддержки партии."
 ENG_nww_defence_mandate:0 "Защитить социальные преобразования"
 ENG_nww_defence_mandate_desc:0 "При внешней угрозе провести 35-дневную кампанию за оборонный мандат. Снимает пацифистское ограничение."
 ENG_nww_irish_mediation:0 "Посредничество между общинами"
 ENG_nww_irish_mediation_desc:0 "Переговоры требуют 35 дней. При потере Северной Ирландии незавершённая процедура отменяется с возвратом стоимости."
 ENG_nww_irish_retry:0 "Вернуться к переговорам с Дублином"
 ENG_nww_irish_retry_desc:0 "Переговоры требуют 35 дней. При потере Северной Ирландии незавершённая процедура отменяется с возвратом стоимости."
 ENG_nww_irish_deadline:0 "Ольстер требует урегулирования"
 ENG_nww_irish_deadline_desc:0 "180 дней на снижение напряжённости ниже 50 или заключение соглашения. Провал обострит кризис кабинета и откроет вооружённую развязку."
 ENG_nww_border_referendum:0 "Согласовать изменение статуса Ольстера"
 ENG_nww_border_referendum_desc:0 "После взаимных гарантий предложить Дублину договор о передаче Северной Ирландии. Требуются согласие Ирландии и фактическое владение и контроль территории."
 ENG_nww_transport_reserve:0 "Заказать резерв транспортов"
 ENG_nww_transport_reserve_desc:0 "50 политической власти и две гражданские фабрики на 70 дней: 40 конвоев. Использует общий слот проектов."
 nww_eng.1.t:0 "Цена короны"
 nww_eng.1.d:0 "За кабинетом стоят крупнейшие рынки мира, но казна не способна одновременно оплатить все требования. Канцлер предлагает определить первый приоритет. Это решение задаст начало программы, сохранив последующий выбор устройства государства."
 nww_eng.1.a:0 "Восстановление метрополии"
 nww_eng.1.b:0 "Подготовка имперских переговоров"
 nww_eng.1.c:0 "Перевооружение"
 nww_eng.4.t:0 "Крах конституционного согласия"
 nww_eng.4.d:0 "Противники нового режима отказались признать чрезвычайную передачу власти. Часть гарнизонов поддержала парламент. Кабинету предстоит удержать государство в гражданской войне."
 nww_eng.4.a:0 "Собрать верные части"
 nww_eng.4.b:0 "Кризис уже разрешён"
 nww_eng.10.t:0 "Договор ратифицирован"
 nww_eng.10.d:0 "Правительство партнёра ратифицировало предложение. Новые обязательства вступают в силу в согласованном объёме; местные учреждения и вооружённые силы сохраняются."
 nww_eng.10.a:0 "Соблюдать договор"
 nww_eng.11.t:0 "Предложение отклонено"
 nww_eng.11.d:0 "Правительство партнёра отказалось от предложения. Прежний статус сохраняется. Кабинет сможет вернуться к переговорам после подготовки нового проекта."
 nww_eng.11.a:0 "Принять ответ"
 nww_eng.20.t:0 "Приглашение ирландской делегации"
 nww_eng.20.d:0 "Проект Белфастского соглашения предусматривает местное представительство, гарантии обеим общинам и совместное расследование пограничных инцидентов. Его необходимо направить правительству Ирландии."
 nww_eng.20.a:0 "Направить проект в Дублин"
 nww_eng.20.b:0 "Пока нет условий для переговоров"
 nww_eng.21.t:0 "Белфастский проект"
 nww_eng.21.d:0 "Лондон предлагает международные гарантии общинам Северной Ирландии и постоянную пограничную комиссию. Договор не меняет суверенитет над Ольстером; дальнейшие изменения потребуют нового согласия."
 nww_eng.21.a:0 "Подписать соглашение"
 nww_eng.21.b:0 "Отказаться от проекта"
 nww_eng.23.t:0 "Кабинет перед ирландским кризисом"
 nww_eng.23.d:0 "Срок урегулирования истёк. Чрезвычайные меры подорвали доверие, а в Ольстере формируются вооружённые группы. Парламент требует отставки министров или нового соглашения."
 nww_eng.23.a:0 "Отставка министров и новое посредничество"
 nww_eng.23.b:0 "Подавить вооружённые группы"
 nww_eng.24.t:0 "Будущий статус Ольстера"
 nww_eng.24.d:0 "После местных консультаций кабинет готов предложить передачу Северной Ирландии под власть Дублина при сохранении гражданских и религиозных гарантий. Окончательное решение требует согласия ирландского правительства."
 nww_eng.24.a:0 "Передать проект договора"
 nww_eng.24.b:0 "Отложить до восстановления мира"
 nww_eng.25.t:0 "Предложение об объединении острова"
 nww_eng.25.d:0 "Лондон предлагает согласованную передачу Северной Ирландии с гарантиями общинам. Принятие договора завершит территориальный спор, сохранив отдельное британское государство."
 nww_eng.25.a:0 "Ратифицировать передачу"
 nww_eng.25.b:0 "Сохранить существующий договор"
 ENG_nww_deadline_CAN:0 "Пересмотр обязательств: Канада"
 ENG_nww_deadline_CAN_desc:0 "180 дней: поднять доверие до 40 или заключить договор. При провале зависимое правительство потребует суверенитета. Во время внешней войны миссия отменяется и может возобновиться после мира."
 ENG_nww_assurances_CAN:0 "Гарантии местному парламенту: Канада"
 ENG_nww_assurances_CAN_desc:0 "35 политической власти и 35 дней: +15 доверия. Использует общий слот переговоров. Военные или административные препятствия отменяют процедуру с возвратом стоимости."
 nww_eng.300.t:0 "Требование пересмотреть имперский договор"
 nww_eng.300.d:0 "Лондон не смог урегулировать наши разногласия в установленный срок. Правительство может потребовать полного суверенитета либо согласиться на новый период переговоров. Британия не получает права отменить наш выбор."
 nww_eng.300.a:0 "Провозгласить суверенитет"
 nww_eng.300.b:0 "Дать переговорам ещё один шанс"
