 ENG_nww_free_trade:0 "Имперская зона свободной торговли"
 ENG_nww_free_trade_desc:0 "Общий рынок может сохранить британское влияние после пересмотра политического подчинения. Для этого закупки, стандарты и доступ к рынкам должны стать предметом взаимных соглашений."
