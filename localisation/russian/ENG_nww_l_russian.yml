 ENG_nww_continuity:0 "Конституционная преемственность"
 ENG_nww_continuity_desc:0 "Британская конституция держится на признанных пределах власти. Кабинет сохранит ответственность перед Палатой общин, а перемены начнутся с пересмотра обязательств, которые Лондон больше не может исполнять в одиночку."
 ENG_nww_federal:0 "Разделить имперский суверенитет"
 ENG_nww_federal_desc:0 "Федерация потребует уступок самой метрополии. Общая оборона и казна станут устойчивыми лишь тогда, когда решения перестанут быть исключительной привилегией Вестминстера."
 ENG_nww_emergency:0 "Комитет национального восстановления"
 ENG_nww_emergency_desc:0 "Радикалы обещают избавить страну от бесконечных парламентских отсрочек. Промышленники и офицеры готовы их выслушать, но чрезвычайные полномочия неизбежно поставят вопрос о том, кто контролирует правительство."
 ENG_nww_labour:0 "Мандат трудящейся Британии"
 ENG_nww_labour_desc:0 "Угольные районы и рабочие кварталы требуют, чтобы богатство Империи наконец служило их нуждам. Для устойчивых реформ лейбористам понадобится собственный общественный мандат внутри демократического большинства."
 ENG_nww_island:0 "Остров прежде Империи"
 ENG_nww_island_desc:0 "Далёкие базы приносят влияние и постоянные счета. Сторонники островного курса предлагают договориться о передаче обязательств и направить высвободившиеся средства на безопасность и благосостояние метрополии."
