 nww_eng.30.t:0 "Корона переходит к наследнику"
 nww_eng.30.d:0 "Георг V скончался. Наследник принимает корону государства, которое избежало мировой войны, но не избежало споров о границах монаршей власти. Кабинет ожидает подтверждения конституционных обязательств."
 nww_eng.30.a:0 "Признать Эдуарда VIII"
 nww_eng.31.t:0 "Корона перед парламентом"
 nww_eng.31.d:0 "Новый монарх требует определить границы его участия в политике. Кабинет предлагает подтвердить парламентскую ответственность правительства. Король может принять это условие либо уступить престол брату."
 nww_eng.31.a:0 "Подтвердить конституционный порядок"
 nww_eng.31.b:0 "Принять отречение"
 nww_eng.32.t:0 "Передача руководства кабинетом"
 nww_eng.32.d:0 "Болдуин готов оставить руководство правительством. Парламентское большинство обсуждает кандидатуру Чемберлена, сторонника упорядоченных смет и переговоров, и Черчилля, настаивающего на более решительном перевооружении. Выбор нового премьера сохраняет конституционный порядок."
 nww_eng.32.a:0 "Кабинет Чемберлена"
 nww_eng.32.b:0 "Поручить кабинет Черчиллю"
 ENG_nww_colonial_exit_MAL:0 "Соглашение о суверенитете: Малайя"
 ENG_nww_colonial_exit_MAL_desc:0 "50 политической власти, две гражданские фабрики и 35 дней переговоров. Предложение направляется только реально зависимому правительству; оно может отказаться."
 nww_eng.400.t:0 "Договор о передаче суверенитета"
 nww_eng.400.d:0 "Лондон подготовил передачу административных полномочий нашему правительству. Мы можем принять независимость без территориальных уступок или пока сохранить прежний статус. Торговые и оборонные соглашения потребуют отдельного согласия."
 nww_eng.400.a:0 "Принять передачу полномочий"
 nww_eng.400.b:0 "Сохранить прежний статус"
