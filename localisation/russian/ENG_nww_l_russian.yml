 ENG_nww_markets:0 "Заморские рынки"
 ENG_nww_markets_desc:0 "Имперские заказы поддерживают британское производство. После пересмотра зависимых отношений их заменяют согласованные торговые договоры."
 ENG_nww_finance:0 "Мировой клиринговый центр"
 ENG_nww_finance_desc:0 "Лондонские банки и страховые общества связывают мировые рынки."
 ENG_nww_project_cost:0 "Имперская проектная смета"
 ENG_nww_project_cost_desc:0 "Две гражданские фабрики выделены на действующий проект до его окончания или отмены."
 ENG_nww_strikes:0 "Промышленные забастовки"
 ENG_nww_strikes_desc:0 "Принуждение обострило трудовой конфликт. Арбитраж и соглашение о труде способны устранить его причины."
 ENG_nww_ulster_garrison:0 "Чрезвычайный гарнизон Ольстера"
 ENG_nww_ulster_garrison_desc:0 "Содержание чрезвычайной администрации требует постоянных расходов."
 ENG_nww_retooling:0 "Перестройка производственных линий"
 ENG_nww_retooling_desc:0 "Новые массовые контракты требуют временной остановки части линий."
 ENG_nww_sea_delay:0 "Задержки имперских проектов"
 ENG_nww_sea_delay_desc:0 "Потеря доступа к морским базам осложняет исполнение договоров. Потери конвоев и снабжения рассчитываются самой игрой."
 ENG_nww_trade_partner:0 "Договор с британским рынком"
 ENG_nww_trade_partner_desc:0 "Участник ратифицировал взаимные закупки и общие стандарты."
