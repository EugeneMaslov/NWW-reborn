 ENG_nww_report:0 "Доклад о состоянии Империи"
 ENG_nww_report_desc:0 "Июльский кризис 1914 года завершился переговорами. Британская империя сохранила флот, рынки и престиж, но избежавшая мировой войны Европа продолжала меняться. Доклад кабинету должен показать цену каждого обязательства."
 ENG_nww_session:0 "Открыть парламентскую сессию"
 ENG_nww_session_desc:0 "Устройство власти определит, какие обещания Лондон способен исполнить. Реформа должна опираться на согласованные полномочия и устойчивые учреждения."
 ENG_nww_budget:0 "Бюджет короны и обязательств"
