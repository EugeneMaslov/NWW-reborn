 ENG_nww_representation:0 "Хартия представительства"
 ENG_nww_representation_desc:0 "Палата населения без индийского представительства станет обещанием с оговоркой. Палата участников без гарантий малым странам вызовет их сопротивление. Хартия должна определить полномочия обеих."
