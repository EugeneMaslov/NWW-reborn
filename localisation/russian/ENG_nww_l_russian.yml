 ENG_nww_ui_trust_help:0 "Доверие: 0–100. Ниже 25 — риск кризиса; 40 — порог торгового предложения; 65 — порог федеративного предложения. Получатель сохраняет право отказа. Неучаствующие страны не заполняют шкалу."
 ENG_nww_ui_mandate_help:0 "Мандат лейбористской программы: 0–100. Для победы на выборах требуется 40. Кампания занимает 35 дней и добавляет 10 пунктов. Остальные условия фокуса сохраняются."
 ENG_nww_ui_irish_help:0 "Напряжённость: 0–100. При 70 начинается кризис с миссией на 180 дней. Для снятия ультиматума снизьте напряжённость ниже 50 или заключите соглашение. Шкала показывает давление, статус — итог урегулирования."
 ENG_nww_ui_route_help:0 "Доступ проверяется ежедневно: контроль ключевой базы Британией, союзником или страной, предоставляющей военный доступ, и резерв не менее 100 конвоев. Для мыса нужен подготовительный фокус. Это доступность баз, а не превосходство на море. При двух недоступных направлениях новые заморские проекты приостановлены."
