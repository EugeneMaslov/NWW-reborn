 ENG_nww_irish_future_desc:0 "Согласие Дублина на Белфастское соглашение позволяет обсуждать будущее острова. Любое изменение границы потребует отдельного договора, мирных условий и фактического британского контроля над передаваемой территорией."
 ENG_nww_industrial_survey:0 "Обследование старых предприятий"
