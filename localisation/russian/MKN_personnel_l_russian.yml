l_russian:
 NWW_MKN_eugen:0 "Евген"
 NWW_MKN_eugen_desc:0 "Молодой командир, выросший из пехотных отрядов Вольной территории. Для Евгена взаимодействие отделений, разведка и вынос раненых важнее красивой атаки. Он может одновременно командовать армией и служить советником высшего командования."
 NWW_MKN_eugen_high_command:0 "Евген"
 mkn_eugen_infantry_master:0 "Мастер пехотной войны"
 mkn_eugen_infantry_master_desc:0 "Сочетает огонь и движение, бережёт пехоту и быстро возвращает подразделения в строй. Назначение требует создания степного генерального штаба."
 mkn_eugen_under_fire:0 "Своих не бросаем"
 mkn_eugen_under_fire_desc:0 "Командир, лично вернувшийся за людьми под обстрелом, заслужил доверие своей пехоты. Усиливает только подчинённые ему дивизии."
 MKN_eugen_under_fire_tt:0 "Евген получает черту §YСвоих не бросаем§!: §G+5%§! к восстановлению организации и §G+5%§! к разведке подчинённых ему дивизий."
 MKN_dmitruk_tratishov:0 "Дмитрук Тратишов"
 MKN_eugen_no_one_left_behind:0 "Никого не оставим в окопах"
 MKN_eugen_no_one_left_behind_desc:0 "История о спасении двух связисток придала солдатам уверенность: штаб потребует держать рубеж, но не бросит людей. Временный подъём боевого духа на 90 дней."
 MKN_eugen_instructor_courses:0 "Курсы взаимовыручки Евгена"
 MKN_eugen_instructor_courses_desc:0 "Фронтовые инструкторы обучают пехоту движению под огнём, прикрытию санитаров и восстановлению связи. Программа действует 180 дней; постоянный армейский дух развивается отдельно через фокусы."
 mkn_personnel.1.t:0 "Двое на дне окопа"
 mkn_personnel.1.d:0 "После обстрела передовой узел связи замолчал. Две офицерки-связистки остались в осыпавшемся окопе: одна была оглушена, другая прижимала повреждённую руку и не могла выбраться. Пока расчёты переносили огонь на склон, Евген провёл небольшую группу по слепой зоне между воронками. Он спустился к связисткам, проверил, живы ли они, и позвал санитаров. Обеих вынесли до нового налёта; резервный кабель вернул связь батальонам.\n\nНа снимке фронтового корреспондента — Евген у края воронки, две фигуры на земле и дым за спиной. Газеты уже просят разрешения напечатать фотографию. Сам генерал прислал в штаб короткую записку: «Нужен не мой портрет. Нужны люди, умеющие прикрыть товарища и вынести раненого»."
 mkn_personnel.1.a:0 "Пусть каждый солдат знает: за ним вернутся."
 mkn_personnel.1.b:0 "Выделить средства на фронтовые инструкторские курсы."
 mkn_personnel_news.1.t:0 "Генерал Евген возвращается за связистками"
 mkn_personnel_news.1.d:0 "Фронтовые газеты опубликовали фотографию из Вольной территории: генерал Евген стоит в дымящемся окопе рядом с двумя офицерками-связистками, которых его группа готовится эвакуировать. По сообщению военного штаба, обе пережили обстрел и были доставлены к медикам; работа узла связи возобновилась по резервной линии.\n\nСнимок привлёк внимание к пехотному командиру, настаивающему на прикрытии санитаров и взаимовыручке малых групп. Зарубежные наблюдатели осторожны в оценках газетных героев, но для солдат территории у этой истории простое содержание: своих не оставляют на дне окопа."
 mkn_personnel_news.1.a:0 "Эта фотография дойдёт до каждой роты."
 mkn_personnel_news.1.b:0 "Лицо войны, которое запомнят."
