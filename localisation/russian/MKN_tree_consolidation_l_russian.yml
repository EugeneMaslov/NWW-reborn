l_russian:
 MKN_column_medical_service:0 "Санитарные колонны и пополнения"
 MKN_column_medical_service_desc:0 "Полевые лазареты и запасные сотни свяжут вольные колонны с родными коммунами. Раненые получат помощь, а подкрепления быстрее займут места в бою."
 MKN_column_medical_service_tt:0 "Постоянно улучшает общий военный дух. Возврат потерь §G+5%§!; скорость вступления подкреплений в бой §G+5 п.п.§!."
 MKN_air_warning_network_focus:0 "Единая сеть воздушного оповещения"
 MKN_air_warning_network_focus_desc:0 "Наземные наблюдатели, телефонные посты и дежурные пары сведут донесения в одну сеть. Перехватчики будут раньше замечать налёт и лучше защищать родное небо."
 MKN_air_warning_network_focus_tt:0 "Постоянно улучшает общий военный дух. Обнаружение при перехвате §G+10%§!; защита в родном небе §G+5%§!."
 MKN_convoy_control_office:0 "Диспетчерская хлебных конвоев"
 MKN_convoy_control_office_desc:0 "Диспетчеры портовых коммун согласуют выходы транспортов, смену охранения и заправку. Хлебные караваны получат надёжный эскорт при меньшем расходе топлива."
 MKN_convoy_control_office_tt:0 "Постоянно улучшает общий военный дух. Эффективность эскорта §G+10%§!; расход топлива флотом §G−5%§!."
 MKN_raider_signal_stations:0 "Сигнальные станции рейдеров"
 MKN_raider_signal_stations_desc:0 "Береговые связные и радиопосты передадут флотилии сведения о чужих караванах. Разрозненные экипажи научатся сходиться для общего удара."
 MKN_raider_signal_stations_tt:0 "Постоянно улучшает общий военный дух. Обнаружение флота §G+10%§!; координация §G+5%§!."
 MKN_underway_refit_artels:0 "Плавучие ремонтные артели"
 MKN_underway_refit_artels_desc:0 "Плавмастерские и тайные рейды позволят спасать повреждённые суда и отрывать их от преследования. Рейдеры вернутся к делу после ремонта, а не останутся на дне."
 MKN_underway_refit_artels_tt:0 "Постоянно улучшает общий военный дух. Вероятность спасения корабля §G+10%§!; скорость отхода §G+5%§!."
