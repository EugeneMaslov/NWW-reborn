l_russian:
 UKR_makhnovist_integration_category:0 "Интеграция бывшей Вольной территории"
 UKR_makhnovist_integration_category_desc:0 "После аннексии махновского государства бывшие территории можно включить в общую систему гражданства. Каждая область требует отдельной администрации."
 UKR_integrate_makhnovist_region:0 "Интегрировать регион [FROM.GetName]"
 UKR_integrate_makhnovist_region_desc:0 "Стоимость: 75 политической власти, срок: 90 дней. Требуются мир, владение и контроль, подчинение выше 30% и сопротивление ниже 25%. По завершении регион станет национальным. Одновременно выполняется один проект. При потере территории, начале войны или восстановлении МКН проект отменяется с возвратом стоимости."
