l_russian:
 MKN_foreign_delegates:0 "Делегаты за рубежом"
 MKN_foreign_delegates_desc:0 "После ухода Батьки за границей должны слышать не отдельную фракцию, а всю Вольную территорию. Сеть сменяемых представителей будет поддерживать постоянные связи при любом правительстве."
 MKN_foreign_delegates_tt:0 "Постоянный дух §YВнешняя служба коммун§!: стоимость поддержания улучшения отношений §G−10%§!."
 MKN_workers_corridors:0 "Коридоры мастерских"
 MKN_workers_corridors_desc:0 "Торговля станками и обмен инженерами откроют двери, которых не открыть одной агитацией. Предложим соседям равноправные технические соглашения. Решение остаётся за получателем."
 MKN_workers_corridors_tt:0 "Внешняя служба коммун: влияние отношений на торговлю §G+10%§!. Открываются предложения обмена промышленными специалистами с Литвой-Беларусью, Австрией, Германией, Османской империей и Венгрией за §Y50 PP§!. При согласии обе стороны получают одну скидку §G50%§! на промышленное исследование и §G+30§! к взаимному мнению."
 MKN_consular_communes:0 "Коммуны взаимной защиты"
 MKN_consular_communes_desc:0 "Наши моряки, рабочие и переселенцы не должны оставаться без помощи за границей. Постоянные бюро займутся документами, посредничеством и возвращением граждан домой."
 MKN_consular_communes_tt:0 "Внешняя служба коммун: ежемесячное улучшение отношений §G+10%§!."
 MKN_solidarity_guarantees:0 "Гарантии солидарности"
 MKN_solidarity_guarantees_desc:0 "Подготовим договорные процедуры защиты независимых соседей. Совет сможет выдавать гарантии обычными дипломатическими средствами, а общий конгресс объединит мирные представительства и зарубежные движения."
 MKN_solidarity_guarantees_tt:0 "Внешняя служба коммун: стоимость гарантий независимости §G−10%§!. Открывается мирный путь к Конгрессу свободных народов."
 MKN_foreign_service:0 "Внешняя служба коммун"
 MKN_foreign_service_desc:0 "Общая сеть представителей, технических связей и взаимной защиты. Её возможности последовательно расширяются внешнеполитическими фокусами."
 MKN_offer_workshop_exchange:0 "Предложить обмен специалистами: [FROM.GetNameDef]"
 MKN_offer_workshop_exchange_desc:0 "За 50 PP предложим независимому партнёру взаимный обмен промышленными специалистами. Он может согласиться или отказать. Для каждой страны соглашение заключается один раз; повторное предложение после отказа доступно через 180 дней."
 MKN_workshop_exchange_offer_tt:0 "Партнёр получит предложение: при согласии обе стороны получат одну промышленную скидку §G50%§! и §G+30§! к взаимному мнению."
 MKN_workshop_exchange_opinion:0 "Обмен промышленными специалистами"
 mkn_foreign.1.t:0 "Специалисты из Вольной территории"
 mkn_foreign.1.d:0 "Представители коммун предлагают взаимный обмен промышленными инженерами. Каждая сторона сохранит собственные предприятия и получит доступ к опыту партнёра. Соглашение улучшит отношения и даст обеим сторонам скидку 50% на одно промышленное исследование."
 mkn_foreign.1.a:0 "Принять предложение."
 mkn_foreign.1.b:0 "Отказаться от обмена."
