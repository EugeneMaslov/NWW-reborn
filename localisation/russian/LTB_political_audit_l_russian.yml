 LTB_union_defence_category:0 "Резервы Союза"
 LTB_union_defence_category_desc:0 "После Виленского компромисса объединённый штаб может согласовать расширение призывного учёта."
 LTB_expand_reserve_register:0 "Расширить резервный учёт"
 LTB_expand_reserve_register_desc:0 "За 75 политической власти и 60 дней перейти от добровольной или разоружённой армии к ограниченному призыву (2.5% населения). Доступно с 1938 года при сохранённом Союзе и поддержке войны выше 25%. Люди поступают через обычную мобилизацию; оружие необходимо произвести."
