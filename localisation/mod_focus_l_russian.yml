 UKR_breadbasket_of_the_union: "Житница Союза"
 UKR_breadbasket_of_the_union_desc: "Украинский хлеб кормит революцию."
 ltb.100.t: "Компромисс подписан"
 ltb.100.d: "В Вильно литовские и белорусские делегаты обнимаются. Союз будет жить."
 ltb.100.a: "За Союз!"
 ltb.101.t: "Волнения в Каунасе"
 ltb.101.d: "Литовские националисты маршируют по Каунасу, требуя конца Союза. Минск отвечает контрдемонстрациями. Надо что-то делать."
 ltb.101.a: "Созвать Великий сейм"
 ltb.102.t: "Сейм заседает"
 ltb.102.d: "Полгода речей. Делегаты требуют окончательного ответа."
 ltb.102.a: "Союз спасён"
 ltb.102.b: "Дошло до этого"
 ltb.104.t: "Час решения"
 ltb.104.d: "Правительство должно раз и навсегда решить национальный вопрос."
 ltb.104.a: "Подтвердить компромисс"
 ltb.104.b: "Компромисса не будет"
 mkn.1.t: "Съезд «Набата»"
 mkn.1.d: "Анархисты со всего юга собираются в Гуляй-Поле. Чёрное знамя реет над степью."
 mkn.1.a: "Да здравствует анархия!"
 mkn.2.t: "Киев возражает"
 mkn.2.d: "Правительство в Киеве требует, чтобы Повстанческая армия разоружилась и подчинилась Республике."
 mkn.2.a: "Никогда!"
 mkn.2.b: "Уступить пока"
