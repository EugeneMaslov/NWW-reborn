 ltb.110.t: "Великий развод"
 ltb.110.d: "Литовско-Белорусский союз распался. Литва и Беларусь стали независимыми государствами, а прежняя федерация прекратила существование. Европа наблюдает, как обе страны создают новые правительства."
 ltb.110.a: "Поздравляем разведённых!"
 mkn.3.t: "Граница тлеет"
 mkn.3.d: "Наши отряды прощупывают киевские заставы. Земля за рекой — украинская, её обрабатывают украинцы, — она должна быть вольной."
 mkn.3.a: "Прощупать их!"
 mkn.4.t: "Столкновения на границе"
 mkn.4.d: "Махновские отряды вступили в ограниченное приграничное сражение с украинскими пограничниками. Киев требует ответа."
 mkn.4.a: "Мы ответим!"
 mkn.5.a: "Победа в приграничном конфликте"
 mkn.6.a: "Приграничный конфликт завершён"
