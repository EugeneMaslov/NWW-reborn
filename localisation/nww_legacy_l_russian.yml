 NWW_foreign_contract:0 "Промышленный договор принят партнёром"
 NWW_danubian_agreement:0 "Дунайское соглашение принято обеими странами"
 NWW_legacy_trade:0 "Промышленное сотрудничество"
 NWW_Danubian_research_name:0 "Дунайская исследовательская сеть"
 NWW_Danubian_research_desc:0 "Австрия и Венгрия обмениваются исследованиями на основе добровольного договора. Во время войны между участниками обмен не действует."
 nww_legacy.1.t:0 "Предложение промышленного сотрудничества"
 nww_legacy.1.d:0 "Государство [FROM.GetName] предлагает оплатить техническую миссию и поставку оборудования. Согласие позволит партнёру открыть военное предприятие и освоить новые производственные методы."
 nww_legacy.1.a:0 "Согласиться на контракт"
 nww_legacy.1.b:0 "Отклонить предложение"
 nww_legacy.2.t:0 "Промышленный договор принят"
 nww_legacy.2.d:0 "Партнёр одобрил техническую миссию. Оплаченное оборудование направляется на строительство предприятия, а специалисты приступают к передаче производственных знаний."
 nww_legacy.2.a:0 "Начать совместную программу"
 nww_legacy.3.t:0 "Дунайский научный договор"
 nww_legacy.3.d:0 "Государство [FROM.GetName] предлагает совместную исследовательскую сеть. Участники сохранят собственные правительства, армии и территории."
 nww_legacy.3.a:0 "Подписать добровольное соглашение"
 nww_legacy.3.b:0 "Сохранить отдельные программы"
 nww_legacy.4.t:0 "Предложение отклонено"
 nww_legacy.4.d:0 "Партнёр отказался от предлагаемого договора. Согласованные награды и совместные программы не вступят в силу."
 nww_legacy.4.a:0 "Продолжить самостоятельное развитие"
 nww_legacy.5.t:0 "Дунайский договор подписан"
 nww_legacy.5.d:0 "Обе страны согласились на совместную исследовательскую сеть. Договор ускорит изучение технологий, уже известных другому участнику."
 nww_legacy.5.a:0 "Открыть научный обмен"
