 TUR_reform_the_army:0 "Реформа армии"
 TUR_reform_the_army_desc:0 "Несмотря на долгую историю нашего государства, наша армия слаба и не может равняться на современные европейские страны. Нам нужны реформы, это начало нашего движения к великой идее."
 TUR_political_rw:0 "Развивать политику"
 TUR_political_rw_desc:0 "Для Турции сейчас главное усилить свою внешнюю политику и договориться с другими странами"
 TUR_prom:0 "Развитие индустрии"
 TUR_prom_desc:0 "Нам нужна промышленность - это залог светлого будущего."
 TUR_air_1:0 "Развитие авиации"
 TUR_air_1_desc:0 "Развитие авиации важно для Турции, это залог успешной войны без больших потерь армии"
 TUR_new_fascism:0 "Турецкий национализм"
 TUR_new_fascism_desc:0 "Согласуем эту программу с учреждениями империи и обеспечим её ресурсами."
 TUR_set_capital:0 "Возвращение в Константинополь"
 TUR_set_capital_desc:0 "Согласуем эту программу с учреждениями империи и обеспечим её ресурсами."
 TUR_dux_national:0 "Национальный дух"
 TUR_dux_national_desc:0 "Наша национальность - высшая ценность. Мы дойдём до любой цели, несмотря на средства"
 TUR_not_fascism:0 "Конституционный султанат"
 TUR_not_fascism_desc:0 "Согласуем эту программу с учреждениями империи и обеспечим её ресурсами."
 tur_bred:0 "Права и свобода"
 tur_bred_desc:0 "Объявить о правах и свободе внутри государства нашим гражданам"
 tur_polos:0 "Свободные выборы"
 tur_polos_desc:0 "Да, выборов у нас нет, но кто сказал, что всё будет максимально демократично"
 TUR_proper_stoper:0 "Турция - превыше всего"
 TUR_proper_stoper_desc:0 "Зачем нам эти все союзники, если мы сами можем сделать всё и только для себя"
 TUR_kosa_smerti:0 "Балканская военная программа"
 TUR_kosa_smerti_desc:0 "Согласуем эту программу с учреждениями империи и обеспечим её ресурсами."
 TUR_store_eng:0 "Европейские дипломатические миссии"
 TUR_store_eng_desc:0 "Союзники помогут нам в случае любой проблемы, поэтому это необходимо"
 TUR_new_dem:0 "Другой путь"
 TUR_new_dem_desc:0 "Путь демократии в других странах не напоминает реальную демократию, мы создадим свою"
 TUR_new_communism:0 "Зачем умирать за..."
 TUR_new_communism_desc:0 "Мы согласны со своими претензиями, но Ирак нам не нужен - это наши товарищи"
 TUR_new_economic:0 "Экономический план"
 TUR_new_economic_desc:0 "Нужно спровоцировать правительство на создание нового эффективного экономического плана для реабилитации экономики"
 TUR_resourse_icons:0 "Добыча ресурсов"
 TUR_resourse_icons_desc:0 "Нужно позаботиться о развитии ресурсной базы страны и вложиться в перспективные проекты рудников и сельскохозяйственных угодий в Анатолии"
 TUR_Factory_2:0 "Работа с населением"
 TUR_Factory_2_desc:0 "Нам нужно призвать население работать во благо родине"
 TUR_Infrastructure_up:0 "Дорожная сеть"
 TUR_Infrastructure_up_desc:0 "Инфраструктура страны в очень ужасном состоянии, надо исправить это"
 TUR_Factory_1:0 "Улучшение условий"
 TUR_Factory_1_desc:0 "Нужно улучшить жизнь в нашей стране ради всеобщего блага и хорошего будущего"
 TUR_Factory_5:0 "Закупка станков"
 TUR_Factory_5_desc:0 "Надо закупить станки у Европы для наших заводов"
 TUR_Army_Factory_1:0 "Фабрики для армии |"
 TUR_Army_Factory_1_desc:0 "Для нашей армии просто неообходима сильная военная промышленность"
 TUR_civ_factory_1:0 "Фабрики |"
 TUR_civ_factory_1_desc:0 "Увеличение численности населения требует ещё большей гражданской промышленности"
 TUR_civ_factory_2:0 "Фабрики ||"
 TUR_civ_factory_2_desc:0 "Увеличение численности населения требует ещё большей гражданской промышленности"
 TUR_new_order:0 "Новый порядок"
 TUR_new_order_desc:0 "Реформа производственной среды нужна, и мы её проведём"
 TUR_Factory_3:0 "Приватизация"
 TUR_Factory_3_desc:0 "Приватизация выведет Турецкую промышленность из кризиса и Турецкая экономика расцветёт"
 TUR_Factory_6:0 "Мировой рынок"
 TUR_Factory_6_desc:0 "Подключиив свою экономику к мировому рынку, мы улучшим свою экономику"
 TUR_capitalism_1:0 "Политика приватизации"
 TUR_capitalism_1_desc:0 "Политика приватизации приносит свои плоды государству, благодаря им, наше государство всё чаще рассматривается иностранными инвесторами для открытия бизнесса"
 TUR_capitalism_4:0 "Привлечение инвесторов"
 TUR_capitalism_4_desc:0 "Инвесторы для государства очень выжны, без них наша экономика - ничто"
 TUR_capitalism_2:0 "Создание НФТ"
 TUR_capitalism_2_desc:0 "Создание национального фонда Турции поможет малым инвесторам и малому бизнесу базис для развития"
 TUR_capitalism_3:0 "Вложения в НФТ"
 TUR_capitalism_3_desc:0 "НФТ требует регулярных вложений со стороны частного сектора либо государства, пока фонд не имеет поклонников, мы должны увеличить его финансирование"
 TUR_capitalism_5:0 "Создание ИПТ"
 TUR_capitalism_5_desc:0 "Инвестиционный Портфель Турции (ИТП) - это ряд мероприятий для привлечения инвестиций в страну"
 TUR_Factory_4:0 "Национализация"
 TUR_Factory_4_desc:0 "Национализация даст нам контроль над промышленностью и мы сможем построить великую промышленность сами"
 TUR_Factory_7:0 "Создание ТАС"
 TUR_Factory_7_desc:0 "Создание Турецкой Антимонопольной Службы (ТАС) даст государтсвенным небольшим концернам свободу на внутреннем рынке"
 TUR_nationalist_1:0 "Безопасность экономики"
 TUR_nationalist_1_desc:0 "Экономика нуждается в сильной руке государства, нам нужно решить проблему безопасности и стабильности раз и навсегда"
 TUR_nationalist_3:0 "Реабилитация ННСП"
 TUR_nationalist_3_desc:0 "Сторонники ННСП(Национальный народный союз промышленников) подняли бунт в 1928 и 1929 против правительства Турции и султана, но не слишком ли мы погорячились, посадив всю организацию за решетку?"
 TUR_nationalist_2:0 "Расширение ТАС"
 TUR_nationalist_2_desc:0 "Очевидно, наша организация ТАС слишком мала для государственного контроля, это стоит исправить"
 TUR_nationalist_4:0 "Национальная гордость"
 TUR_nationalist_4_desc:0 "Наша гордость - наша религия"
 TUR_nationalist_5:0 "Разработка ресурсов"
