 ltb.120.t:0 "Новый общественный договор"
 ltb.120.d:0 "Национальный кризис пережит. Принятая политическая программа теперь закреплена в учреждениях Союза. Литва и Беларусь сохраняют общее государство, но его дальнейшее развитие определяется избранным курсом."
 ltb.120.a:0 "Закрепить новый порядок"
 mkn.20.t:0 "Степь определила своё будущее"
 mkn.20.d:0 "Съезды, полковые собрания и городские советы завершили спор о власти. Новое устройство определяет управление хозяйством и ответственность перед общинами. Пограничные угрозы остаются, но внутренний курс теперь ясен."
 mkn.20.a:0 "Приступить к работе"
