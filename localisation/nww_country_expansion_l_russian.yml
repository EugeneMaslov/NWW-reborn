l_russian:
 LTB_vilnius_university:0 "Виленский университет"
 LTB_vilnius_university_desc:0 "Виленский университет объединит кафедры, лаборатории и подготовку инженеров для обоих народов Союза."
 LTB_union_research_council:0 "Союзный исследовательский совет"
 LTB_union_research_council_desc:0 "Совет объединит университеты Минска и Вильно и создаст постоянную исследовательскую группу."
 LTB_precision_engineering:0 "Точное машиностроение"
 LTB_precision_engineering_desc:0 "Радиотехника и станкостроение превратят университетские разработки в серийное производство."
 LTB_belmash_tank_program:0 "Танковая программа «Белмаш»"
 LTB_belmash_tank_program_desc:0 "«Белмаш» наладит производство лёгких бронированных машин и создаст ремонтную базу армии Союза."
 LTB_motorized_reserves:0 "Моторизованный резерв"
 LTB_motorized_reserves_desc:0 "Мобильные резервы свяжут литовские и белорусские оборонительные районы."
 LTB_mogilev_artillery_school:0 "Могилёвская артиллерийская школа"
 LTB_mogilev_artillery_school_desc:0 "Могилёвский завод и инструкторы подготовят расчёты современной полевой артиллерии."
 LTB_joint_maneuvers:0 "Общесоюзные манёвры"
 LTB_joint_maneuvers_desc:0 "Проверим взаимодействие пехоты, артиллерии и резервов на общих учениях."
 LTB_minsk_aircraft_works:0 "Минск-аир"
 LTB_minsk_aircraft_works_desc:0 "Минские авиамастерские наладят выпуск учебных машин и истребителей, а также ремонт самолётов Союза."
 LTB_fighter_command:0 "Истребительное командование"
 LTB_fighter_command_desc:0 "Единая сеть наблюдения и истребительных частей прикроет города Союза."
 LTB_army_air_support:0 "Авиационная поддержка армии"
 LTB_army_air_support_desc:0 "Штурмовая авиация получит общие процедуры связи с наземными войсками."
 LTB_baltic_escort_program:0 "Балтийские эскорты"
 LTB_baltic_escort_program_desc:0 "Небольшие эскортные корабли защитят торговлю лучше престижного линейного флота."
 LTB_coastal_defense_network:0 "Береговая оборона"
 LTB_coastal_defense_network_desc:0 "Батареи и флотилия прикроют Курляндские порты и подходы к верфям."
 MKN_technical_communes:0 "Технические коммуны"
 MKN_technical_communes_desc:0 "Учёные и мастера создадут общую сеть технических школ, доступную при любой форме хозяйства."
 MKN_polytechnic_institute:0 "Вольный политехникум"
 MKN_polytechnic_institute_desc:0 "Инженерное образование даст артелям свои станки, измерительные приборы и специалистов."
 MKN_communal_research_network:0 "Сеть исследовательских коммун"
 MKN_communal_research_network_desc:0 "Свяжем лаборатории промышленных коммун и создадим дополнительную исследовательскую группу. Общая программа институтов рассчитана на пять ячеек; шестая появится после интеграции Украины и Киевского научного обмена."
 MKN_advanced_research:0 "Высшая техническая школа"
 MKN_advanced_research_desc:0 "Кафедры авиации и металлургии подготовят следующую исследовательскую группу для единой сети институтов. Общий предел программы — шесть ячеек."
 MKN_artillery_artels: "Артиллерийские артели"
 MKN_artillery_artels_desc: "Никопольские артели наладят орудия для сопровождения наступающей пехоты."
 MKN_mobile_supply_columns: "Моторизованные обозы"
 MKN_mobile_supply_columns_desc: "Грузовики и заправщики будут следовать за наступающей бронёй."
 MKN_aircraft_artels: "Артели истребителей"
 MKN_aircraft_artels_desc: "Лёгкие планеры артели «Степной сокол» приспособят для манёвренного перехвата."
 MKN_black_sea_escorts: "Черноморские эскорты"
 MKN_black_sea_escorts_desc: "Лёгкие эскорты Херсонской артели будут держать строй вокруг конвоя."
 LTB_constitutional_crown:0 "Конституционная корона"
 LTB_constitutional_crown_desc:0 "Политическая программа завершена: новое устройство закрепляет порядок и распределение полномочий."
