l_russian:
 MKN_ukrainian_communes_congress:0 "Съезд украинских коммун"
 MKN_ukrainian_communes_congress_desc:0 "Война закончилась, но власть над областями ещё не стала общим договором. Созовём делегатов всех бывших украинских земель и определим порядок добровольного самоуправления."
 MKN_southern_commune_charters:0 "Хартии южных коммун"
 MKN_southern_commune_charters_desc:0 "Одесса, Николаев и Балта примут местные хартии и станут национальными областями. Согласованные склады уменьшат потребление снабжения."
 MKN_right_bank_councils:0 "Советы Правобережья"
 MKN_right_bank_councils_desc:0 "Советы Житомирщины, Подолии и Правобережья получат признанное представительство. Национализация четырёх областей и постоянная стабильность заменят чрезвычайное управление."
 MKN_northern_delegates:0 "Мандаты северных волостей"
 MKN_northern_delegates_desc:0 "Глухов и бывшая украинская область Лиски отправят своих делегатов. Местные мандаты обеспечат национализацию, добровольцев и политический доход."
 MKN_dnieper_workshop_federation:0 "Федерация днепровских мастерских"
 MKN_dnieper_workshop_federation_desc:0 "Киев и Черкассы войдут в хозяйственную федерацию на правах национальных областей. Восстановленная оружейная линия и общий портфель заказов усилят выпуск."
 MKN_ukrainian_rail_reconstruction:0 "Восстановление украинских магистралей"
 MKN_ukrainian_rail_reconstruction_desc:0 "После согласования всех региональных хартий ремонтные артели свяжут Одессу, Киев и Глухов. Постоянные бонусы строительства и ремонта развивают общий хозяйственный дух."
 MKN_kyiv_scientific_exchange:0 "Киевский научный обмен"
 MKN_kyiv_scientific_exchange_desc:0 "Объединим киевские школы и лаборатории с двумя уже созданными исследовательскими сетями коммун. Этот обмен после интеграции Украины создаёт шестую ячейку исследований. Если она уже получена в старом сохранении, вместо неё будут доступны две промышленные скидки 50%."
 MKN_federation_of_free_councils:0 "Федерация вольных советов"
 MKN_federation_of_free_councils_desc:0 "Региональные договоры станут общим федеративным уставом. Стабильность, снабжение и производственная эффективность закрепят интеграцию через единый хозяйственный дух."
 MKN_allied_war_guard_tt:0 "Нельзя объявить войну союзнику по общему блоку или нарушить принятый договор равной автономии MKN."
 MKN_AI_BEHAVIOR:0 "Политический курс Махновщины"
 MKN_AI_DEFAULT_DESC:0 "Один из четырёх подготовленных политических маршрутов выбирается случайно с равными шансами один раз за кампанию, независимо от общей настройки исторических фокусов. Исторический курс Цебрия выбирается отдельной настройкой."
 MKN_AI_HISTORICAL:0 "Исторический: синдикалистский договор"
 MKN_AI_HISTORICAL_DESC:0 "Махновщина готовит хозяйственный съезд, устанавливает власть Цебрия и договаривается с СССР. Украинское предложение перемирия почти всегда отклоняется."
 MKN_AI_RANDOM:0 "Случайный политический маршрут"
 MKN_AI_RANDOM_DESC:0 "Равные шансы четырёх маршрутов: военный, вольные советы, крестьянский или синдикалистский. ИИ заранее набирает поддержку выбранного курса через платные кампании."
 MKN_AI_FASCISM:0 "Военный штаб Дмитрука Тратишова"
 MKN_AI_FASCISM_DESC:0 "Выборный военный штаб, устранение демагогов и Чёрная орда. Для перехода ИИ готовит 40% поддержки."
 MKN_AI_DEMOCRATIC:0 "Вольные советы Волина"
 MKN_AI_DEMOCRATIC_DESC:0 "Договор свободных коммун, самооборона и Чёрный интернационал. Для перехода ИИ готовит 40% поддержки."
 MKN_AI_NEUTRALITY:0 "Крестьянские делегаты"
 MKN_AI_NEUTRALITY_DESC:0 "Хлебный ультиматум, сельская автономия и оборона житницы. Для перехода ИИ готовит 40% поддержки."
 MKN_AI_COMMUNISM:0 "Синдикалистский ревком Цебрия"
 MKN_AI_COMMUNISM_DESC:0 "Ревком, устранение непримиримых, платные договоры с СССР и переговоры о равной автономии. Для перехода сохраняется требование 40% поддержки."
 mkn_integration.1.t:0 "Украина после войны"
 mkn_integration.1.d:0 "Все земли бывшей Советской Украины находятся под нашим владением и контролем. Теперь предстоит договориться о представительстве, восстановить хозяйство и заменить военное управление местными хартиями. В дереве открыта ветка украинской интеграции."
 mkn_integration.1.a:0 "Созвать делегатов областей."
 MKN_ukrainian_administration_category:0 "Украинское самоуправление"
 MKN_ukrainian_administration_category_desc:0 "После исчезновения Советской Украины делегаты могут определить место общего политического центра Вольной территории."
 MKN_move_capital_to_kyiv:0 "Перенести столицу в Киев"
 MKN_move_capital_to_kyiv_desc:0 "Перевезём общие учреждения и съезд делегатов из Гуляй-Поля в Киев. Решение стоит 50 политической власти и доступно после исчезновения UKR, если мы владеем Киевом и полностью контролируем его область. Прохождение всей ветки интеграции не требуется."
