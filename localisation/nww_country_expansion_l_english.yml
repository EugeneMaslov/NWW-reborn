 ltb.101.b:0 "Recognize Belarusian independence"
 ltb.101.c:0 "Recognize Lithuanian independence"
 ltb.120.t:0 "A New Social Compact"
 ltb.120.d:0 "The national crisis has been weathered. The political programme is now embodied in Union institutions. Lithuania and Belarus retain a common state whose future follows the chosen course."
 ltb.120.a:0 "Consolidate the new order"
 mkn.20.t:0 "The Steppe Chooses Its Future"
 mkn.20.d:0 "Congresses, regimental assemblies and town councils have settled the question of power. The new institutions determine economic administration and accountability to the communities. Border threats remain, but the internal course is clear."
 mkn.20.a:0 "Begin the work"
