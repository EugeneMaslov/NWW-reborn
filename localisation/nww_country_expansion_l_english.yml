l_english:
 LTB_vilnius_university:0 "Vilnius University"
 LTB_vilnius_university_desc:0 "Vilnius University will unite departments, laboratories and engineering education for both nations of the Union."
 LTB_union_research_council:0 "Union Research Council"
 LTB_union_research_council_desc:0 "A common council links Minsk and Vilnius universities and establishes a permanent research team."
 LTB_precision_engineering:0 "Precision Engineering"
 LTB_precision_engineering_desc:0 "Radio engineering and machine tools turn university research into series production."
 LTB_belmash_tank_program:0 "Belmash Tank Programme"
 LTB_belmash_tank_program_desc:0 "Belmash will produce light armored vehicles and establish repair facilities for the Union army."
 LTB_motorized_reserves:0 "Motorized Reserve"
 LTB_motorized_reserves_desc:0 "Mobile reserves link Lithuanian and Belarusian defensive districts."
 LTB_mogilev_artillery_school:0 "Mogilev Artillery School"
 LTB_mogilev_artillery_school_desc:0 "The Mogilev works and instructors prepare crews for modern field artillery."
 LTB_joint_maneuvers:0 "Union Maneuvers"
 LTB_joint_maneuvers_desc:0 "Joint exercises test infantry, artillery and reserve coordination."
 LTB_minsk_aircraft_works:0 "Minsk Air Works"
 LTB_minsk_aircraft_works_desc:0 "Minsk aircraft workshops will manufacture trainers and fighters and repair the Union's aircraft."
 LTB_fighter_command:0 "Fighter Command"
 LTB_fighter_command_desc:0 "A unified observation and fighter network protects Union cities."
 LTB_army_air_support:0 "Army Air Support"
 LTB_army_air_support_desc:0 "Close support squadrons adopt common communications with ground forces."
 LTB_baltic_escort_program:0 "Baltic Escorts"
 LTB_baltic_escort_program_desc:0 "Small escort ships protect trade routes at a cost the Union can afford."
 LTB_coastal_defense_network:0 "Coastal Defense Network"
 LTB_coastal_defense_network_desc:0 "Coastal batteries and the flotilla cover Courland ports and shipyards."
 MKN_technical_communes:0 "Technical Communes"
 MKN_technical_communes_desc:0 "Scientists and craftsmen establish a technical school network under either economic model."
 MKN_polytechnic_institute:0 "Free Polytechnic"
 MKN_polytechnic_institute_desc:0 "Engineering education supplies the artels with machine tools, instruments and trained specialists."
 MKN_communal_research_network:0 "Communal Research Network"
 MKN_communal_research_network_desc:0 "Connect the industrial communes’ laboratories and establish an additional research team. The common institute programme provides five slots; Ukrainian integration and Kyiv Scientific Exchange provide the sixth."
 MKN_advanced_research:0 "Advanced Technical School"
 MKN_advanced_research_desc:0 "Aviation and metallurgy departments will train another research team for the common institute network. The programme supports up to six slots."
 MKN_artillery_artels: "Artillery Artels"
 MKN_artillery_artels_desc: "Nikopol workshops will manufacture guns to support advancing infantry."
 MKN_mobile_supply_columns: "Motorized Supply Columns"
 MKN_mobile_supply_columns_desc: "Trucks and fuel tenders will follow advancing armoured units."
 MKN_aircraft_artels: "Fighter Artels"
 MKN_aircraft_artels_desc: "Steppe Falcon cooperatives will adapt light airframes for agile interception."
 MKN_black_sea_escorts: "Black Sea Escorts"
 MKN_black_sea_escorts_desc: "Light escorts from the Kherson cooperative will hold formation around convoys."
