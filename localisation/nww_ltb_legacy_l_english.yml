l_english:
 LTB_free_economic_zones:0 "Free Economic Zones"
 LTB_free_economic_zones_desc:0 "Provide industrial sites with dependable rules for investment and exports. A new Kaunas factory and temporary incentives turn private capital into jobs."
 LTB_polesie_peat:0 "Develop Polesie Peat"
 LTB_polesie_peat_desc:0 "Develop the peat deposits of Polesie and supply local fuel to power stations and factory boilers. Domestic resources and more efficient energy use will strengthen the Union's industry."
 LTB_union_mining_program:0 "Union Mining Programme"
 LTB_union_mining_program_desc:0 "Expand factory resource supplies and adopt new extraction techniques. The programme provides steel and trains prospecting specialists."
 LTB_timoshenko_industrial_board:0 "Timoshenko's Industrial Board"
 LTB_timoshenko_industrial_board_desc:0 "Timoshenko's industrial experience helps coordinate military contracts, series production and a new ordnance factory. Local manufacturers gain access to their own expansion programmes."
 LTB_professional_contract_army:0 "A Professional Contract Army"
 LTB_professional_contract_army_desc:0 "A smaller, better-trained professional force forms the Union army's core. Improved organization and training are balanced by a reduction in the available conscription pool."
 LTB_national_resilience:0 "Strengthen National Resolve"
 LTB_national_resilience_desc:0 "Defending a common state must preserve Lithuanian and Belarusian identities. Organize civil defense and strengthen resolve to protect the Union's national territories."
 LTB_minsk_university:0 "Minsk University"
 LTB_minsk_university_desc:0 "Minsk departments complement Vilnius University through shared laboratories and engineering schools. Research gains permanent support and the university concern receives an improved programme."
 LTB_rocket_research:0 "Rocket Technologies"
 LTB_rocket_research_desc:0 "Combine engine and rocket research into a university programme. Engineers need trials and calculations before these technologies can serve the country."
 LTB_peaceful_atom:0 "The Peaceful Atom"
 LTB_peaceful_atom_desc:0 "Establish university atomic-energy research. Training physicists and building laboratories will lay the scientific foundations for the Union's future nuclear and energy projects."
 LTB_french_machine_tools:0 "Purchase French Machine Tools"
 LTB_french_machine_tools_desc:0 "Free economic zones make an equipment order attractive to French manufacturers. If Paris accepts, the paid delivery equips a new civilian enterprise in Minsk."
 LTB_italian_research_exchange:0 "Research Agreement with Italy"
 LTB_italian_research_exchange_desc:0 "Offer Italy a research exchange. If Rome accepts, both countries gain a bonus when researching technologies already known by their partner. War suspends cooperation."
 LTB_multinational_air_program:0 "International Aviation Programme"
 LTB_multinational_air_program_desc:0 "Use an active German, French or Italian agreement for joint aircraft development. Minsk and Courland aircraft manufacturers gain access to specialized development programmes."
 LTB_investment_zones:0 "Investment Zones"
 LTB_investment_zones_desc:0 "Agreed incentives direct capital and orders into civilian industry."
 LTB_peat_energy:0 "Polesie Fuel"
 LTB_peat_energy_desc:0 "Peat supplies and local boilers reduce industrial energy requirements."
 LTB_industrial_mobilization_board:0 "Union Industrial Board"
 LTB_industrial_mobilization_board_desc:0 "Common orders and production standards accelerate the adoption of new lines."
 LTB_contract_officers:0 "Professional Contract Force"
 LTB_contract_officers_desc:0 "Professional training improves organization while limiting mass conscription."
 LTB_national_resilience_idea:0 "Resolve of Two Nations"
 LTB_national_resilience_idea_desc:0 "Lithuanian and Belarusian communities prepare to defend their national territories together."
 LTB_university_network:0 "Union University Network"
 LTB_university_network_desc:0 "Vilnius and Minsk share laboratories, specialists and research results."
 LTB_french_machine_tools_request_tt:0 "Offer France a machine-tool order. Acceptance, requiring 50 political power, grants an industry research bonus and a civilian factory in controlled Minsk."
 LTB_italian_research_request_tt:0 "Offer Italy a reciprocal research exchange. Acceptance adds both countries to a programme granting +5% research speed for a partner that already knows the technology. Cooperation is suspended during war."
 NWW_LTB_italian_research_name:0 "Union-Italian Research Programme"
 NWW_LTB_italian_research_desc:0 "Knowledge exchange between Union and Italian universities accelerates research into technologies already known by a partner."
 LTB_minsk_industry_company_advanced:0 "Union Machine-Tool Association"
 LTB_vilnius_university_concern_company_advanced:0 "Vilnius-Minsk Laboratory Network"
 NWW_LTB_machine_tool_concern:0 "Domestic Machine Tools"
 NWW_LTB_machine_tool_concern_desc:0 "Domestic machine tools improve civilian construction and conserve energy."
 NWW_LTB_machine_tool_concern_advanced:0 "Union Machine-Tool Standard"
 NWW_LTB_machine_tool_concern_advanced_desc:0 "Common standards improve construction, production-line adoption and energy efficiency."
 NWW_LTB_electronics_laboratories:0 "Applied Electronics"
 NWW_LTB_electronics_laboratories_desc:0 "University laboratories turn fundamental research into useful instruments."
 NWW_LTB_university_laboratories:0 "Shared Laboratory Network"
 NWW_LTB_university_laboratories_desc:0 "The Vilnius-Minsk network accelerates research and raises maximum production efficiency."
