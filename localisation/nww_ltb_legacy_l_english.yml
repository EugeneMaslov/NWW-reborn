 ltb.150.t:0 "French Machine Tools for the Union"
 ltb.150.d:0 "The Union offers to pay for machine tools for a new Minsk enterprise. The order connects French manufacturers with Union industrial zones."
 ltb.150.a:0 "Accept the order"
 ltb.150.b:0 "Decline the delivery"
 ltb.152.t:0 "French Equipment Arrives"
 ltb.152.d:0 "Paris has accepted the order. Paid equipment and technical materials enable a new civilian factory in Minsk while the city remains under our control."
 ltb.152.a:0 "Put the equipment to work"
 ltb.151.t:0 "An Offer of Scientific Exchange"
 ltb.151.d:0 "Union universities propose a reciprocal research exchange with Italy. Both sides can study technologies already known by their partner more quickly while retaining independent programmes."
 ltb.151.a:0 "Establish a shared programme"
 ltb.151.b:0 "Keep our research to ourselves"
 ltb.153.t:0 "A Scientific Agreement with Italy"
 ltb.153.d:0 "Rome has approved the proposal. Both countries have joined the shared research programme, which operates while peaceful relations continue."
 ltb.153.a:0 "Exchange the first discoveries"
