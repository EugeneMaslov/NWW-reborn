l_russian:
 LTB_overture_to_moscow_request_tt:0 "Отправить Москве предложение о ненападении. При согласии: пакт, взаимное улучшение отношений и один бонус к исследованиям промышленности. Ответ откроет восточную торговую программу."
 LTB_the_polish_question_request_tt:0 "Предложить Польше признание существующей границы. При согласии: пакт о ненападении, снятие взаимных территориальных претензий, улучшение отношений и доступ к переговорам о взаимных гарантиях. Национальные территории сторон сохраняются."
 LTB_german_engineers_request_tt:0 "Предложить Германии промышленный договор. При согласии и наличии 50 политической власти: инженерная миссия на три года, бонусы к промышленности и электронике, торговые отношения и доступ к поставкам станков. Германия может отказаться."
 LTB_polish_defense_request_tt:0 "Предложить Польше взаимные гарантии независимости. Польша должна отдельно одобрить оборонительный протокол; это также позволит пригласить её в ПБМАТ после создания альянса."
 LTB_dvina_border_commission:0 "Двинская пограничная комиссия"
 LTB_dvina_border_commission_desc:0 "После подписания пакта общая комиссия установит порядок на восточной границе и согласует безопасные маршруты для торговли. Соглашение должно действовать, а отношения — оставаться мирными."
 LTB_polish_defense_protocol:0 "Протокол взаимной обороны"
 LTB_polish_defense_protocol_desc:0 "Урегулирование границы позволяет обсудить следующий шаг: взаимные гарантии независимости перед лицом давления соседних держав. Варшава примет собственное решение."
 LTB_german_machine_tools:0 "Станки из Германии"
 LTB_german_machine_tools_desc:0 "Заключённый промышленный договор обеспечит минские мастерские современными станками. На этой базе откроем новое гражданское предприятие и обучим собственных инженеров."
 LTB_armed_neutrality:0 "Вооружённый нейтралитет"
 LTB_armed_neutrality_desc:0 "Согласие соседей полезно, но суверенитет Союза не должен зависеть от чужой столицы. Завершив первые переговоры, закрепим самостоятельную оборонительную политику. При вступлении в альянс нейтралитет прекращается."
 LTB_eastern_trade:0 "Восточные торговые маршруты"
 LTB_eastern_trade_desc:0 "Пограничная комиссия открыла устойчивые торговые маршруты. Гражданское строительство получает материалы и заказы; война с Москвой прервёт сотрудничество."
 LTB_german_industrial_mission:0 "Германская инженерная миссия"
 LTB_german_industrial_mission_desc:0 "Трёхлетняя программа передачи станков и инженерных навыков ускоряет гражданское строительство и исследования. Миссия покинет Союз при начале войны с Германией."
 LTB_armed_neutrality_idea:0 "Вооружённый нейтралитет"
 LTB_armed_neutrality_idea_desc:0 "Союз сохраняет самостоятельную внешнюю политику и готовит оборону своих границ. Вступление в альянс завершит этот курс."
 NWW_LTB_diplomatic_agreement:0 "Соглашение с Союзом"
 NWW_LTB_trade_partner:0 "Промышленный торговый партнёр"
 ltb.130.t:0 "Предложение Союза о ненападении"
 ltb.130.d:0 "Литовско-Белорусский Союз предлагает Москве закрепить мир на общей границе. Его делегация готова подписать пакт о ненападении и обсудить технический обмен. Это создаст условия для торговой комиссии, но не включит Союз в нашу систему альянсов."
 ltb.130.a:0 "Подписать пакт и принять делегацию"
 ltb.130.b:0 "Мы не готовы связывать себе руки"
 ltb.131.t:0 "Урегулирование границы с Союзом"
 ltb.131.d:0 "Делегация Союза предлагает признать существующую границу и отказаться от взаимных территориальных претензий. Пакт о ненападении позволит обсуждать оборонительное сотрудничество, не передавая ни одной провинции."
 ltb.131.a:0 "Признать границу и подписать пакт"
 ltb.131.b:0 "Претензии остаются в силе"
 ltb.132.t:0 "Промышленный договор с Союзом"
 ltb.132.d:0 "Литовско-Белорусский Союз просит направить инженерную миссию и открыть поставки промышленного оборудования. Он оплатит организацию программы; наши предприятия получат заказы и торгового партнёра между Балтикой и восточными рынками."
 ltb.132.a:0 "Одобрить миссию и поставки"
 ltb.132.b:0 "Наши инженеры нужны дома"
 ltb.133.t:0 "Взаимные гарантии с Союзом"
 ltb.133.d:0 "После урегулирования границы Союз предлагает Польше взаимно гарантировать независимость. Это оборонительное обязательство: нападение на одну сторону позволит другой вступить в её защиту. Решение не создаёт общего альянса автоматически."
 ltb.133.a:0 "Независимость соседа — наша безопасность"
 ltb.133.b:0 "Сохранить свободу действий"
 ltb.134.t:0 "Приглашение в ПБМАТ"
 ltb.134.d:0 "Литовско-Белорусский Союз создал ПБМАТ и приглашает Польшу превратить действующие гарантии в общий оборонительный альянс. При согласии Польша станет полноценным участником союза."
 ltb.134.a:0 "Вступить в ПБМАТ"
 ltb.134.b:0 "Ограничимся существующими гарантиями"
 ltb.140.t:0 "Москва приняла предложение"
 ltb.140.d:0 "Пакт о ненападении подписан. Делегации приступают к техническому обмену, а Союз может создать Двинскую пограничную комиссию и расширить восточную торговлю."
 ltb.140.a:0 "Открыть работу комиссии"
 ltb.141.t:0 "Варшава признала границу"
 ltb.141.d:0 "Польша согласилась на отказ от взаимных территориальных претензий и подписала пакт о ненападении. Ни одна провинция не меняет владельца. Теперь возможны переговоры о взаимных гарантиях независимости."
 ltb.141.a:0 "Следующий шаг — безопасность"
 ltb.142.t:0 "Германская миссия прибывает"
 ltb.142.d:0 "Промышленный договор одобрен. Союз оплатил организацию трёхлетней миссии, получил технические материалы и доступ к поставкам станков для новых минских предприятий."
 ltb.142.a:0 "Приступить к модернизации"
 ltb.143.t:0 "Переговоры не дали соглашения"
 ltb.143.d:0 "Иностранная делегация отклонила наше предложение. Предполагавшиеся договорные награды и продолжение программы не получены. Союз может обратиться к другим соседям и укреплять вооружённый нейтралитет."
 ltb.143.a:0 "Суверенитет остаётся за нами"
 ltb.144.t:0 "Оборонительный протокол подписан"
 ltb.144.d:0 "Польша и Союз взаимно гарантировали независимость. После создания ПБМАТ Варшаве можно будет предложить участие в общем оборонительном альянсе."
 ltb.144.a:0 "Закрепить обязательства"
 ltb.145.t:0 "Польша вступает в ПБМАТ"
 ltb.145.d:0 "Варшава приняла приглашение. Двусторонние гарантии стали основой общего альянса, и Польша присоединилась к ПБМАТ."
 ltb.145.a:0 "Теперь мы действуем вместе"
