 ENG_nww_treaty_diplomacy:0 "Diplomacy by Treaty"
 ENG_nww_treaty_diplomacy_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_constitutional_crown:0 "A Crown of Constitutional Consent"
 ENG_nww_constitutional_crown_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_conference:0 "Convene the Imperial Conference"
 ENG_nww_conference_desc:0 "Canada seeks legal guarantees, Australia Pacific security, and India responsible government. The conference gives them a seat at the table; the treaty still has to be negotiated."
 ENG_nww_federal_defence:0 "Share Defence Obligations"
 ENG_nww_federal_defence_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_federal_budget:0 "Agree the Federal Budget"
 ENG_nww_federal_budget_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_representation:0 "Charter of Representation"
 ENG_nww_representation_desc:0 "A population chamber excluding India would be a qualified promise. A chamber of participants without safeguards for smaller countries would invite resistance. The charter must define both."
 ENG_nww_two_chambers:0 "Two Chambers of the Union"
 ENG_nww_two_chambers_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_ratification:0 "Submit the Treaty for Ratification"
 ENG_nww_ratification_desc:0 "Delegates may agree a text, but local parliaments decide. Each participant receives a separate ratification proposal after preparation. London must accept the possibility of refusal."
 ENG_nww_federal_parliament:0 "Open the Imperial Parliament"
 ENG_nww_federal_parliament_desc:0 "At least two governments must freely ratify the federal treaty. Parliament will open with the agreed membership, preserving participating countries, their armies and local institutions."
