 ENG_nww_labour_election:0 "A Parliamentary Mandate for Reform"
 ENG_nww_labour_election_desc:0 "Support for democracy does not automatically endorse nationalisation and welfare spending. Labour must campaign for its own programme before forming an Attlee cabinet."
