 ENG_nww_bonus_state_stability_factor_0_05:0 "Persistent spirit change: $MODIFIER_STABILITY_FACTOR$: +5%."
 ENG_nww_reward_treaty_diplomacy_tt:0 "Unlocks paid talks with Germany, the United States and the Ottoman Empire. Each recipient may accept or decline."
 ENG_nww_reward_conference_tt:0 "Unlocks the decision to open an Imperial Conference session."
 ENG_nww_reward_ratification_tt:0 "Unlocks federal ratification decisions. Offers require a trade compact, 65 trust and the year 1938; India also requires responsible government."
