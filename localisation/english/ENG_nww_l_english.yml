 ENG_nww_air_service:0 "Royal Air Force Charter"
 ENG_nww_air_service_desc:0 "The independent air service grew from observation, mail and colonial units. Its future depends on trained crews and coordinated command."
 ENG_nww_pilot_reserve:0 "Aircrew Reserve"
 ENG_nww_pilot_reserve_desc:0 "The independent air service grew from observation, mail and colonial units. Its future depends on trained crews and coordinated command."
 ENG_nww_fighter_command:0 "Fighter Command"
 ENG_nww_fighter_command_desc:0 "Industrial districts need a system that detects raids and directs interceptors in time. Fighter Command will receive priority in air-service development."
 ENG_nww_bomber_command:0 "Bomber Command"
 ENG_nww_bomber_command_desc:0 "Long-range aviation must threaten an opponent’s industry. Crew preparation, navigation and heavy aircraft require a dedicated programme."
