 ENG_nww_blackshirts:0 "British Union of Fascists"
 ENG_nww_blackshirts_desc:0 "Mosley built his movement on industrial discontent and promises of imperial discipline. Taking power requires forty percent support and an organised movement. Low stability risks civil war."
 ENG_nww_directory:0 "Conservative Directorate"
 ENG_nww_directory_desc:0 "Some Conservatives propose handing executive authority to a National Defence Council. Officer backing must be accompanied by public support; parliamentary opponents may refuse to recognise the new order."
