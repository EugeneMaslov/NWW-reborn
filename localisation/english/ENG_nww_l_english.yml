l_english:
 ENG_nww_report:0 "The State of the Empire"
 ENG_nww_report_desc:0 "The July Crisis of 1914 ended at the negotiating table. Britain retained her fleet, markets and prestige, but Europe kept changing. The cabinet must learn the price of every commitment."
 ENG_nww_session:0 "Open the Parliamentary Session"
 ENG_nww_session_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_budget:0 "The Crown and Commitments Budget"
 ENG_nww_budget_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_continuity:0 "Constitutional Continuity"
 ENG_nww_continuity_desc:0 "The constitution rests on accepted limits to power. The cabinet will remain responsible to the Commons while reviewing obligations London can no longer meet alone."
 ENG_nww_federal:0 "Share Imperial Sovereignty"
 ENG_nww_federal_desc:0 "Federation demands concessions from Britain itself. Common defence and finance can endure only when Westminster gives up its exclusive right to decide."
 ENG_nww_emergency:0 "National Recovery Committee"
 ENG_nww_emergency_desc:0 "Radicals promise an end to parliamentary delay. Industrialists and officers are listening, but emergency powers will inevitably raise the question of who controls the government."
 ENG_nww_labour:0 "A Mandate for Working Britain"
 ENG_nww_labour_desc:0 "Mining districts and working-class neighbourhoods demand a share of imperial wealth. Labour needs a programme mandate within the democratic majority to make reform endure."
 ENG_nww_island:0 "The Island before the Empire"
 ENG_nww_island_desc:0 "Distant bases bring influence and permanent bills. The island programme offers a negotiated transfer of commitments and investment in security and welfare at home."
 ENG_nww_majority:0 "A Responsible Majority"
 ENG_nww_majority_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_civil_service:0 "Reform the Colonial Service"
 ENG_nww_civil_service_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_premiers:0 "Council of Prime Ministers"
 ENG_nww_premiers_desc:0 "Dominion prime ministers must discuss common commitments before they are announced. The council opens paid conferences where each participant may accept or reject an offer."
 ENG_nww_local_parliaments:0 "Guarantees for Local Parliaments"
 ENG_nww_local_parliaments_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
