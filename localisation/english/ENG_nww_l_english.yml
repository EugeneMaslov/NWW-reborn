 ENG_nww_labour_campaign_desc:0 "35 political power; 35 days. Adds 10 programme mandate or 10 percentage points of party support."
 ENG_nww_fascist_campaign:0 "Nationalist Meetings"
 ENG_nww_fascist_campaign_desc:0 "35 political power; 35 days. Adds 10 programme mandate or 10 percentage points of party support."
