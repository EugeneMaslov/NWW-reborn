 ENG_nww_quality:0 "Quality Armament Standards"
 ENG_nww_quality_desc:0 "Acceptance boards will demand consistent specifications and reproducible quality. Firms need time to raise the efficiency ceiling of their production lines."
 ENG_nww_mass_contracts:0 "Mobilisation Contracts"
 ENG_nww_mass_contracts_desc:0 "Simplified orders allow output to expand faster. Initial retooling will temporarily reduce production before mass contracts deliver results."
 ENG_nww_vickers:0 "Vickers-Armstrong Workshops"
 ENG_nww_vickers_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
