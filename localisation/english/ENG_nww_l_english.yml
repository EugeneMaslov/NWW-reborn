 ENG_nww_island_housing:0 "Funds for British Cities"
 ENG_nww_island_housing_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_armed_neutrality:0 "Armed Neutrality"
 ENG_nww_armed_neutrality_desc:0 "Neutrality requires completing transfers to dependent governments and leaving the old alliance structure. Britain can then concentrate military planning on its own shores."
 ENG_nww_home_charter:0 "Charter of the Island State"
 ENG_nww_home_charter_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_irish_report:0 "The Unfinished Irish Treaty"
 ENG_nww_irish_report_desc:0 "Irish independence followed a pre-war constitutional struggle. British administration and rival national projects coexist in Ulster. Border incidents threaten both governments."
 ENG_nww_border_inquiry:0 "Investigate the Border Incidents"
 ENG_nww_border_inquiry_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_irish_talks:0 "Open Talks with Dublin"
 ENG_nww_irish_talks_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_belfast:0 "The Belfast Agreement"
 ENG_nww_belfast_desc:0 "A joint commission, community representation and legal guarantees may stop border escalation. Dublin receives the draft and may decline, requiring fresh mediation."
 ENG_nww_irish_emergency:0 "Emergency Administration in Ulster"
 ENG_nww_irish_emergency_desc:0 "Emergency administration can temporarily restore order. Additional garrisons impose political costs while unresolved community demands continue to increase tension."
 ENG_nww_community_rights:0 "Guarantees for Both Communities"
 ENG_nww_community_rights_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_irish_commission:0 "Joint Border Commission"
 ENG_nww_irish_commission_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_ulster_police:0 "Reform the Ulster Police"
 ENG_nww_ulster_police_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_ulster_review:0 "Return to Civilian Government"
 ENG_nww_ulster_review_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_irish_future:0 "A Treaty on the Future of the Island"
 ENG_nww_irish_future_desc:0 "Dublin’s agreement to the Belfast settlement permits discussion of the island’s future. Any border change requires a separate treaty, peace, and actual British control over the territory transferred."
 ENG_nww_industrial_survey:0 "Survey the Old Industries"
 ENG_nww_industrial_survey_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_coalfields:0 "Modernise the Coalfields"
 ENG_nww_coalfields_desc:0 "British coal supremacy survives in the reports of an earlier generation. New workings and machinery must supply the energy system before industrial demand rises."
 ENG_nww_machine_tools:0 "New Machine Tools for the Midlands"
 ENG_nww_machine_tools_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_electric_grid:0 "Connect the Electricity Grid"
 ENG_nww_electric_grid_desc:0 "Fragmented grids and obsolete stations make industrial expansion costly. An integrated distribution system will improve use of the country’s energy base."
 ENG_nww_northern_cities:0 "Revive the Northern Cities"
 ENG_nww_northern_cities_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_freight_routes:0 "Freight Corridors"
 ENG_nww_freight_routes_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_industrial_standards:0 "Common Industrial Standards"
 ENG_nww_industrial_standards_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_free_trade:0 "Imperial Free Trade Area"
 ENG_nww_free_trade_desc:0 "A common market may preserve British influence as political dependency changes. Procurement, standards and market access must become reciprocal agreements."
 ENG_nww_protection:0 "A Protected British Market"
 ENG_nww_protection_desc:0 "Tariffs and procurement will shelter metropolitan firms from foreign competition. Dominions will see a reminder of whose interests London places first."
 ENG_nww_civil_reconstruction:0 "Complete Industrial Reconstruction"
 ENG_nww_civil_reconstruction_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_imperial_investment:0 "Imperial Investment Bank"
 ENG_nww_imperial_investment_desc:0 "Protected markets have sustained our firms for decades. Equipment, energy and labour must now restore their ability to compete."
 ENG_nww_canadian_corridors:0 "Canadian Transport Corridors"
 ENG_nww_canadian_corridors_desc:0 "Canadian industry needs reliable links between the interior and ports. This focus prepares a credit programme; funds and construction capacity require a separate decision and Ottawa’s consent."
 ENG_nww_indian_electricity:0 "Indian Electrification"
 ENG_nww_indian_electricity_desc:0 "Indian industry needs power and productive capacity of its own. This programme opens paid investment without replacing negotiations on responsible government."
 ENG_nww_commercial_ports:0 "Ports of World Trade"
