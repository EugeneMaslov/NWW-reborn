 ENG_nww_reward_ulster_review_tt:0 "Unlocks paid renewed talks with Dublin and ends the additional monthly tension from coercion."
 ENG_nww_reward_irish_future_tt:0 "Unlocks a negotiated Northern Ireland transfer decision. Ownership, peace and Dublin’s consent are required."
