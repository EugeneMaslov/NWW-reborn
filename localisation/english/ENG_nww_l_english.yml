 ENG_nww_ui_trust_help:0 "Trust: 0–100. Below 25: crisis risk; 40: trade offer threshold; 65: federal offer threshold. Recipients may refuse. Ineligible countries do not fill the gauge."
 ENG_nww_ui_mandate_help:0 "Labour programme mandate: 0–100. An election victory requires 40. A 35-day campaign adds 10 points. Other focus requirements still apply."
 ENG_nww_ui_irish_help:0 "Tension: 0–100. At 70, a crisis starts with a 180-day mission. Reduce tension below 50 or reach an agreement to end the ultimatum. The gauge shows pressure; the status shows the settlement."
 ENG_nww_ui_route_help:0 "Checked daily: key base control by Britain, a faction partner or a country granting military access, plus at least 100 convoys. The Cape requires its preparation focus. This measures base access, not naval supremacy. Two unavailable routes suspend new overseas projects."
