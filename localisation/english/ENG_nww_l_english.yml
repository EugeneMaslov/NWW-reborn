 ENG_nww_defence_mandate:0 "Defend Social Reform"
 ENG_nww_defence_mandate_desc:0 "A 35-day campaign for a defence mandate under external threat removes the pacifist constraint."
 ENG_nww_irish_mediation:0 "Intercommunal Mediation"
 ENG_nww_irish_mediation_desc:0 "Negotiations take 35 days. Losing Northern Ireland cancels an unfinished procedure and refunds its cost."
 ENG_nww_irish_retry:0 "Return to Talks with Dublin"
 ENG_nww_irish_retry_desc:0 "Negotiations take 35 days. Losing Northern Ireland cancels an unfinished procedure and refunds its cost."
 ENG_nww_irish_deadline:0 "Ulster Demands a Settlement"
 ENG_nww_irish_deadline_desc:0 "180 days to reduce tension below 50 or conclude an agreement. Failure deepens the cabinet crisis and opens an armed outcome."
 ENG_nww_border_referendum:0 "Negotiate a Change in Ulster Status"
 ENG_nww_border_referendum_desc:0 "After mutual guarantees, offer Dublin a treaty transferring Northern Ireland. Requires Irish consent and actual ownership and control."
 ENG_nww_transport_reserve:0 "Order Reserve Transports"
 ENG_nww_transport_reserve_desc:0 "50 political power and two civilian factories for 70 days: 40 convoys. Uses the shared project slot."
 nww_eng.1.t:0 "The Price of the Crown"
 nww_eng.1.d:0 "The cabinet commands vast markets, but the Treasury cannot meet every demand at once. The Chancellor asks for an initial priority. It will launch a programme while leaving the constitutional choice open."
 nww_eng.1.a:0 "Metropolitan recovery"
 nww_eng.1.b:0 "Prepare imperial negotiations"
 nww_eng.1.c:0 "Rearmament"
 nww_eng.4.t:0 "Constitutional Consent Breaks Down"
 nww_eng.4.d:0 "Opponents reject the emergency transfer of power. Some garrisons have rallied to Parliament. The cabinet must now hold the state together in a civil war."
 nww_eng.4.a:0 "Rally loyal forces"
 nww_eng.4.b:0 "The crisis has already passed"
 nww_eng.10.t:0 "Treaty Ratified"
 nww_eng.10.d:0 "The partner government has ratified the proposal. Its agreed obligations enter into force; local institutions and armed forces remain in place."
 nww_eng.10.a:0 "Honour the treaty"
 nww_eng.11.t:0 "Proposal Declined"
 nww_eng.11.d:0 "The partner government declined the proposal. Existing status is preserved. The cabinet may prepare a new proposal after the negotiation cooldown."
 nww_eng.11.a:0 "Accept the reply"
 nww_eng.20.t:0 "Invite the Irish Delegation"
 nww_eng.20.d:0 "The Belfast draft provides local representation, guarantees to both communities and joint investigation of border incidents. It must be submitted to the Irish government."
 nww_eng.20.a:0 "Send the draft to Dublin"
 nww_eng.20.b:0 "Conditions do not permit talks"
 nww_eng.21.t:0 "The Belfast Draft"
 nww_eng.21.d:0 "London offers international guarantees for the communities of Northern Ireland and a permanent border commission. The treaty does not change Ulster sovereignty; any later change requires fresh consent."
 nww_eng.21.a:0 "Sign the agreement"
 nww_eng.21.b:0 "Decline the draft"
 nww_eng.23.t:0 "The Cabinet Faces the Irish Crisis"
 nww_eng.23.d:0 "The settlement deadline has expired. Emergency measures have damaged trust and armed groups are forming in Ulster. Parliament demands ministerial resignations or a new settlement."
 nww_eng.23.a:0 "Ministerial resignations and fresh mediation"
 nww_eng.23.b:0 "Suppress the armed groups"
 nww_eng.24.t:0 "Ulster’s Future Status"
 nww_eng.24.d:0 "Following local consultations, the cabinet offers to transfer Northern Ireland to Dublin with civil and religious guarantees. Final agreement requires Irish government consent."
 nww_eng.24.a:0 "Submit the treaty draft"
 nww_eng.24.b:0 "Postpone until peace returns"
 nww_eng.25.t:0 "An Offer to Unite the Island"
 nww_eng.25.d:0 "London offers an agreed transfer of Northern Ireland with guarantees to its communities. Acceptance settles the territorial dispute while preserving the separate British state."
 nww_eng.25.a:0 "Ratify the transfer"
 nww_eng.25.b:0 "Keep the existing treaty"
 ENG_nww_deadline_CAN:0 "Review of Obligations: Canada"
 ENG_nww_deadline_CAN_desc:0 "180 days: raise trust to 40 or sign a compact. Failure brings a demand for sovereignty. External war cancels the mission; it can restart after peace."
 ENG_nww_assurances_CAN:0 "Assurances to the Local Parliament: Canada"
 ENG_nww_assurances_CAN_desc:0 "35 political power and 35 days: +15 trust. Uses the shared negotiation slot. War or administrative obstacles cancel the procedure and refund its cost."
 nww_eng.300.t:0 "A Demand to Review the Imperial Treaty"
 nww_eng.300.d:0 "London failed to settle our differences before the deadline. The government may demand full sovereignty or agree to another round of talks. Britain cannot overturn our choice."
 nww_eng.300.a:0 "Assert sovereignty"
 nww_eng.300.b:0 "Give negotiations another chance"
