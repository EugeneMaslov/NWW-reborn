 nww_eng.30.t:0 "The Crown Passes to the Heir"
 nww_eng.30.d:0 "George V has died. His heir inherits a state that avoided world war but not arguments over royal power. The cabinet awaits confirmation of constitutional commitments."
 nww_eng.30.a:0 "Recognise Edward VIII"
 nww_eng.31.t:0 "The Crown before Parliament"
 nww_eng.31.d:0 "The new monarch seeks to define his political role. The cabinet proposes reaffirming parliamentary responsibility. The King may accept or yield the throne to his brother."
 nww_eng.31.a:0 "Reaffirm constitutional government"
 nww_eng.31.b:0 "Accept the abdication"
 nww_eng.32.t:0 "A New Head of the Cabinet"
 nww_eng.32.d:0 "Baldwin is ready to leave office. The parliamentary majority considers Chamberlain, an advocate of orderly budgets and negotiation, and Churchill, who argues for more determined rearmament. Choosing a new premier preserves constitutional government."
 nww_eng.32.a:0 "A Chamberlain cabinet"
 nww_eng.32.b:0 "Ask Churchill to form a cabinet"
