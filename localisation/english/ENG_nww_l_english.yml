 ENG_nww_colonial_review:0 "Review the Colonial Treaty"
 ENG_nww_colonial_review_desc:0 "Transferring administrative powers requires prepared local institutions and negotiations with their representatives. Each actual dependency will receive a separate sovereignty treaty."
 ENG_nww_parliamentary_socialism:0 "Parliamentary Socialism"
 ENG_nww_parliamentary_socialism_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
 ENG_nww_social_republic:0 "Socialist Republic"
 ENG_nww_social_republic_desc:0 "Republicans demand a final break with hereditary power. An organised movement with forty percent support may attempt constitutional change; a divided country may answer with arms."
 ENG_nww_housing_parliament:0 "Decent Housing"
 ENG_nww_housing_parliament_desc:0 "The settlement of power determines which promises London can honour. Reform needs agreed powers and durable institutions."
