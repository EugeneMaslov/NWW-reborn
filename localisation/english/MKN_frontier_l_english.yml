l_english:
 MKN_ukrainian_frontier_root:0 "The Ukrainian Frontier"
 MKN_ukrainian_frontier_root_desc:0 "Between Huliaipole's assemblies and Kharkiv's commissariats, every railway junction has become an argument about the revolution itself. The Congress must give the frontier communes a common policy before a patrol's rifle decides it for them."
 MKN_ukrainian_frontier_root_tt:0 "Opens the Ukrainian Frontier display. Frontier orders become available after the incident following Makhno's death. Every border victory immediately integrates the captured state as our core territory."
 MKN_tachanka_deep_recon:0 "Tachanka Reconnaissance in Depth"
 MKN_tachanka_deep_recon_desc:0 "A cart can pass for a farmer's transport until the tarpaulin falls away. Trusted crews will map the red patrols, depot entrances and embankments, so the frontier committees can act with knowledge instead of expensive guesswork."
 MKN_tachanka_deep_recon_tt:0 "Reduces the political power cost of Ukrainian Frontier decisions by §G50%§!."
 MKN_donbas_miners_agitation:0 "Agitate Among the Donbas Miners"
 MKN_donbas_miners_agitation_desc:0 "The commissar can order a pit to meet its quota; he cannot make the miners forget who lowered the cages. Our couriers will carry the communes' appeal into the coalfields, turning the frontier's industrial rhythm against Kharkiv's coercion."
 MKN_donbas_miners_agitation_tt:0 "Disrupt neighboring Ukrainian industry for 180 days. Unlock border battles for Soviet-owned Stalino, Kharkiv and Crimea while the frontier crisis remains active."
 MKN_right_of_first_shot:0 "The Right of the First Shot"
 MKN_right_of_first_shot_desc:0 "No frontier assembly should have to wait for a distant office to admit that shooting has begun. Reconnaissance reports and elected commanders will determine the hour of the attack, before the red detachments can concentrate against us."
 MKN_right_of_first_shot_tt:0 "Our attacking force receives §G+15%§! combat strength in Ukrainian Frontier border wars started after this focus."
 MKN_armored_train_interceptors:0 "Armored Train Interceptors"
 MKN_armored_train_interceptors_desc:0 "The frontier's steel roads must carry more than grain and proclamations. Reinforced wagons and elevated machine-gun mounts will keep our supply trains moving through air raids, while mobile crews answer alarms along the embankments."
 MKN_frontier_train_effect_tt:0 "Unlocks armored train technology and supplies §G10 armored trains§!. Their armor and anti-air attack improve by §G20%§!."
 MKN_dnieper_trenches:0 "Trenches of the Dnieper Frontier"
 MKN_dnieper_trenches_desc:0 "The steppe offers little cover to a commune caught beneath artillery. Earth, timber and the work of every village will turn the exposed approaches into linked strongpoints, where a handful of defenders can hold until the trains arrive."
 MKN_dnieper_trenches_tt:0 "Adds §G2 levels§! of land forts to eligible provinces along our border with Soviet Ukraine."
 MKN_conclude_total_war:0 "War for the Steppe"
 MKN_conclude_total_war_desc:0 "The fiction of isolated patrol clashes has burned away. Kharkiv and Huliaipole now face one another as belligerents, and every commune must decide what its freedom demands. The border committees will become the supply councils of a common war."
 MKN_conclude_total_war_tt:0 "Ends the frontier crisis in full war with Soviet Ukraine and secures the permanent spirit §YWar for the Steppe§! (§G+10%§! attack on core territory)."
 MKN_conclude_kharkiv_treaty:0 "Ratify the Kharkiv Treaty"
 MKN_conclude_kharkiv_treaty_desc:0 "The signatures from Kharkiv cannot erase the dead, but they can give the surviving frontier villages two years to sow in peace. Workshops will return to civilian orders, and delegates will carry the pact home along the same tracks that once brought ammunition."
 MKN_soviet_intervention_category:0 "The Shadow of Intervention"
 MKN_soviet_intervention_category_desc:0 "The four congresses fight over the inheritance of the Free Territory while Moscow and Kharkiv assemble their demands. We have one hundred days to reunite the steppe before outside armies turn our civil war into their conquest."
 MKN_soviet_intervention_mission:0 "Threat of Soviet Intervention"
 MKN_soviet_intervention_mission_desc:0 "While brothers slaughter brothers, the Red Army gathers along the border. If the Free Territory is not united within §Y100 days§!, the Soviets will intervene to restore order. All surviving factions must be reunited into one; then this mission ends. Otherwise independent SOV and UKR receive annexation goals and declare war on every surviving faction."
 mkn_crisis.200.t:0 "The Red Army Crosses the Dnieper"
 mkn_crisis.200.d:0 "For a hundred days, rival congresses have claimed the black banner while villages changed hands between brothers. Now the warning from the Soviet republics has become a marching order. Moscow speaks of restoring revolutionary order; Kharkiv demands that the frontier be secured. Their columns move against every surviving claimant to the Free Territory, repudiating even alliances that stand in their way. Our quarrel has given the commissars their opening. The steppe must face a foreign war before its own war is over."
 mkn_crisis.200.a:0 "The steppe will answer with fire."
 MKN_soviet_intervention_tt:0 "Existing independent §YSoviet Russia§! and §YSoviet Ukraine§! receive annexation war goals and declare war on every surviving participant in the Free Territory's collapse. Shared factions are broken before intervention."
 MKN_ukr_border_category:0 "The Ukrainian Frontier"
 MKN_ukr_border_category_desc:0 "The assemblies of the Free Territory face the Soviet Ukrainian patrols across a frontier of farms, workshops and railway sidings. Raising the alarm buys striking power; withdrawing buys time. Three completed border battles without a 180-day cooling period, or escalation level five, bring full war. A year after the first incident, exhaustion imposes a two-year ceasefire unless full war has already begun."
 mkn_escalate_steppe_alarm:0 "Raise the Steppe Alarm"
 mkn_escalate_steppe_alarm_desc:0 "Summon the mounted detachments and issue ammunition to the frontier communes. Escalation rises by one level; Border Fury lasts fourteen days. Reconnaissance halves the political cost."
 mkn_deescalate_pull_back:0 "Withdraw the Forward Patrols"
 mkn_deescalate_pull_back_desc:0 "Recall patrols for 20 days. When the withdrawal ends, escalation falls by exactly one and this decision can be used again immediately. Recent battles are still counted. The 90-day relaxation weakens offensive readiness."
 mkn_raid_soviet_depots:0 "Raid the Soviet Ukrainian Depots"
 mkn_raid_soviet_depots_desc:0 "Strike a depot in a UKR-controlled neighboring state. Four hundred rifles leave the Ukrainian stockpile and enter ours as captured basic weapons; infrastructure suffers one level of damage. Escalation rises by one. The raid requires four hundred rifles in their reserve."
 mkn_launch_border_battle:0 "Contest the Frontier State"
 mkn_launch_border_battle_desc:0 "At escalation level three, fight over any neighboring Ukrainian state except Kyiv. Miners’ agitation also opens Soviet-owned Stalino, Kharkiv and Crimea. Victory transfers and cores the contested state; defeat transfers our participating state to its actual opponent without granting a new core. A completed battle resets escalation to one. All clashes stop when the frontier crisis ends."
 mkn_sign_kharkiv_pact:0 "Propose the Kharkiv Pact"
 mkn_sign_kharkiv_pact_desc:0 "At the lowest escalation level, and with Mykolaiv and Cherkasy held, ask Soviet Ukraine to recognize the frontier. Its acceptance ends the skirmishes, confirms our captured cores and establishes a two-year non-aggression pact. The annual deadline continues until full war or its scheduled expiry."
 MKN_border_fury_buff:0 "Border Fury"
 MKN_border_fury_buff_desc:0 "The railway whistles carry the alarm from commune to commune. Mounted patrols race to the firing line, determined to decide the clash before the commissars can gather their reserves."
 MKN_border_relaxation_debuff:0 "The Patrols Stand Down"
 MKN_border_relaxation_debuff_desc:0 "The fields reclaim hands from the frontier. Village life steadies, but dispersed detachments will take longer to recover their fighting order."
 MKN_war_for_the_steppe:0 "War for the Steppe"
 MKN_war_for_the_steppe_desc:0 "The frontier dispute has become a war for the communes themselves. Every familiar lane and embankment gives our fighters another road to the enemy's flank."
 MKN_ukr_miners_state_disruption:0 "Frontier Miners' Agitation"
 MKN_ukr_miners_state_disruption_desc:0 "Couriers from the Free Territory coordinate refusals, slowdowns and stoppages across the frontier workshops."
 MKN_frontier_core_integration_tt:0 "The state is immediately integrated into the Federation of Free Soviets and becomes a core state."
 MKN_frontier_war_locked_tt:0 "§REscalation cannot be adjusted: full-scale war is underway!§!"
 MKN_frontier_frozen_tt:0 "§YThe frontier is frozen by a de facto ceasefire§!"
 MKN_frontier_incident_required_tt:0 "The first frontier incident has occurred."
 MKN_frontier_gui_title:0 "THE UKRAINIAN FRONTIER"
 MKN_frontier_current_level:0 "Escalation: [?mkn_ukr_escalation_level|0]/5"
 MKN_frontier_stage_1:0 "I — Uneasy Quiet"
 MKN_frontier_stage_2:0 "II — Patrol Provocations"
 MKN_frontier_stage_3:0 "III — Border Battles"
 MKN_frontier_stage_4:0 "IV — The Frontier Mobilizes"
 MKN_frontier_stage_5:0 "V — Full War"
 MKN_frontier_meter_tt:0 "Escalation runs from one to five. Level five or three completed battles without a 180-day cooling period bring full war. At war, or after the frontier freezes, all frontier orders are locked."
 MKN_frontier_native_orders_hint:0 "Frontier orders and political costs appear below."
 MKN_frontier_year_countdown_mission:0 "One Year on the Frontier"
 MKN_frontier_year_countdown_mission_desc:0 "The first Soviet Ukrainian provocation starts §Y365 days§! of frontier crisis. If full war with UKR or SOV begins, this countdown ends. Otherwise the deadline imposes a §Y730-day§! non-aggression pact with UKR, preserves every captured MKN core and freezes further skirmishes."
 mkn_ukr_border.1.t:0 "The Border Can No Longer Hold"
 mkn_ukr_border.1.d:0 "The lists of dead no longer fit beneath the heading of isolated incidents. Soviet Ukrainian columns leave their barracks, and the frontier delegates hear that Kharkiv has ordered a general advance. Whether brought by the fifth alarm or the third successive battle, the war has reached the steppe. The councils must now supply an army rather than a patrol."
 mkn_ukr_border.1.a:0 "Sound the alarm in every commune."
 mkn_ukr_border.2.t:0 "A Frontier Changes Hands"
 mkn_ukr_border.2.win:0 "Our detachments have won the contest for [?mkn_ukr_last_contested_state.GetName]. The black banner rises above its railway office as delegates gather the village assemblies. The territory has already passed into our administration and become a core of the Federation of Free Soviets. The guns fall silent, but another battle is entered in the frontier ledger."
 mkn_ukr_border.2.loss:0 "The contested state is now administered by our Soviet opponent. Survivors return to the communes as frontier tension eases. The victor gains no new core from our defeat."
 mkn_ukr_border.2.a:0 "Send the delegates to the villages."
 mkn_ukr_border.3.t:0 "A Pact Offered from Huliaipole"
 mkn_ukr_border.3.d:0 "The frontier communes offer to recognize the current line for two years. Their delegates insist that the territories won beneath the black banner remain national territory of their federation. We can accept a breathing space, or send them home without signatures."
 mkn_ukr_border.3.a:0 "Sign the pact."
 mkn_ukr_border.3.b:0 "There will be no agreement."
 mkn_ukr_border.4.t:0 "Kharkiv Signs"
 mkn_ukr_border.4.d:0 "The delegates return carrying the Soviet Ukrainian signatures. For two years, a non-aggression pact recognizes the line held by our communes; the regions already won remain national territory. Railway workshops can prepare the tools of harvest again. The annual frontier reckoning still stands, ready to impose its own ceasefire if war does not intervene."
 mkn_ukr_border.4.a:0 "Let the villages sow in peace."
 mkn_ukr_border.5.t:0 "The Delegates Return Empty-Handed"
 mkn_ukr_border.5.d:0 "Kharkiv has refused the proposed pact. The current frontier remains unsettled, and the patrols keep their rifles. The committees must decide how long to maintain the quiet before trying another course."
 mkn_ukr_border.5.a:0 "Keep watch."
 mkn_ukr_border.10.t:0 "Soviets Sense Weakness"
 mkn_ukr_border.10.d:0 "Seven days after Huliaipole lowered its black flags, Soviet intelligence has confirmed the Batko's passing. Patrols of Soviet Ukraine test the roads along our frontier, backed by reports passed between Kharkiv and the Red Army staff. A sentry is disarmed; a grain cart is turned back; a warning shot answers a warning shot. The councils face their first alarm without Makhno. The frontier has one year before either war or exhaustion decides its future."
 mkn_ukr_border.10.a:0 "The communes will keep their watch."
 mkn_ukr_frontier_concluded:0 "The frontier crisis has ended"
 mkn_ukr_pact_signed:0 "The Kharkiv Pact has been signed"
 mkn_ukr_total_war:0 "Full war has begun on the frontier"
