l_english:
 MKN_steppe_horde:0 "The Steppe Horde"
 MKN_steppe_horde_desc:0 "Preserve cavalry mobility by investing in weapons and communications rather than expensive armour.\n\nVillage mustering stations will assign recruits to detachments in advance.\n\nShared stables and remount reserves will sustain the march.\n\nMachine-gun carts will provide cavalry detachments with sustained firepower."
 MKN_hidden_supply_bases_focus:0 "Hidden Supply Bases"
 MKN_hidden_supply_bases_focus_desc:0 "Local guides will locate fords and flanking routes before the enemy.\n\nVeterinary teams will reduce horse losses on long marches."
 MKN_free_column_command_focus:0 "Signals of the Free Columns"
 MKN_free_column_command_focus_desc:0 "Small scouting parties will clear the route for the main column.\n\nSignals teams will connect districts and bring reserves to the right sector."
 MKN_motorized_vanguard:0 "The Motorized Vanguard"
 MKN_motorized_vanguard_desc:0 "Tractor cooperatives will develop breakthrough armour that needs trained crews and fuel.\n\nCrews must repair their vehicles and cooperate with infantry.\n\nQuartermasters will reconcile the supply requirements of motorized formations.\n\nTrucks and fuel tenders will follow advancing armoured units."
 MKN_armored_trains_and_repair_focus:0 "Armored Trains and Repair Bases"
 MKN_armored_trains_and_repair_focus_desc:0 "Recovery tractors will retrieve damaged vehicles for the workshops.\n\nA Dnipro repair plant will provide replacement assemblies and equipment repairs."
 MKN_communal_fire_support_focus:0 "Communal Fire Support"
 MKN_communal_fire_support_focus_desc:0 "Nikopol workshops will manufacture guns to support advancing infantry.\n\nCommon firing tables will align battery fire with armoured commanders' plans."
 MKN_combined_arms_command_focus:0 "Combined Arms Command"
 MKN_combined_arms_command_focus_desc:0 "Radios will bring reinforcements into battle when the staff needs them."
 MKN_steppe_hawks_and_schools:0 "Steppe Hawks and Flying Schools"
 MKN_steppe_hawks_and_schools_desc:0 "Establish a communal air service with shared flight control and operating rules.\n\nForward strips will bring aircraft closer to troops and reduce ferry flights.\n\nThe pilot school will provide common training before combat specialization.\n\nUnlocks one-time field headquarters tactics purchased with experience and command power."
 MKN_interceptor_cooperatives:0 "Interceptor Cooperatives"
 MKN_interceptor_cooperatives_desc:0 "Fighters will shield the communes while strike aviation remains secondary.\n\nSteppe Falcon cooperatives will adapt light airframes for agile interception.\n\nVeteran instructors will teach new pilots how to fight in pairs.\n\nLeaders and wingmen will replace lone heroics with coordinated pairs."
 MKN_communal_aa_defense_focus:0 "Layered Communal Air Defense"
 MKN_communal_aa_defense_focus_desc:0 "Observers will report bombers before they reach the towns.\n\nA shared warning system will scramble the right flights without exhausting the whole air force."
 MKN_airframe_standardization_focus:0 "Air Workshop Standards"
 MKN_airframe_standardization_focus_desc:0 "Radio beacons will guide interceptors home in poor weather.\n\nProduction jigs will improve fighter assembly and armament.\n\nRecovery teams will retrieve damaged aircraft for repair."
 MKN_flying_artillery_focus:0 "Flying Artillery"
 MKN_flying_artillery_focus_desc:0 "Aviation will become flying artillery for the free columns.\n\nDnipro Wing cooperatives will adapt light aircraft for ground attack.\n\nHeavier aircraft armament will break enemy strongpoints.\n\nRange training will teach crews to strike targets close to friendly troops."
 MKN_forward_airstrips_focus:0 "Forward Airstrips"
 MKN_forward_airstrips_focus_desc:0 "Forward strips will shorten the delay between a support request and the strike.\n\nLiaison teams will carry infantry requests directly to the airfields."
 MKN_air_ground_coordination_focus:0 "Maps for the Free Columns"
 MKN_air_ground_coordination_focus_desc:0 "Maps, photographs and shared coordinates will prevent blind target searches.\n\nSmoke signals and recognition panels will mark the front line."
 MKN_cas_workshop_network_focus:0 "Attack Aircraft Workshop Network"
 MKN_cas_workshop_network_focus_desc:0 "Front-line workshops will repair damage inflicted by ground fire."
 MKN_black_sea_flotilla_and_yards:0 "Black Sea Flotilla and Shipyards"
 MKN_black_sea_flotilla_and_yards_desc:0 "Establish a small flotilla with missions the communes can afford.\n\nDnieper patrols will train the future sea-going crews.\n\nKherson yards will give the flotilla its own construction and repair base.\n\nUnlocks one-time field headquarters tactics purchased with experience and command power."
 MKN_sea_escort_service:0 "Sea Escort Service"
 MKN_sea_escort_service_desc:0 "Defend port approaches and make grain shipping the navy's main mission.\n\nLight escorts from the Kherson cooperative will hold formation around convoys.\n\nCrews will train to protect slow transports rather than chase glory.\n\nSonar operators and depth-charge crews will work as one team."
 MKN_coastal_fortifications_focus:0 "Coastal Fortifications"
 MKN_coastal_fortifications_focus_desc:0 "River crews will move to light sea-going ships for coastal service.\n\nCoastal stations will warn captains of enemy movements."
 MKN_escort_repair_network_focus:0 "Escort Repair Artels"
 MKN_escort_repair_network_focus_desc:0 "Dredged channels will improve ship turnaround and harbour logistics.\n\nRepair cooperatives will learn hull repairs and refitting.\n\nShared schedules and new transports will organize shipping into escorted groups."
 MKN_torpedo_artels_focus:0 "Torpedo Artels"
 MKN_torpedo_artels_focus_desc:0 "Small submarines and raiders will threaten enemy shipping without a battleship race.\n\nTorpedo workshops will improve weapons for concealed attacks.\n\nCrews will choose targets and timing rather than seek open battle.\n\nTrials will eliminate failures and establish attack ranges."
 MKN_hidden_smuggler_bases_focus:0 "Hidden Smuggler Bases"
 MKN_hidden_smuggler_bases_focus_desc:0 "Concealed anchorages will prepare sorties without exposing raider positions.\n\nShipping intelligence will identify valuable targets and safe waiting areas.\n\nEstuary workshops will organize serial construction of small submarines.\n\nNight sorties will reduce exposure to coastal observers.\n\nConcealed fuel reserves will extend patrols along shipping routes."
 MKN_tactic_night_marches:0 "Night Marches"
 MKN_tactic_night_marches_desc:0 "Detachments will withdraw at night without losing cohesion.\n\nElected junior commanders need tactical schooling and clear responsibilities.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_steppe_camouflage:0 "Steppe Camouflage"
 MKN_tactic_steppe_camouflage_desc:0 "Camouflaged steppe positions will help troops survive superior enemy firepower.\n\nHidden depots will sustain columns operating far from the railway.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_militia_engineers:0 "Engineer Squads"
 MKN_tactic_militia_engineers_desc:0 "Small engineer teams will prepare crossings and field shelters.\n\nCommunes will organize casualty evacuation and rehabilitation.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_flexible_orders:0 "Mission over Lengthy Orders"
 MKN_tactic_flexible_orders_desc:0 "Commanders will receive objectives and freedom of execution rather than constant detailed orders.\n\nRotating reserves will let rural communes field troops while maintaining the harvest.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_tachanka_tactics:0 "Tachankas and Infantry Screens"
 MKN_tactic_tachanka_tactics_desc:0 "Dismounted screens will cover the carts' withdrawal and break pursuit.\n\nMobile rearguards will delay the enemy while supply trains relocate.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_free_column_exercises:0 "Free Column Exercises"
 MKN_tactic_free_column_exercises_desc:0 "Joint exercises will coordinate mounted and dismounted detachments.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_motorized_infantry:0 "Infantry Behind the Armour"
 MKN_tactic_motorized_infantry_desc:0 "Mobile infantry will secure crossings and settlements taken by tanks.\n\nPortable bridges will keep the columns advancing beyond the Dnieper.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_fuel_discipline:0 "Fuel Accounting on Campaign"
 MKN_tactic_fuel_discipline_desc:0 "Fuel reserves and refuelling routes will prevent stalled offensives.\n\nTest operational plans in staff exercises before risking lives.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_mobile_medical:0 "Mobile Medical Posts"
 MKN_tactic_mobile_medical_desc:0 "Medical vehicles will recover wounded soldiers and preserve trained personnel.\n\nArmour, artillery and infantry will learn to fight as one formation.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_armoured_manoeuvres:0 "Second Echelon Reserve"
 MKN_tactic_armoured_manoeuvres_desc:0 "Arm the second echelon early to sustain a breakthrough without pauses.\n\nBreakthrough workshops will build armour to field crews' specifications.\n\nLarge manoeuvres will rehearse changes of direction without losing cohesion.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_air_dispersal:0 "Dispersed Airfields"
 MKN_tactic_air_dispersal_desc:0 "Disperse aircraft among reserve strips and strengthen home air defence.\n\nPatrols over crossings will protect links between industrial districts.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_night_interceptors:0 "Radar School"
 MKN_tactic_night_interceptors_desc:0 "Radar schooling will train crews to track targets and direct fighters.\n\nNight flights will practise ground-directed interception.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_fighter_conversion:0 "Shared Aircraft Spares"
 MKN_tactic_fighter_conversion_desc:0 "Shared engine reserves will reduce downtime and failures.\n\nConversion training will speed adoption of the next fighter generation.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_air_rescue:0 "Downed Pilot Rescue"
 MKN_tactic_air_rescue_desc:0 "Rescued pilots will return to flying and train new crews.\n\nControllers will assign flights to targets without wasteful duplication.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_sky_watch_exercises:0 "Industrial Air Defence"
 MKN_tactic_sky_watch_exercises_desc:0 "Anti-aircraft batteries and fighters will share the defence of industrial communes.\n\nExercises will test the whole interception chain from detection to landing.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_tactical_recon:0 "Tactical Aerial Reconnaissance"
 MKN_tactic_tactical_recon_desc:0 "Aerial scouts will identify flanking routes and enemy reserves.\n\nNavigators will extend support beyond familiar airfields.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_air_supply_lift:0 "Urgent Air Deliveries"
 MKN_tactic_air_supply_lift_desc:0 "Air transport will meet the urgent needs of isolated columns.\n\nCoastal squadrons will cover crossings and attack enemy shipping.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_replacement_crews:0 "Attack Crew Reserve"
 MKN_tactic_replacement_crews_desc:0 "Trained replacement crews will sustain the sortie rate.\n\nRotating wings will balance demands on crews, machines and fuel depots.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_weather_service:0 "Squadron Fuel Depots"
 MKN_tactic_weather_service_desc:0 "Organize refuelling so strike groups can fly at the decisive moment.\n\nWeather stations will help select a strike window instead of cancelling the operation.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_joint_target_planning:0 "Joint Strike Planning"
 MKN_tactic_joint_target_planning_desc:0 "Army and air staffs will prepare common target lists before an offensive.\n\nJoint exercises will test cooperation between pilots, gunners and forward observers.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_damage_control:0 "Repair and Salvage Artels"
 MKN_tactic_damage_control_desc:0 "Damage-control teams will save hit ships and bring them home.\n\nPermanent patrols will close gaps between port districts.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_sweeper_sections:0 "Minesweeper Sections"
 MKN_tactic_sweeper_sections_desc:0 "Minesweeping teams will clear the shipping lanes.\n\nA shared escort frequency will help ships reorganize their protective screen.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_coastal_depots:0 "Port Supply Depots"
 MKN_tactic_coastal_depots_desc:0 "Coastal depots will sustain patrols without long refuelling trips.\n\nCoordinate river transport, sea escorts and coastal reconnaissance.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_convoy_rescue:0 "Anti Submarine Patrols"
 MKN_tactic_convoy_rescue_desc:0 "Hunting groups will sweep the area before convoys sail.\n\nRescue vessels will recover crews and tow damaged transports.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_coastal_fleet_exercises:0 "Port Crew Reserve"
 MKN_tactic_coastal_fleet_exercises_desc:0 "Reserve crews and an additional yard will replace losses.\n\nTest merchant convoy protection against a simulated attack.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_submarine_listening:0 "Hydrophone School"
 MKN_tactic_submarine_listening_desc:0 "Hydrophone crews will hear targets before enemies detect the submarine.\n\nFast craft will cover raider departures and fight in restricted coastal waters.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_radio_discipline:0 "Raider Radio Discipline"
 MKN_tactic_radio_discipline_desc:0 "Short encrypted transmissions will make raider groups harder to locate.\n\nRepair crews will overhaul machinery between patrols.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_raider_weather:0 "Weather as an Ally"
 MKN_tactic_raider_weather_desc:0 "Weather reports will help crews approach targets under poor visibility.\n\nReplacement crews will practise emergency dives and evasion.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_torpedo_ambushes:0 "Torpedo Ambushes"
 MKN_tactic_torpedo_ambushes_desc:0 "Ambushes near narrow passages will concentrate torpedo salvos.\n\nAssign hunting areas to disrupt enemy supplies systematically.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_tactic_raider_escape_routes:0 "Escape Routes"
 MKN_tactic_raider_escape_routes_desc:0 "Planned escape routes will help raiders evade superior fleets.\n\nJoint exercises will prepare submarine groups for coordinated attacks.\n\nOne-time training. Costs 20 service experience and 10 command power. Permanently improves the service national spirit."
 MKN_army_hq_decisions:0 "Field Headquarters: Army"
 MKN_army_hq_decisions_desc:0 "Field headquarters preserve the experience of columns, aviation cooperatives and naval artels. Each tactic and each project type is available once per campaign. Choose a project location on the map. Only one project can run at a time; losing its state refunds political power and command power and closes the project."
 MKN_army_hq_unlock_tt:0 "Unlocks this service field headquarters; tactics require a chosen military program."
 MKN_hq_army_cost:0 "£army_experience §Y20§!  £command_power §Y10§!"
 MKN_air_hq_decisions:0 "Field Headquarters: Air Force"
 MKN_air_hq_decisions_desc:0 "Field headquarters preserve the experience of columns, aviation cooperatives and naval artels. Each tactic and each project type is available once per campaign. Choose a project location on the map. Only one project can run at a time; losing its state refunds political power and command power and closes the project."
 MKN_air_hq_unlock_tt:0 "Unlocks this service field headquarters; tactics require a chosen military program."
 MKN_hq_air_cost:0 "£air_experience §Y20§!  £command_power §Y10§!"
 MKN_navy_hq_decisions:0 "Field Headquarters: Navy"
 MKN_navy_hq_decisions_desc:0 "Field headquarters preserve the experience of columns, aviation cooperatives and naval artels. Each tactic and each project type is available once per campaign. Choose a project location on the map. Only one project can run at a time; losing its state refunds political power and command power and closes the project."
 MKN_navy_hq_unlock_tt:0 "Unlocks this service field headquarters; tactics require a chosen military program."
 MKN_hq_navy_cost:0 "£navy_experience §Y20§!  £command_power §Y10§!"
 MKN_hq_20_cp_cost:0 "£command_power §Y20§!"
 MKN_military_program_progress_tt:0 "Develops the permanent national spirit of this service."
 MKN_project_hidden_supply_node:0 "Hidden Supply Hub"
 MKN_project_hidden_supply_node_desc:0 "Camouflaged stores and wagon routes connect the columns to their rear. Spend 50 political power to build one supply hub in the selected state after 30 days.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_hidden_supply_node_unlock_tt:0 "Unlocks a one-time map project: Hidden Supply Hub."
 MKN_project_front_railway:0 "Lay Rails to the Front"
 MKN_project_front_railway_desc:0 "Railway artels build a new level-one connection from the capital to a state with no existing connection. The work takes 15 days and costs 20 command power. The route crosses only our territory.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_front_railway_unlock_tt:0 "Unlocks a one-time map project: Lay Rails to the Front."
 MKN_project_repair_infrastructure:0 "Repair Infrastructure"
 MKN_project_repair_infrastructure_desc:0 "Repair crews restore damaged infrastructure in the selected state in 7 days for 20 command power.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_repair_infrastructure_unlock_tt:0 "Unlocks a one-time map project: Repair Infrastructure."
 MKN_project_observation_posts:0 "Observation Posts"
 MKN_project_observation_posts_desc:0 "After radar research, two civilian factories build the first radar station in the selected state over 45 days.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_observation_posts_unlock_tt:0 "Unlocks a one-time map project: Observation Posts."
 MKN_project_aa_batteries:0 "Anti-Aircraft Batteries"
 MKN_project_aa_batteries_desc:0 "Two civilian factories build one level of state anti-air defenses over 45 days to protect the communes.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_aa_batteries_unlock_tt:0 "Unlocks a one-time map project: Anti-Aircraft Batteries."
 MKN_project_forward_airstrip:0 "Steppe Airfield"
 MKN_project_forward_airstrip_desc:0 "Spend 30 political power to add one air base level in 15 days in a state adjoining enemy-controlled territory.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_forward_airstrip_unlock_tt:0 "Unlocks a one-time map project: Steppe Airfield."
 MKN_project_coastal_battery:0 "Coastal Battery"
 MKN_project_coastal_battery_desc:0 "Spend 50 political power to build one level of coastal fortifications in one coastal province of the selected state after 45 days.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_coastal_battery_unlock_tt:0 "Unlocks a one-time map project: Coastal Battery."
 MKN_project_hidden_cove:0 "Hidden Cove"
 MKN_project_hidden_cove_desc:0 "Spend 30 political power to build one naval base level in one coastal province of the selected state after 30 days.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_hidden_cove_unlock_tt:0 "Unlocks a one-time map project: Hidden Cove."
 MKN_project_fuel_cache:0 "Fuel Cache"
 MKN_project_fuel_cache_desc:0 "Spend 30 political power and reserve two civilian factories for 30 days to build one fuel silo in the selected state.\n\nThis project type is available once per campaign in one selected state. Requires full ownership and control. Cancellation refunds PP/CP; it cannot be started again."
 MKN_project_fuel_cache_unlock_tt:0 "Unlocks a one-time map project: Fuel Cache."
 MKN_military_project_idle_tt:0 "No other military construction project is currently running"
