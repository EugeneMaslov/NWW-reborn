l_english:
 NWW_MKN_eugen:0 "Eugen"
 NWW_MKN_eugen_desc:0 "A young commander who rose through the Free Territory’s infantry detachments. Eugen values squad coordination, reconnaissance and casualty evacuation above a spectacular charge. He can command an army while serving in the high command."
 NWW_MKN_eugen_high_command:0 "Eugen"
 mkn_eugen_infantry_master:0 "Master of Infantry Warfare"
 mkn_eugen_infantry_master_desc:0 "Combines fire and movement, preserves his infantry and quickly returns units to action. Appointment requires the Steppe General Staff."
 mkn_eugen_under_fire:0 "We Leave No One Behind"
 mkn_eugen_under_fire_desc:0 "An officer who personally returned for his people under fire has earned his infantry’s trust. Benefits only the divisions under his command."
 MKN_eugen_under_fire_tt:0 "Eugen gains §YWe Leave No One Behind§!: §G+5%§! organization recovery and §G+5%§! reconnaissance for divisions under his command."
 MKN_dmitruk_tratishov:0 "Dmitruk Tratishov"
 MKN_eugen_no_one_left_behind:0 "No One Left in the Trenches"
 MKN_eugen_no_one_left_behind_desc:0 "The rescue of two signals officers has reassured the troops that their commanders will return for them. A temporary morale boost lasting 90 days."
 MKN_eugen_instructor_courses:0 "Eugen’s Mutual Support Courses"
 MKN_eugen_instructor_courses_desc:0 "Frontline instructors teach infantry to move under fire, cover medics and restore communications. The program lasts 180 days; the permanent army spirit continues to develop through national focuses."
 mkn_personnel.1.t:0 "Two at the Bottom of the Trench"
 mkn_personnel.1.d:0 "The forward signals post fell silent after the bombardment. Two women signals officers were trapped in a collapsed trench: one was stunned, the other could not climb out with her injured arm. While covering fire shifted to the slope, Eugen led a small party through the dead ground between shell holes. He climbed down, checked both officers and called for the medics. They were carried out before the next barrage; a reserve cable restored contact with the battalions.\n\nA correspondent’s photograph shows Eugen beside the crater, two figures on the ground and smoke behind him. The newspapers are already asking to print it. The general’s own message to headquarters was brief: “We need people who can cover a comrade and carry out the wounded.”"
 mkn_personnel.1.a:0 "Let every soldier know that we will come back for them."
 mkn_personnel.1.b:0 "Fund frontline instructor courses."
 mkn_personnel_news.1.t:0 "General Eugen Returns for Trapped Signals Officers"
 mkn_personnel_news.1.d:0 "Frontline newspapers have published a photograph from the Free Territory: General Eugen stands in a smoking trench beside two women signals officers awaiting evacuation by his party. The military staff reports that both survived the bombardment and reached medical care; a reserve cable restored the signals post.\n\nThe photograph has drawn attention to an infantry commander who insists on covering medics and training small units to support one another. Foreign observers remain cautious about newspaper heroes. For the territory’s soldiers, however, the story has a simple meaning: their comrades will not be left at the bottom of a trench."
 mkn_personnel_news.1.a:0 "This photograph will reach every company."
 mkn_personnel_news.1.b:0 "A face of war that will be remembered."
