 nww_pol.1.t:0 "Poland: The Defiant Buffer"
 nww_pol.1.d:0 "Independence was won during the Great Tumult of 1918–1922. Galicia is held, but Poznan, Silesia and Danzig remain German. Poland has neither ports nor a fleet; German investment supports industry at the price of dependence. After Pilsudski’s death the Castle and the colonels dispute the republic’s future. Begin with After the Marshal to unlock preparation, party campaigns and four paths."
 nww_pol.1.a:0 "The republic must endure."
 nww_pol.2.t:0 "The Marshal’s Legacy"
 nww_pol.2.d:0 "The Castle seeks agreement with the colonels, Endecja organizes national leagues, and Lodz workers form their own committees. Pro-German pragmatists offer security in exchange for autonomy. No path has been chosen: prepare a movement, the budget commission and at least 40% support before changing the regime."
 nww_pol.2.a:0 "The republic must endure."
 nww_pol.3.t:0 "The Budget Compromise"
 nww_pol.3.d:0 "The commission has eased the Sanation crisis without settling the struggle for power. The selected regime must establish its institutions. An independent Intermarium and political subordination to Berlin cannot both be promised."
 nww_pol.3.a:0 "The republic must endure."
 nww_pol.50.t:0 "Sanation: President and Colonels"
 nww_pol.50.d:0 "The civil service works, but military authority remains unsettled. Moscicki demands presidential accountability; the colonels demand freedom of action."
 nww_pol.50.a:0 "Presidential Budget Oversight (50 political power)"
 nww_pol.50.b:0 "Colonels Secretariat (50 political power)"
 nww_pol.50.c:0 "Return to this through decisions."
 nww_pol.51.t:0 "Endecja: State and Citizenship"
 nww_pol.51.d:0 "The National Bloc has prevailed. It must now choose between civic institutions and an expanded coercive administration."
 nww_pol.51.a:0 "Civic Minority Administration (50 political power)"
 nww_pol.51.b:0 "Compulsory Administration (50 political power)"
 nww_pol.51.c:0 "Return to this through decisions."
 nww_pol.52.t:0 "The Berlin Deal: The Price of Security"
 nww_pol.52.d:0 "The customs commission is ready. Industrialists demand transit reform; officers want defence commitments. An alliance still requires German consent."
 nww_pol.52.a:0 "Polish Transit Board (50 political power)"
 nww_pol.52.b:0 "Defence Coordination Protocol (50 political power)"
 nww_pol.52.c:0 "Return to this through decisions."
 nww_pol.53.t:0 "The Red Vistula: Who Rules the Councils?"
 nww_pol.53.d:0 "The civil war is over. Local councils demand autonomy; the party apparatus demands unified control. The Polish republic must define its own institutions."
 nww_pol.53.a:0 "Local Council Autonomy (50 political power)"
 nww_pol.53.b:0 "Planning Commissariat (50 political power)"
 nww_pol.53.c:0 "Return to this through decisions."
 POL_institutions_unlocked_tt:0 "Unlocks institutional projects for the chosen path under State Institutions."
