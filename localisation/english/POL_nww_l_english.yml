l_english:
 POL_cop_plan:0 "The COP Plan"
 POL_cop_plan_desc:0 "Concentrate scarce funds on an inland industrial district beyond German industrial ownership.\n\nPersistent programme change: Construction speed: +5%."
 POL_cop_plan_bonus_tt:0 "Construction speed: +5%."
 POL_industrial_census:0 "Industrial Census"
 POL_industrial_census_desc:0 "Audit capacity and transit obligations before granting new concessions."
 POL_accept_german_capital:0 "Accept German Capital"
 POL_accept_german_capital_desc:0 "Two civilian factories come with heavier consumer-goods and trade obligations."
 POL_economic_independence:0 "Economic Independence"
 POL_economic_independence_desc:0 "Buy out dependent enterprises for 100 political power. German investment benefits end with the stranglehold.\n\nPersistent programme change: Construction speed: +10%."
 POL_economic_independence_bonus_tt:0 "Construction speed: +10%."
 POL_public_works_board:0 "Public Works Board"
 POL_public_works_board_desc:0 "Coordinate departmental orders rather than building competing facilities in the same towns.\n\nPersistent programme change: Construction speed: +5%."
 POL_public_works_board_bonus_tt:0 "Construction speed: +5%."
 POL_vistula_rail_corridor:0 "Vistula Rail Corridor"
 POL_vistula_rail_corridor_desc:0 "Improve inland transport between Warsaw and the industrial districts."
 POL_southern_workshops:0 "Southern Engineering Workshops"
 POL_southern_workshops_desc:0 "Build a military factory on territory we actually own and control."
 POL_rural_electrification:0 "Rural Electrification"
 POL_rural_electrification_desc:0 "Power supply lags behind the industrial plan; expand domestic generation.\n\nPersistent programme change: Energy gain: +10%."
 POL_rural_electrification_bonus_tt:0 "Energy gain: +10%."
 POL_domestic_coal_survey:0 "Domestic Coal Survey"
 POL_domestic_coal_survey_desc:0 "Develop domestic deposits rather than relying on German Upper Silesia."
 POL_lublin_arsenals:0 "Lublin Arsenals"
 POL_lublin_arsenals_desc:0 "Add another factory to the inland armaments district."
 POL_precision_machine_tools:0 "Precision Machine Tools"
 POL_precision_machine_tools_desc:0 "Improve series production and master modern machine tools.\n\nPersistent programme change: Production efficiency growth: +10%."
 POL_precision_machine_tools_bonus_tt:0 "Production efficiency growth: +10%."
 POL_university_consortium:0 "University Consortium"
 POL_university_consortium_desc:0 "Connect universities and factory laboratories: one research slot, up to a total of five."
 POL_export_diversification:0 "Diversify Industrial Orders"
 POL_export_diversification_desc:0 "Develop alternative components and improve military output. Land trade still requires a real route.\n\nPersistent programme change: Military factory output: +5%."
 POL_export_diversification_bonus_tt:0 "Military factory output: +5%."
 POL_four_year_balance_sheet:0 "Four-Year Balance Sheet"
 POL_four_year_balance_sheet_desc:0 "Consolidate industrial cooperation and technical education.\n\nPersistent programme change: Military factory output: +5%; Research speed: +5%."
 POL_four_year_balance_sheet_bonus_tt:0 "Military factory output: +5%; Research speed: +5%."
 POL_modernize_the_army:0 "Modernize the Army"
 POL_modernize_the_army_desc:0 "The army needs trained staffs and supplies rather than another cavalry legend.\n\nPersistent programme change: Planning speed: +5%."
 POL_modernize_the_army_bonus_tt:0 "Planning speed: +5%."
 POL_officer_academy:0 "Officer Academy"
 POL_officer_academy_desc:0 "Coordinate officer training and formation command.\n\nPersistent programme change: Army organisation: +5%."
 POL_officer_academy_bonus_tt:0 "Army organisation: +5%."
 POL_cavalry_traditions:0 "Cavalry Traditions"
 POL_cavalry_traditions_desc:0 "Keep cavalry in reconnaissance and manoeuvre roles while preparing cooperation with motorized infantry.\n\nPersistent programme change: Cavalry attack: +10%; Cavalry speed: +10%."
 POL_cavalry_traditions_bonus_tt:0 "Cavalry attack: +10%; Cavalry speed: +10%."
 POL_defend_the_wisla:0 "Defend the Vistula"
 POL_defend_the_wisla_desc:0 "Fortify our controlled core border states and improve army organisation and entrenchment.\n\nPersistent programme change: Army organisation: +5%; Maximum entrenchment: +10%."
 POL_defend_the_wisla_bonus_tt:0 "Army organisation: +5%; Maximum entrenchment: +10%."
 POL_motorized_columns:0 "Motorized Columns"
 POL_motorized_columns_desc:0 "Supply mobile formations with trucks and common operating standards.\n\nPersistent programme change: Motorized attack: +10%; Army speed: +5%."
 POL_motorized_columns_bonus_tt:0 "Motorized attack: +10%; Army speed: +5%."
 POL_mobile_signals:0 "Mobile Signals"
 POL_mobile_signals_desc:0 "Speed up orders within the mobile army.\n\nPersistent programme change: Planning speed: +10%."
 POL_mobile_signals_bonus_tt:0 "Planning speed: +10%."
 POL_fortress_engineers:0 "Fortress Engineers"
 POL_fortress_engineers_desc:0 "Engineer teams will prepare fortifications and field positions.\n\nPersistent programme change: Entrenchment speed: +10%."
 POL_fortress_engineers_bonus_tt:0 "Entrenchment speed: +10%."
 POL_vistula_reserve_battalions:0 "Vistula Reserve Battalions"
 POL_vistula_reserve_battalions_desc:0 "Organize replacement battalions for homeland defence.\n\nPersistent programme change: Defence on core territory: +10%."
 POL_vistula_reserve_battalions_bonus_tt:0 "Defence on core territory: +10%."
 POL_unified_general_staff:0 "Unified General Staff"
 POL_unified_general_staff_desc:0 "Place the chosen doctrine within a unified planning system.\n\nPersistent programme change: Planning speed: +5%."
 POL_unified_general_staff_bonus_tt:0 "Planning speed: +5%."
 POL_quartermaster_service:0 "Quartermaster Service"
 POL_quartermaster_service_desc:0 "Reduce supply waste in inland transport.\n\nPersistent programme change: Supply consumption: -10%."
 POL_quartermaster_service_bonus_tt:0 "Supply consumption: -10%."
 POL_reserve_officer_network:0 "Reserve Officer Network"
 POL_reserve_officer_network_desc:0 "Trained instructors will accelerate replacement training.\n\nPersistent programme change: Army training time: -10%."
 POL_reserve_officer_network_bonus_tt:0 "Army training time: -10%."
 POL_national_manoeuvres:0 "National Manoeuvres"
 POL_national_manoeuvres_desc:0 "Test the reforms in exercises and consolidate army cohesion.\n\nPersistent programme change: Army organisation: +5%."
 POL_national_manoeuvres_bonus_tt:0 "Army organisation: +5%."
 POL_pzl_research_bureau:0 "PZL Design Bureau"
 POL_pzl_research_bureau_desc:0 "Develop domestic aircraft designs."
 POL_air_training_schools:0 "Flying Schools"
 POL_air_training_schools_desc:0 "A common training syllabus will reduce accidents.\n\nPersistent programme change: Air accident chance: -10%."
 POL_air_training_schools_bonus_tt:0 "Air accident chance: -10%."
 POL_defence_of_the_skies:0 "Defence of Polish Skies"
 POL_defence_of_the_skies_desc:0 "Prepare fighters to defend inland industrial districts.\n\nPersistent programme change: Air range: +10%."
 POL_defence_of_the_skies_bonus_tt:0 "Air range: +10%."
 POL_army_air_liaison:0 "Army-Air Liaison"
 POL_army_air_liaison_desc:0 "Coordinate reconnaissance and requests for air support.\n\nPersistent programme change: Air mission efficiency: +5%."
 POL_army_air_liaison_bonus_tt:0 "Air mission efficiency: +5%."
 POL_dispersed_air_workshops:0 "Dispersed Air Workshops"
 POL_dispersed_air_workshops_desc:0 "Build another military factory and an inland air base."
 POL_integrated_air_command:0 "Integrated Air Command"
 POL_integrated_air_command_desc:0 "Consolidate cooperation between air districts.\n\nPersistent programme change: Air mission efficiency: +5%."
 POL_integrated_air_command_bonus_tt:0 "Air mission efficiency: +5%."
 POL_baltic_fleet_program:0 "Baltic Fleet Programme"
 POL_baltic_fleet_program_desc:0 "Until we control a coastline this remains a future proposal. This focus creates no ships."
 POL_baltic_fleet_program_reward_tt:0 "Preparatory project: unlocks the first dockyard focus. The project itself creates no ships, divisions or buildings."
 POL_first_coastal_dockyard:0 "First Coastal Dockyard"
 POL_first_coastal_dockyard_desc:0 "Move from plans to one dockyard in an owned, controlled coastal state."
 POL_aftermath_of_the_marshal:0 "After the Marshal"
 POL_aftermath_of_the_marshal_desc:0 "Pilsudski is dead. Independence won during the Great Tumult will outlive him only through a new political settlement."
 POL_aftermath_of_the_marshal_reward_tt:0 "Unlocks economic and military preparation, party support campaigns and the Marshal’s legacy event."
 POL_castle_and_colonels_dialogue:0 "Castle-Colonels Dialogue"
 POL_castle_and_colonels_dialogue_desc:0 "Prepare an agreement between Sanation’s civilian and military wings."
 POL_castle_and_colonels_dialogue_reward_tt:0 "Unlocks the paid Sanation support campaign; the budget commission and a 40% mandate are required."
 POL_national_democratic_leagues:0 "National Democratic Leagues"
 POL_national_democratic_leagues_desc:0 "Endecja builds an organization; street agitation alone cannot justify a change of government."
 POL_national_democratic_leagues_reward_tt:0 "Unlocks paid Endecja campaigning towards 40% support."
 POL_berlin_trade_delegation:0 "Trade Delegation to Berlin"
 POL_berlin_trade_delegation_desc:0 "Prepare a domestic coalition for a pragmatic agreement with Germany."
 POL_berlin_trade_delegation_reward_tt:0 "Unlocks pragmatic campaigning and preparation for talks with Germany."
 POL_workers_defence_committees:0 "Workers Defence Committees"
 POL_workers_defence_committees_desc:0 "Build a Lodz workers’ organization capable of winning mass support."
 POL_workers_defence_committees_reward_tt:0 "Unlocks paid worker campaigning towards 40% communist support."
 POL_state_budget_commission:0 "State Budget Commission"
 POL_state_budget_commission_desc:0 "Ease the Sanation crisis, while leaving its final institutional settlement unfinished."
 POL_state_budget_commission_reward_tt:0 "Eases the Sanation Crisis: stability penalty changes from −15% to −10%, daily political power from −0.20 to −0.10. Institutions of the selected path must finish the settlement."
 POL_the_colonels_regime:0 "The Colonels’ Regime"
 POL_the_colonels_regime_desc:0 "Preserve independence and Sanation rule with at least 40% support.\n\nPersistent programme change: Stability: +5%."
 POL_the_colonels_regime_bonus_tt:0 "Stability: +5%."
 POL_endecja_ascendant:0 "Endecja Ascendant"
 POL_endecja_ascendant_desc:0 "The National Democrats replace the regime with at least 40% support and a prepared political movement.\n\nPersistent programme change: Stability: +5%."
 POL_endecja_ascendant_bonus_tt:0 "Stability: +5%."
 POL_pragmatic_deal:0 "A Pragmatic Deal"
 POL_pragmatic_deal_desc:0 "Choose negotiations with Berlin; a political alliance still requires German consent."
 POL_pragmatic_deal_reward_tt:0 "Commits to the German political path and unlocks preparations for a Berlin compact. This focus establishes neither an alliance nor puppet status."
 POL_the_lodz_uprising:0 "The Lodz Uprising"
 POL_the_lodz_uprising_desc:0 "With at least 40% communist support, the workers’ movement launches an armed challenge to the regime."
 POL_castle_compact:0 "Compact with the Castle"
 POL_castle_compact_desc:0 "Define the powers of the president and the inspector-general.\n\nPersistent programme change: Daily political power: +0.10."
 POL_castle_compact_bonus_tt:0 "Daily political power: +0.10."
 POL_professional_civil_service:0 "Professional Civil Service"
 POL_professional_civil_service_desc:0 "End divided administration and establish budgetary accountability.\n\nPersistent programme change: Stability: +5%."
 POL_professional_civil_service_bonus_tt:0 "Stability: +5%."
 POL_fortify_the_borders:0 "Fortify the Borders"
 POL_fortify_the_borders_desc:0 "Prepare our actual controlled core border states for defence.\n\nPersistent programme change: Defence on core territory: +5%."
 POL_fortify_the_borders_bonus_tt:0 "Defence on core territory: +5%."
 POL_intermarium_concept:0 "The Intermarium Concept"
 POL_intermarium_concept_desc:0 "Create a defensive alliance of our own; neighbours may accept or reject an invitation."
 POL_intermarium_concept_reward_tt:0 "Creates a Polish defensive faction. Romanian and Lithuanian-Belarusian membership requires separate negotiations."
 POL_vilnius_settlement:0 "The Vilnius Settlement"
 POL_vilnius_settlement_desc:0 "Offer Lithuania-Belarus mutual renunciation of border claims without automatic state transfers."
 POL_vilnius_settlement_reward_tt:0 "Sends Lithuania-Belarus an offer to renounce mutual claims if the Union survived its own Vilnius compromise. Unlocks paid renewed talks."
 POL_baltic_danubian_congress:0 "Baltic-Danubian Congress"
 POL_baltic_danubian_congress_desc:0 "Invite Romania and, after settling the dispute, Lithuania-Belarus into the Intermarium."
 POL_baltic_danubian_congress_reward_tt:0 "Invites eligible Romania and Lithuania-Belarus; each government may refuse."
 POL_agrarian_conciliation:0 "Agrarian Conciliation"
 POL_agrarian_conciliation_desc:0 "Rural representation strengthens the independent republic.\n\nPersistent programme change: Stability: +5%."
 POL_agrarian_conciliation_bonus_tt:0 "Stability: +5%."
 POL_national_defence_fund_nww:0 "National Defence Fund"
 POL_national_defence_fund_nww_desc:0 "Finance another domestic military factory."
 POL_republic_survives:0 "The Republic Endures"
 POL_republic_survives_desc:0 "After 1941, consolidate the institutions of an independent defensive republic.\n\nPersistent programme change: Daily political power: +0.10; Defence on core territory: +5%."
 POL_republic_survives_bonus_tt:0 "Daily political power: +0.10; Defence on core territory: +5%."
 POL_national_bloc:0 "National Bloc"
 POL_national_bloc_desc:0 "Consolidate the nationalist government’s political organization.\n\nPersistent programme change: War support: +10%."
 POL_national_bloc_bonus_tt:0 "War support: +10%."
 POL_radical_polonization:0 "Radical Polonization"
 POL_radical_polonization_desc:0 "Coercive administration accelerates occupied-territory compliance but increases resistance.\n\nPersistent programme change: Compliance growth in our occupied states: +5%; Resistance target in our occupied states: +10%."
 POL_radical_polonization_bonus_tt:0 "Compliance growth in our occupied states: +5%; Resistance target in our occupied states: +10%."
 POL_western_claims_dossier:0 "Western Claims Dossier"
 POL_western_claims_dossier_desc:0 "Formulate claims to Poznan, Pomerelia, Danzig and Upper Silesia without treating them as already owned."
 POL_western_claims_dossier_reward_tt:0 "Adds claims on Poznan, Pomerelia, Danzig and Upper Silesia. Ownership and core status do not change."
 POL_wartime_conversion:0 "Wartime Conversion"
 POL_wartime_conversion_desc:0 "Redirect industrial orders and terminate German concessions.\n\nPersistent programme change: Military factory output: +10%."
 POL_wartime_conversion_bonus_tt:0 "Military factory output: +10%."
 POL_march_to_the_sea:0 "March to the Sea"
 POL_march_to_the_sea_desc:0 "From 1939 prepare a limited war goal against Germany for the western states. The AI must wait until Germany is vulnerable."
 POL_secure_the_corridor:0 "Secure the Corridor"
 POL_secure_the_corridor_desc:0 "Rebuild administration only after actually owning and controlling western territory.\n\nPersistent programme change: Stability: +5%."
 POL_secure_the_corridor_bonus_tt:0 "Stability: +5%."
 POL_silesian_reconstruction:0 "Silesian Reconstruction"
 POL_silesian_reconstruction_desc:0 "Industrial investment goes only to genuinely recovered states."
 POL_continental_army:0 "Continental Army"
 POL_continental_army_desc:0 "Consolidate army organization and supplies after the western campaign.\n\nPersistent programme change: Army organisation: +5%; Supply consumption: -5%."
 POL_continental_army_bonus_tt:0 "Army organisation: +5%; Supply consumption: -5%."
 POL_sovereign_national_state:0 "A Sovereign National State"
 POL_sovereign_national_state_desc:0 "Consolidate the institutions of a state that rejected a German protectorate.\n\nPersistent programme change: Daily political power: +0.10; War support: +5%."
 POL_sovereign_national_state_bonus_tt:0 "Daily political power: +0.10; War support: +5%."
 POL_customs_commission:0 "Customs Commission"
 POL_customs_commission_desc:0 "Prepare terms for transit and industrial credit.\n\nPersistent programme change: Production efficiency growth: +5%."
 POL_customs_commission_bonus_tt:0 "Production efficiency growth: +5%."
 POL_guaranteed_transit:0 "Guaranteed Transit"
 POL_guaranteed_transit_desc:0 "Agree transport procedures. This focus creates neither ports nor imaginary trade routes.\n\nPersistent programme change: Military factory output: +5%."
 POL_guaranteed_transit_bonus_tt:0 "Military factory output: +5%."
 POL_join_mitteleuropa_officially:0 "Officially Join Mitteleuropa"
 POL_join_mitteleuropa_officially_desc:0 "With 40% support for Germany’s ideology, align our government and request Berlin’s alliance and guarantee. Germany may refuse."
 POL_join_mitteleuropa_officially_reward_tt:0 "With a 40% mandate, adopts the current German government’s ideology and offers an alliance and guarantee. Berlin may refuse; paid renewed talks remain available."
 POL_licensed_machine_tools:0 "Licensed Machine Tools"
 POL_licensed_machine_tools_desc:0 "Maintain Polish production through agreed technical licences.\n\nPersistent programme change: Production efficiency growth: +5%."
 POL_licensed_machine_tools_bonus_tt:0 "Production efficiency growth: +5%."
 POL_staff_exchange:0 "Staff Exchange"
 POL_staff_exchange_desc:0 "Train officers to cooperate with partners while retaining Polish formations.\n\nPersistent programme change: Planning speed: +10%."
 POL_staff_exchange_bonus_tt:0 "Planning speed: +10%."
 POL_recognize_the_western_frontier:0 "Recognize the Western Frontier"
 POL_recognize_the_western_frontier_desc:0 "Renounce political claims to German western states; no foreign territory is transferred automatically."
 POL_recognize_the_western_frontier_reward_tt:0 "Removes Polish claims on German western states without transferring territory."
 POL_galician_assurances:0 "Galician Assurances"
 POL_galician_assurances_desc:0 "Strengthen our own southern defence; an alliance with Germany does not annex Austria.\n\nPersistent programme change: Defence on core territory: +5%."
 POL_galician_assurances_bonus_tt:0 "Defence on core territory: +5%."
 POL_joint_armament_contracts:0 "Joint Armament Contracts"
 POL_joint_armament_contracts_desc:0 "Expand armaments production with one domestic factory."
 POL_polish_institutions_in_mitteleuropa:0 "Polish Institutions in Mitteleuropa"
 POL_polish_institutions_in_mitteleuropa_desc:0 "Consolidate administrative stability within the German system.\n\nPersistent programme change: Stability: +10%; Daily political power: +0.10."
 POL_polish_institutions_in_mitteleuropa_bonus_tt:0 "Stability: +10%; Daily political power: +0.10."
 POL_council_republic:0 "Council Republic"
 POL_council_republic_desc:0 "Only an actual rebel victory in the civil war permits the new state to be constituted.\n\nPersistent programme change: Stability: +5%."
 POL_council_republic_bonus_tt:0 "Stability: +5%."
 POL_land_and_food_committees:0 "Land and Food Committees"
 POL_land_and_food_committees_desc:0 "Organize urban food supply and rural representation.\n\nPersistent programme change: Stability: +5%."
 POL_land_and_food_committees_bonus_tt:0 "Stability: +5%."
 POL_nationalize_german_assets:0 "Nationalize German Assets"
 POL_nationalize_german_assets_desc:0 "End German concession dependence together with its investment benefits.\n\nPersistent programme change: Construction speed: +5%."
 POL_nationalize_german_assets_bonus_tt:0 "Construction speed: +5%."
 POL_workers_militias_nww:0 "Workers Militias"
 POL_workers_militias_nww_desc:0 "Build a workers’ military training system without conjuring free divisions.\n\nPersistent programme change: Army training time: -10%; Defence on core territory: +5%."
 POL_workers_militias_nww_bonus_tt:0 "Army training time: -10%; Defence on core territory: +5%."
 POL_alliance_with_the_east:0 "Alliance with the East"
 POL_alliance_with_the_east_desc:0 "Offer an alliance to communist Russia or Lithuania-Belarus. The recipient retains the right to refuse."
 POL_alliance_with_the_east_reward_tt:0 "After actual rebel victory, offers an alliance to communist Russia or eligible Lithuania-Belarus. Acceptance is not guaranteed."
 POL_socialist_constitution:0 "Socialist Constitution"
 POL_socialist_constitution_desc:0 "Define central authority and the powers of local councils.\n\nPersistent programme change: Daily political power: +0.10."
 POL_socialist_constitution_bonus_tt:0 "Daily political power: +0.10."
 POL_eastern_trade_protocols:0 "Eastern Trade Protocols"
 POL_eastern_trade_protocols_desc:0 "Agree industrial contracts with the partner that accepted our alliance.\n\nPersistent programme change: Military factory output: +5%."
 POL_eastern_trade_protocols_bonus_tt:0 "Military factory output: +5%."
 POL_red_logistics_service:0 "Red Logistics Service"
 POL_red_logistics_service_desc:0 "Coordinate rail deliveries and army depots.\n\nPersistent programme change: Supply consumption: -10%."
 POL_red_logistics_service_bonus_tt:0 "Supply consumption: -10%."
 POL_red_wisla:0 "The Red Vistula"
 POL_red_wisla_desc:0 "Complete institutional reconstruction and the defence of the Polish council republic.\n\nPersistent programme change: Stability: +5%; Army organisation: +5%."
 POL_red_wisla_bonus_tt:0 "Stability: +5%; Army organisation: +5%."
 POL_cop_program:0 "Central Industrial District"
 POL_cop_program_desc:0 "One industrial programme based on the chosen financing."
 POL_army_program:0 "Polish Army Programme"
 POL_army_program_desc:0 "A persistent programme for the chosen doctrine and common military administration."
 POL_air_program:0 "Polish Aviation Programme"
 POL_air_program_desc:0 "Common standards for air training, communications and command."
 POL_state_program:0 "Polish State Institutions"
 POL_state_program_desc:0 "Institutions and policy choices of the selected path."
 POL_german_economic_stranglehold:0 "German Economic Stranglehold"
 POL_german_economic_stranglehold_desc:0 "German investment improves factory output, but consumer obligations and expensive trade-law changes bind Warsaw. Economic dependence does not make Poland a puppet."
 POL_german_economic_stranglehold_2:0 "German Stranglehold: New Concessions"
 POL_german_economic_stranglehold_2_desc:0 "New factories and higher output are paid for through deeper dependence on German orders."
 POL_sanation_crisis:0 "Sanation Crisis"
 POL_sanation_crisis_desc:0 "Pilsudski’s death intensified the rivalry between the Castle and the Colonels. Stability and government effectiveness suffer until a new settlement is reached."
 POL_sanation_crisis_2:0 "Sanation Crisis: Interim Compromise"
 POL_sanation_crisis_2_desc:0 "The budget commission contained the conflict, but the chosen political path must still build lasting institutions."
 POL_landlocked_nation:0 "A Landlocked Nation"
 POL_landlocked_nation_desc:0 "Poland has no coastline or starting fleet. The naval programme requires control of at least one coastal state; a dockyard additionally requires ownership. Land trade follows the game’s normal route rules."
 POL_native_event_disabled:0 "This native chain is replaced by NWW content."
 POL_ai_restraint_tt:0 "Polish AI does not start early wars. Endecja’s western campaign requires 1939, preparation and a vulnerable Germany."
 POL_civil_war_tt:0 "A genuine civil war begins: the communists receive approximately 40% of the country. The player transfers to the rebels; their actual victory is required for the Council Republic."
 POL_nww_politics:0 "Polish Politics and Negotiations"
 POL_nww_politics_desc:0 "Building a public mandate costs political power. Regime changes require at least 40% support; diplomatic proposals may be refused."
 POL_campaign_neutrality:0 "Campaign for a state settlement"
 POL_campaign_neutrality_desc:0 "Spend 50 political power on an organized campaign: +10 points of support for the corresponding party. Available again after 35 days."
 POL_campaign_fascism:0 "Campaign for the National Democrats"
 POL_campaign_fascism_desc:0 "Spend 50 political power on an organized campaign: +10 points of support for the corresponding party. Available again after 35 days."
 POL_campaign_communism:0 "Campaign for the workers’ movement"
 POL_campaign_communism_desc:0 "Spend 50 political power on an organized campaign: +10 points of support for the corresponding party. Available again after 35 days."
 POL_campaign_democratic:0 "Campaign for parliamentary representation"
 POL_campaign_democratic_desc:0 "Spend 50 political power on an organized campaign: +10 points of support for the corresponding party. Available again after 35 days."
 POL_retry_german_compact:0 "Renew Talks with Berlin"
 POL_retry_german_compact_desc:0 "A fresh diplomatic attempt costs 50 political power. A pending proposal prevents duplicate dispatch; a 180-day cooldown follows each attempt. The partner may refuse."
 POL_retry_vilnius_talks:0 "Renew the Vilnius Talks"
 POL_retry_vilnius_talks_desc:0 "A fresh diplomatic attempt costs 50 political power. A pending proposal prevents duplicate dispatch; a 180-day cooldown follows each attempt. The partner may refuse."
 POL_retry_eastern_alliance:0 "Renew Talks with the East"
 POL_retry_eastern_alliance_desc:0 "A fresh diplomatic attempt costs 50 political power. A pending proposal prevents duplicate dispatch; a 180-day cooldown follows each attempt. The partner may refuse."
 POL_cancel_german_contracts:0 "Terminate German Concessions"
 POL_cancel_german_contracts_desc:0 "For 100 political power buy out dependent enterprises, also losing the investment output bonus. The pro-German path and German subject status exclude this option."
 POL_intermarium_faction:0 "Intermarium"
 POL_mitteleuropa_faction:0 "Mitteleuropa"
 POL_eastern_faction:0 "Eastern Union of Council Republics"
 POL_plan_sanation:0 "Independent Sanation"
 POL_plan_sanation_desc:0 "Develop the selected institutions, domestic industry and army."
 POL_plan_endecja:0 "Endecja’s Western Strategy"
 POL_plan_endecja_desc:0 "Develop the selected institutions, domestic industry and army."
 POL_plan_german:0 "The German Compact"
 POL_plan_german_desc:0 "Develop the selected institutions, domestic industry and army."
 POL_plan_communist:0 "The Red Vistula"
 POL_plan_communist_desc:0 "Develop the selected institutions, domestic industry and army."
 POL_rule_sanation:0 "Sanation: Independent Buffer"
 POL_rule_sanation_desc:0 "The historical Colonels’ path: defence, COP and a voluntary Intermarium. German protectorate demands will be rejected."
 POL_rule_endecja:0 "Endecja: March to the Sea"
 POL_rule_endecja_desc:0 "National revolution and a prepared western campaign from 1939 when Germany becomes vulnerable."
 POL_rule_german:0 "Deal with Germany"
 POL_rule_german_desc:0 "A pragmatic deal, ideological alignment with Germany and a negotiated German bloc. A later puppet-status ultimatum will be accepted."
 POL_rule_communist:0 "The Lodz Uprising"
 POL_rule_communist_desc:0 "Build a communist mandate, fight a civil war and offer an eastern alliance."
 POL_rule_random:0 "Random NWW Path"
 POL_rule_random_desc:0 "Randomly select one of the four Polish paths, independently of DLC."
 nww_pol.10.t:0 "A Polish-German Compact"
 nww_pol.10.d:0 "Warsaw proposes officially joining our political system in exchange for alliance and a guarantee. This agreement transfers no territory and does not itself make Poland a puppet."
 nww_pol.10.a:0 "Accept the alliance and guarantee Poland."
 nww_pol.10.b:0 "Decline the proposal."
 nww_pol.20.t:0 "A Vilnius Settlement with Poland"
 nww_pol.20.d:0 "Polish Sanation proposes a non-aggression pact and mutual renunciation of border claims. No state is transferred and cores remain intact. The decision belongs to our government."
 nww_pol.20.a:0 "Accept the settlement."
 nww_pol.20.b:0 "Decline to bind ourselves."
 nww_pol.30.t:0 "An Invitation to the Intermarium"
 nww_pol.30.d:0 "Independent Poland invites us into a defensive alliance. We retain sovereignty; alliance obligations take effect only with our consent."
 nww_pol.30.a:0 "Join the Intermarium."
 nww_pol.30.b:0 "Retain diplomatic independence."
 nww_pol.40.t:0 "The Polish Councils Propose an Alliance"
 nww_pol.40.d:0 "Victorious Polish communists ask to join our alliance. They transfer no territory and demand no change to our relations with existing partners."
 nww_pol.40.a:0 "Accept the Polish republic into our alliance."
 nww_pol.40.b:0 "Decline further commitments."
