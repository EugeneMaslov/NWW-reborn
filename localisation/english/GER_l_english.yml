l_english:
 GER_the_gilded_colossus:0 "The Gilded Colossus"
 GER_the_gilded_colossus_desc:0 "The empire commands markets and colonies across the world, yet its institutions have grown rigid and its commitments exceed its means. The crown must decide how this unwieldy hegemony will be governed."
 GER_fund_the_reichswehr:0 "Fund the Reichswehr"
 GER_fund_the_reichswehr_desc:0 "Give the imperial army the funds and access it demands. The General Staff gains influence at the expense of parliamentary oversight. Begin staff reform and replace Imperial Overstretch with its reduced version, removing the organisation penalty."
 GER_empower_the_chancellor:0 "Empower the Chancellor"
 GER_empower_the_chancellor_desc:0 "The chancellor must negotiate budgets through the Reichstag rather than defer to the court and General Staff. Civilian institutions gain a stronger voice."
 GER_end_of_an_era:0 "End of an Era"
 GER_end_of_an_era_desc:0 "Wilhelm II personified an empire that never faced a world war. His death will end its long political suspension and open the struggle over the succession. This focus is completed only by the succession event, between August and the end of 1936."
 GER_the_potsdam_coup:0 "The Potsdam Coup"
 GER_the_potsdam_coup_desc:0 "With the General Staff behind him, Wilhelm III will seize the powers his father allowed to decay. The army must already have received our backing; military influence must exceed 10% to the left of centre, and the monarchists need at least 40% support."
 GER_dissolve_the_reichstag:0 "Dissolve the Reichstag"
 GER_dissolve_the_reichstag_desc:0 "Parliament will no longer obstruct imperial commands. The crown and OHL take complete control, the balance of power is locked, and democratic political advisors lose their posts and eligibility."
 GER_reign_in_mitteleuropa:0 "Rein in Mitteleuropa"
 GER_reign_in_mitteleuropa_desc:0 "From 1939, demand political subordination from independent Poland and Lithuania-Belarus. An economic sphere is not political control: both governments may refuse. A refusal remains a standing objective until Germany is ready to prepare its campaign."
 GER_the_austrian_question:0 "The Austrian Question"
 GER_the_austrian_question_desc:0 "Vienna must acknowledge the supremacy of Berlin and accept puppet status. Austria may refuse; such a refusal gives us a war goal to enforce its submission."
 GER_crush_eastern_syndicates:0 "Crush the Eastern Syndicates"
 GER_crush_eastern_syndicates_desc:0 "After pressure on Mitteleuropa, prepare war goals against independent Ukraine and Makhnovists outside our alliance. The general threshold is 1939; historical AI begins this stage in 1940. Temporarily unsafe objectives are retried later without repeating focus rewards."
 GER_gott_mit_uns:0 "Gott mit uns"
 GER_gott_mit_uns_desc:0 "The Iron Kaiserreich binds crown, army and nation to a single imperial purpose. Its divisions gain 15% core defence, 10% attack and 10% breakthrough. Complete military and administrative reform, removing both versions of Imperial Overstretch."
 ger_aging_monarch:0 "Aging Monarch"
 ger_aging_monarch_desc:0 "The aging Kaiser clings to familiar courtiers, weakening stability and making political appointments more expensive."
 GER_imperial_overstretch:0 "Imperial Overstretch"
 GER_imperial_overstretch_desc:0 "Colonial garrisons, continental guarantees and an inflexible court drain an empire that can no longer afford every obligation. An untested, aristocratic staff clings to nineteenth-century doctrine: organisation falls, recruits train slowly and operational plans stagnate."
 GER_master_of_mitteleuropa:0 "Master of Mitteleuropa"
 GER_master_of_mitteleuropa_desc:0 "Berlin shapes the commercial rules of Central Europe and promotes imperial political influence among its dependants."
 GER_prussian_martial_spirit:0 "Prussian Martial Spirit"
 GER_prussian_martial_spirit_desc:0 "Generations of professional service preserve the discipline and planning traditions of the imperial army."
 GER_kaiser_vs_reichstag:0 "Kaiser and Reichstag"
 GER_ohl_and_crown_side:0 "OHL and the Crown"
 GER_reichstag_side:0 "The Reichstag"
 GER_bop_balanced:0 "Institutional Balance"
 GER_bop_total_ohl:0 "Total OHL Control"
 GER_bop_ohl_leaning:0 "OHL Ascendant"
 GER_bop_ohl_influence:0 "Growing Military Influence"
 GER_bop_reichstag_influence:0 "Growing Parliamentary Influence"
 GER_bop_reichstag_leaning:0 "Reichstag Ascendant"
 GER_bop_total_reichstag:0 "Parliamentary Supremacy"
 GER_bop_decisions_category:0 "Crown, Command and Parliament"
 GER_bop_decisions_category_desc:0 "The empire balances the authority of the crown and General Staff against the demands of the Reichstag. Military command lies to the left; parliament lies to the right."
 GER_consult_the_general_staff:0 "Consult the General Staff"
 GER_consult_the_general_staff_desc:0 "Invite the generals to shape imperial policy. Moves the balance 10% left and increases monarchist support by 5 percentage points. Repeatable every 30 days until the Reichstag is dissolved."
 GER_concede_to_parliament:0 "Concede to Parliament"
 GER_concede_to_parliament_desc:0 "Recognise the Reichstag as a partner in government. Moves the balance 10% right and increases democratic support by 5 percentage points. Repeatable every 30 days until the Reichstag is dissolved."
 GER_bop_frozen_tt:0 "The balance of power is permanently fixed at complete OHL and Crown control. Both influence decisions are disabled."
 GER_litbel_war_guard_tt:0 "Imperial commitments prohibit Germany from declaring war on Lithuania-Belarus before 1 January 1939."
 GER_mitteleuropa_demand_tt:0 "Lithuania-Belarus and Poland: existing German subjects have their autonomy reduced; independent governments receive a demand for puppet status and may refuse. Integrated puppet status requires Together for Victory; otherwise puppet status is used."
 GER_mitteleuropa_refusal_tt:0 "Refusal may grant Germany a puppet war goal. For Lithuania-Belarus this can happen only from 1 January 1939, while it remains independent and outside the German alliance."
 GER_nww_historical_plan:0 "The Iron Kaiserreich"
 GER_nww_historical_plan_desc:0 "An imperial succession followed by military consolidation and pressure on the German sphere."
 ger_crisis.1.t:0 "The Death of Kaiser Wilhelm II"
 ger_crisis.1.d:0 "Kaiser Wilhelm II has died. For decades he stood above a prosperous yet increasingly immobile imperial system, its colonial and continental obligations multiplying while political reform stalled. His son now ascends the throne as Wilhelm III. Behind the public mourning, the General Staff and Reichstag measure their strength. The new reign must settle questions that the old one left unanswered."
 ger_crisis.1.a:0 "The Kaiser is dead. Long live the Kaiser!"
 ger_news.1.t:0 "The Passing of the Last True Emperor"
 ger_news.1.d:0 "Berlin has announced the death of Kaiser Wilhelm II and the accession of Wilhelm III. The late monarch presided over the long German hegemony that shaped Europe without a world war. Now governments from Vienna to the eastern frontier are asking whether his successor will preserve the old arrangements or turn the military weight of the Reich toward a new imperial settlement."
 ger_news.1.a:0 "Europe watches Berlin."
 ger_crisis.10.t:0 "Berlin Demands Austrian Submission"
 ger_crisis.10.d:0 "Wilhelm III demands that Austria recognise German supremacy and accept the status of a puppet state. Acceptance preserves our government under German oversight. Refusal will give Berlin a pretext to enforce submission by war."
 ger_crisis.10.a:0 "Accept German protection."
 ger_crisis.10.b:0 "Austria will remain sovereign."
 ger_crisis.20.t:0 "The Mitteleuropa Ultimatum"
 ger_crisis.20.d:0 "The imperial government in Berlin demands that [ROOT.GetNameDef] accept formal subordination as a German puppet. Our institutions would survive, but foreign policy and strategic decisions would answer to the Kaiser. We can reject this demand. Germany is bound not to begin war against Lithuania-Belarus before 1939, though refusal will leave a lasting dispute."
 ger_crisis.20.a:0 "Accept the imperial settlement."
 ger_crisis.20.b:0 "Our sovereignty is not negotiable."
 GER_pan_german_leagues:0 "The Pan-German Leagues"
 GER_pan_german_leagues_desc:0 "Organise nationalist associations into a coherent political movement. Their rallies can build the 40% mandate needed to break a parliamentary deadlock."
 GER_organize_ruhr_workers:0 "Organise the Ruhr Workers"
 GER_organize_ruhr_workers_desc:0 "Rebuild the workers councils and prepare a Spartacist challenge to the imperial order. Councils can raise support for the coming uprising."
 GER_parliamentary_spring:0 "Parliamentary Spring"
 GER_parliamentary_spring_desc:0 "With at least 40% democratic support, a strengthened chancellor and the balance to the right of +0.10, parliament can take charge of the succession. Hans Vogel forms a social democratic government; the balance is permanently fixed at full Reichstag control."
 GER_true_constitutional_monarchy:0 "A True Constitutional Monarchy"
 GER_true_constitutional_monarchy_desc:0 "Wilhelm III retains the crown as a constitutional symbol while elected ministers exercise executive power. Parliamentary institutions grant +15% stability and +0.20 daily political power. Civilian oversight begins the same staff reform as army funding, removing the organisation penalty."
 GER_mitteleuropa_economic_community:0 "Mitteleuropa Economic Community"
 GER_mitteleuropa_economic_community_desc:0 "Free Lithuania-Belarus and Poland if they are our subjects, and invite them to the voluntary Mitteleuropa alliance. Each partner that accepts contributes one off-map civilian factory to economic integration, up to two in total. Refusal brings no war goal."
 GER_the_austrian_referendum:0 "The Austrian Referendum"
 GER_the_austrian_referendum_desc:0 "Offer Vienna peaceful unification if its government is democratic, or an alliance between sovereign states. Austria decides freely and must be at peace; refusing either arrangement has no military consequences."
 GER_arsenal_of_democracy:0 "Arsenal of Democracy"
 GER_arsenal_of_democracy_desc:0 "Strengthen our constitutional institutions with a defensive industrial programme: +20% factory output and +10% division defence, retaining their stability and political-power bonuses. Guarantee independent Lithuania-Belarus and Poland against foreign aggression. Complete military and administrative reform, removing both versions of Imperial Overstretch."
 GER_the_pan_germanic_triumph:0 "The Pan-Germanic Triumph"
 GER_the_pan_germanic_triumph_desc:0 "With at least 40% nationalist support and a deadlocked balance between -0.30 and +0.30, the Pan-German movement seizes government. Wilhelm III remains its nominal head until the dynasty is abolished."
 GER_abolish_the_hohenzollerns:0 "Abolish the Hohenzollerns"
 GER_abolish_the_hohenzollerns_desc:0 "Remove Wilhelm III and the last dynastic restraints. Alfred Hugenberg heads a radical nationalist government, and the crown-Reichstag balance of power is abolished permanently. Reorganise the staff to remove the organisation penalty from Imperial Overstretch."
 GER_anschluss_by_force:0 "Anschluss by Force"
 GER_anschluss_by_force_desc:0 "Demand Austria consent to annexation into the new German state. A refusal grants an annexation war goal. The demand is delivered only to an independent Austria at peace."
 GER_lebensraum_in_the_east:0 "Expansion in the East"
 GER_lebensraum_in_the_east_desc:0 "The Pan-German leadership claims the eastern borderlands as its sphere of expansion. Prepare annexation war goals against independent, non-allied Lithuania-Belarus and Poland, only after the eastern gate opens.\n\n$GER_eastern_1939_gate_tt$"
 GER_the_new_reich:0 "The New Reich"
 GER_the_new_reich_desc:0 "A militarised nationalist state mobilises its divisions for offensive war: +15% division attack, +20% breakthrough and +10% division speed. Complete military and administrative reform, removing both versions of Imperial Overstretch."
 GER_the_spartacist_uprising:0 "The Spartacist Uprising"
 GER_the_spartacist_uprising_desc:0 "With workers organised and at least 40% Communist support, rise against the monarchy. A real civil war begins; the player switches to the Communist insurgents with 40% of the initial military strength. Victory is required before proclaiming the republic."
 GER_german_soviet_republic:0 "The German Soviet Republic"
 GER_german_soviet_republic_desc:0 "After the Spartacists defeat the imperial loyalists in the civil war, establish a German council republic under Ernst Thalmann. The uprising must have won; simply waiting for the fighting to end is insufficient. Reconstitute the staff and replace Imperial Overstretch with its reduced version."
 GER_workers_militias:0 "Workers Militias"
 GER_workers_militias_desc:0 "Build a common militia organisation around the factory councils, granting +5 percentage points of recruitable population and +10% organisation recovery. Complete military and administrative reform, removing both versions of Imperial Overstretch."
 GER_dismantle_imperial_borders:0 "Dismantle Imperial Borders"
 GER_dismantle_imperial_borders_desc:0 "End German overlordship over Lithuania-Belarus and Poland. Only our own existing subjects are freed; independent countries and the possessions of third powers are not annexed or transferred."
 GER_berlin_moscow_axis:0 "The Berlin-Moscow Axis"
 GER_berlin_moscow_axis_desc:0 "Allocate political resources to international coordination and offer communist Russia an alliance when diplomacy permits. Moscow may refuse. The absence of a suitable partner does not block our own revolutionary programme."
 GER_world_revolution:0 "World Revolution"
 GER_world_revolution_desc:0 "Prepare annexation war goals against independent, non-allied France and Britain. These western objectives never waive Germany’s eastern restrictions."
 GER_eastern_1939_gate_tt:0 "German eastern ultimatums and focus war goals open in §Y1939§!. Historical AI turns to Ukraine and MKN from §Y1940§!; war requires separate readiness."
 GER_eastern_war_guard_tt:0 "Eastern focus objectives are closed before 1939; AI does not start offensive wars."
 GER_reichstag_locked_tt:0 "The balance of power is permanently fixed at full Reichstag control. Military influence decisions are disabled."
 GER_economic_community_tt:0 "Free our existing Lithuanian-Belarusian and Polish subjects and invite them into Mitteleuropa. Each consenting partner grants one off-map civilian factory, once only."
 GER_constitutional_monarchy:0 "Constitutional Institutions"
 GER_constitutional_monarchy_desc:0 "An accountable cabinet governs in the name of a ceremonial crown. These institutions grow into the Arsenal of Democracy."
 GER_mitteleuropa_faction:0 "Mitteleuropa"
 GER_berlin_moscow_faction:0 "Berlin-Moscow Workers Alliance"
 GER_rally_pan_german_leagues:0 "Rally the Pan-German Leagues"
 GER_rally_pan_german_leagues_desc:0 "Spend 50 political power to gain 10 percentage points of Pan-German support. Repeatable every 30 days before committing to a political path; the balance does not move."
 GER_organize_workers_councils:0 "Organise Workers Councils"
 GER_organize_workers_councils_desc:0 "Spend 50 political power to gain 10 percentage points of Spartacist support. Repeatable every 30 days before committing to a political path; the balance does not move."
 ger_crisis.30.t:0 "An Austrian Referendum"
 ger_crisis.30.d:0 "The parliamentary government of [FROM.GetNameDef] proposes a peaceful settlement. A democratic Austria may freely choose unification, while a sovereign alliance offers an alternative. Vienna can also decline without inviting war."
 ger_crisis.30.a:0 "Vote for democratic unification."
 ger_crisis.30.b:0 "Join Mitteleuropa as a sovereign partner."
 ger_crisis.30.c:0 "Retain our independent course."
 ger_crisis.40.t:0 "The Pan-German Annexation Demand"
 ger_crisis.40.d:0 "The radical nationalist government in Berlin demands that Austria join its state immediately. Acceptance means annexation; refusal will give Germany a war goal. This is an Austrian decision, not an automatic transfer of territory."
 ger_crisis.40.a:0 "Accept incorporation into Germany."
 ger_crisis.40.b:0 "Austria will resist."
 ger_crisis.50.t:0 "An Invitation to Mitteleuropa"
 ger_crisis.50.d:0 "The social democratic government of [FROM.GetNameDef] offers membership in a voluntary economic and defensive community. Our sovereignty is recognised independently of our answer. Acceptance establishes joint economic institutions; refusal brings no ultimatum."
 ger_crisis.50.a:0 "Join the community."
 ger_crisis.50.b:0 "Prefer independent economic relations."
 ger_crisis.60.t:0 "The Berlin-Moscow Proposal"
 ger_crisis.60.d:0 "The victorious German Spartacists propose an alliance with the Soviet Union. If we lead an existing alliance they will join it; otherwise a common workers alliance can be established. The decision remains with our government."
 ger_crisis.60.a:0 "Accept our German comrades."
 ger_crisis.60.b:0 "Pursue our own strategy."
 GER_imperial_field_exercises:0 "Hold Imperial Field Exercises"
 GER_imperial_field_exercises_desc:0 "The General Staff demonstrates its readiness at the cost of public confidence. Strengthen the Crown and temporarily improve planning and recovery."
 GER_reichstag_social_compact:0 "Negotiate the Reichstag Social Budget"
 GER_reichstag_social_compact_desc:0 "Parliament funds civilian construction and social peace, accepting a less martial public mood."
 GER_publish_military_audit:0 "Publish the Military Accounts"
 GER_publish_military_audit_desc:0 "An open audit restores confidence and parliamentary influence. Officers resent the scrutiny and temporarily resist offensive initiatives."
 GER_mediate_crown_and_chamber:0 "Mediate between Crown and Chamber"
 GER_mediate_crown_and_chamber_desc:0 "Move the balance toward the center through a costly constitutional truce. Consumer obligations ease, while enthusiasm for war falls."
 GER_staff_manoeuvres:0 "General Staff Manoeuvres"
 GER_staff_manoeuvres_desc:0 "Coordinated exercises strengthen planning and the recovery of formations."
 GER_social_budget:0 "Parliamentary Social Budget"
 GER_social_budget_desc:0 "Civil construction contracts underpin the compromise with the Reichstag."
 GER_military_accounts:0 "Published Military Accounts"
 GER_military_accounts_desc:0 "Transparent accounts ease political work, but military opposition weakens offensive action."
 GER_constitutional_truce:0 "Constitutional Truce"
 GER_constitutional_truce_desc:0 "A temporary settlement releases resources previously absorbed by political concessions."
 GER_schlieffen_reborn:0 "Schlieffen Reborn"
 GER_schlieffen_reborn_desc:0 "Modern staff work replaces a plan inherited from the last century. From 1941 we can demand the subordination of the Netherlands and Belgium. The historical AI must first settle its Polish and Austrian campaigns."
 GER_strike_the_west:0 "Strike the West"
 GER_strike_the_west_desc:0 "The reformed imperial army prepares a campaign against France. A conquest war goal supplies the diplomatic instrument; victory still has to be won on the battlefield."
 GER_the_second_naval_race:0 "The Second Naval Race"
 GER_the_second_naval_race_desc:0 "An earlier rivalry for the oceans resumes. Shipyard construction rises by 15%, dockyard output by 10%, and two capital-ship or related module technologies receive a 100% research bonus. A conquest war goal against Britain completes our western strategy."
 GER_drang_nach_osten_expanded:0 "Expand the Eastern Offensive"
 GER_drang_nach_osten_expanded_desc:0 "From 1941 the radical government prepares conquest war goals against Soviet Russia and the Makhnovist state, provided they still exist as independent, non-allied states."
 GER_total_assimilation:0 "Total Assimilation"
 GER_total_assimilation_desc:0 "A coercive occupation administration accelerates compliance growth in our occupied territories by 10% and lowers the resistance target by 10 percentage points. Its extensive policing increases required garrisons by 10%. These measures grant no new national cores."
 GER_hegemony_over_europe_focus:0 "Hegemony over Europe"
 GER_hegemony_over_europe_focus_desc:0 "The New Reich issues conquest war goals against independent Denmark, Norway, Sweden, Finland and Switzerland, excluding our allies and existing wars."
 GER_european_federation:0 "European Federation"
 GER_european_federation_desc:0 "Transform our voluntary alliance into the European Federation. Every member receives +10% civilian factory construction speed and +5% factory output while democratic Germany leads the federation. Future entrants share the programme; leaving ends its benefits."
 GER_anti_imperialist_crusade:0 "Anti-Imperialist Crusade"
 GER_anti_imperialist_crusade_desc:0 "Prepare liberation war goals against France and Britain if they are independent, non-democratic states outside our alliance. Liberation must be achieved through war and the peace settlement."
 GER_shield_against_the_reds:0 "Shield against the Reds"
 GER_shield_against_the_reds_desc:0 "Democracy must be able to defend itself. Gain +15% defence on our core territory, two additional volunteer divisions and a 50-point reduction to the volunteer world-tension requirement. Authorise volunteers and support independent states resisting fascist or communist aggression."
 GER_red_rhine:0 "The Red Rhine"
 GER_red_rhine_desc:0 "Support communist organisations in France, the Netherlands, Belgium and Luxembourg. Each independent recipient may tolerate agitation or suppress it. A communist uprising is possible only with a substantial local movement and more than one controlled state."
 GER_nva_mass_mobilization:0 "National People’s Army"
 GER_nva_mass_mobilization_desc:0 "Turn the workers’ militias into a permanent mass army. Raise recruitable population by another 5 percentage points, to 10 in total. Retain +10% organisation recovery and reduce army training time by 10%. Prioritising infantry imposes a 20% research-speed penalty on aircraft and naval equipment."
 GER_challenge_moscow:0 "Challenge Moscow"
 GER_challenge_moscow_desc:0 "From 1941, at peace, dispute Moscow’s claim to lead the revolution. Leave the Soviet alliance, or expel the Soviet Union if we lead it, then prepare a conquest war goal against an independent Soviet state."
 GER_imperial_overstretch_2:0 "Imperial Overstretch: Reformed Staff"
 GER_imperial_overstretch_2_desc:0 "Staff reform removes the organisation penalty, but bureaucracy and obsolete institutions still burden consumer production, war support, planning and training. Only the political programme’s final military settlement can end these obligations."
 GER_gott_mit_uns_naval:0 "Gott mit uns: Oceanic Empire"
 GER_gott_mit_uns_naval_desc:0 "The imperial military settlement retains its army bonuses while long-term contracts expand dockyard construction and naval output for an ocean-going fleet."
 GER_the_new_reich_integrated:0 "The New Reich: Occupation Administration"
 GER_the_new_reich_integrated_desc:0 "The New Reich retains its army bonuses and expands its coercive bureaucracy to manage occupied territories, at the cost of larger garrisons."
 GER_federal_investment:0 "Federal Investment Programme"
 GER_federal_investment_desc:0 "Common industrial standards and voluntary investment agreements improve civilian construction and military factory output. Membership benefits end when the federation loses its democratic German leadership or this country leaves it."
 GER_arsenal_of_democracy_shield:0 "Democratic Shield"
 GER_arsenal_of_democracy_shield_desc:0 "Retain the Arsenal of Democracy’s institutional and industrial benefits, strengthen homeland defence and organise a larger volunteer contingent to support threatened independent states."
 GER_nva_mass_army:0 "National People’s Army"
 GER_nva_mass_army_desc:0 "A permanent successor to the workers’ militias adds another 5 percentage points of recruitable population, retains their recovery benefits and trains infantry faster, while air and naval research loses priority."
 GER_european_federation_faction:0 "European Federation"
 GER_capital_ship_research:0 "Capital Ship Programme"
 ger_crisis.70.t:0 "Revolutionary Agitation from Germany"
 ger_crisis.70.d:0 "German Spartacist organisers have contacted local communist groups. Their funds and propaganda may strengthen the movement, but the government can still suppress it. Where communist support is already substantial, radicals demand an immediate armed uprising."
 ger_crisis.70.a:0 "The revolution begins here!"
 ger_crisis.70.b:0 "Allow peaceful workers’ agitation."
 ger_crisis.70.c:0 "Disrupt the foreign-funded organisations."
