l_english:
 MKN_the_free_territory:0 "The Free Territory"
 MKN_the_free_territory_desc:0 "No masters, no states - only free soviets of peasants and workers."
 MKN_farmers_and_workers:0 "Farmers and Workers"
 MKN_farmers_and_workers_desc:0 "The Free Territory stands on the hands that labor, not on the crowns of the old world."
 MKN_shadow_republic:0 "Shadow Republic"
 MKN_shadow_republic_desc:0 "The state that never quite appears, but is always felt."
 MKN_free_soviets:0 "Free Soviets"
 MKN_free_soviets_desc:0 "Every village its own commune, every commune its own voice."
 MKN_nabat_federation:0 "The Nabat Federation"
 MKN_nabat_federation_desc:0 "Anarchist federations from Kharkov to Odessa look to Gulyai-Polye."
 MKN_gulyai_polye_commune:0 "Gulyai-Polye Commune"
 MKN_gulyai_polye_commune_desc:0 "The capital of anarchy will show the world a different way to live."
 MKN_black_banner_east:0 "Black Banner East"
 MKN_black_banner_east_desc:0 "Kiev bows to Moscow. The east must be freed from both."
 MKN_makhno_moves_south:0 "Makhno Moves South"
 MKN_makhno_moves_south_desc:0 "To the sea, to the ports, to the ships that carry our grain."
 MKN_the_steppe_holds:0 "The Steppe Holds"
 MKN_the_steppe_holds_desc:0 "Three years of war and the Free Territory still stands. Let them come."
 MKN_soviet_press:0 "Soviet Press"
 MKN_soviet_press_desc:0 "Nabat and Golos print the truth daily."
 MKN_anarchist_schools:0 "Anarchist Schools"
 MKN_anarchist_schools_desc:0 "Ferrer schools for free children."
 MKN_peasant_militias:0 "Peasant Militias"
 MKN_peasant_militias_desc:0 "Every village its own sotnya."
 MKN_border_tensions:0 "Border Tensions"
 MKN_border_tensions_desc:0 "Kiev holds what the steppe needs. Probe their border."
 MKN_everlasting_makhnovshchina:0 "The Makhnovist Tradition"
 MKN_everlasting_makhnovshchina_desc:0 "The congress may invite Makhno back as a civilian delegate, without restoring his military office. Voluntary defence and communal autonomy strengthen the soviets by 0.20."
 MKN_soviets_forever:0 "Soviets Forever"
 MKN_soviets_forever_desc:0 "The commune is eternal."
 MKN_tachanka_guards:0 "Tachanka Guards"
 MKN_tachanka_guards_desc:0 "The elite of the Insurgent Army."
 MKN_council_communism:0 "The Syndicalist Program"
 MKN_council_communism_desc:0 "Factory assemblies and peasant communes coordinate production through elected delegates. This alternative within anarcho-communism strengthens the soviets by 0.20 without submitting to Moscow."
 MKN_workers_control:0 "Workers Control"
 MKN_workers_control_desc:0 "The factory to those who work it."
 MKN_commune_federation:0 "Commune Federation"
 MKN_commune_federation_desc:0 "A thousand communes, one federation."
 MKN_constituent_assembly:0 "The Congress of Free Soviets"
 MKN_constituent_assembly_desc:0 "At least 40% support is required to entrust authority to recallable council delegates. Anarcho-communism uses the democratic ideology group, while national parliamentary elections remain disabled. The balance shifts by 0.45 toward the free soviets."
 MKN_free_elections_steppe:0 "Recallable Communal Mandates"
 MKN_free_elections_steppe_desc:0 "Each commune elects and may recall its delegates. The federation receives reliable mandates without creating a permanent parliament. Free soviets gain another 0.20 on the balance scale."
 MKN_open_markets:0 "Cooperative Exchange"
 MKN_open_markets_desc:0 "Communal workshops exchange their surplus through cooperative agreements and shared technical standards."
 MKN_red_banner_steppe:0 "The Red Compromise"
 MKN_red_banner_steppe_desc:0 "With at least 40% support, state socialists establish a central administration while recognizing local councils. The balance shifts by 0.35 toward the soviets. An independent communist Moscow receives a proposal for a defence pact if neither country is already fighting the other and the Free Territory is outside a faction."
 MKN_hand_to_moscow:0 "Renew the Moscow Proposal"
 MKN_hand_to_moscow_desc:0 "A rejected invitation may be renewed through formal negotiations. Only Moscow can accept the alliance; an accepted pact bypasses this redundant request without another reward. A betrayal ends further negotiations."
 MKN_collectivize_the_steppe:0 "Collectivize the Steppe"
 MKN_collectivize_the_steppe_desc:0 "Voluntarily. Mostly."
 MKN_black_hundreds:0 "The Atamans Take Command"
 MKN_black_hundreds_desc:0 "With at least 40% support and a mandate from the communal press, the atamans establish anarcho-militarism. Army command gains 0.45 on the native balance scale; village consent gives way to military orders."
 MKN_order_through_tachanka:0 "Unified Operational Orders"
 MKN_order_through_tachanka_desc:0 "The atamans establish a common chain of command, shifting the balance another 0.20 toward the military."
 MKN_steppe_legions:0 "The Steppe Legions"
 MKN_steppe_legions_desc:0 "Permanent formations replace the loosely coordinated detachments. This institution requires more than 80% military control and shifts the balance another 0.10 toward command."
 MKN_nestor_the_first:0 "The Peasant Protector"
 MKN_nestor_the_first_desc:0 "With at least 40% support, the peasant congress chooses agrarian isolationism under Nestor I. The dispute between command and soviets is abolished, removing the balance of power and its modifiers. Makhno retains his crown and portrait, while his military offices remain restricted to communism."
 MKN_imperial_coronation:0 "Imperial Coronation"
 MKN_imperial_coronation_desc:0 "A crown of wheat and steel."
 MKN_steppe_empire:0 "Defend the Peasant Realm"
 MKN_steppe_empire_desc:0 "The protectorate prepares to defend its villages without seeking foreign conquest. Nestor remains a monarch, bound by the agreements of the peasant congress."
 MKN_ataman_directorate:0 "The Ataman Directorate"
 MKN_ataman_directorate_desc:0 "The directorate establishes a permanent command council. It requires more than 80% military control; the balance remains adjustable through political decisions."
 MKN_recallable_delegates:0 "The Charter of Recall"
 MKN_recallable_delegates_desc:0 "Whether the congress follows the Makhnovist tradition or syndicalist coordination, it guarantees the right to recall every delegate. The charter requires more than 80% control by the free soviets."
 MKN_peasant_charter:0 "The Peasant Charter"
 MKN_peasant_charter_desc:0 "Nestor I recognizes the village assemblies, communal land agreements and limits on foreign commitments. The crown becomes a guarantor of agrarian isolation rather than a claim to conquest."
 MKN_red_compromise_institutions:0 "The Council Administration"
 MKN_red_compromise_institutions_desc:0 "Local councils implement the state socialist program through a permanent civil administration. These institutions remain viable even if Moscow rejects or betrays the pact."
