l_english:
 MKN_foreign_delegates:0 "Delegates Abroad"
 MKN_foreign_delegates_desc:0 "After Batko’s departure, our neighbours must hear the Free Territory as a whole. Recallable representatives will maintain foreign contacts under every successor government."
 MKN_foreign_delegates_tt:0 "Permanent §YCommunal Foreign Service§!: improve relations maintenance cost §G−10%§!."
 MKN_workers_corridors:0 "Workshop Corridors"
 MKN_workers_corridors_desc:0 "Machine-tool trade and visiting engineers open doors that agitation alone cannot. Offer equal technical agreements to neighbouring states, which remain free to accept or refuse."
 MKN_workers_corridors_tt:0 "Communal Foreign Service: trade opinion factor §G+10%§!. Unlock §Y50 PP§! technical exchange offers to Lithuania–Belarus, Austria, Germany, the Ottoman Empire and Hungary. Acceptance grants each party one §G50%§! industrial research bonus and §G+30§! mutual opinion."
 MKN_consular_communes:0 "Mutual Protection Communes"
 MKN_consular_communes_desc:0 "Our sailors, workers and emigrants need assistance abroad. Permanent bureaux will arrange documents, mediation and safe passage home."
 MKN_consular_communes_tt:0 "Communal Foreign Service: monthly opinion gain §G+10%§!."
 MKN_solidarity_guarantees:0 "Guarantees of Solidarity"
 MKN_solidarity_guarantees_desc:0 "Prepare treaty procedures for defending independent neighbours. The council can issue guarantees through normal diplomacy, while a common congress brings together our representatives and overseas movements."
 MKN_solidarity_guarantees_tt:0 "Communal Foreign Service: independence guarantee cost §G−10%§!. Opens a peaceful route to the Congress of Free Peoples."
 MKN_foreign_service:0 "Communal Foreign Service"
 MKN_foreign_service_desc:0 "A common network of representatives, technical contacts and mutual protection, developed through successive foreign policy focuses."
 MKN_offer_workshop_exchange:0 "Offer a technical exchange to [FROM.GetNameDef]"
 MKN_offer_workshop_exchange_desc:0 "Spend 50 PP to propose a reciprocal industrial exchange to an independent partner. They may accept or decline. Each country can sign once; rejected offers may be repeated after 180 days."
 MKN_workshop_exchange_offer_tt:0 "The recipient may accept: both countries then receive one §G50%§! industrial research bonus and §G+30§! mutual opinion."
 MKN_workshop_exchange_opinion:0 "Industrial Technical Exchange"
 mkn_foreign.1.t:0 "Specialists from the Free Territory"
 mkn_foreign.1.d:0 "Communal representatives propose an exchange of industrial engineers. Each country retains its own enterprises while learning from its partner. The agreement improves relations and grants both parties one 50% industrial research bonus."
 mkn_foreign.1.a:0 "Accept the exchange."
 mkn_foreign.1.b:0 "Decline the exchange."
