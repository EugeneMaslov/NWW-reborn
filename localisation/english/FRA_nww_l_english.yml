l_english:
 FRA_meter_mandate_gain_1_tt:0 "Cabinet mandate: +1."
 FRA_nww_session:0 "Open the Parliamentary Session"
 FRA_nww_session_desc:0 "France avoided a world war, but not a crisis of representation. The Chamber must decide who will fund economic recovery and national defence."
 FRA_meter_mandate_gain_10_tt:0 "Cabinet mandate: +10."
 FRA_nww_accounts:0 "Publish the Public Accounts"
 FRA_nww_accounts_desc:0 "Rumours of hidden state obligations destroy credit faster than bankruptcies. Publish departmental accounts so the Chamber can debate a real budget."
 FRA_meter_tension_loss_5_tt:0 "Street tension: -5."
 FRA_nww_consultations:0 "National Consultations"
 FRA_nww_consultations_desc:0 "Unions, employers, municipalities and the command must state the terms on which they will support a government. A majority lasting one vote is not enough."
 FRA_nww_republic:0 "The Republic Can Govern"
 FRA_nww_republic_desc:0 "The republic need not abandon its name. It needs a cabinet able to fulfil its promises and a Chamber prepared to answer for its decisions."
 FRA_nww_right:0 "National Committees Agreement"
 FRA_nww_right_desc:0 "Royalist societies and national leagues share their hatred of an impotent Chamber. Their agreement still conceals the central question: who will rule after victory?"
 FRA_nww_front:0 "Pact of the Left"
 FRA_nww_front_desc:0 "The left must agree before the election on wages, credit, organisational freedoms and the colonies. Without a common programme, its cabinet will merely continue the party dispute."
 FRA_nww_emergency:0 "Prepare an Emergency Mandate"
 FRA_nww_emergency_desc:0 "Prepare an Emergency Mandate: agree responsibilities, trained staff and funding. The programme will become part of France's permanent institutions."
 FRA_meter_tension_gain_5_tt:0 "Street tension: +5."
 FRA_nww_commission:0 "Parliamentary Inquiry"
