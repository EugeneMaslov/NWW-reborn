 FRA_nww_security_offer:0 "Offer a Treaty: [FROM.GetName]"
 FRA_nww_security_offer_desc:0 "35-day talks on non-aggression and scientific cooperation. The recipient accepts or refuses independently; faction membership remains unchanged."
 nww_fra.200.t:0 "An Offer from Paris"
 nww_fra.200.d:0 "France offers a non-aggression pact and, once its scientific network is ready, participation in joint research. Our government and existing foreign commitments are retained."
 nww_fra.200.a:0 "Accept the treaty."
 nww_fra.200.b:0 "Decline the offer."
 nww_fra.201.t:0 "Treaty Accepted"
 nww_fra.201.d:0 "Our offer has been accepted. The treaty transfers neither territory nor command over the partner's army to France."
 nww_fra.201.a:0 "Cooperation begins."
 nww_fra.202.t:0 "Offer Declined"
 nww_fra.202.d:0 "The talks produced no agreement. A refusal does not create a war goal."
 nww_fra.202.a:0 "Take note."
 FRA_nww_alliance_offer:0 "Offer a Defensive Alliance: [FROM.GetName]"
 FRA_nww_alliance_offer_desc:0 "The partner must separately approve a defensive alliance. France must lead its faction or belong to none. Existing recipient alliances are respected."
 nww_fra.203.t:0 "Defensive Alliance with France"
 nww_fra.203.d:0 "Paris proposes moving from a treaty to a joint defensive alliance. This is a separate decision for our government."
 nww_fra.203.a:0 "Join the alliance."
 nww_fra.203.b:0 "Retain our independence."
 nww_fra.204.t:0 "The French Rhine Ultimatum"
 nww_fra.204.d:0 "Paris demands an end to pressure on its neighbours and a non-aggression treaty. French nationalists are prepared to use refusal as grounds for war. Acceptance transfers no territory."
 nww_fra.204.a:0 "Conclude the treaty."
 nww_fra.204.b:0 "Reject the ultimatum."
