 FRA_mandate_help:0 "Mandate below 25 opens a 90-day confidence vote: restore it to 40. Before settlement lose 2 mandate per 30 days. Each completed focus adds 1 and fulfils a coalition promise. A broken promise costs 5 mandate and adds 5 tension. Civil war requires tension of at least 80, armed organisations and failed reconciliation."
