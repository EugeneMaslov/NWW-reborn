 FRA_nww_contracts:0 "Transparent Public Contracts"
 FRA_nww_contracts_desc:0 "Transparent Public Contracts: agree responsibilities, trained staff and funding. The programme will become part of France's permanent institutions."
 FRA_meter_mandate_gain_15_tt:0 "Cabinet mandate: +15."
 FRA_nww_responsible:0 "A Responsible Cabinet"
 FRA_nww_responsible_desc:0 "A vote of no confidence must open the way to a new cabinet rather than leave the country ungoverned. A majority dismissing ministers must present a replacement."
 FRA_meter_tension_loss_15_tt:0 "Street tension: -15."
 FRA_nww_oversight:0 "Guarantees of Parliamentary Oversight"
 FRA_nww_oversight_desc:0 "A strong government needs credible limits. Standing committees and public accounts will sustain a broad coalition without granting unlimited powers."
 FRA_meter_tension_loss_10_tt:0 "Street tension: -10."
