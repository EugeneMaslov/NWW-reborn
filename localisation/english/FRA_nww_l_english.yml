 nww_fra.1.t:0 "Republic at the Crossroads"
 nww_fra.1.d:0 "The Great War never came. Yet factories work short weeks, cabinets survive vote by vote and the streets lose faith in promises. Our people and industry survived. We must restore the state's ability to act."
 nww_fra.1.a:0 "Let the Chamber begin its work."
 FRA_check_tension_greater_than_or_equals_80_tt:0 "Street tension: at least 80."
 nww_fra.2.t:0 "The Cabinet Loses Confidence"
 nww_fra.2.d:0 "The Chamber has denied the government its support. A new coalition may gain temporary confidence. If armed organisations are ready for conflict, a reconciliation conference remains the last opportunity."
 nww_fra.2.a:0 "Form a new cabinet."
 nww_fra.2.b:0 "Fund a reconciliation conference."
 nww_fra.2.c:0 "The confrontation spirals out of control."
 FRA_meter_tension_gain_25_tt:0 "Street tension: +25."
 FRA_meter_mandate_loss_15_tt:0 "Cabinet mandate: -15."
 nww_fra.3.t:0 "The Military Cabinet Mandate Expires"
 nww_fra.3.d:0 "The promised period of emergency rule has expired. An extension without a new legal basis will destroy confidence in the command."
 nww_fra.3.a:0 "Return power to a civilian cabinet."
 nww_fra.3.b:0 "Retain power by emergency decree."
 nww_fra.100.t:0 "Overseas Conference: Algeria"
 nww_fra.100.d:0 "Continue talks without an agreement."
 nww_fra.100.a:0 "Offer representation and a local budget."
 nww_fra.100.b:0 "Offer an autonomy agreement."
