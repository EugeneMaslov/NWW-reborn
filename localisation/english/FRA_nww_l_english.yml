 nww_fra.140.t:0 "Delegates Reply: Algeria"
 nww_fra.140.d:0 "Representatives have reviewed the offer. They ratify it if pressure is below 80; on the brink of revolt the delegation can no longer guarantee implementation. Pressure must first be reduced."
 nww_fra.140.a:0 "Announce the delegation decision."
 nww_fra.120.t:0 "Overseas Settlement Fails: Algeria"
 nww_fra.120.d:0 "Negotiations have expired. Local organisations announce their break with Paris. The government must recognise their departure or begin an open military campaign; policing can no longer resolve the conflict."
 nww_fra.120.a:0 "Recognise departure and avoid war."
 nww_fra.120.b:0 "Begin a regional campaign."
