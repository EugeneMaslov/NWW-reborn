l_english:
 mkn_expropriate_funds_operation:0 "Expropriate Foreign Funds"
 mkn_expropriate_funds_operation_desc:0 "One attempt per foreign European country or Turkey, including a failed or aborted attempt. Requires one operative, more than 30 network strength and more than 20% civilian intel; costs 200 infantry equipment and takes 45 days. Wealth is measured by civilian factories at launch."
 MKN_valid_expropriation_target:0 "An eligible European or Turkish target that has never been raided."
 MKN_expropriation_outcomes_tt:0 "§GSuccess: 80%§!. Civilian factories at launch determine the reward:\n§Y0–14§!: 25 PP, 300 infantry equipment, 1 off-map civilian factory.\n§Y15–39§!: 50 PP, 500 infantry equipment, 2 off-map civilian factories.\n§Y40+§!: 75 PP, 750 infantry equipment, 3 off-map civilian factories.\nThe first lease lasts §Y180 days§!. A further successful raid while it is active adds its factories and §Y90 days to the remaining duration§!. All leased factories are removed together at expiry.\n§RFailure: 20%§!: lose 50 PP; the target receives a 60-day war goal against us unless already at war or already holding one. §YOne attempt per country; cancellation also consumes the attempt.§!"
 mkn_expropriation_infiltrate:0 "Case the Bank"
 mkn_expropriation_infiltrate_desc:0 "Our operative recruits local sympathizers, studies guard rotations and identifies a shipment worth intercepting."
 mkn_expropriation_infiltrate_outcome:0 "Safe houses and a reliable timetable are ready."
 mkn_expropriation_open_vault:0 "Seize the Funds"
 mkn_expropriation_open_vault_desc:0 "The team strikes at the vault or armored shipment, using forged orders and a short, concentrated assault."
 mkn_expropriation_open_vault_outcome:0 "The team attempts to secure the shipment before the alarm spreads."
 mkn_expropriation_escape:0 "Disappear Across the Border"
 mkn_expropriation_escape_desc:0 "False trails and railway contacts will cover the retreat. Only after extraction will we know whether the expropriation succeeded."
 mkn_expropriation_escape_outcome:0 "The surviving team leaves the country; the final outcome is reported."
 MKN_expropriated_funds:0 "Expropriated Funds"
 MKN_expropriated_funds_desc:0 "Foreign expropriations finance contracts with independent workshops. Successful raids on different countries accumulate factory leases; each further success during the lease adds ninety days."
 MKN_expropriated_funds_factories_tt:0 "Leased off-map civilian factories: §G+[?MKN_expropriation_factories|0]§!. All are removed when this spirit expires."
 mkn_black_international_category:0 "The Black International"
 mkn_black_international_category_desc:0 "Foreign comrades can be welcomed after completing The Black International through either the syndicalist or agrarian programme. Each group costs 50 political power and can be welcomed only once."
 MKN_welcome_cnt_fai_exiles:0 "Welcome Spanish CNT-FAI Exiles"
 MKN_welcome_cnt_fai_exiles_desc:0 "Offer refuge to Spanish anarchists driven into exile by repression. Buenaventura Durruti joins as a level 4 general, an urban assault specialist, mountaineer and commando."
 MKN_buenaventura_durruti:0 "Buenaventura Durruti"
 MKN_harbor_spartacist_engineers:0 "Harbor German Spartacist Engineers"
 MKN_harbor_spartacist_engineers_desc:0 "Engineers escaping political persecution will organize a temporary armaments workshop: one off-map military factory for 180 days."
 MKN_spartacist_engineers:0 "Spartacist Workshop"
 MKN_spartacist_engineers_desc:0 "German specialists have established a temporary cooperative for arms production."
 MKN_spartacist_factory_tt:0 "Off-map military factories: §G+1§! while this spirit is active."
 MKN_accept_italian_mechanics:0 "Accept Italian Syndicalist Mechanics"
 MKN_accept_italian_mechanics_desc:0 "Italian workshop organizers bring expertise in engines and vehicle maintenance. Gain one shared 100% research bonus for motorized equipment or armored cars."
 MKN_italian_mechanics_bonus:0 "Italian Syndicalist Mechanics"
 MKN_smuggle_kronstadt_sailors:0 "Smuggle Kronstadt Sailors"
 MKN_smuggle_kronstadt_sailors_desc:0 "Bring dissident sailors and their families to the free territory through clandestine Baltic routes. Gain 10,000 manpower and 15 naval experience."
 MKN_memory_of_atamansha_marusya:0 "In Memory of Atamansha Marusya"
 MKN_memory_of_atamansha_marusya_desc:0 "Marusya Nikiforova made audacity and initiative a weapon of the insurgency. Preserve her legacy through permanent training in street fighting, breakthrough tactics and rapid recovery."
 MKN_marusyas_legacy:0 "Marusya's Legacy"
 MKN_marusyas_legacy_desc:0 "The memory of Marusya inspires disciplined assault groups able to breach a defended street and regroup before the enemy recovers."
 MKN_marusya_urban_attack_tt:0 "Urban attack: §G+15%§! for land combat battalions."
 MKN_marusya_assault_training:0 "Marusya's Urban Assault Training"
 MKN_marusya_assault_training_desc:0 "Special assault training granted by the national spirit Marusya's Legacy."
 MKN_the_black_guard_battalions:0 "The Black Guard Battalions"
 MKN_the_black_guard_battalions_desc:0 "Form two veteran shock detachments in Huliaipole. Each has nine infantry and two artillery battalions, with engineers, reconnaissance and a field hospital. Their elite template cannot be edited or recruited manually. Huliaipole must be ours and under our control, and all three support technologies must be researched."
 MKN_marusya_shock_detachment:0 "Marusya's Shock Detachment"
 MKN_marusya_guard_1:0 "1st Marusya's Shock Detachment"
 MKN_marusya_guard_2:0 "2nd Marusya's Shock Detachment"
 mkn_espionage.1.t:0 "Anarchists Rob the Central Bank!"
 mkn_espionage.1.d:0 "A coordinated raid has stripped one of our central banking shipments of cash and negotiable securities. The robbers left anarchist leaflets and vanished through a network of safe houses. Investigators trace their organization to the Makhnovist free territory. The proceeds are already beyond our reach."
 mkn_espionage.1.a:0 "Find those responsible."
 mkn_espionage.2.t:0 "Anarchist Bank Robbers Thwarted!"
 mkn_espionage.2.d:0 "Security forces have intercepted an anarchist team preparing to seize a central banking shipment. Recovered documents link the operation to the Makhnovist free territory. The evidence gives us a temporary justification for military action; any existing war goal remains in force."
 mkn_espionage.2.a:0 "They will answer for this."
 mkn_news.10.t:0 "Gunfire at the Reichsbank"
 mkn_news.10.d:0 "A forged transfer order brought a Makhnovist raiding party into a Reichsbank loading yard. When a clerk raised the alarm, shots rang out between the bullion carts. The raiders escaped with cash and securities in a stolen delivery truck, leaving Berlin to explain how foreign anarchists penetrated its financial heart."
 mkn_news.10.a:0 "The Black International strikes again."
 mkn_news.11.t:0 "The Vanishing Bank of England Shipment"
 mkn_news.11.d:0 "A Bank of England shipment disappeared after men in official-looking uniforms redirected its escort through a London service tunnel. The abandoned armored van contained only empty cases and a black flag. Investigators suspect a Makhnovist network used dockside contacts to move the funds out of Britain before the alarm reached the ports."
 mkn_news.11.a:0 "The Black International strikes again."
 mkn_news.12.t:0 "A Vault Breached in Paris"
 mkn_news.12.d:0 "Anarchist burglars entered a Paris bank vault through the cellar of a neighboring workshop. Cutting equipment muffled behind construction noise opened the treasury wall overnight. By morning the vault was stripped of portable securities. A message claiming the money for the free communes linked the spectacular breach to Makhnovist operatives."
 mkn_news.12.a:0 "The Black International strikes again."
 mkn_news.13.t:0 "The Italian Treasury Convoy Ambush"
 mkn_news.13.d:0 "A blocked road and a counterfeit railway diversion trapped an Italian treasury convoy outside Rome. Raiders struck before the escort could reorganize, seized its strongboxes and scattered along workshop supply routes. Black banners and intercepted correspondence point to a Makhnovist expropriation team aided by local sympathizers."
 mkn_news.13.a:0 "The Black International strikes again."
 mkn_news.14.t:0 "Vienna Cashiers Confront an Empty Vault"
 mkn_news.14.d:0 "Viennese bank employees opened their vault to find carefully resealed boxes filled with scrap iron. A counterfeit inspection team had replaced the contents during a scheduled transfer. Authorities now believe Makhnovist agents carried the real reserves away in maintenance wagons while the guards watched the wrong doors."
 mkn_news.14.a:0 "The Black International strikes again."
 mkn_news.15.t:0 "A Baltic Clearinghouse Emptied"
 mkn_news.15.d:0 "Forged clearing documents allowed anarchist couriers to collect a large shipment from a Baltic banking depot. The fraud emerged only when the real recipients arrived. Police across the region are searching railway offices and warehouses; the organizers have already proclaimed the funds a contribution to the Makhnovist free communes."
 mkn_news.15.a:0 "The Black International strikes again."
 mkn_news.16.t:0 "Warsaw Bank Transfer Hijacked"
 mkn_news.16.d:0 "A Warsaw treasury transfer ended in a warehouse controlled by men carrying forged police credentials. The escort was disarmed, the funds loaded onto civilian trucks and the warehouse set ablaze to destroy the trail. Leaflets found nearby identify the raid as an expropriation in solidarity with the Makhnovist communes."
 mkn_news.16.a:0 "The Black International strikes again."
 mkn_news.17.t:0 "A Soviet Treasury Train Diverted"
 mkn_news.17.d:0 "False dispatch orders sent a Soviet treasury carriage onto a quiet siding, where armed expropriators cut the telegraph line and seized its cargo. The engine was recovered hours later, but the money had vanished. Evidence of Makhnovist involvement has turned an embarrassing railway failure into an international incident."
 mkn_news.17.a:0 "The Black International strikes again."
 mkn_news.18.t:0 "Black Flags over a Ukrainian Mail Train"
 mkn_news.18.d:0 "A Ukrainian mail train carrying bank reserves was stopped by a counterfeit signal crew. Masked raiders uncoupled the treasury wagon and hauled it away with a waiting locomotive. The passengers were left unharmed beside a black flag, while the stolen reserves disappeared along routes leading toward the Makhnovist free territory."
 mkn_news.18.a:0 "The Black International strikes again."
 mkn_news.19.t:0 "Stockholm Reserve Launch Disappears"
 mkn_news.19.d:0 "A launch carrying Swedish banking reserves vanished among the islands outside Stockholm. A fake harbor patrol had redirected it into a secluded inlet, where expropriators transferred the strongboxes to a fishing vessel. Authorities found anarchist proclamations aboard the empty launch and suspect a Makhnovist maritime escape network."
 mkn_news.19.a:0 "The Black International strikes again."
 MKN_mobile_patrols:0 "Tachanka Patrol Columns"
 MKN_mobile_patrols_desc:0 "Dispersed patrols move quickly but require additional supplies."
 MKN_seed_cooperatives:0 "Communal Seed Cooperatives"
 MKN_seed_cooperatives_desc:0 "Shared reserves and reliable workshop schedules ease civilian shortages."
 MKN_extra_workshop_shifts:0 "Requisitioned Workshop Shifts"
 MKN_extra_workshop_shifts_desc:0 "Military output rises as the communes shoulder additional civilian obligations."
 MKN_recallable_front_delegates:0 "Recallable Front Delegates"
 MKN_recallable_front_delegates_desc:0 "A standing exchange between villages and units improves recovery but demands political effort."
 MKN_tachanka_patrols:0 "Send Tachankas on Steppe Patrol"
 MKN_tachanka_patrols_desc:0 "Empower field commanders to patrol the steppe. Mobility and war support improve, while supply demands and unrest grow."
 MKN_communal_seed_reserves:0 "Pool the Communal Seed Reserves"
 MKN_communal_seed_reserves_desc:0 "Let village assemblies coordinate seed stocks and workshop orders. Strengthen the councils and economic cooperation while reducing enthusiasm for war."
 MKN_requisition_workshop_shifts:0 "Requisition Extra Workshop Shifts"
 MKN_requisition_workshop_shifts_desc:0 "Commanders demand additional arms from the workshops. Military production rises at the cost of stability and civilian consumption."
 MKN_reconcile_village_and_front:0 "Reconcile Village and Front"
 MKN_reconcile_village_and_front_desc:0 "Bring recallable delegates from the villages to the units. Move the balance toward the center, share military experience and improve recovery through political effort."
 MKN_black_international_decisions_unlock_tt:0 "Unlocks the four one-time Black International invitations: Spanish anarchists, German engineers, Italian mechanics and Kronstadt sailors."
 MKN_heist_unused_tt:0 "No expropriation operation has previously been launched against this country."
