l_english:
 MKN_nabat_abroad:0 "Nabat Beyond the Frontier"
 MKN_nabat_abroad_desc:0 "After the Great Tumult, Nabat must reach workers and peasants on both sides of the frontier. Couriers will build solidarity rather than a new state bureaucracy."
 MKN_agitation_in_litbel:0 "Agitation in Litbel"
 MKN_agitation_in_litbel_desc:0 "The Vilnius compromise has not ended the struggle between labourers and landlords. Litbel unions shall receive arms and funds for their own struggle."
 MKN_galician_peasants:0 "Defend the Galician Peasants"
 MKN_galician_peasants_desc:0 "The Habsburgs may gather crownlands, but they cannot own their inhabitants' labour. Rural unions in Galicia and Bucovina shall receive our support."
 MKN_fund_the_underground:0 "Fund the Underground"
 MKN_fund_the_underground_desc:0 "Local guides, caches and voluntary committees will help our columns operate beyond their home territory."
 MKN_congress_of_free_peoples:0 "Congress of Free Peoples"
 MKN_congress_of_free_peoples_desc:0 "Neighbouring councils shall not become our branch offices. A common congress will establish voluntary agreements and the right to refuse."
 MKN_global_syndicalist_pact:0 "Global Syndicalist Pact"
 MKN_global_syndicalist_pact_desc:0 "The Black International shall be a consensual association, not an empire under another flag. Our volunteers will aid communist and democratic participants in civil wars."
 MKN_death_or_freedom:0 "Death or Freedom!"
 MKN_death_or_freedom_desc:0 "A great power advances and our home communes are occupied. Emergency recruitment will demand sacrifices and divide the peaceful assemblies."
 MKN_hide_the_machines:0 "Hide the Machines"
 MKN_hide_the_machines_desc:0 "Workshops move into cellars, barns and forest shelters. Three underground arsenals will sustain production at the expense of construction."
 MKN_marusya_womens_battalions:0 "Marusya's Women's Battalions"
 MKN_marusya_womens_battalions_desc:0 "Marusya has become a symbol for a new generation of volunteers. Thirty thousand defenders of the communes will join the ranks and help the army recover after battle."
 MKN_evacuation_soviets:0 "Evacuation Councils"
 MKN_evacuation_soviets_desc:0 "Medical wagons and local councils must bring the wounded home. A common evacuation network will operate for the next six months."
 MKN_shadows_in_the_forests:0 "Shadows in the Forests"
 MKN_shadows_in_the_forests_desc:0 "Occupation garrisons shall have no quiet rear. Forest couriers and underground councils will double resistance damage on our occupied soil."
 MKN_black_vengeance:0 "Black Vengeance"
 MKN_black_vengeance_desc:0 "Six months to return home. Our columns will strike the occupiers on home soil and quicken their advance while the common resolve lasts."
 MKN_free_science_network:0 "Network of Free Institutes"
 MKN_free_science_network_desc:0 "Unite the polytechnic and research communes into a network of free institutes. A second additional team raises scientific capacity to five slots. Kyiv Scientific Exchange will provide the sixth after Ukrainian integration."
 MKN_open_peer_review:0 "Open Laboratories"
 MKN_open_peer_review_desc:0 "Scientists' councils publish results and scrutinise each other. Shared laboratories will accelerate research without bureaucratic barriers."
 MKN_jet_tachankas:0 "Rocket Tachankas"
 MKN_jet_tachankas_desc:0 "Rocket batteries will carry forward the mobile firepower of the tachanka. Two research programmes shall receive common funding."
 MKN_dnieper_jet_falcons:0 "Jet Falcons of the Dnieper"
 MKN_dnieper_jet_falcons_desc:0 "Dnieper workshops move from pistons to jet propulsion. A common programme will accelerate jet research and improve aircraft agility."
 MKN_reactor_safety_councils:0 "Nuclear Safety Councils"
 MKN_reactor_safety_councils_desc:0 "The new energy requires verifiable rules, trained engineers and communal oversight. We shall prepare them before starting a reactor."
 MKN_the_absolute_argument:0 "The Absolute Argument"
 MKN_the_absolute_argument_desc:0 "Empires must know the cost of invasion. Reactor research will open a project in Huliaipole; actual nuclear weapons will still require further scientific and industrial work."
 MKN_military_reform_cooldown:0 "Military Reform Implementation"
 MKN_military_reform_cooldown_desc:0 "The staff is implementing the current reform. We cannot yet begin further major reforms in the armed services."
 MKN_nabat_foreign_cells:0 "Foreign Nabat Cells"
 MKN_nabat_foreign_cells_desc:0 "Communal couriers establish intelligence networks abroad. Requires La Résistance."
 MKN_hidden_workshops:0 "Underground Arsenals"
 MKN_hidden_workshops_desc:0 "Three off-map military factories operate in hiding. Construction is 20% slower. The factories and construction penalty persist after peace returns."
 MKN_evacuation_columns:0 "Council Medical Columns"
 MKN_evacuation_columns_desc:0 "For 180 days, local councils bring more wounded fighters home."
 MKN_black_vengeance_spirit:0 "The Black Vengeance Offensive"
 MKN_black_vengeance_spirit_desc:0 "For 180 days: +20% attack on core territory and +10% army speed."
 MKN_open_laboratories:0 "Open Communal Laboratories"
 MKN_open_laboratories_desc:0 "Free exchange of results increases research speed by 5%."
 MKN_nabat_abroad_unlock_tt:0 "Unlocks Nabat work abroad and its decisions."
 MKN_litbel_agitation_unlock_tt:0 "Unlocks Litbel strike funding: 50 PP and 200 rifles for 45 days. Completion reduces stability by 5 percentage points and damages one military factory. Allies and non-aggression partners are excluded."
 MKN_galician_agitation_unlock_tt:0 "Unlocks support for rural unions in Galicia and Bucovina: 50 PP and 200 rifles for 45 days. A prepared Austrian state bordering us can then be contested for 100 PP."
 MKN_underground_combat_tt:0 "Shared army spirit: +10% attack and defence on territory that is not our core."
 MKN_free_peoples_congress_tt:0 "Prepares a voluntary pact. Other countries must receive an invitation and consent to membership."
 MKN_syndicalist_pact_unlock_tt:0 "Shared army spirit: +3 volunteer capacity. Unlocks founding the Black International for 100 PP and invitations for 50 PP. Volunteers may be sent to communist and democratic participants in civil wars."
 MKN_volunteer_recipients_tt:0 "Volunteer solidarity requires a communist or democratic recipient fighting a civil war."
 MKN_death_or_freedom_tt:0 "Permanently improves the shared army spirit: recruitable population §G+5 percentage points§!."
 MKN_hidden_workshops_tt:0 "Permanent spirit: +3 off-map military factories and −20% construction speed."
 MKN_womens_battalions_tt:0 "Permanently improves the shared army spirit: organisation recovery §G+10%§!."
 MKN_forest_resistance_tt:0 "Shared army spirit: +100% damage to garrisons on our occupied territory."
 MKN_jet_falcons_tt:0 "Permanently improves the shared air spirit: agility §G+5%§!."
 MKN_reactor_project_unlock_tt:0 "Unlocks one Huliaipole reactor project in the Economic Congress: 100 PP and 5 civilian factories for 90 days. Requires ownership, control and a free slot; cancellation refunds PP."
 MKN_horizons_200_rifles:0 "£infantry_equipment_text_icon §Y200§!"
 MKN_horizons_international_category:0 "Nabat Abroad"
 MKN_horizons_international_category_desc:0 "Strikes, rural unions and voluntary diplomacy for the Black International. Armed support costs time and resources; allies and pact partners are protected."
 MKN_sponsor_litbel_strike:0 "Sponsor a Litbel Strike"
 MKN_sponsor_litbel_strike_desc:0 "45 days, 50 PP and 200 rifles: −5 percentage points stability and damage to one military factory. Can be funded again after 180 days. Cancellation refunds PP and basic rifles."
 MKN_support_galician_unions:0 "Arm Rural Unions: [FROM.GetName]"
 MKN_support_galician_unions_desc:0 "45 days, 50 PP and 200 rifles prepare rural unions against the Habsburgs: Austrian stability falls by 5 percentage points, infrastructure is damaged and the state is prepared for a border action. Cancellation refunds PP and basic rifles."
 MKN_galician_border_action:0 "Support the Rising: [FROM.GetName]"
 MKN_galician_border_action_desc:0 "100 PP. Requires armed rural unions, Austrian ownership and control, a shared border and peace between both sides. Winning the border conflict transfers the contested state without granting a core."
 MKN_found_black_international:0 "Found the Black International"
 MKN_found_black_international_desc:0 "For 100 PP, establish our own faction if we are independent and outside any existing faction."
 MKN_horizons_black_international:0 "Black International"
 MKN_invite_free_councils:0 "Invite [FROM.GetName] to the International"
 MKN_invite_free_councils_desc:0 "50 PP funds a diplomatic mission. An independent communist or democratic country outside any faction decides whether to accept."
 MKN_huliaipole_reactor_project:0 "Huliaipole Reactor Project"
 MKN_huliaipole_reactor_project_desc:0 "One completed project per campaign: 100 PP and 5 civilian factories for 90 days. Builds one nuclear reactor in Huliaipole. Loss of ownership, control or space cancels the project, refunds PP and releases the factories."
 MKN_jet_tachankas_bonus:0 "Communal Rocket Batteries"
 MKN_jet_falcons_bonus:0 "Dnieper Jet Programme"
 MKN_reactor_safety_bonus:0 "Communal Nuclear Councils"
 mkn_horizons.1.t:0 "An Invitation from the Black International"
 mkn_horizons.1.d:0 "Delegates of the Free Territory offer us a seat in their congress and defensive association. They promise equal representation, but membership would bind our foreign policy to the communes. The decision is ours."
 mkn_horizons.1.a:0 "Accept the invitation."
 mkn_horizons.1.b:0 "We will choose our own course."
 UKR_mkn_escalation_required_tt:0 "An attack on the Free Territory requires the conclusion of frontier escalation."
