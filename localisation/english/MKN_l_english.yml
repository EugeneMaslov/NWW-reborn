 MKN_Commune_Guard:0 "Commune Guard"
 MKN_peasant_council_leader:0 "Council of Peasant Delegates"
 MKN_revkom_leader:0 "Emergency Revolutionary Committee"
 MKN_fascism_successor_desc:0 "Dmitruk Tratishov leads the Black Staff’s anarcho-militarists. He promises unified command, workshops serving the front and a territory held together by force. His accession requires a prepared congress and at least 40% public support; military discipline cannot replace a political mandate."
 MKN_democratic_successor_desc:0 "Volin speaks for recallable local delegates and free association."
 MKN_neutrality_successor_desc:0 "An elected village council governs without a monarch or a permanent urban bureaucracy."
 MKN_communism_successor_desc:0 "The revolutionary committee coordinates an independent state-socialist administration."
