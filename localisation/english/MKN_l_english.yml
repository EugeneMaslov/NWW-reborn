l_english:
 MKN_congress_1936:0 "The Congress of 1936"
 MKN_congress_1936_desc:0 "The hall smells of wet greatcoats and printer’s ink. Makhno can still silence it with a glance, but no one believes that he can do so forever. Give the delegates a mandate and bring the struggle between Tratishov’s staff and Volin’s soviets into the open."
 MKN_question_of_supply:0 "The Question of Supply"
 MKN_question_of_supply_desc:0 "A rifle cannot eat a resolution. Let the communes audit grain, ammunition and rail deliveries; the free soviets gain influence over the common war effort."
 MKN_question_of_discipline:0 "The Question of Discipline"
 MKN_question_of_discipline_desc:0 "Orders die between the congress hall and the trenches. Let the staff coordinate marching columns and reserve depots, even if the delegates call that the first stone of a new state."
 MKN_departure_of_batko:0 "The Departure of the Batko"
 MKN_departure_of_batko_desc:0 "This focus is completed by Makhno’s death event. His coffin closes an age, not an argument. There are 180 days to settle the succession before the steppe splits into armed camps."
 MKN_military_takes_charge:0 "The Military Takes Charge"
 MKN_military_takes_charge_desc:0 "Tratishov spreads a railway map over the congress table. The revolution needs a single operational command. With at least 40% public support and a prepared congress, anarcho-militarism becomes the ruling program."
 MKN_arrest_demagogues:0 "Arrest the Demagogues"
 MKN_arrest_demagogues_desc:0 "The staff seals the faction presses and detains those organizing rival commands. A brutal settlement ends the 180-day countdown to civil war."
 MKN_abolish_election_of_commanders:0 "Abolish the Election of Commanders"
 MKN_abolish_election_of_commanders_desc:0 "A battle cannot wait for a recall vote. End the balance of power and fold military authority into our existing army organization: stronger planning and cohesion under a permanent staff."
 MKN_militarize_communes:0 "Militarize the Communes"
 MKN_militarize_communes_desc:0 "Every commune must keep a muster roll beside its grain ledger. Broaden recruitment, at the price of another wound to communal confidence."
 MKN_standardize_workshops:0 "Standardize the Workshops"
 MKN_standardize_workshops_desc:0 "A dozen incompatible breech blocks are a dozen ways to lose a battle. Give the artels common gauges and coordinated orders to raise output and production efficiency."
 MKN_iron_fist_trains:0 "The Iron Fist on Rails"
 MKN_iron_fist_trains_desc:0 "Armored trains shall carry the staff’s will beyond the horizon. Preserve the railway cult, accelerate train research and reduce the army’s supply burden."
 MKN_black_expansionism:0 "Black Expansionism"
 MKN_black_expansionism_desc:0 "A frontier drawn by a chancery is no sacred boundary. Unlock controlled border clashes with LitBel and the Soviet Republics wherever our territories actually meet."
 MKN_the_black_horde:0 "The Black Horde"
 MKN_the_black_horde_desc:0 "Bayonets rise beneath the black banner. The army gains 25% attack and 30% breakthrough; sovereign neighbors outside our faction become targets for annexation. The staff promises freedom at the end of every march."
 MKN_triumph_of_free_soviets:0 "The Triumph of the Free Soviets"
 MKN_triumph_of_free_soviets_desc:0 "Volin asks the delegates who gave a staff the right to govern. With a prepared congress and at least 40% support, anarcho-communism becomes the ruling program of recallable local councils."
 MKN_pact_of_free_communes:0 "The Pact of Free Communes"
 MKN_pact_of_free_communes_desc:0 "The communes sign a common obligation to settle disputes without rival armies. Ratification stops the civil-war countdown and restores confidence in collective rule."
 MKN_abolish_general_staff:0 "Abolish the General Staff"
 MKN_abolish_general_staff_desc:0 "The staff becomes a technical bureau answerable to the communes. Lock the balance at complete soviet control and improve coordination between local fighting detachments."
 MKN_arms_to_the_people:0 "Arms to the People"
 MKN_arms_to_the_people_desc:0 "Issue rifles from the common depots and form three equipped commune guards. A broader recruitment system makes each village responsible for its own defense."
 MKN_black_international:0 "The Black International"
 MKN_black_international_desc:0 "A shared initiative of the syndicalists and agrarians, prepared after arming the people or organizing the fortified farms. Opens the four Black International invitations, repeated recruitment of foreign volunteers and support for overseas revolutions."
 MKN_propaganda_by_deed:0 "Propaganda by Deed"
 MKN_propaganda_by_deed_desc:0 "A stopped furnace speaks more loudly than a manifesto. Unlock strike networks in neighboring countries; their governments must endure the stoppage or pay to break it."
 MKN_autonomous_rail_crews:0 "Autonomous Rail Crews"
 MKN_autonomous_rail_crews_desc:0 "The timetable belongs to those who keep it running. Worker crews lower train costs and accelerate railway and infrastructure construction."
 MKN_beacon_of_statelessness:0 "The Beacon of Statelessness"
 MKN_beacon_of_statelessness_desc:0 "They may occupy a station, but never the village assembly behind it. Add 35% core defense and 75% damage to enemy garrisons on our occupied soil."
 MKN_peasant_delegates:0 "The Peasant Delegates"
 MKN_peasant_delegates_desc:0 "No new crown shall replace the Batko’s hat. An elected council of villages takes responsibility for the granary. Agrarian isolationism requires a prepared congress and at least 40% support."
 MKN_grain_ultimatum:0 "The Grain Ultimatum"
 MKN_grain_ultimatum_desc:0 "The villages will feed a common defense, never four rival headquarters. Their ultimatum settles the succession and stops the civil-war countdown."
 MKN_sever_urban_ties:0 "Sever Urban Ties"
 MKN_sever_urban_ties_desc:0 "Close the export ledgers and dismiss the competing delegations. Abolish the balance of power, adopt a closed economy and reserve more output for the villages."
 MKN_every_farm_a_fortress:0 "Every Farm a Fortress"
 MKN_every_farm_a_fortress_desc:0 "Cellars become ammunition stores; hedges conceal firing positions. Build two levels of land forts along the borders of states we own and control."
 MKN_steppe_snipers:0 "Steppe Snipers"
 MKN_steppe_snipers_desc:0 "A furrow, a patient eye and one shot. Improve defense and reconnaissance while reducing the enemy’s advantage from air superiority."
 MKN_railway_sabotage:0 "Railway Sabotage"
 MKN_railway_sabotage_desc:0 "Prepare the charges before the retreat order comes. Unlock deliberate damage to infrastructure and railways in threatened border states; their repair will take longer."
 MKN_cavalry_ambush:0 "Cavalry Ambush"
 MKN_cavalry_ambush_desc:0 "Tachankas wait behind the rise, their horses silent in the rye. Add 30% cavalry and motorized battalion attack to the common army spirit."
 MKN_impregnable_granary:0 "The Impregnable Granary"
 MKN_impregnable_granary_desc:0 "There will be no easy harvest for an invader. Add 50% core defense and impose 40% additional hostile attrition in our territory."
 MKN_emergency_revkom:0 "The Emergency Revkom"
 MKN_emergency_revkom_desc:0 "The red delegates demand an administration that can survive its founder. With a prepared congress and at least 40% support, state socialism becomes the ruling program."
 MKN_purge_irreconcilables:0 "Purge the Irreconcilables"
 MKN_purge_irreconcilables_desc:0 "The revkom orders every armed committee to submit its weapons and registers. Resolve the succession and stop the 180-day countdown."
 MKN_embassy_to_kharkov:0 "An Embassy to Kharkov"
 MKN_embassy_to_kharkov_desc:0 "Disband the balance of power and send a delegation to the Soviet Republics. The first proposal offers reciprocal military transit and a grain-for-supply agreement; Kharkov may refuse."
 MKN_integrate_steel_lines:0 "Integrate the Steel Lines"
 MKN_integrate_steel_lines_desc:0 "With Soviet consent and a controlled common border, build a level-two railway connection. Receive ten locomotives and two years of coordinated supply assistance."
 MKN_red_military_specialists:0 "Red Military Specialists"
 MKN_red_military_specialists_desc:0 "The visiting instructors bring tables of organization, not sermons. Improve army cohesion and planning, and gain experience and land doctrine mastery."
 MKN_tractors_for_grain:0 "Tractors for Grain"
 MKN_tractors_for_grain_desc:0 "The grain contract buys machine tools as well as tractors. Gain industrial research bonuses, two military factories and stronger construction capacity."
 MKN_anti_imperialist_front:0 "The Anti-Imperialist Front"
 MKN_anti_imperialist_front_desc:0 "Propose a defensive alliance against the imperial courts of LitBel and Germany. The Soviet government must agree; no foreign country joins without its own decision."
 MKN_the_fatal_plenum:0 "The Fatal Plenum"
 MKN_the_fatal_plenum_desc:0 "The final charter places our autonomous councils beside the Soviet government as equals. Kharkov may ratify it—or expel us from the common front and invade. A betrayed revolution fights with the temporary spirit Betrayed Twice."
 MKN_decaying_batko:0 "The Failing Batko"
 MKN_decaying_batko_desc:0 "The founder’s failing health has become the failing health of the revolution. Orders stall, councils quarrel and marching columns lose cohesion. This spirit ends with Makhno’s death."
 MKN_steppes_freedom:0 "Freedom of the Steppe"
 MKN_steppes_freedom_desc:0 "Fast cavalry and motor columns rely on local supply networks. Five successive industrial milestones remove the scattered workshops’ output penalty, improving the shared economy spirit by five percentage points at each step."
 MKN_cult_of_railways:0 "The Cult of Railways"
 MKN_cult_of_railways_desc:0 "The rails bind scattered communes into a fighting territory. Armored trains cost 35% less, railway guns cost 25% less and bombard 25% more effectively; railway and supply-hub construction gain 35%."
 MKN_autonomous_rail_crews_idea:0 "Autonomous Rail Crews"
 MKN_autonomous_rail_crews_idea_desc:0 "Elected crews share designs and repair tools. All trains cost 25% less; railway and infrastructure construction gain 25% and 20%."
 MKN_soviet_supply_agreement:0 "Soviet Supply Agreement"
 MKN_soviet_supply_agreement_desc:0 "Joint dispatchers and supply officers coordinate deliveries for two years."
 MKN_neighbor_strikes:0 "Black Flag Strikes"
 MKN_neighbor_strikes_desc:0 "The furnaces cool while workers debate a pamphlet from the Free Territory. Production and construction slow for sixty days."
 MKN_betrayed_twice:0 "Betrayed Twice"
 MKN_betrayed_twice_desc:0 "They promised a common front and brought an occupying army. For one year, the councils and soldiers stand together against the betrayal."
 MKN_anarcho_militarism:0 "Anarcho-Militarism"
 MKN_anarcho_communism:0 "Anarcho-Communism"
 MKN_agrarian_isolationism:0 "Agrarian Isolationism"
 MKN_state_socialism:0 "State Socialism"
 MKN_power_balance:0 "Staff and Free Soviets"
 MKN_power_balance_desc:0 "Tratishov’s operational command and Volin’s recallable councils contend for authority. Each side’s control is (1 ± balance value) / 2; the middle represents 45–55% control on either side."
 MKN_bop_decisions_category:0 "The Mandate of the Free Territory"
 MKN_bop_decisions_category_desc:0 "Three repeatable 50-PP decisions adjust the balance. A locked constitution prevents further changes."
 MKN_succession_crisis_category:0 "After the Batko"
 MKN_succession_crisis_category_desc:0 "The funeral is over; the argument has only begun. Complete a settlement focus before the mission expires."
 MKN_steppe_operations_category:0 "Beyond the Village Gate"
 MKN_steppe_operations_category_desc:0 "Rail crews, volunteers and underground organizers carry the commune’s struggle beyond its fields."
 MKN_empower_atamans:0 "Empower the Atamans"
 MKN_empower_atamans_desc:0 "Spend 50 PP to move the balance 0.15 toward the military command. Repeatable after 60 days."
 MKN_convene_local_communes:0 "Convene Local Communes"
 MKN_convene_local_communes_desc:0 "Spend 50 PP to move the balance 0.15 toward the free soviets. Repeatable after 60 days."
 MKN_joint_defence_congress:0 "Joint Defense Congress"
 MKN_joint_defence_congress_desc:0 "Spend 50 PP to move the balance 0.10 toward the center without crossing it. Repeatable after 90 days."
 MKN_civil_war_timer_mission:0 "The Steppe on the Brink"
 MKN_civil_war_timer_mission_desc:0 "We have 180 days to complete Arrest the Demagogues, Pact of Free Communes, Grain Ultimatum or Purge the Irreconcilables. Changing the ruling party alone does not avert collapse. If time runs out, rival camps divide our states and armed forces according to popular support, with whole-state rounding and a minimum foothold for each camp."
 MKN_recruit_international_volunteers:0 "Welcome Foreign Volunteers"
 MKN_recruit_international_volunteers_desc:0 "Spend 50 PP to welcome 5,000 volunteers with 500 rifles. Repeatable every 90 days while the manpower reserve is below 100,000."
 MKN_strike_networks:0 "Organize Strikes in [From.GetNameDef]"
 MKN_strike_networks_desc:0 "Spend 75 PP to send a strike call. The target may endure sixty days of disruption or spend 50 PP and lose 5% stability to suppress it."
 MKN_scorched_railways:0 "Destroy Routes in [From.GetName]"
 MKN_scorched_railways_desc:0 "Spend 25 PP to damage two levels of infrastructure and railways in this threatened state. Repairs are 50% slower. The damage remains after control changes."
 MKN_clash_LTB:0 "Raid LitBel’s Border: [From.GetName]"
 MKN_clash_LTB_desc:0 "Spend 50 PP to begin a real border battle. Victory transfers the contested state; both countries must be at peace and the border must be contiguous and controlled."
 MKN_clash_SOV:0 "Raid the Soviet Border: [From.GetName]"
 MKN_clash_SOV_desc:0 "Spend 50 PP to begin a real border battle. Victory transfers the contested state; both countries must be at peace and outside a common faction."
 MKN_renew_supply_talks:0 "Renew the Grain Negotiations"
 MKN_renew_supply_talks_desc:0 "Ask Kharkov to reconsider reciprocal transit and supplies."
 MKN_renew_front_talks:0 "Renew the Front Negotiations"
 MKN_renew_front_talks_desc:0 "Ask the Soviet Republics to reconsider a common defensive alliance."
