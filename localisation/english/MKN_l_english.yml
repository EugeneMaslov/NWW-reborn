 mkn_crisis.1.t:0 "The Last Breath of the Batko"
 mkn_crisis.1.d:0 "Before dawn, the runner from Huliaipole reached the congress building. He carried no order, only Makhno’s worn cap. The Batko is dead. At the stations, whistles sound without a departure; in the villages, the assemblies stand in silence. Tratishov wants a common command, Volin a federation of free councils, the peasants a closed granary, and the red delegates a revolutionary administration. The funeral has bought us silence, not agreement. We have 180 days."
 mkn_crisis.100.t:0 "The Steppe Burns: Four-Way Collapse"
 mkn_crisis.100.d:0 "The succession deadline has expired. The strongest opposition party has challenged the incumbent government, dividing the Free Territory into two armed camps. Use the decisions to remain with the established order or rally to the insurgents. Victory will open the winning political program."
 mkn_crisis.20.t:0 "An Embassy from the Steppe"
 mkn_crisis.20.d:0 "The Free Territory’s revkom offers grain deliveries and reciprocal military transit. It asks for locomotives, dispatching expertise and a railway connection. Accepting this first agreement does not create an alliance or a protectorate."
 mkn_crisis.21.t:0 "Kharkov Opens the Sidings"
 mkn_crisis.21.d:0 "The Soviet Republics have accepted reciprocal transit. Our engineers may now prepare a railway connection across a controlled common border, followed by two years of supply cooperation."
 mkn_crisis.22.t:0 "The Soviet Gates Stay Closed"
 mkn_crisis.22.d:0 "The delegation returned with polite phrases and no agreement. We retain our independence and may reopen negotiations through a decision."
 mkn_crisis.23.t:0 "A Common Anti-Imperialist Front?"
 mkn_crisis.23.d:0 "The Free Territory proposes an equal defensive alliance against LitBel and Imperial Germany. Its councils will keep their own administration and armed forces. Shall we accept?"
 mkn_crisis.24.t:0 "The Common Front Is Signed"
 mkn_crisis.24.d:0 "The Soviet government has admitted us to the common defensive front. Our flag still flies above our congress; the next question is whether equality will survive its written charter."
 mkn_crisis.25.t:0 "No Common Front"
 mkn_crisis.25.d:0 "The Soviet government has declined the alliance. Our councils remain independent, and our envoys may ask again when circumstances change."
 mkn_crisis.30.t:0 "A Black Flag above the Factory Gate"
 mkn_crisis.30.d:0 "Pamphlets from the Free Territory have passed from hand to hand through the night shift. The workers demand elected workshop committees and threaten sixty days of industrial action. We can endure the stoppage or spend political capital on a crackdown."
 mkn_crisis.40.t:0 "The Fatal Plenum"
 mkn_crisis.40.d:0 "The Free Territory’s delegates have placed an autonomy charter before the plenum. It demands equal sovereignty inside our common front: no appointed governors, no requisitions without consent, no foreign occupation. We may ratify this equality or expel the territory and enforce submission by war."
 mkn_crisis.41.t:0 "A Charter between Equals"
 mkn_crisis.41.d:0 "The plenum accepted the charter. Our councils retain their administration and sovereignty within the common front. For once, a revolutionary promise has reached the ledger intact."
 mkn_crisis.42.t:0 "Betrayed Twice"
 mkn_crisis.42.d:0 "The envoys have been detained. Across the frontier, Soviet columns advance toward the stations they helped connect. The alliance is broken and the war has begun. At the congress, one old insurgent opens the grain ledger and writes a single word across it: betrayal. For a year, every village shall answer."
 mkn_crisis.1.a:0 "Lower the black flag. Convene the delegates."
 mkn_crisis.100.a:0 "Hold our ground."
 mkn_crisis.20.a:0 "Open the transit and supply talks."
 mkn_crisis.20.b:0 "We will make no such agreement."
 mkn_crisis.21.a:0 "Let the dispatchers get to work."
 mkn_crisis.22.a:0 "The granary remains ours."
 mkn_crisis.23.a:0 "Welcome equal allies."
 mkn_crisis.23.b:0 "Decline the front."
 mkn_crisis.24.a:0 "Ratify the common defense."
 mkn_crisis.25.a:0 "We must rely on ourselves."
 mkn_crisis.30.a:0 "Endure the stoppage."
 mkn_crisis.30.b:0 "Break the strike committees."
 mkn_crisis.40.a:0 "Ratify equal autonomy."
 mkn_crisis.40.b:0 "Expel them. Force their submission."
 mkn_crisis.40.c:0 "The negotiations have become impossible."
 mkn_crisis.41.a:0 "Keep the charter above every desk."
 mkn_crisis.42.a:0 "They shall find no undefended village."
 mkn_news.1.t:0 "Black Flag at Half-Mast: The Death of Nestor Makhno"
 mkn_news.1.d:0 "At Huliaipole, Nestor Makhno lies in state beneath a black flag. The casket stands on plain boards in the hall where village delegates once argued with him until dawn. Railway workers have brought a locomotive whistle; a peasant woman has left a loaf of bread beside his worn cap. No church bell marks the hour. The station whistles do.\n\nAcross the Ukrainian steppe, the founder’s death leaves a silence that every faction hopes to fill. Tratishov’s staff speaks of discipline, Volin’s free soviets of an unbroken promise; village delegates count the grain, and red committees count the rifles. Makhno’s life has ended. The quarrel over what his revolution must become has not. Foreign chancelleries watch the funeral procession, wondering how long the black flag will remain one banner."
 mkn_news.1.a:0 "The Batko is gone. The communes remain."
 mkn_news.1.b:0 "The steppe’s future now lies in the councils’ hands."
 mkn_news.1.c:0 "Observe the succession closely."
 mkn_news.1.e:0 "Another uncertain dawn for the steppe."
