 mkn_batko_departed:0 "Makhno has died"
 MKN_unlock_border_clashes_tt:0 "Unlocks state-targeted border clashes with LitBel and the Soviet Republics on a controlled common frontier."
 MKN_unlock_volunteers_tt:0 "Unlocks repeatable recruitment of foreign volunteers."
 MKN_unlock_strikes_tt:0 "Unlocks strike networks in neighboring countries."
 MKN_unlock_sabotage_tt:0 "Unlocks infrastructure and railway demolition in threatened states during war."
