l_english:
 MKN_bank_raid_aftermath:0 "Aftermath of the Bank Raid"
 MKN_bank_raid_aftermath_desc:0 "Missing funds have frozen industrial payments and undermined confidence in the government. For 180 days: consumer goods factor +20%, factory output −20%, daily political power −0.30."
 MKN_UKR_first_year_local_war:0 "First Year of the Bilateral War"
 MKN_UKR_first_year_local_war_desc:0 "For the first 12 months of the MKN–Ukraine war, AI participants and allies refrain from calling allies into this war or accepting its calls. Faction membership is preserved."
 MKN_voucher_transition_idea_inactive:0 "Archived Labour Voucher Transition"
 MKN_voucher_transition_idea_inactive_desc:0 "A different political programme is inactive. Its original expiry continues to run; restoring that party restores only the remaining duration."
 MKN_betrayed_twice_inactive:0 "Archived Mobilisation after Betrayal"
 MKN_betrayed_twice_inactive_desc:0 "This temporary Revkom measure is inactive under another ruling party. Its original expiry is not extended."
 MKN_grain_barter_factory_idea_inactive:0 "Suspended Grain Contract"
 MKN_grain_barter_factory_idea_inactive_desc:0 "The grain contract's temporary factory is unavailable under another ruling party. The contract keeps expiring and can resume only for its remaining duration."
 mkn_gameplay.1.t:0 "The Steppe Has Weathered the War"
 mkn_gameplay.1.d:0 "The alarm bells have fallen silent. We concealed machinery, led people out of the line of fire and raised resistance where the enemy expected submission. Our communes have preserved their will to live. It is time to return the workshops to peace and face tomorrow with confidence."
 mkn_gameplay.1.a:0 "Together, we endured!"
 MKN_council_selection_tt:0 "§YEugen§! joins the council. Two further seats go to army leaders with the §Yhighest skill§! at completion; ties are resolved randomly."
 MKN_party_reforms_enabled:0 "Political programmes are open to the current ruling party"
