l_english:
 MTG_naval_treaty_adherent:0 "London Naval Agreement"
 MTG_naval_treaty_adherent_desc:0 "The London compromise between Britain, Italy, Germany, France, Japan, China and the United States limits the cost of new naval armaments. Design cost limits (cruiser / heavy ship / carrier): 5300 / 10000 / 9500. Existing fleets are not automatically scrapped."
 MTG_naval_treaty_cheating:0 "London Naval Agreement"
 MTG_naval_treaty_cheating_desc:0 "The London compromise between Britain, Italy, Germany, France, Japan, China and the United States limits the cost of new naval armaments. Design cost limits (cruiser / heavy ship / carrier): 5700 / 11500 / 10250. Existing fleets are not automatically scrapped."
 MTG_naval_treaty_adherent_reduced:0 "London Naval Agreement — protective clause"
 MTG_naval_treaty_adherent_reduced_desc:0 "The London compromise between Britain, Italy, Germany, France, Japan, China and the United States limits the cost of new naval armaments. Design cost limits (cruiser / heavy ship / carrier): 6000 / 12000 / 10500. Existing fleets are not automatically scrapped."
 MTG_naval_treaty_cheating_reduced:0 "London Naval Agreement — protective clause"
 MTG_naval_treaty_cheating_reduced_desc:0 "The London compromise between Britain, Italy, Germany, France, Japan, China and the United States limits the cost of new naval armaments. Design cost limits (cruiser / heavy ship / carrier): 6500 / 14000 / 10750. Existing fleets are not automatically scrapped."
 ENG_london_category:0 "The London Naval Agreement"
 ENG_london_category_desc:0 "Opening signatories: Britain, Italy, Germany, France, Japan, China and the United States. Current signatories: [?global.ENG_london_members|0]. Limits apply to the production cost of new ship designs, not existing fleet size. One withdrawal does not expel the remaining members."
 ENG_london_withdraw:0 "Give Notice of Withdrawal"
 ENG_london_withdraw_desc:0 "75 political power, 35 days. Removes our restrictions after notice expires. Cancellation refunds the cost. Remaining signatories retain the agreement until fewer than three remain or they go to war with one another."
 ENG_london_clause:0 "Invoke the Protective Clause"
 ENG_london_clause_desc:0 "After a withdrawal: 100 political power and 35 days of shared preparation. Raises design cost limits for all remaining signatories: cruisers 5300 → 6000, heavy ships 10000 → 12000, carriers 9500 → 10500. Existing ships are not destroyed."
 nww_london.1.t:0 "Withdrawal from the London Agreement"
 nww_london.1.d:0 "[FROM.GetNameDef] has completed the withdrawal procedure. Remaining parties retain the limits and may invoke the agreed protective clause."
 nww_london.1.a:0 "Take note"
 nww_london.2.t:0 "The Protective Clause Takes Effect"
 nww_london.2.d:0 "A withdrawal has changed the naval balance. The same increased design cost limits now apply to every remaining signatory."
 nww_london.2.a:0 "Take note"
