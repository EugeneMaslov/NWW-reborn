 GER_nww_bohemian_civic_support:0 "Support Bohemian Civic Societies"
 GER_nww_bohemian_civic_support_desc:0 "Spend 75 political power on 45 days of consular, press and civic support in Bohemia. An unresolved crisis gains 2 tension and 2 German contribution, capped at 10 total tension. Funding is refunded if the crisis closes, Austria loses Bohemia, or alliance or war blocks intervention. Further support follows a 30-day interval."
