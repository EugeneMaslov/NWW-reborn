 MKN_column_medical_service:0 "Medical and Replacement Columns"
 MKN_column_medical_service_desc:0 "Field hospitals and reserve companies will connect free columns to their home communes, recovering wounded fighters and bringing replacements into battle sooner."
 MKN_column_medical_service_tt:0 "Permanently improves the shared service spirit. Casualty recovery §G+5%§!; reinforcement rate §G+5 percentage points§!."
 MKN_air_warning_network_focus:0 "Common Air Warning Network"
 MKN_air_warning_network_focus_desc:0 "Ground observers, telephone posts and ready sections will share one warning network, detecting raids earlier and defending home skies more effectively."
 MKN_air_warning_network_focus_tt:0 "Permanently improves the shared service spirit. Interception detection §G+10%§!; home air defence §G+5%§!."
 MKN_convoy_control_office:0 "Grain Convoy Dispatch Office"
 MKN_convoy_control_office_desc:0 "Port commune dispatchers will coordinate sailing times, escort rotations and refuelling, protecting grain shipments while using less fuel."
 MKN_convoy_control_office_tt:0 "Permanently improves the shared service spirit. Convoy escort efficiency §G+10%§!; naval fuel use §G−5%§!."
 MKN_raider_signal_stations:0 "Raider Signal Stations"
 MKN_raider_signal_stations_desc:0 "Coastal couriers and radio posts will report enemy shipping and help scattered crews assemble for coordinated attacks."
 MKN_raider_signal_stations_tt:0 "Permanently improves the shared service spirit. Naval detection §G+10%§!; coordination §G+5%§!."
 MKN_underway_refit_artels:0 "Floating Repair Artels"
 MKN_underway_refit_artels_desc:0 "Floating workshops and concealed anchorages will recover damaged vessels and help them escape pursuit, returning raiders to service."
 MKN_underway_refit_artels_tt:0 "Permanently improves the shared service spirit. Ship recovery chance §G+10%§!; retreat speed §G+5%§!"
