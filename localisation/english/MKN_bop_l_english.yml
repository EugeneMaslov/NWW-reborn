 MKN_bop_category:0 "The Mandate of the Free Territory"
 MKN_bop_category_desc:0 "Spend political power to change the balance between command and communes. Decisions may be repeated after their cooldown; the agrarian path abolishes this struggle."
 MKN_moscow_request_pending:0 "A proposal is awaiting Moscow's reply"
 MKN_moscow_betrayal:0 "Moscow betrayed the proposed compromise"
 MKN_moscow_alliance:0 "The Moscow defence pact was accepted"
 MKN_bop_abandoned:0 "The agrarian congress abolished the balance of power"
 MKN_red_defence_pact:0 "Red Defence Pact"
 mkn_bop.1.t:0 "A Proposal from the Free Territory"
 mkn_bop.1.d:0 "The state socialists of the Free Territory propose mutual defence while retaining local councils and their own government. We may accept them as allies, refuse the arrangement, or prepare to subordinate the territory instead."
 mkn_bop.1.a:0 "Accept them as equal allies."
 mkn_bop.1.b:0 "Prepare to bring the territory under our control."
 mkn_bop.1.c:0 "Decline the proposal."
 mkn_bop.2.t:0 "Moscow Accepts the Pact"
 mkn_bop.2.d:0 "Moscow has accepted our independence within a common defence pact. We have joined its faction; the administration of the Free Territory remains our own."
 mkn_bop.2.a:0 "Ratify the agreement."
 mkn_bop.3.t:0 "The Red Compromise Betrayed"
 mkn_bop.3.d:0 "Moscow answered our proposal by preparing to subordinate the Free Territory. It has gained a war goal against us. The councils must prepare their own defence."
 mkn_bop.3.a:0 "Prepare to defend our independence."
 mkn_bop.4.t:0 "Moscow Declines"
 mkn_bop.4.d:0 "No alliance has been concluded. Our state socialist institutions must stand on their own; a later diplomatic focus can renew the request if negotiations remain possible."
 mkn_bop.4.a:0 "Continue the domestic program."
 MKN_army_war_support_factor_tt:0 "War support from the army institutions: §G+10%§!"
