 MKN_air_air_mission_efficiency_tt: "$air_mission_efficiency_tt$"
 MKN_fighter_instructors: "Инструкторы воздушного боя"
 MKN_fighter_instructors_desc: "Лучшие инструкторы покажут молодым пилотам приёмы боя в паре."
 MKN_air_air_accidents_factor_tt: "$air_accidents_factor_tt$"
 MKN_air_warning: "Единая воздушная тревога"
 MKN_air_warning_desc: "Единая тревога поднимет нужные звенья вместо всей авиации сразу."
 MKN_radio_beacons: "Радиомаяки полевых полос"
 MKN_radio_beacons_desc: "Радиомаяки помогут перехватчикам вернуться даже в плохую погоду."
 MKN_airframe_jigs: "Оснастка для лёгких планеров"
 MKN_airframe_jigs_desc: "Серийная оснастка обеспечит точную сборку и вооружение истребителей."
 MKN_interceptor_pairs: "Перехват парами"
 MKN_interceptor_pairs_desc: "Ведущий прикрывает ведомого: одиночный герой уступит место слаженной паре."
 MKN_aircraft_recovery: "Возвращать повреждённые машины"
 MKN_aircraft_recovery_desc: "Эвакуационные бригады вернут повреждённые машины и спасут ремонтный фонд."
 MKN_air_dispersal: "Рассредоточенные аэродромы"
 MKN_air_dispersal_desc: "Рассредоточим самолёты по запасным полосам и защитим домашнее небо."
 MKN_fighter_patrols: "Патрули над переправами"
 MKN_fighter_patrols_desc: "Патрули над переправами прикроют связь между промышленными районами."
 MKN_air_radar_school: "Школа радиолокации"
 MKN_air_radar_school_desc: "Радиолокационная школа научит расчёты сопровождать цели и наводить истребители."
 MKN_night_interceptors: "Ночной перехват"
 MKN_night_interceptors_desc: "Ночные звенья отработают перехват по командам с земли."
 MKN_aircraft_spares: "Общий запас авиационных деталей"
 MKN_aircraft_spares_desc: "Общий запас моторов сократит простои и аварии изношенных самолётов."
 MKN_fighter_conversion: "Переучивание лётчиков"
 MKN_fighter_conversion_desc: "Переучивание позволит быстро освоить следующее поколение истребителей."
 MKN_air_rescue: "Спасение сбитых лётчиков"
 MKN_air_rescue_desc: "Спасённый лётчик вернётся к полётам и передаст опыт новым экипажам."
 MKN_fighter_controllers: "Диспетчеры воздушного боя"
 MKN_fighter_controllers_desc: "Диспетчеры распределят звенья по целям, исключая бесполезное дублирование."
 MKN_air_home_defence: "Защита промышленных районов"
 MKN_air_home_defence_desc: "Зенитные батареи и истребители разделят зоны защиты промышленных коммун."
 MKN_sky_watch_exercises: "Учения воздушного дозора"
 MKN_sky_watch_exercises_desc: "Учения проверят цепочку от обнаружения цели до посадки перехватчика."
 MKN_free_sky_compact: "Небо под защитой коммун"
 MKN_free_sky_compact_desc: "Основная система перехвата готова; ночные и радиолокационные службы останутся дополнительными. Основная программа: десять фокусов, включая этот итог. Дополнительные специализации не обязательны."
 MKN_close_support_program: "Авиация поддержки"
 MKN_close_support_program_desc: "Авиация станет летающей артиллерией для вольных колонн."
 MKN_air_air_cas_efficiency_tt: "$air_cas_efficiency_tt$"
 MKN_attack_air_artels: "Артели штурмовой авиации"
 MKN_attack_air_artels_desc: "«Днепровское крыло» приспособит лёгкие самолёты для ударов по наземным целям."
 MKN_air_air_range_factor_tt: "$air_range_factor_tt$"
 MKN_air_ground_liaisons: "Связные при наземных штабах"
 MKN_air_ground_liaisons_desc: "Связные передадут запросы пехоты прямо на аэродром."
 MKN_bombing_ranges: "Полигоны точного бомбометания"
 MKN_bombing_ranges_desc: "На полигонах экипажи научатся поражать цель рядом со своими войсками."
 MKN_forward_airstrips: "Передовые посадочные полосы"
 MKN_forward_airstrips_desc: "Передовые полосы сократят время между запросом поддержки и ударом."
 MKN_air_map_bureau: "Общее картографическое бюро"
 MKN_air_map_bureau_desc: "Карты, фотосъёмка и единая сетка координат избавят экипажи от поиска цели вслепую."
 MKN_cas_maintenance: "Ремонт штурмовиков у фронта"
 MKN_cas_maintenance_desc: "Прифронтовые мастерские восстановят повреждения от наземного огня."
 MKN_target_markers: "Обозначение целей с земли"
 MKN_target_markers_desc: "Дымовые сигналы и условные полотнища обозначат передний край."
 MKN_flying_artillery: "Летающая артиллерия"
 MKN_flying_artillery_desc: "Тяжёлое вооружение штурмовиков поможет разрушать узлы сопротивления."
 MKN_airfield_fuel: "Топливные склады эскадрилий"
 MKN_airfield_fuel_desc: "Наладим заправку, чтобы ударные группы не пропускали решающий вылет."
 MKN_tactical_recon: "Тактическая воздушная разведка"
 MKN_tactical_recon_desc: "Воздушная разведка укажет колоннам обходные пути и вражеские резервы."
 MKN_bomber_navigation: "Школа штурманов"
 MKN_bomber_navigation_desc: "Штурманы обеспечат поддержку за пределами знакомых аэродромов."
 MKN_air_supply_lift: "Доставка срочных грузов"
 MKN_air_supply_lift_desc: "Воздушные перевозки восполнят самые срочные нужды оторвавшихся колонн."
 MKN_air_coastal_support: "Поддержка приморского фронта"
 MKN_air_coastal_support_desc: "Приморские эскадрильи прикроют переправы и ударят по кораблям противника."
 MKN_cas_replacement_crews: "Резерв экипажей штурмовиков"
 MKN_cas_replacement_crews_desc: "Резерв подготовленных экипажей позволит сохранять темп вылетов."
 MKN_joint_target_planning: "Совместное планирование ударов"
 MKN_joint_target_planning_desc: "Штабы армии и авиации составят общие списки целей перед наступлением."
 MKN_air_weather_service: "Степная метеослужба"
 MKN_air_weather_service_desc: "Метеопосты помогут выбирать окно для удара вместо отмены всей операции."
 MKN_attack_wing_rotations: "Сменяемые ударные группы"
 MKN_attack_wing_rotations_desc: "Сменяемые группы распределят нагрузку между людьми, машинами и складами горючего."
 MKN_cas_joint_exercises: "Учения лётчиков и артиллеристов"
 MKN_cas_joint_exercises_desc: "Совместные учения проверят взаимодействие пилотов, артиллеристов и передовых наблюдателей."
 MKN_air_support_compact: "Крылья над вольными колоннами"
 MKN_air_support_compact_desc: "Колонны получили воздушную поддержку; дальние и морские операции можно развивать отдельно. Основная программа: десять фокусов, включая этот итог. Дополнительные специализации не обязательны."
 MKN_navy_convoy_escort_efficiency_tt: "$convoy_escort_efficiency_tt$"
 MKN_navy_screening_efficiency_tt: "$screening_efficiency_tt$"
 MKN_navy_naval_detection_tt: "$naval_detection_tt$"
 MKN_coastal_signal_posts: "Береговые сигнальные посты"
 MKN_coastal_signal_posts_desc: "Береговые посты предупредят капитанов о появлении противника."
 MKN_navy_naval_defense_factor_tt: "$naval_defense_factor_tt$"
 MKN_escort_crews: "Школа экипажей эскортов"
 MKN_escort_crews_desc: "Экипажи отработают охранение медленных транспортов вместо погони за славой."
 MKN_harbour_dredging: "Расчистка портовых фарватеров"
 MKN_harbour_dredging_desc: "Расчищенные фарватеры ускорят оборот кораблей и портовое снабжение."
 MKN_hull_repair_artels: "Артели судового ремонта"
 MKN_hull_repair_artels_desc: "Судоремонтные артели освоят замену повреждённых секций и переоборудование."
 MKN_depth_charge_school: "Школа глубинных бомб"
 MKN_depth_charge_school_desc: "Гидроакустики и расчёты глубинных бомб будут работать одной командой."
 MKN_convoy_schedules: "Расписания зерновых конвоев"
 MKN_convoy_schedules_desc: "Общие расписания и новые транспорты позволят сопровождать торговлю организованными группами."
 MKN_fleet_damage_control: "Артели аварийного ремонта"
 MKN_fleet_damage_control_desc: "Аварийные команды спасут корабль после попадания и вернут его в порт."
 MKN_coastal_watch: "Постоянный береговой дозор"
 MKN_coastal_watch_desc: "Постоянный дозор закроет промежутки между портовыми районами."
 MKN_sweeper_sections: "Тральные отряды"
 MKN_sweeper_sections_desc: "Тральные команды очистят торговые фарватеры от мин."
 MKN_escort_radio_net: "Радиосеть охранения"
 MKN_escort_radio_net_desc: "Общая частота охранения позволит быстро перестроить защитный экран."
 MKN_coastal_depots: "Портовые склады снабжения"
 MKN_coastal_depots_desc: "Прибрежные склады поддержат длительное патрулирование без дальних переходов на заправку."
 MKN_river_sea_coordination: "От реки к морскому эскорту"
 MKN_river_sea_coordination_desc: "Согласуем речные перевозки, морской эскорт и береговую разведку."
 MKN_anti_submarine_patrols: "Противолодочные патрули"
 MKN_anti_submarine_patrols_desc: "Охотничьи группы будут прочёсывать район перед выходом конвоев."
 MKN_convoy_rescue: "Спасательная служба конвоев"
 MKN_convoy_rescue_desc: "Спасательные суда подберут людей и возьмут повреждённые транспорты на буксир."
 MKN_escort_reserves: "Резерв портовых экипажей"
 MKN_escort_reserves_desc: "Резерв экипажей и дополнительная верфь обеспечат замену потерь."
 MKN_coastal_fleet_exercises: "Учения береговой флотилии"
 MKN_coastal_fleet_exercises_desc: "Проверим охранение торгового каравана в условиях учебной атаки."
