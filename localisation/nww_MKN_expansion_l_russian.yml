 MKN_navy_naval_torpedo_hit_chance_factor_tt: "$naval_torpedo_hit_chance_factor_tt$"
 MKN_submarine_crews: "Школа подводных экипажей"
 MKN_submarine_crews_desc: "Экипажи научатся выбирать цель и момент атаки, а не искать открытого боя."
 MKN_navy_naval_speed_factor_tt: "$naval_speed_factor_tt$"
 MKN_hidden_anchorages: "Скрытые рейдерские стоянки"
 MKN_hidden_anchorages_desc: "Тайные стоянки позволят подготовить выход, не выдавая расположение рейдеров."
 MKN_navy_naval_torpedo_reveal_chance_factor_tt: "$naval_torpedo_reveal_chance_factor_tt$"
 MKN_naval_intelligence: "Карты торговых маршрутов"
 MKN_naval_intelligence_desc: "Карты торговых маршрутов укажут ценные цели и безопасные районы ожидания."
 MKN_raider_dockyard: "Мастерская малых подлодок"
