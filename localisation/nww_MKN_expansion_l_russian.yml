 MKN_radio_sections: "Радиостанция в каждом штабе"
 MKN_radio_sections_desc: "Радиосвязь позволит подкреплениям вступать в бой по команде штаба."
 MKN_army_supply_consumption_factor_tt: "$supply_consumption_factor_tt$"
 MKN_recovery_tractors: "Тягачи для эвакуации"
 MKN_recovery_tractors_desc: "Эвакуационные тягачи вернут повреждённые машины в мастерские."
 MKN_tank_maintenance: "Полевой ремонт брони"
 MKN_tank_maintenance_desc: "Ремонтная база Днепра обеспечит запасные узлы и восстановление техники."
 MKN_fire_tables: "Общие таблицы огня"
 MKN_fire_tables_desc: "Единые таблицы стрельбы свяжут огонь батарей с планами танковых командиров."
 MKN_motorized_infantry: "Пехота вслед за бронёй"
 MKN_motorized_infantry_desc: "Подвижная пехота закрепит захваченные танками переправы и населённые пункты."
 MKN_bridge_columns: "Мостовые колонны"
 MKN_bridge_columns_desc: "Сборные мосты позволят колоннам продолжать наступление за Днепром."
 MKN_fuel_discipline: "Учёт горючего в походе"
 MKN_fuel_discipline_desc: "Запас горючего и маршруты заправки избавят наступление от пустых баков."
 MKN_staff_games: "Штабные игры на Днепре"
 MKN_staff_games_desc: "Проверим планы на штабных играх прежде, чем проверять их людьми."
 MKN_mobile_medical: "Подвижные санитарные пункты"
 MKN_mobile_medical_desc: "Санитарные автомобили вернут раненых в строй и сохранят кадры."
 MKN_combined_arms: "Единый боевой порядок"
 MKN_combined_arms_desc: "Броня, артиллерия и пехота научатся действовать в одном боевом порядке."
 MKN_deep_reserves: "Резерв второго эшелона"
 MKN_deep_reserves_desc: "Второй эшелон получит оружие заранее, чтобы поддерживать прорыв без пауз."
 MKN_breakthrough_workshops: "Мастерские прорыва"
 MKN_breakthrough_workshops_desc: "Мастерские прорыва будут выпускать бронетехнику по требованиям полевых экипажей."
 MKN_armoured_manoeuvres: "Манёвры механизированных колонн"
 MKN_armoured_manoeuvres_desc: "Большие манёвры отработают смену направления без потери управления."
 MKN_mechanized_compact: "Механизированная армия коммун"
 MKN_mechanized_compact_desc: "Основные службы готовы: коммуны располагают механизированной армией, а дальнейшие специализации остаются добровольными. Основная программа: десять фокусов, включая этот итог. Дополнительные специализации не обязательны."
 MKN_village_muster: "Сельские сборные пункты"
 MKN_village_muster_desc: "Сельские сборные пункты заранее распределят людей по отрядам."
 MKN_army_army_speed_factor_tt: "$army_speed_factor_tt$"
 MKN_remount_artels: "Артели конского резерва"
 MKN_remount_artels_desc: "Общие конюшни и запас верховых лошадей поддержат темп похода."
 MKN_army_modifier_army_sub_unit_cavalry_attack_factor_tt: "Атака кавалерии: $RIGHT|+=%1$"
 MKN_machinegun_carts: "Пулемётные повозки"
 MKN_machinegun_carts_desc: "Пулемётные тачанки дадут конным отрядам огневую опору."
 MKN_army_attrition_tt: "$attrition_tt$"
 MKN_local_guides: "Проводники родной степи"
 MKN_local_guides_desc: "Местные проводники найдут броды и обходные тропы раньше противника."
 MKN_scout_parties: "Разведка малыми отрядами"
 MKN_scout_parties_desc: "Разведывательные партии расчистят путь основной колонне."
 MKN_field_veterinary: "Ветеринарная служба колонн"
 MKN_field_veterinary_desc: "Ветеринарная служба снизит потери лошадей в длительных переходах."
 MKN_militia_signals: "Связь между волостями"
 MKN_militia_signals_desc: "Сигнальные команды свяжут волости и выведут резерв на нужный участок."
 MKN_night_marches: "Ночные переходы"
 MKN_night_marches_desc: "Отряды научатся уходить из-под удара ночью без распада колонны."
 MKN_militia_junior_leaders: "Выборные младшие командиры"
 MKN_militia_junior_leaders_desc: "Выборный командир тоже нуждается в тактической школе и понятной ответственности."
 MKN_hidden_depots: "Скрытые сельские склады"
 MKN_hidden_depots_desc: "Сеть тайных складов поддержит колонны вдали от железной дороги."
 MKN_militia_engineers: "Сапёрные десятки"
 MKN_militia_engineers_desc: "Сапёрные десятки подготовят переправы и укрытия лёгкими средствами."
 MKN_militia_hospitals: "Санитарные артели"
 MKN_militia_hospitals_desc: "Общины организуют эвакуацию раненых и восстановление бойцов."
 MKN_flexible_orders: "Задача вместо длинного приказа"
 MKN_flexible_orders_desc: "Командир получит цель и свободу исполнения вместо цепочки мелких приказов."
 MKN_rural_reserve: "Сменяемый сельский резерв"
 MKN_rural_reserve_desc: "Сменяемый резерв позволит сельским общинам содержать армию и продолжать посевную."
 MKN_tachanka_tactics: "Тачанки и пеший заслон"
 MKN_tachanka_tactics_desc: "Пеший заслон прикроет отход тачанок и сорвёт преследование."
 MKN_steppe_camouflage: "Степная маскировка"
 MKN_steppe_camouflage_desc: "Маскировка степных позиций поможет переждать превосходство противника в огне."
 MKN_mobile_rearguard: "Подвижный арьергард"
 MKN_mobile_rearguard_desc: "Подвижный арьергард задержит врага, пока обозы меняют стоянку."
 MKN_free_column_exercises: "Сборы вольных колонн"
 MKN_free_column_exercises_desc: "Сборы сведут конные и пешие отряды в согласованные колонны."
 MKN_free_army_compact: "Армия вольных колонн"
 MKN_free_army_compact_desc: "Вольные колонны готовы к походу; дополнительные службы можно развивать по нуждам фронта. Основная программа: десять фокусов, включая этот итог. Дополнительные специализации не обязательны."
 MKN_air_air_agility_factor_tt: "$air_agility_factor_tt$"
 MKN_air_air_attack_factor_tt: "$air_attack_factor_tt$"
