 MKN_escort_compact_desc: "Основная система эскорта готова; противолодочные и спасательные службы можно расширять дальше. Основная программа: десять фокусов, включая этот итог. Дополнительные специализации не обязательны."
 MKN_navy_convoy_raiding_efficiency_factor_tt: "$convoy_raiding_efficiency_factor_tt$"
 MKN_torpedo_artels: "Торпедные мастерские"
