l_russian:
 MKN_focus: "Махновская вольница"
 MKN_the_free_territory: "Вольная территория"
 MKN_the_free_territory_desc: "Ни господ, ни государств — только вольные советы крестьян и рабочих."
 MKN_farmers_and_workers: "Крестьяне и рабочие"
 MKN_farmers_and_workers_desc: "Вольная территория держится на руках труда, а не на коронах старого мира."
 MKN_shadow_republic: "Теневое государство"
 MKN_shadow_republic_desc: "Государство, которое почти никогда не спорит вслух, но всегда чувствуется в воздухе."
 MKN_free_soviets: "Вольные советы"
 MKN_free_soviets_desc: "Каждому селу — свою коммуну, каждой коммуне — свой голос."
 MKN_tachanka_columns: "Тачаночные колонны"
 MKN_tachanka_columns_desc: "Программа «Тачаночные колонны» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_nabat_federation: "Федерация «Набат»"
 MKN_nabat_federation_desc: "Анархистские федерации от Харькова до Одессы смотрят на Гуляй-Поле."
 MKN_gulyai_polye_commune: "Гуляйпольская коммуна"
 MKN_gulyai_polye_commune_desc: "Столица анархии покажет миру иной способ жить."
 MKN_railway_war: "Железнодорожная война"
 MKN_railway_war_desc: "Программа «Железнодорожная война» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_black_banner_east: "Чёрное знамя на восток"
 MKN_black_banner_east_desc: "Киев кланяется Москве. Восток надо освободить от обоих."
 MKN_makhno_moves_south: "Махно идёт на юг"
 MKN_makhno_moves_south_desc: "К морю, к портам, к кораблям, что везут наш хлеб."
 MKN_the_steppe_holds: "Степь держится"
 MKN_the_steppe_holds_desc: "Три года войны, а Вольная территория стоит. Пусть приходят."
 MKN_free_territory: "Вольная территория"
 MKN_free_territory_desc: "Взаимопомощь и добровольная защита объединяют коммуны. Отряды знают родную степь и сражаются за свою землю; съездам предстоит сделать общие обязательства столь же надёжными."
 MKN_tachanka_warfare: "Тачаночная война"
 MKN_tachanka_warfare_desc: "Скорость — броня в степи."
 MKN_railway_guards: "Железнодорожная стража"
 MKN_railway_guards_desc: "Кто держит рельсы, тот держит юг."
 MKN_BELASH_DESC: "Начальник штаба Повстанческой армии."
 MKN_SHCHUS_DESC: "Лихий кавалерийский атаман."
 MKN_focus_desc: "Дерево фокусов Махновской вольной территории."
 MKN_NESTOR_MAKHNO_DESC: "Атаман Революционной повстанческой армии Украины."
 MKN_black_sea_flotilla: "Черноморская флотилия"
 MKN_black_sea_flotilla_desc: "Программа «Черноморская флотилия» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_dnieper_patrol: "Днепровский дозор"
 MKN_dnieper_patrol_desc: "Программа «Днепровский дозор» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_steppe_hawks: "Степные соколы"
 MKN_steppe_hawks_desc: "Программа «Степные соколы» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_free_soviets_idea: "Упорядоченные вольные советы"
 MKN_free_soviets_idea_desc: "Отзывные делегаты укрепляют доверие к общим решениям, сохраняя самостоятельность коммун."
 MKN_soviet_press: "Советская печать"
 MKN_soviet_press_desc: "«Набат» и «Голос» ежедневно печатают правду."
 MKN_anarchist_schools: "Анархистские школы"
 MKN_anarchist_schools_desc: "Школы Феррера для свободных детей."
 MKN_peasant_militias: "Крестьянские милиции"
 MKN_peasant_militias_desc: "Каждому селу — свою сотню."
 MKN_batko_guards: "Гвардия батьки"
 MKN_batko_guards_desc: "Личная гвардия старика."
 MKN_SHCHUS_LEADER_DESC: "Атаман, ставший государственником. Или наоборот."
 MKN_EMPEROR_DESC: "Милостью тачанки — император Степи."
 MKN_VOLIN_DESC: "Теоретик вольных советов и вольных выборов."
 MKN_border_tensions: "Напряжение на границе"
 MKN_border_tensions_desc: "Киев держит то, что нужно степи. Прощупать их границу."
 MKN_everlasting_makhnovshchina: "Вечная махновщина"
 MKN_everlasting_makhnovshchina_desc: "Ни богов, ни господ, ни конца."
 MKN_soviets_forever: "Советы навсегда"
 MKN_soviets_forever_desc: "Коммуна вечна."
 MKN_tachanka_guards: "Тачаночная гвардия"
 MKN_tachanka_guards_desc: "Элита Повстанческой армии."
 MKN_council_communism: "Советский коммунизм"
 MKN_council_communism_desc: "Маркс без Москвы."
 MKN_workers_control: "Рабочий контроль"
 MKN_workers_control_desc: "Завод — тем, кто на нём работает."
 MKN_commune_federation: "Федерация коммун"
 MKN_commune_federation_desc: "Тысяча коммун — одна федерация."
 MKN_constituent_assembly: "Учредительное собрание"
 MKN_constituent_assembly_desc: "Даже анархисты иногда голосуют."
 MKN_free_elections_steppe: "Вольные выборы в степи"
 MKN_free_elections_steppe_desc: "Бюллетени вместо пуль. Преимущественно."
 MKN_open_markets: "Открытые рынки"
 MKN_open_markets_desc: "Торговля — не преступление."
 MKN_red_banner_steppe: "Красное знамя над степью"
 MKN_red_banner_steppe_desc: "Чёрное блекнет до красного."
 MKN_hand_to_moscow: "Рука Москве"
 MKN_hand_to_moscow_desc: "Союзник, наконец, против Киева."
 MKN_collectivize_the_steppe: "Коллективизировать степь"
 MKN_collectivize_the_steppe_desc: "Добровольно. Преимущественно."
 MKN_black_hundreds: "Чёрные сотни"
 MKN_black_hundreds_desc: "Порядок будет восстановлен. Жестоко."
 MKN_order_through_tachanka: "Порядок через тачанку"
 MKN_order_through_tachanka_desc: "Пулемёт — лучший аргумент."
 MKN_steppe_legions: "Степные легионы"
 MKN_steppe_legions_desc: "Шагом марш, иначе — никак."
 MKN_nestor_the_first: "Нестор Первый"
 MKN_nestor_the_first_desc: "Почему нет? У всех остальных есть царь."
 MKN_imperial_coronation: "Императорская коронация"
 MKN_imperial_coronation_desc: "Корона из пшеницы и стали."
 MKN_steppe_empire: "Степная империя"
 MKN_steppe_empire_desc: "От моря до моря — по указу."
 MKN_border_raids: "Пограничные рейды"
 MKN_border_raid: "Провести пограничный рейд"
 MKN_border_raid_desc: "Начать ограниченное приграничное сражение, начиная с Николаева и продвигаясь вдоль фронта. После третьего рейда Киев объявит войну."
 MKN: "Махновцы"
 MKN_DEF: "Махновская Украина"
 MKN_ADJ: "Махновский"
 NWW_MKN_DESC: "Махновская вольница."
 MKN_manganese_nikopol: "Никопольский марганец"
 MKN_manganese_nikopol_desc: "Руды Никопольского бассейна — металл для вольных заводов и валюта для вольных рук."
 MKN_dneprostroi: "Днепрострой"
 MKN_dneprostroi_desc: "Коммуны выберут путь крупных предприятий и общего промышленного плана. Первый договор ослабит хозяйственный кризис; программа вольных кооперативов станет недоступна."
 MKN_kichkas_bridge: "Кичкасский мост"
 MKN_kichkas_bridge_desc: "Восстановим инфраструктуру и согласуем первые сквозные маршруты. Это ослабит перебои снабжения, но не заменит диспетчерскую сеть."
 MKN_zaporizhstal: "Запорожсталь"
 MKN_zaporizhstal_desc: "После восстановления перевозок инженерные делегаты согласуют металлургическую программу. Хозяйственные ограничения уменьшатся ещё на одну ступень."
 MKN_steppe_electrification: "Электрификация степи"
 MKN_steppe_electrification_desc: "Общая сеть свяжет предприятия и сельские поселения. Дух электрификации снизит потребление энергии заводами."
 MKN_steppe_general_staff: "Штаб степных армий"
 MKN_steppe_general_staff_desc: "Программа «Штаб степных армий» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_steel_horses: "Стальные кони"
 MKN_steel_horses_desc: "Крупные соединения получат лёгкую броню, моторизованный тыл и общий штаб. Этот выбор направит ресурсы в механизацию и закроет программу вольных конных колонн."
 MKN_batko_cavalry: "Конница Батьки"
 MKN_batko_cavalry_desc: "Опора на конницу, сельский резерв и самостоятельных младших командиров позволит обходить противника и беречь снабжение. Механизированная модель армии станет недоступна."
 MKN_black_guard_veterans: "Ветераны Чёрной гвардии"
 MKN_black_guard_veterans_desc: "Отработаем собственный способ боя на общих сборах. Новые образцы и приёмы будут проверены вместе с теми, кто должен применять их в степи."
 MKN_steppe_quartermasters: "Школа степных квартирмейстеров"
 MKN_steppe_quartermasters_desc: "Отработаем собственный способ боя на общих сборах. Новые образцы и приёмы будут проверены вместе с теми, кто должен применять их в степи."
 MKN_village_airfields: "Сельские аэродромы"
 MKN_village_airfields_desc: "Программа «Сельские аэродромы» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_gulyaipole_pilot_school: "Гуляйпольская школа лётчиков"
 MKN_gulyaipole_pilot_school_desc: "Программа «Гуляйпольская школа лётчиков» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_black_swarm: "Чёрный рой"
 MKN_black_swarm_desc: "В первую очередь защитим переправы, заводы и собственные аэродромы. Истребительные артели и сеть воздушного дозора получат приоритет над программой ударной поддержки."
 MKN_kherson_shipyard: "Херсонские верфи"
 MKN_kherson_shipyard_desc: "Программа «Херсонские верфи» закрепит подготовку кадров и снабжение местных подразделений. Коммуны распределят обязанности, чтобы новые возможности опирались на действующие службы."
 MKN_black_sea_smugglers: "Школа черноморских рейдеров"
 MKN_black_sea_smugglers_desc: "Знание бухт и торговых путей превратим в школу скрытных рейдеров. Подлодки и торпедные катера получат приоритет над крупной программой береговых эскортов."
 MKN_coastal_defense_steppe: "Береговой защитный пояс"
 MKN_coastal_defense_steppe_desc: "Верфи будут строить охранные корабли, а флотилия — защищать зерновые конвои и подходы к портам. Самостоятельная рейдерская программа станет недоступна."
 MKN_dnieper_gun_flotilla: "Днепровские канонерки"
 MKN_dnieper_gun_flotilla_desc: "Общие карты, сигналы и учебные выходы согласуют работу экипажей. Местные моряки знают берег, но нуждаются в порядке совместных действий."
 MKN_dneprostroi_power: "Электросеть Днепростроя"
 MKN_dneprostroi_power_desc: "Общая электросеть снижает потребление энергии заводами и ускоряет строительство."
 MKN_electrified_steppe: "Электрифицированная степь"
 MKN_electrified_steppe_desc: "Хата с лампой и грамота в каждой волости."
 MKN_steel_horses_idea: "Стальные кони"
 MKN_steel_horses_idea_desc: "Броня и скорость вместо конского мяса."
 MKN_batko_cavalry_idea: "Конница Батьки"
 MKN_batko_cavalry_idea_desc: "Конные сотни волости — глаза, уши и оружие степи."
 MKN_black_guard_veterans_idea: "Ветераны Чёрной гвардии"
 MKN_black_guard_veterans_idea_desc: "Те, кто выжил в цепях и на тачанках, ведут за собой новые сотни."
 MKN_steppe_quartermasters_idea: "Степные интенданты"
 MKN_steppe_quartermasters_idea_desc: "С обозом Маркса, а без обоза и Маркс воюет вполсилы. Мы — наоборот."
 MKN_free_airmen: "Вольные лётчики"
 MKN_free_airmen_desc: "Ловить воздушные течения, а не приказы."
 MKN_black_swarm_idea: "Чёрный рой"
 MKN_black_swarm_idea_desc: "Медленно — но над всем и всюду."
 MKN_smuggling_network: "Контрабандистские сети"
 MKN_smuggling_network_desc: "Чёрное море кормит Вольную территорию в обход любых блокад."
 MKN_free_industry_modifier: "Хозяйство вольной территории"
 MKN_free_industry_modifier_desc: "Хозяйственные соглашения, производство и снабжение коммун развиваются вместе. Съезды постепенно преодолевают стартовые ограничения и закрепляют преимущества выбранной программы."
 MKN_free_industry_tt: "§HВольно-промышленный подъём:§!\nПромышленность коммун растёт с каждым завершённым промышленным фокусом."
 MKN_fi_capacity: "Производительность фабрик"
 MKN_fi_construction: "Скорость строительства"
 MKN_fi_research: "Скорость исследований"
 MKN_kommunar_tractor: "Тракторный завод «Коммунар»"
 MKN_kommunar_tractor_desc: "Запорожский «Коммунар» сыграет трактора, а когда потребуется — корпуса для пушек."
 MKN_dnepro_aluminium: "Днепровский алюминиевый"
 MKN_dnepro_aluminium_desc: "Токи Днепростроя плавят бокситы. Крылья Вольной территории будут лёгкими."
 MKN_nikopol_tube_zavod: "Никопольский трубный завод"
 MKN_nikopol_tube_zavod_desc: "Унифицируем заготовки и оснастку. Переход к общим деталям ослабит разрозненность мастерских."
 MKN_steppe_mech_works: "Механические заводы волостей"
 MKN_steppe_mech_works_desc: "Станки на вольной земле, вольными руками."
 MKN_grain_export: "Зерновой экспорт"
 MKN_grain_export_desc: "Хлеб вольных коммун идёт на экспорт — за станки и наличность."
 MKN_steel_volnitsa: "Стальная вольница"
 MKN_steel_volnitsa_desc: "Завершим промышленную программу после реформы производства, семейных касс и хозяйственного договора. Подготовленные склады и расписания превратят перебои снабжения в преимущество."
 MKN_free_cooperatives: "Вольные кооперативы"
 MKN_free_cooperatives_desc: "Сеть самостоятельных артелей примет взаимные обязательства. Хозяйственный кризис ослабнет; путь Днепростроя станет недоступен."
 MKN_salt_artsels: "Соляные артели"
 MKN_salt_artsels_desc: "Соль степи — верная валюта волостей."
 MKN_village_smithies: "Сельские кузницы"
 MKN_village_smithies_desc: "Учтём станки и навыки сельских мастеров. Оружейные артели станут первым звеном реформы разрозненного производства."
 MKN_grain_brokers: "Хлебные биржи"
 MKN_grain_brokers_desc: "Хлеб — это тоже политика."
 MKN_wind_mills_steppe: "Ветряки вольных хуторов"
 MKN_wind_mills_steppe_desc: "Ветер в степи бесплатный, как свобода."
 MKN_mobile_workshops: "Передвижные мастерские"
 MKN_mobile_workshops_desc: "Обмен инструментом и ремонтные поездки укрепят общие договоры. Хозяйственный кризис ослабнет ещё на одну ступень."
 MKN_free_bazaars: "Вольные базары"
 MKN_free_bazaars_desc: "Торговля без газетных гонок размещает содержание страны. Все ждут базарного дня."
 MKN_steppe_mint: "Степной монетный двор"
 MKN_steppe_mint_desc: "Свободная чеканка на свободной земле. Никто не мешает печатать собственные билеты..."
 MKN_freight_artels: "Грузовые артели"
 MKN_freight_artels_desc: "Перевозчики нанесут склады и маршруты на общую карту. Перебои снабжения уменьшатся, но съезд ещё должен согласовать регулярные рейсы."
 MKN_workshop_airplane_artels: "Артельные авиамастерские"
 MKN_workshop_airplane_artels_desc: "Разъездные авиамастерские ремонтируют и сколачивают машины прямо под открытым небом."
 MKN_craft_federation: "Федерация ремесленных коммун"
 MKN_craft_federation_desc: "Общий заказ, страховая касса и хартия взаимопомощи завершат программу. Обозная сеть снимет последние перебои снабжения и уменьшит потери техники."
 MKN_free_mint_idea: "Свободный монетный двор"
 MKN_free_mint_idea_desc: "Вольная валюта степи даёт вольной земле власть и ловкость жонглёра."
 MKN_anarchic_economy_idea: "Несогласованное хозяйство коммун"
 MKN_anarchic_economy_idea_desc: "Каждая коммуна решает за себя, но общего учёта и надёжных расчётов нет. Съезды должны выработать работающие хозяйственные соглашения."
 MKN_anarchic_economy_tt: "Артели и базары сами решают, что строить: централизованных поставок нет."
 MKN_industry_concern_1: "Концерн «Вольная сталь»"
 MKN_industry_concern_2: "Концерн «Вольная сталь»"
 MKN_rifle_concern_1: "Артель стрелкового вооружения"
 MKN_rifle_concern_2: "Артель стрелкового вооружения"
 MKN_steel_concern: "Концерн «Вольная сталь»"
 MKN_steel_concern_desc: "Ставропольско-никопольские металлурги объединяются в концерн вольных заводов. Веткой промышленности он станет сильнее.\n\n§YДоступен промышленный концерн. Нанимайте его в разделе советников.§!"
 MKN_steel_concern_union: "«Союз заводов»"
 MKN_steel_concern_union_desc: "Заводы концерна связывает общая ставка и общие склады — концерн становится сильнее."
 MKN_steel_concern_union_tt: "§GКонцерн «Вольная сталь» улучшен:§! исследования промышленности +5%, скорость строительства +3%, производительность фабрик +5%"
 MKN_rifle_concern: "Артель стрелкового вооружения"
 MKN_rifle_concern_desc: "Кузни и оружейные артели Гуляй-Поля объединяются под одним качеством. Их мастерство можно расширять.\n\n§YДоступен концерн пехотного вооружения. Нанимайте его в разделе советников.§!"
 MKN_rifle_concern_union: "Расширение оружейных артелей"
 MKN_rifle_concern_union_desc: "Артели получили общий инструмент и школы мастеров."
 MKN_rifle_concern_union_tt: "§GАртель стрелкового вооружения улучшена:§! исследования пехотного вооружения +5%, производительность фабрик +3%"
 MKN_fi_b_cap1: "Вольно-промышленный подъём: производительность фабрик §G+1%§!"
 MKN_fi_b_cap2: "Вольно-промышленный подъём: производительность фабрик §G+2%§!"
 MKN_fi_b_cap3: "Вольно-промышленный подъём: производительность фабрик §G+3%§!"
 MKN_fi_b_cons1: "Вольно-промышленный подъём: скорость строительства §G+1%§!"
 MKN_fi_b_cons2: "Вольно-промышленный подъём: скорость строительства §G+2%§!"
 MKN_fi_b_cons3: "Вольно-промышленный подъём: скорость строительства §G+3%§!"
 MKN_fi_b_res1: "Вольно-промышленный подъём: скорость исследований §G+1%§!"
 MKN_fi_b_res2: "Вольно-промышленный подъём: скорость исследований §G+2%§!"
 MKN_fi_b_res3: "Вольно-промышленный подъём: скорость исследований §G+3%§!"
 MKN_economic_coordination: "Первые хозяйственные соглашения"
 MKN_economic_coordination_desc: "Коммуны признали общие обязательства, но хлеб, станки и труд ещё распределяются с задержками."
 MKN_economic_recovery: "Хозяйство на пути к восстановлению"
 MKN_economic_recovery_desc: "Согласованные заказы сокращают потери. Остаётся закрепить правила расчётов и обеспечить семьи работников."
 MKN_fragmented_workshops: "Разрозненные мастерские"
 MKN_fragmented_workshops_desc: "Каждая артель использует свои чертежи и калибры. Серийное производство буксует, а технические знания редко выходят за ворота мастерской."
 MKN_catalogued_workshops: "Учтённые мастерские"
 MKN_catalogued_workshops_desc: "Станки и специалисты внесены в общий реестр, но детали ещё не взаимозаменяемы."
 MKN_standardized_workshops: "Мастерские переходного периода"
 MKN_standardized_workshops_desc: "Общие чертежи уже работают. Последние узкие места требуют постоянной системы заказов и контроля качества."
 MKN_broken_supply: "Перебои степного снабжения"
 MKN_broken_supply_desc: "Поезда простаивают, обозы расходятся по местным соглашениям, а склады не знают потребностей соседних отрядов."
 MKN_mapped_supply: "Согласованные маршруты"
 MKN_mapped_supply_desc: "Известны станции и склады, но диспетчеры и артели ещё спорят об очередности перевозок."
 MKN_coordinated_supply: "Налаживающееся снабжение"
 MKN_coordinated_supply_desc: "Регулярные рейсы приходят вовремя. Резервные склады и правила военных перевозок завершат реформу."
 MKN_untrained_militias: "Неподготовленное ополчение"
 MKN_untrained_militias_desc: "Храбрость не заменяет связи, подготовки и ответственности командиров. Сельские отряды умеют сражаться поодиночке, но теряются в общей операции."
 MKN_accountable_militias: "Ответственные командиры ополчения"
 MKN_accountable_militias_desc: "Отряды согласовали полномочия командиров. Теперь предстоит обучить их действовать вместе."
 MKN_drilled_militias: "Ополчение на общих учениях"
 MKN_drilled_militias_desc: "Инструкторы дали отрядам общую подготовку. Постоянная организация резерва закрепит результат."
 MKN_dnieper_economy: "Днепровский хозяйственный договор"
 MKN_dnieper_economy_desc: "Общий план основан на мандатах коммун, открытых сметах и обеспечении семей. Крупные проекты больше не питаются случайными сборами."
 MKN_mutual_aid_economy: "Хозяйство взаимопомощи"
 MKN_mutual_aid_economy_desc: "Кредит, страхование урожая и прозрачные договоры связывают самостоятельные артели без принудительного подчинения."
 MKN_serial_production: "Серийное производство Днепра"
 MKN_serial_production_desc: "Общие допуски и производственные циклы дают крупным предприятиям устойчивые серии вооружения."
 MKN_cooperative_production: "Федерация производственных артелей"
 MKN_cooperative_production_desc: "Общие заказы и обмен оснасткой позволяют мастерским быстро осваивать новые образцы."
 MKN_dnieper_logistics: "Днепровская транспортная служба"
 MKN_dnieper_logistics_desc: "Диспетчерская сеть и зерновые резервы поддерживают большие соединения на дальних маршрутах."
 MKN_artel_logistics: "Обозная взаимопомощь"
 MKN_artel_logistics_desc: "Артели держат запасные маршруты и ремонтные пункты, уменьшая потери техники в полевых условиях."
 MKN_worker_battalions_idea: "Подготовленные рабочие батальоны"
 MKN_worker_battalions_idea_desc: "Заводские смены и военные сборы согласованы. Избранные командиры отвечают за подготовку и совместные операции."
 MKN_mobile_self_defence_idea: "Подвижная самооборона коммун"
 MKN_mobile_self_defence_idea_desc: "Сельские резервы регулярно собираются на учения и быстро соединяются в мобильные отряды."
 MKN_construction_drive: "Напряжённый строительный сезон"
 MKN_construction_drive_desc: "Съезд временно направил дополнительные средства на стройки. Потребительский сектор оплачивает ускорение."
 MKN_careful_investment: "Бережливое переоснащение"
 MKN_careful_investment_desc: "Предприятия переоснащаются постепенно, без чрезвычайных сборов."
 MKN_export_contracts: "Артельные экспортные договоры"
 MKN_export_contracts_desc: "Экспорт оплачивает оборудование, но переговоры и проверки связывают силы делегатов."
 MKN_local_reserves: "Местные страховые запасы"
 MKN_local_reserves_desc: "Излишки остаются в общих кладовых до следующего урожая."
 MKN_dnieper_audit: "Открытые сметы Днепростроя"
 MKN_dnieper_audit_desc: "Съезд проверит расходы прежде, чем начнутся большие стройки. Делегаты выберут напряжённый строительный сезон или бережливое переоснащение; оба решения действуют один год."
 MKN_engineering_delegates: "Инженеры с мандатом коммун"
 MKN_engineering_delegates_desc: "Коммуны направят инженеров с проверяемыми полномочиями. Общий реестр станков станет основой металлургической программы."
 MKN_elected_brigadiers: "Выборные бригадиры"
 MKN_elected_brigadiers_desc: "Рабочие и сельские отряды изберут командиров, обязанных регулярно отчитываться. Право отзыва совместимо с ясными обязанностями в бою."
 MKN_factory_instructors: "Инструкторы при заводах"
 MKN_factory_instructors_desc: "Учебные смены дадут ополченцам навыки связи и взаимодействия. Выпускать оружие и уметь им пользоваться должны одни и те же сообщества."
 MKN_steppe_coal_contracts: "Угольные промыслы степи"
 MKN_steppe_coal_contracts_desc: "Небольшие промыслы и подвоз топлива обеспечат новые заводы энергией. Развиваем угольную добычу, не подменяя её нефтяными запасами."
 MKN_dnieper_dispatch: "Единая днепровская диспетчерская"
 MKN_dnieper_dispatch_desc: "Станции согласуют расписания, приоритеты угольных составов и воинских эшелонов. Общая связь уменьшит перебои снабжения."
 MKN_worker_battalions: "Рабочие батальоны резерва"
 MKN_worker_battalions_desc: "Закрепим учебные сборы, сменяемость командиров и защиту рабочего места за ополченцем. Подготовленный резерв завершит военную реформу."
 MKN_dnieper_standards: "Общие допуски и калибры"
 MKN_dnieper_standards_desc: "Заводские советы примут общие стандарты вместо несовместимых партий деталей. Артели сохранят свои мастерские, но будут работать по понятным чертежам."
 MKN_production_cycles: "Согласованные производственные циклы"
 MKN_production_cycles_desc: "После налаживания подвоза и принятия стандартов заводы перейдут к длинным сериям. Разрозненное производство уступит устойчивому выпуску вооружения."
 MKN_workers_welfare: "Кассы рабочих семей"
 MKN_workers_welfare_desc: "Общие кассы поддержат семьи строителей и резервистов. Промышленный договор не получит доверия, если его успех измеряется только тоннажем стали."
 MKN_industrial_compact: "Днепровский хозяйственный договор"
 MKN_industrial_compact_desc: "Утвердим открытый план заказов, обязательства предприятий и защиту семей. Съезд снимет последние хозяйственные ограничения и закрепит преимущества крупной промышленности."
 MKN_artel_register: "Реестр взаимных обязательств"
 MKN_artel_register_desc: "Артели запишут, чем располагают и что обещают соседям. Учёт не требует начальника над каждой мастерской."
 MKN_recallable_commanders: "Отзывные командиры"
 MKN_recallable_commanders_desc: "Сельские сходы установят сроки мандатов и ответственность полевых командиров. Добровольность службы не означает неопределённости приказа."
 MKN_field_schools: "Полевые школы коммун"
 MKN_field_schools_desc: "Передвижные инструкторы обучат отряды связи, маскировке и совместному манёвру, не отрывая деревни от посевной на месяцы."
 MKN_harvest_reserves: "Хлеб для обмена и резерва"
 MKN_harvest_reserves_desc: "Съезд решит, направить излишки на экспортные договоры или оставить их в страховых кладовых. Выбранная мера действует один год."
 MKN_mutual_credit: "Кредит без ростовщика"
 MKN_mutual_credit_desc: "Кассы взаимопомощи выдадут артельные ссуды под проверяемые договоры. Урожай и инструменты послужат основой расчётов."
 MKN_mobile_self_defence: "Подвижная самооборона"
 MKN_mobile_self_defence_desc: "Сельские резервы объединятся в подготовленные мобильные отряды с общими сборами и сменяемым командованием."
 MKN_repair_exchanges: "Биржи инструмента и ремонта"
 MKN_repair_exchanges_desc: "Артели обменяются оснасткой, запчастями и топливом для мастерских. Малые угольные промыслы поддержат местную энергетику."
 MKN_workshop_standards: "Договор о взаимозаменяемости"
 MKN_workshop_standards_desc: "Оружейные артели примут общие калибры и образцы деталей. Стандарт станет договором производителей, а не приказом единственного завода."
 MKN_supply_congress: "Съезд обозных артелей"
 MKN_supply_congress_desc: "Перевозчики согласуют резервные маршруты и помощь пострадавшим обозам. Военные перевозки получат устойчивый порядок."
 MKN_shared_orders: "Общий портфель заказов"
 MKN_shared_orders_desc: "Общие стандарты и обмен инструментом позволят распределять заказы между мастерскими. Разрозненность сменится гибким освоением производства."
 MKN_social_fund: "Страховая касса коммун"
 MKN_social_fund_desc: "Взносы артелей защитят семьи от неурожая, травм и потери кормильца. Общая безопасность сделает взаимопомощь надёжнее случайных пожертвований."
 MKN_communal_compact: "Хартия хозяйственной взаимопомощи"
 MKN_communal_compact_desc: "Закрепим добровольные договоры, кредитные кассы и страхование. Хозяйственный кризис уступит устойчивой сети самостоятельных коммун."
 mkn.30.t: "Смета принадлежит съезду"
 mkn.30.d: "Делегаты Днепростроя проверили сметы. Ускоренный сезон даст больше строек, но потребует дополнительных средств от потребительского сектора. Постепенное переоснащение поможет осваивать производство без чрезвычайных сборов. Какой порядок мы принимаем на ближайший год?"
 mkn.30.a: "Ускорить строительство, приняв расходы."
 mkn.30.b: "Переоснащать предприятия постепенно."
 mkn.31.t: "Что делать с общим излишком?"
 mkn.31.d: "Артели подсчитали хлеб и соль, которыми можно распорядиться сообща. Экспортные договоры оплатят оборудование, но свяжут делегатов долгими переговорами. Страховые кладовые укрепят доверие и снабжение отрядов. Съезд выбирает меру на ближайший год."
 mkn.31.a: "Заключить экспортные договоры."
 mkn.31.b: "Наполнить страховые кладовые."
