l_russian:
 MKN_focus: "Махновская вольница"
 MKN_the_free_territory: "Вольная территория"
 MKN_the_free_territory_desc: "Ни господ, ни государств — только вольные советы крестьян и рабочих."
 MKN_farmers_and_workers: "Крестьяне и рабочие"
 MKN_farmers_and_workers_desc: "Вольная территория держится на руках труда, а не на коронах старого мира."
 MKN_shadow_republic: "Теневое государство"
 MKN_shadow_republic_desc: "Государство, которое почти никогда не спорит вслух, но всегда чувствуется в воздухе."
 MKN_free_soviets: "Вольные советы"
 MKN_free_soviets_desc: "Каждому селу — свою коммуну, каждой коммуне — свой голос."
 MKN_tachanka_columns: "Тачаночные колонны"
 MKN_tachanka_columns_desc: "Пулемёты на тачанках — быстрее любой кавалерии старых империй."
 MKN_nabat_federation: "Федерация «Набат»"
 MKN_nabat_federation_desc: "Анархистские федерации от Харькова до Одессы смотрят на Гуляй-Поле."
 MKN_gulyai_polye_commune: "Гуляйпольская коммуна"
 MKN_gulyai_polye_commune_desc: "Столица анархии покажет миру иной способ жить."
 MKN_railway_war: "Рельсовая война"
 MKN_railway_war_desc: "Бронепоезда и летучие отряды — степь принадлежит тому, кто держит рельсы."
 MKN_black_banner_east: "Чёрное знамя на восток"
 MKN_black_banner_east_desc: "Киев кланяется Москве. Восток надо освободить от обоих."
 MKN_makhno_moves_south: "Махно идёт на юг"
 MKN_makhno_moves_south_desc: "К морю, к портам, к кораблям, что везут наш хлеб."
 MKN_the_steppe_holds: "Степь держится"
 MKN_the_steppe_holds_desc: "Три года войны, а Вольная территория стоит. Пусть приходят."
 MKN_free_territory: "Вольная территория"
 MKN_free_territory_desc: "Анархистские коммуны, скреплённые одной лишь волей."
 MKN_tachanka_warfare: "Тачаночная война"
 MKN_tachanka_warfare_desc: "Скорость — броня в степи."
 MKN_railway_guards: "Железнодорожная стража"
 MKN_railway_guards_desc: "Кто держит рельсы, тот держит юг."
 MKN_BELASH_DESC: "Начальник штаба Повстанческой армии."
 MKN_SHCHUS_DESC: "Лихий кавалерийский атаман."
 MKN_focus_desc: "Дерево фокусов Махновской вольной территории."
 MKN_NESTOR_MAKHNO_DESC: "Атаман Революционной повстанческой армии Украины."
 MKN_black_sea_flotilla: "Черноморская флотилия"
 MKN_black_sea_flotilla_desc: "Даже анархистам нужны лодки для охраны берега."
 MKN_dnieper_patrol: "Днепровский дозор"
 MKN_dnieper_patrol_desc: "Канонерки на реке."
 MKN_steppe_hawks: "Степные ястребы"
 MKN_steppe_hawks_desc: "Пара ящиков, пара смельчаков — своего рода авиация."
 MKN_free_soviets_idea: "Упорядоченные вольные советы"
 MKN_free_soviets_idea_desc: "Коммуны учатся считать хлеб и винтовки."
 MKN_soviet_press: "Советская печать"
 MKN_soviet_press_desc: "«Набат» и «Голос» ежедневно печатают правду."
 MKN_anarchist_schools: "Анархистские школы"
 MKN_anarchist_schools_desc: "Школы Феррера для свободных детей."
 MKN_peasant_militias: "Крестьянские милиции"
 MKN_peasant_militias_desc: "Каждому селу — свою сотню."
 MKN_batko_guards: "Гвардия батьки"
 MKN_batko_guards_desc: "Личная гвардия старика."
 MKN_SHCHUS_LEADER_DESC: "Атаман, ставший государственником. Или наоборот."
 MKN_EMPEROR_DESC: "Милостью тачанки — император Степи."
 MKN_VOLIN_DESC: "Теоретик вольных советов и вольных выборов."
 MKN_border_tensions: "Напряжение на границе"
 MKN_border_tensions_desc: "Киев держит то, что нужно степи. Прощупать их границу."
 MKN_everlasting_makhnovshchina: "Вечная махновщина"
 MKN_everlasting_makhnovshchina_desc: "Ни богов, ни господ, ни конца."
 MKN_soviets_forever: "Советы навсегда"
 MKN_soviets_forever_desc: "Коммуна вечна."
 MKN_tachanka_guards: "Тачаночная гвардия"
 MKN_tachanka_guards_desc: "Элита Повстанческой армии."
 MKN_council_communism: "Советский коммунизм"
 MKN_council_communism_desc: "Маркс без Москвы."
 MKN_workers_control: "Рабочий контроль"
 MKN_workers_control_desc: "Завод — тем, кто на нём работает."
 MKN_commune_federation: "Федерация коммун"
 MKN_commune_federation_desc: "Тысяча коммун — одна федерация."
 MKN_constituent_assembly: "Учредительное собрание"
 MKN_constituent_assembly_desc: "Даже анархисты иногда голосуют."
 MKN_free_elections_steppe: "Вольные выборы в степи"
 MKN_free_elections_steppe_desc: "Бюллетени вместо пуль. Преимущественно."
 MKN_open_markets: "Открытые рынки"
 MKN_open_markets_desc: "Торговля — не преступление."
 MKN_red_banner_steppe: "Красное знамя над степью"
 MKN_red_banner_steppe_desc: "Чёрное блекнет до красного."
 MKN_hand_to_moscow: "Рука Москве"
 MKN_hand_to_moscow_desc: "Союзник, наконец, против Киева."
 MKN_collectivize_the_steppe: "Коллективизировать степь"
 MKN_collectivize_the_steppe_desc: "Добровольно. Преимущественно."
 MKN_black_hundreds: "Чёрные сотни"
 MKN_black_hundreds_desc: "Порядок будет восстановлен. Жестоко."
 MKN_order_through_tachanka: "Порядок через тачанку"
 MKN_order_through_tachanka_desc: "Пулемёт — лучший аргумент."
 MKN_steppe_legions: "Степные легионы"
 MKN_steppe_legions_desc: "Шагом марш, иначе — никак."
 MKN_nestor_the_first: "Нестор Первый"
 MKN_nestor_the_first_desc: "Почему нет? У всех остальных есть царь."
 MKN_imperial_coronation: "Императорская коронация"
 MKN_imperial_coronation_desc: "Корона из пшеницы и стали."
 MKN_steppe_empire: "Степная империя"
 MKN_steppe_empire_desc: "От моря до моря — по указу."
 MKN_border_raids: "Пограничные рейды"
 MKN_border_raid: "Провести пограничный рейд"
 MKN_border_raid_desc: "Начать ограниченное приграничное сражение, начиная с Николаева и продвигаясь вдоль фронта. После третьего рейда Киев объявит войну."
 MKN: "Махновцы"
 MKN_DEF: "Махновская Украина"
 MKN_ADJ: "Махновский"
 NWW_MKN_DESC: "Махновская вольница."
 MKN_manganese_nikopol: "Никопольский марганец"
 MKN_manganese_nikopol_desc: "Руды Никопольского бассейна — металл для вольных заводов и валюта для вольных рук."
 MKN_dneprostroi: "Днепрострой"
 MKN_dneprostroi_desc: "Плотина у Кичкаса перегородит Днепр. Электричество будет принадлежать общинам, а не государству."
 MKN_kichkas_bridge: "Кичкасский мост"
 MKN_kichkas_bridge_desc: "Рельсы свяжут оба берега Днепра — хлеб пойдёт туда, куда укажем сами."
 MKN_zaporizhstal: "Запорожсталь"
 MKN_zaporizhstal_desc: "Печи на никопольском металле и днепровской воле."
 MKN_steppe_electrification: "Электрификация степи"
 MKN_steppe_electrification_desc: "Лампа в каждой хате — учебник в каждой волости."
 MKN_steppe_general_staff: "Штаб Степной армии"
 MKN_steppe_general_staff_desc: "Батько мыслит набегами. Штаб учится мыслить фронтами."
 MKN_steel_horses: "Стальные кони Махно"
 MKN_steel_horses_desc: "Бронеавтомобили и танки — пулемёт крепится к стали, а не к коню."
 MKN_batko_cavalry: "Конница Батьки"
 MKN_batko_cavalry_desc: "Конь и степь — древние союзники анархии."
 MKN_black_guard_veterans: "Ветераны Чёрной гвардии"
 MKN_black_guard_veterans_desc: "Опыт, которого не заменит никакая академия."
 MKN_steppe_quartermasters: "Степные интенданты"
 MKN_steppe_quartermasters_desc: "Полный мешок — тоже оружие."
 MKN_village_airfields: "Аэродромы волостей"
 MKN_village_airfields_desc: "Ровные поля Гуляй-Поля — отличные полосы."
 MKN_gulyaipole_pilot_school: "Школа вольных лётчиков"
 MKN_gulyaipole_pilot_school_desc: "Небо не делится на сословия."
 MKN_black_swarm: "Чёрный рой"
 MKN_black_swarm_desc: "Рой мелких, юрких машин над головами врагов."
 MKN_kherson_shipyard: "Херсонская верфь"
 MKN_kherson_shipyard_desc: "На лимане — стапели вольных: баркасы и канонерки."
 MKN_black_sea_smugglers: "Черноморская контрабанда"
 MKN_black_sea_smugglers_desc: "Соль, спички и патроны ходят морем в обход всех блокад."
 MKN_coastal_defense_steppe: "Оборона лиманов"
 MKN_coastal_defense_steppe_desc: "Батареи на косах и лиманах: к берегу Вольной территории со двора не заходить."
 MKN_dnieper_gun_flotilla: "Днепровская канонерская флотилия"
 MKN_dnieper_gun_flotilla_desc: "Мелкосидящие канонерки от Кичкаса до лимана."
 MKN_dneprostroi_power: "Энергия Днепростроя"
 MKN_dneprostroi_power_desc: "Токи Днепра крутят станки свободных коммун."
 MKN_electrified_steppe: "Электрифицированная степь"
 MKN_electrified_steppe_desc: "Хата с лампой и грамота в каждой волости."
 MKN_steel_horses_idea: "Стальные кони"
 MKN_steel_horses_idea_desc: "Броня и скорость вместо конского мяса."
 MKN_batko_cavalry_idea: "Конница Батьки"
 MKN_batko_cavalry_idea_desc: "Конные сотни волости — глаза, уши и оружие степи."
 MKN_black_guard_veterans_idea: "Ветераны Чёрной гвардии"
 MKN_black_guard_veterans_idea_desc: "Те, кто выжил в цепях и на тачанках, ведут за собой новые сотни."
 MKN_steppe_quartermasters_idea: "Степные интенданты"
 MKN_steppe_quartermasters_idea_desc: "С обозом Маркса, а без обоза и Маркс воюет вполсилы. Мы — наоборот."
 MKN_free_airmen: "Вольные лётчики"
 MKN_free_airmen_desc: "Ловить воздушные течения, а не приказы."
 MKN_black_swarm_idea: "Чёрный рой"
 MKN_black_swarm_idea_desc: "Медленно — но над всем и всюду."
 MKN_smuggling_network: "Контрабандистские сети"
 MKN_smuggling_network_desc: "Чёрное море кормит Вольную территорию в обход любых блокад."
 MKN_free_industry_modifier: "Вольно-промышленный подъём"
 MKN_free_industry_modifier_desc: "Вольная территория индустриализируется на своих условиях. Развитие промышленности усиливает эту программу."
 MKN_free_industry_tt: "§HВольно-промышленный подъём:§!\nПромышленность коммун растёт с каждым завершённым промышленным фокусом."
 MKN_fi_capacity: "Производительность фабрик"
 MKN_fi_construction: "Скорость строительства"
 MKN_fi_research: "Скорость исследований"
 MKN_kommunar_tractor: "Тракторный завод «Коммунар»"
 MKN_kommunar_tractor_desc: "Запорожский «Коммунар» сыграет трактора, а когда потребуется — корпуса для пушек."
 MKN_dnepro_aluminium: "Днепровский алюминиевый"
 MKN_dnepro_aluminium_desc: "Токи Днепростроя плавят бокситы. Крылья Вольной территории будут лёгкими."
 MKN_nikopol_tube_zavod: "Никопольский трубный завод"
 MKN_nikopol_tube_zavod_desc: "Трубы — для нефти, воды и гаубиц."
 MKN_steppe_mech_works: "Механические заводы волостей"
 MKN_steppe_mech_works_desc: "Станки на вольной земле, вольными руками."
 MKN_grain_export: "Зерновой экспорт"
 MKN_grain_export_desc: "Хлеб вольных коммун идёт на экспорт — за станки и наличность."
 MKN_steel_volnitsa: "Стальная вольница"
 MKN_steel_volnitsa_desc: "Вторая пятилетка вольной степи: Деферроский счётчик коммун идёт в гору."
 MKN_free_cooperatives: "Вольные кооперативы"
 MKN_free_cooperatives_desc: "Начнём с кооперативов: артель сильнее биржи, биржа сильнее казны."
 MKN_salt_artsels: "Соляные артели"
 MKN_salt_artsels_desc: "Соль степи — верная валюта волостей."
 MKN_village_smithies: "Кузни волостей"
 MKN_village_smithies_desc: "Каждая волость кует — от петель до гранат."
 MKN_grain_brokers: "Хлебные биржи"
 MKN_grain_brokers_desc: "Хлеб — это тоже политика."
 MKN_wind_mills_steppe: "Ветряки вольных хуторов"
 MKN_wind_mills_steppe_desc: "Ветер в степи бесплатный, как свобода."
 MKN_mobile_workshops: "Поезда-мастерские"
 MKN_mobile_workshops_desc: "Мастерская едет к селу, а не село к мастерской."
 MKN_free_bazaars: "Вольные базары"
 MKN_free_bazaars_desc: "Торговля без газетных гонок размещает содержание страны. Все ждут базарного дня."
 MKN_steppe_mint: "Степной монетный двор"
 MKN_steppe_mint_desc: "Свободная чеканка на свободной земле. Никто не мешает печатать собственные билеты..."
 MKN_freight_artels: "Дальние извозчицкие артели"
 MKN_freight_artels_desc: "Лошади, дороги и сметливость — древнейшая логистика степи."
 MKN_workshop_airplane_artels: "Артельные авиамастерские"
 MKN_workshop_airplane_artels_desc: "Разъездные авиамастерские ремонтируют и сколачивают машины прямо под открытым небом."
 MKN_craft_federation: "Федерация кустарных промыслов"
 MKN_craft_federation_desc: "Федерация кооперативов — экономика свободных рук: часто работаю я, часто работаю рядом."
 MKN_free_mint_idea: "Свободный монетный двор"
 MKN_free_mint_idea_desc: "Вольная валюта степи даёт вольной земле власть и ловкость жонглёра."
 MKN_anarchic_economy_idea: "Стихия вольной экономики"
 MKN_anarchic_economy_idea_desc: "Никакого центра, западов и планов: заводы принадлежат тем, кто на них работает, а снабжение — артелям. Это мешает строительству и исследованиям, но коммунам так живётся лучше."
 MKN_anarchic_economy_tt: "Артели и базары сами решают, что строить: централизованных поставок нет."
 MKN_industry_concern_1: "Концерн «Вольная сталь»"
 MKN_industry_concern_2: "Концерн «Вольная сталь»"
 MKN_rifle_concern_1: "Артель стрелкового вооружения"
 MKN_rifle_concern_2: "Артель стрелкового вооружения"
 MKN_steel_concern: "Концерн «Вольная сталь»"
 MKN_steel_concern_desc: "Ставропольско-никопольские металлурги объединяются в концерн вольных заводов. Веткой промышленности он станет сильнее.\n\n§YДоступен промышленный концерн. Нанимайте его в разделе советников.§!"
 MKN_steel_concern_union: "«Союз заводов»"
 MKN_steel_concern_union_desc: "Заводы концерна связывает общая ставка и общие склады — концерн становится сильнее."
 MKN_steel_concern_union_tt: "§GКонцерн «Вольная сталь» улучшен:§! исследования промышленности +5%, скорость строительства +3%, производительность фабрик +5%"
 MKN_rifle_concern: "Артель стрелкового вооружения"
 MKN_rifle_concern_desc: "Кузни и оружейные артели Гуляй-Поля объединяются под одним качеством. Их мастерство можно расширять.\n\n§YДоступен концерн пехотного вооружения. Нанимайте его в разделе советников.§!"
 MKN_rifle_concern_union: "Расширение оружейных артелей"
 MKN_rifle_concern_union_desc: "Артели получили общий инструмент и школы мастеров."
 MKN_rifle_concern_union_tt: "§GАртель стрелкового вооружения улучшена:§! исследования пехотного вооружения +5%, производительность фабрик +3%"
 MKN_fi_b_cap1: "Вольно-промышленный подъём: производительность фабрик §G+1%§!"
 MKN_fi_b_cap2: "Вольно-промышленный подъём: производительность фабрик §G+2%§!"
 MKN_fi_b_cap3: "Вольно-промышленный подъём: производительность фабрик §G+3%§!"
 MKN_fi_b_cons1: "Вольно-промышленный подъём: скорость строительства §G+1%§!"
 MKN_fi_b_cons2: "Вольно-промышленный подъём: скорость строительства §G+2%§!"
 MKN_fi_b_cons3: "Вольно-промышленный подъём: скорость строительства §G+3%§!"
 MKN_fi_b_res1: "Вольно-промышленный подъём: скорость исследований §G+1%§!"
 MKN_fi_b_res2: "Вольно-промышленный подъём: скорость исследований §G+2%§!"
 MKN_fi_b_res3: "Вольно-промышленный подъём: скорость исследований §G+3%§!"
