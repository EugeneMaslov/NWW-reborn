l_english:
 LTB_national_question:0 "The Union's National Question"
 LTB_national_question_desc:0 "Kaunas and Minsk must resolve their constitutional dispute before the compromise deadline expires."
 LTB_public_political_debate:0 "Debate the Union's Future"
 LTB_public_political_debate_desc:0 "The crisis has been resolved, but our institutions still need a public mandate. Open political meetings and allow movements to build support. A new course requires at least 40% party popularity."
 LTB_political_campaigns_tt:0 "Unlocks political campaign decisions. Each costs 50 political power and grants 10 percentage points of party popularity after 60 days. Only one campaign may run at a time. A change of government requires at least 40% popularity for the corresponding party."
 LTB_political_mandate:0 "A Public Mandate"
 LTB_political_mandate_desc:0 "Political movements must convince the people of both republics. Adopting a new course requires at least 40% party popularity. Campaigns end once a course is chosen."
 LTB_campaign_democratic:0 "Republican Public Meetings"
 LTB_campaign_democratic_desc:0 "Local meetings, an independent press and voters' associations will build support for democracy. The campaign lasts 60 days and grants popularity on completion."
 LTB_campaign_neutrality:0 "Campaign for the Crown"
 LTB_campaign_neutrality_desc:0 "Rally supporters of a common crown and government above the parties. The campaign lasts 60 days and grants popularity on completion."
 LTB_campaign_fascism:0 "National Movement Meetings"
 LTB_campaign_fascism_desc:0 "Nationalists will establish local organisations across both republics. The campaign lasts 60 days and grants popularity on completion."
 LTB_campaign_communism:0 "Organise Workers' Unions"
 LTB_campaign_communism_desc:0 "Factory meetings and the workers' press will build support for the left. The campaign lasts 60 days and grants popularity on completion."
 LTB_bicameral_union:0 "Two Chambers of the Union"
 LTB_bicameral_union_desc:0 "Republican representation and a common legislative chamber will give the crown a lasting foundation. Laws must account for both Kaunas and Minsk."
 LTB_royal_charter:0 "The Union's Royal Charter"
 LTB_royal_charter_desc:0 "Define the powers of the crown and the rights of the republics. The state council will prioritise arbitration between the lands or royal patronage of common defence."
 LTB_social_compact:0 "A Social Compact"
 LTB_social_compact_desc:0 "Agree on the rights of local parliaments, trade unions and the federal government. The republic must earn the trust of both lands."
 LTB_federal_constitution:0 "A Federal Constitution"
 LTB_federal_constitution_desc:0 "Adopt the constitution and choose the republic's first priority: civil rights or universal education."
 LTB_unified_administration:0 "A Unified Civil Service"
 LTB_unified_administration_desc:0 "Replace competing departments with a common administration and clear responsibilities."
 LTB_national_defense_state:0 "The National Defence State"
 LTB_national_defense_state_desc:0 "Define the national regime's foundation. Officers demand better army training, while industrialists seek government defence contracts."
 LTB_republics_of_labor:0 "Republics of Labour"
 LTB_republics_of_labor_desc:0 "Establish representation for workers and farmers in both republics. Common decisions must account for local councils."
 LTB_union_economic_congress:0 "The Union Economic Congress"
 LTB_union_economic_congress_desc:0 "The congress will choose between independent production councils and common state planning."
 LTB_crown_arbitration:0 "The Crown as Union Arbiter"
 LTB_crown_arbitration_desc:0 "The crown and both chambers reconcile republican interests and strengthen trust in common government."
 LTB_royal_defense_patronage:0 "Royal Defence Patronage"
 LTB_royal_defense_patronage_desc:0 "The court supports defence enterprises and military associations through continued government expenditure."
 LTB_federal_civil_rights:0 "Guaranteed Civil Rights"
 LTB_federal_civil_rights_desc:0 "Constitutional guarantees and independent courts strengthen trust in the federation."
 LTB_public_education:0 "Universal Education"
 LTB_public_education_desc:0 "Common educational standards improve the training of researchers and future soldiers."
 LTB_professional_officer_state:0 "Priority for the Officer Corps"
 LTB_professional_officer_state_desc:0 "Military training receives additional resources, while growing officer influence unsettles civilian institutions."
 LTB_directed_industry:0 "Government Defence Contracts"
 LTB_directed_industry_desc:0 "The government accelerates military factory construction through additional commitments to industrialists."
 LTB_autonomous_workers_councils:0 "Autonomous Workers' Councils"
 LTB_autonomous_workers_councils_desc:0 "Independent production councils cooperate with universities and encourage local initiative."
 LTB_state_planning_commission:0 "The Union Planning Commission"
 LTB_state_planning_commission_desc:0 "Common planning expands military production while committing additional civilian resources to its targets."
 ltb.160.t:0 "The Royal Charter's Priority"
 ltb.160.d:0 "The state council has agreed on the foundations of the union monarchy. The crown must now prioritise arbitration between the republics or active patronage of common defence."
 ltb.160.a:0 "The crown will reconcile the republics"
 ltb.160.b:0 "The crown will support our defence"
 ltb.161.t:0 "The Federal Constitution's Priority"
 ltb.161.d:0 "Delegates from Kaunas and Minsk have adopted the federation's foundations. The assembly must choose its first common programme: stronger civil rights or accessible education."
 ltb.161.a:0 "Independent courts and civil rights"
 ltb.161.b:0 "Schools and specialist training"
 ltb.162.t:0 "The National State's Foundation"
 ltb.162.d:0 "The common administration is ready to act. Officers seek expanded army training, while industrialists offer faster military factory construction through government contracts."
 ltb.162.a:0 "Support a professional officer corps"
 ltb.162.b:0 "Expand defence contracts"
 ltb.163.t:0 "The Economic Congress Decides"
 ltb.163.d:0 "Delegates have agreed on the union of labour republics. Some favour independent production councils and scientific initiative; others seek a planning commission and binding common targets."
 ltb.163.a:0 "Trust the workers' councils"
 ltb.163.b:0 "Establish the union planning commission"
 LTB_union_preserved:0 "The crisis has been resolved and the Union preserved"
 LTB_deadline_resolved:0 "The national crisis has been settled"
 LTB_split_choice_available:0 "The crisis has reached the dissolution decision"
 LTB_moscow_agreement:0 "Moscow accepted the treaty"
 LTB_moscow_rejected:0 "Moscow rejected the proposal"
 LTB_polish_agreement:0 "Warsaw recognised the Union's border"
 LTB_polish_rejected:0 "Warsaw rejected the proposal"
 LTB_polish_defense_agreement:0 "Poland accepted the mutual defence protocol"
 LTB_german_agreement:0 "Berlin accepted the industrial agreement"
 LTB_german_rejected:0 "Berlin rejected the industrial agreement"
 LTB_french_machines_agreement:0 "France accepted machine-tool deliveries"
 LTB_italian_research_agreement:0 "Italy accepted the research exchange"
 LTB_political_campaign_active:0 "Another political campaign is in progress"
 LTB_constitutional_settlement:0 "The final constitutional settlement has been adopted"
