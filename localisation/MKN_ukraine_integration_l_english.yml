l_english:
 MKN_ukrainian_communes_congress:0 "Congress of Ukrainian Communes"
 MKN_ukrainian_communes_congress_desc:0 "The war is over, but ownership has yet to become a shared compact. Delegates from the former Ukrainian lands will define local self-government."
 MKN_southern_commune_charters:0 "Charters of the Southern Communes"
 MKN_southern_commune_charters_desc:0 "Odesa, Mykolaiv and Balta adopt local charters and become core states. Coordinated depots reduce supply consumption."
 MKN_right_bank_councils:0 "Councils of the Right Bank"
 MKN_right_bank_councils_desc:0 "Councils of Zhytomyr, Podillia and the right bank gain recognized representation. Four states become cores and lasting stability replaces emergency administration."
 MKN_northern_delegates:0 "Mandates of the Northern Districts"
 MKN_northern_delegates_desc:0 "Hlukhiv and the former Ukrainian district of Liski send delegates. Local mandates bring cores, volunteers and political income."
 MKN_dnieper_workshop_federation:0 "Federation of Dnieper Workshops"
 MKN_dnieper_workshop_federation_desc:0 "Kyiv and Cherkasy join the economic federation as core states. A restored arms line and shared orders improve production."
 MKN_ukrainian_rail_reconstruction:0 "Rebuild the Ukrainian Main Lines"
 MKN_ukrainian_rail_reconstruction_desc:0 "Once regional charters are agreed, repair artels connect Odesa, Kyiv and Hlukhiv. Permanent construction and repair bonuses develop the shared economic spirit."
 MKN_kyiv_scientific_exchange:0 "Kyiv Scientific Exchange"
 MKN_kyiv_scientific_exchange_desc:0 "Join Kyiv’s schools and laboratories to both existing communal research networks. This exchange after Ukrainian integration establishes the sixth research slot. If an older save already has it, gain two 50% industrial research bonuses instead."
 MKN_federation_of_free_councils:0 "Federation of Free Councils"
 MKN_federation_of_free_councils_desc:0 "Regional compacts become a common federal charter. Stability, supply and production efficiency consolidate integration through the shared economic spirit."
 MKN_allied_war_guard_tt:0 "War cannot be declared against a common-bloc ally or in violation of MKN’s accepted equal-autonomy agreement."
 MKN_AI_BEHAVIOR:0 "Makhnovshchina Political Course"
 MKN_AI_DEFAULT_DESC:0 "Choose one of four prepared political routes with equal chances once per campaign, regardless of the global historical-focus setting. Tsebriy’s historical course is available as a separate rule."
 MKN_AI_HISTORICAL:0 "Historical: Syndicalist Compact"
 MKN_AI_HISTORICAL_DESC:0 "Makhnovshchina prepares its congress, establishes Tsebriy’s government and negotiates with the USSR. The Ukrainian truce proposal is almost always refused."
 MKN_AI_RANDOM:0 "Random Political Route"
 MKN_AI_RANDOM_DESC:0 "Equal chances of the military, free councils, peasant or syndicalist route. The AI builds its chosen mandate through paid campaigns."
 MKN_AI_FASCISM:0 "Dmitruk Tratishov’s Military Staff"
 MKN_AI_FASCISM_DESC:0 "An elected military staff, suppression of demagogues and the Black Horde. The AI prepares 40% support for transition."
 MKN_AI_DEMOCRATIC:0 "Volin’s Free Councils"
 MKN_AI_DEMOCRATIC_DESC:0 "A compact of free communes, self-defence and the Black International. The AI prepares 40% support for transition."
 MKN_AI_NEUTRALITY:0 "Peasant Delegates"
 MKN_AI_NEUTRALITY_DESC:0 "The grain ultimatum, rural autonomy and defence of the granary. The AI prepares 40% support for transition."
 MKN_AI_COMMUNISM:0 "Tsebriy’s Syndicalist Revkom"
 MKN_AI_COMMUNISM_DESC:0 "The Revkom, removal of irreconcilables, negotiated Soviet cooperation and equal autonomy. The 40% mandate requirement remains."
 mkn_integration.1.t:0 "Ukraine after the War"
 mkn_integration.1.d:0 "All lands of former Soviet Ukraine are now owned and controlled by us. Representation, reconstruction and local charters must replace military administration. The Ukrainian integration focus branch is now visible."
 mkn_integration.1.a:0 "Summon the regional delegates."
 MKN_ukrainian_administration_category:0 "Ukrainian Self-Government"
 MKN_ukrainian_administration_category_desc:0 "After Soviet Ukraine ceases to exist, delegates can choose the political centre of the Free Territory."
 MKN_move_capital_to_kyiv:0 "Move the Capital to Kyiv"
 MKN_move_capital_to_kyiv_desc:0 "Move the common institutions and congress of delegates from Huliaipole to Kyiv. This decision costs 50 political power and is available after UKR ceases to exist, provided we own Kyiv and fully control its state. Completing the integration branch is not required."
