l_russian:
 LTB_national_question:0 "Национальный вопрос Союза"
 LTB_national_question_desc:0 "Каунас и Минск должны разрешить спор о государственном устройстве до истечения срока компромисса."
 LTB_public_political_debate:0 "Обсудить будущее Союза"
 LTB_public_political_debate_desc:0 "Кризис разрешён, но будущее государственного устройства ещё предстоит определить. Откроем политические собрания и дадим движениям возможность добиваться общественного мандата. Новый курс потребует поддержки не менее 40% граждан."
 LTB_political_campaigns_tt:0 "Открывает политические кампании в решениях. Каждая стоит 50 политической власти и через 60 дней добавляет 10 процентных пунктов поддержки выбранной партии. Одновременно можно проводить одну кампанию. Для смены государственного курса требуется поддержка соответствующей партии не менее 40%."
 LTB_political_mandate:0 "Общественный мандат"
 LTB_political_mandate_desc:0 "Политические движения должны убедить жителей обеих республик. Для принятия нового государственного курса требуется поддержка партии не менее 40%. После выбора курса предвыборные кампании завершаются."
 LTB_campaign_democratic:0 "Собрания сторонников республики"
 LTB_campaign_democratic_desc:0 "Местные собрания, независимая пресса и союзы избирателей расширят поддержку демократического движения. Кампания длится 60 дней; поддержка увеличивается после её завершения."
 LTB_campaign_neutrality:0 "Кампания сторонников короны"
 LTB_campaign_neutrality_desc:0 "Объединим сторонников надпартийной власти и общей короны. Кампания длится 60 дней; поддержка увеличивается после её завершения."
 LTB_campaign_fascism:0 "Собрания национального движения"
 LTB_campaign_fascism_desc:0 "Националисты проведут собрания и создадут местные организации в обеих республиках. Кампания длится 60 дней; поддержка увеличивается после её завершения."
 LTB_campaign_communism:0 "Организация рабочих союзов"
 LTB_campaign_communism_desc:0 "Заводские собрания и рабочая пресса помогут левым получить поддержку. Кампания длится 60 дней; поддержка увеличивается после её завершения."
 LTB_bicameral_union:0 "Две палаты Союза"
 LTB_bicameral_union_desc:0 "Представительство республик и общесоюзная палата дадут короне устойчивую опору. Законы будут учитывать интересы Каунаса и Минска."
 LTB_royal_charter:0 "Союзная королевская хартия"
 LTB_royal_charter_desc:0 "Закрепим полномочия короны и права республик. Государственный совет определит, станет ли главным делом монархии арбитраж между землями или покровительство общей обороне."
 LTB_social_compact:0 "Общественный договор"
 LTB_social_compact_desc:0 "Согласуем права местных парламентов, профсоюзов и общесоюзного правительства. Республика должна опираться на доверие жителей обеих земель."
 LTB_federal_constitution:0 "Конституция федерации"
 LTB_federal_constitution_desc:0 "Примем конституцию и определим приоритет новой республики: защиту гражданских прав или развитие всеобщего образования."
 LTB_unified_administration:0 "Единая государственная служба"
 LTB_unified_administration_desc:0 "Заменим конкурирующие ведомства общей системой управления. Согласованные полномочия позволят проводить единый курс по обе стороны Немана."
 LTB_national_defense_state:0 "Государство национальной обороны"
 LTB_national_defense_state_desc:0 "Определим опору национального режима. Военное руководство требует приоритета офицерской подготовки, промышленники — государственных оборонных заказов."
 LTB_republics_of_labor:0 "Республики труда"
 LTB_republics_of_labor_desc:0 "Закрепим представительство рабочих и крестьян обеих республик. Общесоюзные решения должны учитывать местные советы."
 LTB_union_economic_congress:0 "Хозяйственный съезд Союза"
 LTB_union_economic_congress_desc:0 "Съезд выберет устройство новой экономики: самостоятельность производственных советов или общесоюзное планирование."
 LTB_crown_arbitration:0 "Корона — арбитр Союза"
 LTB_crown_arbitration_desc:0 "Корона и две палаты согласуют интересы республик, укрепляя доверие к общей власти."
 LTB_royal_defense_patronage:0 "Королевское оборонное покровительство"
 LTB_royal_defense_patronage_desc:0 "Двор направляет средства на оборонные предприятия и общественные военные организации. Программа требует постоянных расходов правительства."
 LTB_federal_civil_rights:0 "Гарантии гражданских прав"
 LTB_federal_civil_rights_desc:0 "Конституционные гарантии и независимый суд укрепляют доверие к федерации."
 LTB_public_education:0 "Всеобщее образование"
 LTB_public_education_desc:0 "Единые образовательные стандарты и поддержка школ повышают квалификацию исследователей и будущих военнослужащих."
 LTB_professional_officer_state:0 "Приоритет офицерского корпуса"
 LTB_professional_officer_state_desc:0 "Военная подготовка получает дополнительные ресурсы; возрастающее влияние офицеров вызывает недовольство гражданских учреждений."
 LTB_directed_industry:0 "Государственные оборонные заказы"
 LTB_directed_industry_desc:0 "Правительство ускоряет строительство военных предприятий за счёт дополнительных обязательств перед промышленниками."
 LTB_autonomous_workers_councils:0 "Самостоятельные рабочие советы"
 LTB_autonomous_workers_councils_desc:0 "Производственные советы сохраняют самостоятельность и сотрудничают с университетами, поддерживая местную инициативу."
 LTB_state_planning_commission:0 "Союзная плановая комиссия"
 LTB_state_planning_commission_desc:0 "Общесоюзный план повышает выпуск военной продукции, направляя больше гражданских ресурсов на исполнение производственных заданий."
 ltb.160.t:0 "Приоритет королевской хартии"
 ltb.160.d:0 "Государственный совет согласовал основы союзной монархии. Теперь предстоит определить главное назначение короны: сохранять равновесие республик через арбитраж или активно покровительствовать общей обороне."
 ltb.160.a:0 "Корона обеспечит согласие республик"
 ltb.160.b:0 "Корона станет покровителем обороны"
 ltb.161.t:0 "Приоритет федеральной конституции"
 ltb.161.d:0 "Представители Каунаса и Минска приняли основы федерации. Конституционное собрание обсуждает первую общесоюзную программу: укрепление гражданских прав или развитие доступного образования."
 ltb.161.a:0 "Независимый суд и гражданские права"
 ltb.161.b:0 "Школы и подготовка специалистов"
 ltb.162.t:0 "Опора национального государства"
 ltb.162.d:0 "Единая администрация готова проводить государственный курс. Офицеры требуют расширить подготовку армии, а промышленники предлагают ускорить строительство военных заводов через государственные заказы."
 ltb.162.a:0 "Поддержать профессиональный офицерский корпус"
 ltb.162.b:0 "Расширить оборонные заказы"
 ltb.163.t:0 "Решение хозяйственного съезда"
 ltb.163.d:0 "Рабочие делегаты согласовали основы союза республик труда. Одни выступают за самостоятельность производственных советов и научную инициативу, другие — за плановую комиссию и обязательные общесоюзные задания."
 ltb.163.a:0 "Доверить инициативу рабочим советам"
 ltb.163.b:0 "Учредить союзную плановую комиссию"
 LTB_union_preserved:0 "Союз сохранён после разрешения кризиса"
 LTB_split_choice_available:0 "Кризис дошёл до решения о распаде Союза"
 LTB_moscow_agreement:0 "Москва согласилась на договор"
 LTB_moscow_rejected:0 "Москва отклонила предложение"
 LTB_polish_agreement:0 "Варшава признала границу Союза"
 LTB_polish_rejected:0 "Варшава отклонила предложение"
 LTB_polish_defense_agreement:0 "Польша приняла протокол взаимной обороны"
 LTB_german_agreement:0 "Берлин согласился на промышленный договор"
 LTB_german_rejected:0 "Берлин отклонил промышленный договор"
 LTB_french_machines_agreement:0 "Франция согласилась поставить станки"
 LTB_italian_research_agreement:0 "Италия согласилась на научный обмен"
 LTB_political_campaign_active:0 "Проводится другая политическая кампания"
 LTB_constitutional_settlement:0 "Принято окончательное государственное устройство"
