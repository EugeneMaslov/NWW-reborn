l_english:
 UKR_breadbasket_of_the_union: "Breadbasket of the Union"
 UKR_breadbasket_of_the_union_desc: "Ukrainian grain feeds the revolution."
 ltb.100.t: "The Compromise Signed"
 ltb.100.d: "In Vilnius, Lithuanian and Belarusian delegates embrace. The Union will live."
 ltb.100.a: "For the Union!"
 ltb.101.t: "Unrest in Kaunas"
 ltb.101.d: "Lithuanian nationalists march through Kaunas demanding an end to the Union. Minsk answers with counter-demonstrations. Something must be done."
 ltb.101.a: "Convene the Grand Seimas"
 ltb.102.t: "The Seimas Deliberates"
 ltb.102.d: "Half a year of speeches. The delegates demand a final answer."
 ltb.102.a: "The Union is saved"
 ltb.102.b: "It has come to this"
 ltb.104.t: "The Hour of Decision"
 ltb.104.d: "The government must settle the national question once and for all."
 ltb.104.a: "Confirm the compromise"
 ltb.104.b: "There is no compromise"
 mkn.1.t: "The Nabat Congress"
 mkn.1.d: "Anarchists from across the south gather in Gulyai-Polye. The black banner flies over the steppe."
 mkn.1.a: "Long live anarchy!"
 mkn.2.t: "Kiev Objects"
 mkn.2.d: "The government in Kiev demands that the Insurgent Army disarm and submit to the Republic."
 mkn.2.a: "Never!"
 mkn.2.b: "Yield for now"
