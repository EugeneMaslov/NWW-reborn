l_russian:
 NWW_TUR_imperial_crisis:0 "Больной человек Европы"
 NWW_TUR_imperial_crisis_desc:0 "Империя пережила десятилетия без большой европейской войны, но не преодолела борьбу двора, офицерства и провинций за влияние. Открыв политические переговоры, необходимо поочерёдно договориться с офицерами, улемами и провинциальными советами. Каждый завершённый договор ослабляет общий кризис; окончательное урегулирование требует фокуса «Имперское соглашение»."
 NWW_TUR_imperial_crisis_1:0 "Больной человек Европы"
 NWW_TUR_imperial_crisis_1_desc:0 "Первый договор вернул кабинету часть авторитета. Две другие влиятельные группы всё ещё требуют гарантий, поэтому кризис пока ослаблен лишь частично."
 NWW_TUR_imperial_crisis_2:0 "Больной человек Европы"
 NWW_TUR_imperial_crisis_2_desc:0 "Основные разногласия сглажены, но общий порядок ещё не утверждён. Завершив переговоры со всеми тремя группами, необходимо закрепить достигнутые гарантии Имперским соглашением."
 NWW_TUR_imperial_compact:0 "Имперское соглашение"
 NWW_TUR_imperial_compact_desc:0 "Договорённости с офицерским корпусом, улемами и провинциальными советами объединены в общий закон. Армия получает устойчивое финансирование, религиозные учреждения — гарантии, а провинции — представительство. Кабинет приобретает опору для модернизации в рамках выбранного политического курса."
 NWW_TUR_balkan_administration:0 "Управление балканскими провинциями"
 NWW_TUR_balkan_administration_desc:0 "Местные советы, единые правила сбора налогов и военная служба снабжения помогают закрепить власть на Балканах."
 NWW_TUR_war_industry:0 "Имперские военные заказы"
 NWW_TUR_war_industry_desc:0 "Казённые арсеналы и частные поставщики работают по общим стандартам. Долгосрочные заказы ускоряют строительство военных заводов и повышают выпуск вооружения."
 NWW_TUR_imperial_councils:0 "Имперские советы"
 NWW_TUR_imperial_councils_desc:0 "Влиятельные группы империи требуют гарантий участия в реформе. Переговоры с офицерами, улемами и провинциальными советами ведутся по очереди: каждые занимают 45 дней и стоят 50 политической власти. Завершённые договоры постепенно ослабляют «Больного человека Европы» и открывают Имперское соглашение. При утрате независимости текущие переговоры отменяются, а затраты возвращаются."
 NWW_TUR_negotiate_officers:0 "Договориться с офицерским корпусом"
 NWW_TUR_negotiate_officers_desc:0 "Офицеры требуют регулярного жалованья, профессионального продвижения и ясных границ между армией и политикой. За 45 дней кабинет согласует программу службы. Договор даёт 10 опыта армии, 5% поддержки войны и ослабляет имперский кризис. Другие переговоры в это время недоступны."
 NWW_TUR_negotiate_ulema:0 "Согласовать гарантии с улемами"
 NWW_TUR_negotiate_ulema_desc:0 "Улемы опасаются, что модернизация разрушит их школы и благотворительные учреждения. Кабинет предлагает прозрачное финансирование и постепенную реформу образования. Через 45 дней договор даёт 5% стабильности и ослабляет имперский кризис. Другие переговоры в это время недоступны."
 NWW_TUR_negotiate_provinces:0 "Созвать провинциальные советы"
 NWW_TUR_negotiate_provinces_desc:0 "Делегаты провинций требуют справедливого налогообложения, местного представительства и правил, защищающих разные общины. За 45 дней переговоров можно согласовать их участие в общей реформе. Завершённый договор возвращает кабинету 25 политической власти и ослабляет имперский кризис. Другие переговоры в это время недоступны."
 nww_tur_council.1.t:0 "Служба вместо дворцовых интриг"
 nww_tur_council.1.d:0 "Представители офицерского корпуса подписали соглашение с кабинетом. Жалованье и закупки вооружения будут утверждаться заранее, а продвижение по службе должно опираться на подготовку и опыт. Взамен командиры признают полномочия установленных политических органов.\n\nОфицеры получили основание поддержать общую реформу. Согласие других влиятельных групп ещё предстоит обеспечить."
 nww_tur_council.1.a:0 "Армия получает ясную задачу."
 nww_tur_council.2.t:0 "Гарантии для улемов"
 nww_tur_council.2.d:0 "Долгие заседания завершились соглашением о школах, благотворительных фондах и положении религиозных учреждений. Кабинет отказался от немедленной конфискации, а представители улемов согласились на отчётность и поэтапное обновление образования.\n\nИмперия сможет двигаться дальше, если остальные участники также получат понятные гарантии."
 nww_tur_council.2.a:0 "У реформ появляется общественная опора."
 nww_tur_council.3.t:0 "Голос провинций"
 nww_tur_council.3.d:0 "Делегаты Анатолии, арабских провинций и других общин согласовали с кабинетом порядок налоговых сборов и представительства. Взамен на обязательства перед центром местные советы получают закреплённые права и возможность обжаловать произвол чиновников.\n\nЭтот договор даёт провинциям причину участвовать в общей реформе, а не искать защиту за её границами."
 nww_tur_council.3.a:0 "Общий порядок должен учитывать местные интересы."
 nww_tur_council.4.t:0 "Имперское соглашение принято"
 nww_tur_council.4.d:0 "Договоры с офицерским корпусом, улемами и провинциальными советами сведены в общий закон. Впервые за долгие годы кабинет может опираться на согласованный порядок службы, образования и местного представительства.\n\nСоглашение устанавливает правила разрешения внутренних споров и даёт государству возможность перейти от затянувшегося кризиса к модернизации."
 nww_tur_council.4.a:0 "Теперь можно строить будущее."
 NWW_TUR_officer_accord:0 "Достигнута договорённость с офицерским корпусом"
 NWW_TUR_ulema_accord:0 "Согласованы гарантии с улемами"
 NWW_TUR_provincial_accord:0 "Достигнута договорённость с провинциальными советами"
