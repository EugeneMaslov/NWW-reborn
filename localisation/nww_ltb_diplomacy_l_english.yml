l_english:
 LTB_overture_to_moscow_request_tt:0 "Send Moscow a non-aggression proposal. Acceptance grants a pact, mutual opinion improvements and one industry research bonus, and unlocks the eastern trade programme."
 LTB_the_polish_question_request_tt:0 "Offer Poland recognition of the existing border. Acceptance grants a non-aggression pact, removes mutual territorial claims, improves relations and opens mutual-guarantee negotiations. National cores and ownership remain intact."
 LTB_german_engineers_request_tt:0 "Offer Germany an industrial agreement. Acceptance, requiring 50 political power, grants a three-year engineering mission, industry and electronics bonuses, trade relations and access to machine-tool deliveries. Germany may refuse."
 LTB_polish_defense_request_tt:0 "Offer Poland mutual guarantees of independence. Poland must separately approve the defense protocol. Once PBMAT is founded, an invitation to the alliance can follow."
 LTB_dvina_border_commission:0 "Dvina Border Commission"
 LTB_dvina_border_commission_desc:0 "A joint commission will establish procedures at the eastern border and safe routes for trade. The pact must remain in force and relations peaceful."
 LTB_polish_defense_protocol:0 "Mutual Defense Protocol"
 LTB_polish_defense_protocol_desc:0 "The border settlement opens negotiations for mutual guarantees of independence against outside pressure. Warsaw will make its own decision."
 LTB_german_machine_tools:0 "German Machine Tools"
 LTB_german_machine_tools_desc:0 "Our industrial agreement supplies modern machine tools to Minsk workshops. A new civilian enterprise and engineering training will make use of them."
 LTB_armed_neutrality:0 "Armed Neutrality"
 LTB_armed_neutrality_desc:0 "Foreign consent helps, but Union sovereignty must not depend on another capital. After the first negotiations, establish an independent defensive policy. Joining a faction ends neutrality."
 LTB_eastern_trade:0 "Eastern Trade Routes"
 LTB_eastern_trade_desc:0 "The border commission has opened dependable trade routes, supplying materials and orders for civilian construction. War with Moscow will end cooperation."
 LTB_german_industrial_mission:0 "German Engineering Mission"
 LTB_german_industrial_mission_desc:0 "A three-year transfer of equipment and engineering skills improves civilian construction and research. The mission leaves if war with Germany begins."
 LTB_armed_neutrality_idea:0 "Armed Neutrality"
 LTB_armed_neutrality_idea_desc:0 "The Union follows an independent foreign policy and prepares its border defenses. Joining a faction ends this policy."
 NWW_LTB_diplomatic_agreement:0 "Agreement with the Union"
 NWW_LTB_trade_partner:0 "Industrial Trade Partner"
 ltb.130.t:0 "A Union Non-Aggression Proposal"
 ltb.130.d:0 "The Lithuanian-Belarusian Union proposes peace at our shared border. Its delegates offer a non-aggression pact and technical exchange, paving the way for a trade commission without bringing the Union into our alliance system."
 ltb.130.a:0 "Sign the pact and receive the delegates"
 ltb.130.b:0 "We will not restrict our freedom of action"
 ltb.131.t:0 "A Border Settlement with the Union"
 ltb.131.d:0 "The Union proposes recognition of the existing border and withdrawal of mutual territorial claims. A non-aggression pact could lead to defensive cooperation without transferring a single province."
 ltb.131.a:0 "Recognize the border and sign the pact"
 ltb.131.b:0 "Our claims remain in force"
 ltb.132.t:0 "An Industrial Agreement with the Union"
 ltb.132.d:0 "The Union requests an engineering mission and industrial equipment. It will pay for the programme's organization; our companies gain orders and a trading partner between Baltic and eastern markets."
 ltb.132.a:0 "Approve the mission and deliveries"
 ltb.132.b:0 "Our engineers are needed at home"
 ltb.133.t:0 "Mutual Guarantees with the Union"
 ltb.133.d:0 "Following the border settlement, the Union proposes mutual guarantees of independence. An attack on either side could bring the other to its defense. The protocol does not automatically create a common faction."
 ltb.133.a:0 "Our neighbor's independence strengthens ours"
 ltb.133.b:0 "Retain our freedom of action"
 ltb.134.t:0 "An Invitation to PBMAT"
 ltb.134.d:0 "The Union has founded PBMAT and invites Poland to turn its existing guarantees into a common defensive alliance. Acceptance makes Poland a full member."
 ltb.134.a:0 "Join PBMAT"
 ltb.134.b:0 "The existing guarantees are sufficient"
 ltb.140.t:0 "Moscow Accepts"
 ltb.140.d:0 "The non-aggression pact is signed. Technical exchange begins, allowing the Union to establish the Dvina Border Commission and expand eastern trade."
 ltb.140.a:0 "Begin the commission's work"
 ltb.141.t:0 "Warsaw Recognizes the Border"
 ltb.141.d:0 "Poland has accepted the withdrawal of mutual claims and signed the pact. No province changes hands. Mutual guarantees of independence can now be discussed."
 ltb.141.a:0 "Security is the next step"
 ltb.142.t:0 "The German Mission Arrives"
 ltb.142.d:0 "The industrial agreement is approved. The Union has paid for a three-year mission, received technical materials and secured machine-tool supplies for new Minsk enterprises."
 ltb.142.a:0 "Begin modernization"
 ltb.143.t:0 "Negotiations End Without Agreement"
 ltb.143.d:0 "The foreign delegation has refused our proposal. Treaty rewards and the continuation of this programme have not been obtained. The Union can approach other neighbors and strengthen armed neutrality."
 ltb.143.a:0 "Our sovereignty remains our own"
 ltb.144.t:0 "The Defense Protocol Is Signed"
 ltb.144.d:0 "Poland and the Union have guaranteed each other's independence. Once PBMAT is founded, Warsaw can be invited into a common defensive alliance."
 ltb.144.a:0 "Honor our commitments"
 ltb.145.t:0 "Poland Joins PBMAT"
 ltb.145.d:0 "Warsaw has accepted the invitation. Bilateral guarantees have grown into a common alliance and Poland has joined PBMAT."
 ltb.145.a:0 "We now act together"
