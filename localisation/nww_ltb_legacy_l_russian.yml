 ltb.150.t:0 "Французские станки для Союза"
 ltb.150.d:0 "Литовско-Белорусский Союз предлагает оплатить поставку станков для нового предприятия в Минске. Заказ свяжет французских производителей с промышленными зонами Союза."
 ltb.150.a:0 "Принять заказ"
 ltb.150.b:0 "Отказаться от поставок"
 ltb.152.t:0 "Французское оборудование прибывает"
 ltb.152.d:0 "Париж принял заказ. Оплаченные станки и технические материалы позволят открыть новое гражданское предприятие в Минске, если город остаётся под нашим контролем."
 ltb.152.a:0 "Пустить станки в работу"
 ltb.151.t:0 "Предложение научного обмена"
 ltb.151.d:0 "Университеты Союза предлагают Италии взаимный обмен исследованиями. Общая программа поможет быстрее изучать уже известные партнёру технологии, сохраняя самостоятельность каждой стороны."
 ltb.151.a:0 "Открыть общую программу"
 ltb.151.b:0 "Оставить исследования при себе"
 ltb.153.t:0 "Научный договор с Италией"
 ltb.153.d:0 "Рим одобрил предложение. Обе страны присоединились к общей исследовательской программе; сотрудничество действует, пока между нами сохраняется мир."
 ltb.153.a:0 "Обменяться первыми разработками"
