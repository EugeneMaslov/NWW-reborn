l_russian:
 LTB_free_economic_zones:0 "Свободные экономические зоны"
 LTB_free_economic_zones_desc:0 "Выделим промышленным площадкам устойчивые правила для вложений и вывоза продукции. Новая фабрика в Каунасе и временные льготы помогут превратить частный капитал в рабочие места."
 LTB_polesie_peat:0 "Разработка торфа в Полесье"
 LTB_polesie_peat_desc:0 "Разработаем торфяные месторождения Полесья и наладим поставки местного топлива электростанциям и заводским котельным. Собственная сырьевая база и более экономное расходование энергии укрепят промышленность Союза."
 LTB_union_mining_program:0 "Рудники Союза"
 LTB_union_mining_program_desc:0 "Расширим сырьевую базу заводов и освоим новые методы добычи. Программа обеспечит промышленность дополнительной сталью и подготовит специалистов по разработке месторождений."
 LTB_timoshenko_industrial_board:0 "Промышленный совет Тимошенко"
 LTB_timoshenko_industrial_board_desc:0 "Опыт Тимошенко в промышленной организации пригодится для согласования военных заказов, освоения серийного производства и открытия нового оружейного завода. Предприятия получат доступ к собственным программам расширения."
 LTB_professional_contract_army:0 "Контрактная армия"
 LTB_professional_contract_army_desc:0 "Меньший, но лучше подготовленный кадровый состав станет основой армии Союза. Повышенная организация и сокращённая подготовка будут оплачены ограничением доступного призывного контингента."
 LTB_national_resilience:0 "Укрепить национальное сознание"
 LTB_national_resilience_desc:0 "Защита общего государства не должна стирать литовскую и белорусскую идентичность. Подготовим местные органы гражданской обороны и укрепим решимость защищать национальные территории Союза."
 LTB_minsk_university:0 "Минский университет"
 LTB_minsk_university_desc:0 "Минские кафедры дополнят Виленский университет общей сетью лабораторий и инженерных школ. Исследования получат постоянную поддержку, а университетский концерн — улучшенную программу."
 LTB_rocket_research:0 "Ракетные технологии"
 LTB_rocket_research_desc:0 "Объединим исследования двигателей и ракетных систем в университетскую программу. Нашим инженерам нужны испытания и расчёты, прежде чем эти технологии смогут служить стране."
 LTB_peaceful_atom:0 "Мирный атом"
 LTB_peaceful_atom_desc:0 "Начнём университетские исследования атомной энергии. Подготовка физиков и создание лабораторий заложат научную основу для будущих ядерных и энергетических проектов Союза."
 LTB_french_machine_tools:0 "Закупка французских станков"
 LTB_french_machine_tools_desc:0 "Свободные экономические зоны позволяют предложить французским предприятиям оплачиваемую поставку станков. При согласии Парижа оборудование обеспечит новое гражданское предприятие в Минске."
 LTB_italian_research_exchange:0 "Исследовательский договор с Италией"
 LTB_italian_research_exchange_desc:0 "Предложим Италии обмен исследованиями. Если Рим согласится, обе страны получат бонус при изучении уже известных партнёру технологий; война остановит сотрудничество."
 LTB_multinational_air_program:0 "Международная авиационная программа"
 LTB_multinational_air_program_desc:0 "Используем действующее германское, французское или итальянское соглашение для работы над авиационными технологиями. Минские и курляндские авиастроители получат доступ к отдельным программам развития."
 LTB_investment_zones:0 "Инвестиционные зоны"
 LTB_investment_zones_desc:0 "Согласованные льготы направляют заказы и капитал в гражданскую промышленность."
 LTB_peat_energy:0 "Топливо Полесья"
 LTB_peat_energy_desc:0 "Торф и местные котельные уменьшают энергетические расходы промышленности."
 LTB_industrial_mobilization_board:0 "Промышленный совет Союза"
 LTB_industrial_mobilization_board_desc:0 "Общие заказы и производственные стандарты ускоряют освоение новых линий."
 LTB_contract_officers:0 "Кадровая контрактная армия"
 LTB_contract_officers_desc:0 "Профессиональная подготовка повышает организацию войск, ограничивая массовый призыв."
 LTB_national_resilience_idea:0 "Решимость двух народов"
 LTB_national_resilience_idea_desc:0 "Литовские и белорусские общины готовятся совместно защищать национальные территории."
 LTB_university_network:0 "Сеть университетов Союза"
 LTB_university_network_desc:0 "Вильно и Минск делят лаборатории, специалистов и результаты исследований."
 LTB_french_machine_tools_request_tt:0 "Предложить Франции поставку станков. При её согласии и наличии 50 политической власти: промышленный исследовательский бонус и новая гражданская фабрика в контролируемом Минске."
 LTB_italian_research_request_tt:0 "Предложить Италии взаимный исследовательский обмен. При согласии обе страны войдут в программу: +5% к скорости изучения технологии за партнёра, уже изучившего её. Во время войны сотрудничество не действует."
 NWW_LTB_italian_research_name:0 "Союзно-итальянская научная программа"
 NWW_LTB_italian_research_desc:0 "Обмен знаниями между университетами Союза и Италии ускоряет изучение технологий, уже освоенных партнёром."
 LTB_minsk_industry_company_advanced:0 "Союз станкостроителей"
 LTB_vilnius_university_concern_company_advanced:0 "Виленско-Минская сеть лабораторий"
 NWW_LTB_machine_tool_concern:0 "Локальное станкостроение"
 NWW_LTB_machine_tool_concern_desc:0 "Станки собственного производства помогают гражданским заводам строиться быстрее и экономить энергию."
 NWW_LTB_machine_tool_concern_advanced:0 "Союзный стандарт станков"
 NWW_LTB_machine_tool_concern_advanced_desc:0 "Согласованные стандарты улучшают строительство, освоение производственных линий и энергетическую эффективность."
 NWW_LTB_electronics_laboratories:0 "Прикладная электроника"
 NWW_LTB_electronics_laboratories_desc:0 "Университетские лаборатории превращают фундаментальные исследования в полезные приборы."
 NWW_LTB_university_laboratories:0 "Общая лабораторная сеть"
 NWW_LTB_university_laboratories_desc:0 "Объединение Вильно и Минска ускоряет исследования и повышает предельную эффективность производства."
 LTB_belmash_specialization:0 "Балтийские лёгкие танки"
