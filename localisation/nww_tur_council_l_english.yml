l_english:
 NWW_TUR_imperial_crisis:0 "The Sick Man of Europe"
 NWW_TUR_imperial_crisis_desc:0 "The Empire survived decades without a great European war, yet the court, officer corps and provinces still compete for authority. Open political negotiations, then reach separate accords with the officers, ulema and provincial councils. Each completed accord eases the shared crisis; the Imperial Compact focus completes the settlement."
 NWW_TUR_imperial_crisis_1:0 "The Sick Man of Europe"
 NWW_TUR_imperial_crisis_1_desc:0 "The first accord has restored some authority to the cabinet. Two other influential groups still demand guarantees, so the crisis is only partly resolved."
 NWW_TUR_imperial_crisis_2:0 "The Sick Man of Europe"
 NWW_TUR_imperial_crisis_2_desc:0 "The main disputes have eased, but the common settlement is not yet law. Complete negotiations with all three groups, then ratify their guarantees through the Imperial Compact."
 NWW_TUR_imperial_compact:0 "The Imperial Compact"
 NWW_TUR_imperial_compact_desc:0 "The accords with the officer corps, ulema and provincial councils are united in a common law. The army receives dependable funding, religious institutions gain guarantees, and the provinces obtain representation. The cabinet can now modernize the state within its chosen political course."
 NWW_TUR_balkan_administration:0 "Administration of the Balkan Provinces"
 NWW_TUR_balkan_administration_desc:0 "Local councils, common tax regulations and an army supply service help consolidate control in the Balkans. This administrative program does not automatically turn conquered territory into core states."
 NWW_TUR_war_industry:0 "Imperial War Contracts"
 NWW_TUR_war_industry_desc:0 "State arsenals and private suppliers work to common standards. Long-term orders accelerate military factory construction and increase weapons output."
 NWW_TUR_imperial_councils:0 "Imperial Councils"
 NWW_TUR_imperial_councils_desc:0 "The central government cannot impose terms on every influential group at once. Negotiate with the officers, ulema and provincial councils in succession: each negotiation takes 45 days and costs 50 political power. Completed accords gradually ease the Sick Man of Europe and unlock the Imperial Compact. Loss of independence cancels the current negotiation and refunds its cost."
 NWW_TUR_negotiate_officers:0 "Reach an Accord with the Officer Corps"
 NWW_TUR_negotiate_officers_desc:0 "The officers demand reliable pay, professional promotion and clear boundaries between military command and politics. Over 45 days the cabinet negotiates a service program. The accord grants 10 army experience, 5% war support and eases the imperial crisis. Other negotiations remain unavailable during these talks."
 NWW_TUR_negotiate_ulema:0 "Negotiate Guarantees with the Ulema"
 NWW_TUR_negotiate_ulema_desc:0 "The ulema fear that modernization will destroy their schools and charitable institutions. The cabinet offers accountable funding and gradual educational reform. After 45 days the accord grants 5% stability and eases the imperial crisis. Other negotiations remain unavailable during these talks."
 NWW_TUR_negotiate_provinces:0 "Convene the Provincial Councils"
 NWW_TUR_negotiate_provinces_desc:0 "Provincial delegates demand fair taxation, local representation and rules protecting their communities. Over 45 days, negotiations establish their part in the common reform. The completed accord returns 25 political power to the cabinet and eases the imperial crisis. Other negotiations remain unavailable during these talks."
 nww_tur_council.1.t:0 "Service Instead of Court Intrigue"
 nww_tur_council.1.d:0 "Representatives of the officer corps have signed an accord with the cabinet. Pay and arms purchases will be approved in advance, while promotion should depend on training and experience. Commanders in turn recognize the authority of the established political institutions.\n\nThe officers have not become a single political party, but they now have a reason to support the common reform. The other influential groups must still be brought into the settlement."
 nww_tur_council.1.a:0 "The army has a clear task."
 nww_tur_council.2.t:0 "Guarantees for the Ulema"
 nww_tur_council.2.d:0 "Long sessions have ended in an agreement on schools, charitable funds and the position of religious institutions. The cabinet has rejected immediate confiscation, while the ulema accept accountability and gradual educational reform.\n\nThis is an agreement on administration, rather than a mandate for the clergy to determine the entire political course. The Empire can move forward once the other participants also receive clear guarantees."
 nww_tur_council.2.a:0 "The reforms gain public support."
 nww_tur_council.3.t:0 "A Voice for the Provinces"
 nww_tur_council.3.d:0 "Delegates from Anatolia, the Arab provinces and other communities have agreed with the cabinet on taxation and representation. In return for obligations to the central government, local councils receive defined rights and a way to appeal arbitrary official decisions.\n\nAn order alone cannot preserve a multinational empire. This accord gives the provinces a reason to take part in the common reform rather than seek protection outside its borders."
 nww_tur_council.3.a:0 "The common settlement must account for local interests."
 nww_tur_council.4.t:0 "The Imperial Compact Is Ratified"
 nww_tur_council.4.d:0 "The accords with the officer corps, ulema and provincial councils have been united in a common law. For the first time in years, the cabinet can rely on agreed rules for service, education and local representation.\n\nThe compact does not end every dispute or turn all subjects into one people. It establishes rules for addressing those disputes and allows the state to move from a prolonged crisis toward modernization."
 nww_tur_council.4.a:0 "We can now build for the future."
 NWW_TUR_officer_accord:0 "An accord has been reached with the officer corps"
 NWW_TUR_ulema_accord:0 "Guarantees have been agreed with the ulema"
 NWW_TUR_provincial_accord:0 "An accord has been reached with the provincial councils"
