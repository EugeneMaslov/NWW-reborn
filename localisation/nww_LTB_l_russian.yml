l_russian:
 LTB_focus: "Союз Литвы и Беларуси"
 LTB_consolidate_the_union: "Укрепить Союз"
 LTB_consolidate_the_union_desc: "Каунас и Минск должны говорить в один голос, пока гиганты вокруг не решили нашу судьбу за нас."
 ltb.112.a: "Союз больше не удержать"
 LTB_rebuild_the_bridge: "Восстановить мост"
 LTB_rebuild_the_bridge_desc: "Союз силён только настолько, насколько крепки дороги, заводы и доверие между Вильнюсом и Минском."
 LTB_baltic_bridgehead: "Балтийский плацдарм"
 LTB_baltic_bridgehead_desc: "Компактный и вооружённый Союз ещё может стать поворотным пунктом в Балтике."
 LTB_the_vilnius_compromise: "Виленский компромисс"
 LTB_the_vilnius_compromise_desc: "Широкая автономия для Беларуси в составе Союза. В школах Минска будут учить по-белорусски."
 LTB_vilnius_compromise_deadline:0 "Провести Виленский компромисс"
 LTB_vilnius_compromise_deadline_desc:0 "У Союза есть 210 дней, чтобы решить национальный вопрос. Выполни решение, чтобы принять компромисс; иначе кризис заставит выбрать государство-преемника."
 LTB_choose_lithuania:0 "Продолжить за Литву"
 LTB_choose_lithuania_desc:0 "Распустить Союз и продолжить кампанию за Литву."
 LTB_choose_belarus:0 "Продолжить за Беларусь"
 LTB_choose_belarus_desc:0 "Распустить Союз и продолжить кампанию за Беларусь."
 LTB_kaunas_first: "Каунас — прежде всего"
 LTB_kaunas_first_desc: "Союз держится, лишь пока Каунас держит вожжи. Литва ведёт, Беларусь следует."
 LTB_belarusian_schools: "Белорусские школы"
 LTB_belarusian_schools_desc: "Грамотный крестьянин — верный гражданин."
 LTB_land_for_the_tillers: "Земля — пахарям"
 LTB_land_for_the_tillers_desc: "Раздробить крупные имения. Тот, кто владеет полем, будет его защищать."
 LTB_the_seimas_of_kaunas: "Сейм Каунаса"
 LTB_the_seimas_of_kaunas_desc: "Собрать нотаблей и дать центральной власти настоящий мандат."
 LTB_mobilize_the_sauliai: "Мобилизовать шауляй"
 LTB_mobilize_the_sauliai_desc: "Союз стрелков станет хребтом национальной армии."
 LTB_face_the_crisis: "Встретить кризис"
 LTB_face_the_crisis_desc: "Национальный вопрос больше нельзя откладывать. Реши судьбу Союза."
 LTB_union_general_staff: "Генеральный штаб Союза"
 LTB_union_general_staff_desc: "Одна армия, один штаб, два народа под одним знаменем."
 LTB_the_minsk_school: "Минская школа"
 LTB_the_minsk_school_desc: "Белорусские офицеры принесли суровые уроки восточных войн."
 LTB_timoshenkos_doctrine: "Доктрина Тимошенко"
 LTB_timoshenkos_doctrine_desc: "Глубокая оборона, быстрые резервы и ни шагу назад на родной земле."
 LTB_officers_of_two_nations: "Офицеры двух народов"
 LTB_officers_of_two_nations_desc: "Смешанные юнкерские училища скуют единый офицерский корпус."
 LTB_fortify_the_dvina: "Укрепить Двину"
 LTB_fortify_the_dvina_desc: "Западная Двина должна стать стеной против любого захватчика."
 LTB_minsk_arsenal_works: "Минский арсенал"
 LTB_minsk_arsenal_works_desc: "Союз, который не может себя вооружить, — союз лишь на бумаге."
 LTB_electrify_the_union: "Электрифицировать Союз"
 LTB_electrify_the_union_desc: "Линии электропередач от Каунаса до Витебска."
 LTB_neman_trade_company: "Неманская торговая компания"
 LTB_neman_trade_company_desc: "Неман несёт наш лес и лён к морю."
 LTB_workers_of_minsk_and_kaunas: "Рабочие Минска и Каунаса"
 LTB_workers_of_minsk_and_kaunas_desc: "Хлеб и порядок удержат заводы в верности."
 LTB_balance_between_giants: "Баланс между гигантами"
 LTB_balance_between_giants_desc: "Германия, Польша, Россия — мы выживем, балансируя между всеми тремя."
 LTB_overture_to_moscow: "Реверанс Москве"
 LTB_overture_to_moscow_desc: "Торговля и инженеры с востока — без цепей в придачу."
 LTB_the_polish_question: "Польский вопрос"
 LTB_the_polish_question_desc: "Вильно когда-то был их притязанием. Пора свести старые счёты."
 LTB_german_engineers: "Германские инженеры"
 LTB_german_engineers_desc: "Крупповская сталь и прусская муштра для армии Союза."
 LTB_unresolved_national_question: "Неразрешённый национальный вопрос"
 LTB_unresolved_national_question_desc: "Литовцы и белорусы делят государство, но ещё не нацию."
 LTB_vilnius_compromise: "Виленский компромисс"
 LTB_vilnius_compromise_desc: "Автономия купила верность Минска."
 LTB_kaunas_centralism: "Каунасский централизм"
 LTB_kaunas_centralism_desc: "Порядок сверху, по-литовски."
 LTB_minsk_arsenal: "Минский арсенал"
 LTB_minsk_arsenal_desc: "Собственная военная промышленность Союза."
 LTB_union_army_tradition: "Традиции армии Союза"
 LTB_union_army_tradition_desc: "Два народа, один офицерский корпус."
 LTB_ZARETCHKY_DESC: "Президент Союза, осторожный демократ."
 LTB_GARUN_DESC: "Премьер-министр, мастер компромиссов."
 LTB_MELEZH_DESC: "Голос белорусских коммунистов."
 LTB_LEVITSKY_DESC: "Вождь литовских националистов."
 LTB_TIMOSHENKO_DESC: "Строитель армии Союза."
 LTB_BELYATSKY_DESC: "Старый кавалерист трёх войн."
 LTB_ABRAMIENKA_DESC: "Защитник Минска."
 LTB_focus_desc: "Общее дерево фокусов Литвы и Беларуси."
 LTB_observe_the_skies: "Смотреть в небо"
 LTB_observe_the_skies_desc: "Сегодня пара самолётов, завтра — воздушный флот."
 LTB_kaunas_air_club: "Каунасский аэроклуб"
 LTB_kaunas_air_club_desc: "Спортивные пилоты — лучшие военные лётчики."
 LTB_vitebsk_airfield: "Витебский аэродром"
 LTB_vitebsk_airfield_desc: "Бетонная полоса на восточной границе."
 LTB_memel_shipyards:0 "Мемельские верфи"
 LTB_memel_shipyards_desc:0 "Превратим портовые мастерские в небольшую базу военного судостроения."
 LTB_baltic_patrols:0 "Балтийское патрулирование"
 LTB_baltic_patrols_desc:0 "Защитим торговые пути и прибрежные подступы Союза."
 LTB_coastal_flotilla:0 "Прибрежная флотилия"
 LTB_coastal_flotilla_desc:0 "Небольшой флот патрульных кораблей усложнит рейды на балтийское побережье."
 LTB_the_union_endures: "Союз выстоял"
 LTB_the_union_endures_desc: "Вопреки всему Каунас и Минск всё ещё вместе."
 LTB_the_pbmat_pact: "Пакт ПБМАТ"
 LTB_the_pbmat_pact_desc: "Военный союз земель между Германией и Россией."
 LTB_fortress_vitebsk: "Крепость Витебск"
 LTB_fortress_vitebsk_desc: "Восточные ворота Союза должны держать."
 LTB_two_nations_one_voice: "Два народа — один голос"
 LTB_two_nations_one_voice_desc: "Поколение компромисса берёт власть."
 LTB_the_1926_legacy: "Наследие 1926-го"
 LTB_the_1926_legacy_desc: "Поколение переворота передаёт стабильную республику."
 LTB_cavalry_inspectorate: "Кавалерийская инспекция"
 LTB_cavalry_inspectorate_desc: "Лошади всё ещё решают на восточных равнинах."
 LTB_border_guard_corps: "Корпус пограничной стражи"
 LTB_border_guard_corps_desc: "Каждая верста границы под надзором."
 LTB_vilnius_radio: "Виленское радио"
 LTB_vilnius_radio_desc: "Голос Союза на каждой волне."
 LTB_kaunas_textile: "Каунасский текстиль"
 LTB_kaunas_textile_desc: "Лён для мундиров, лён на экспорт."
 LTB_crown_the_regency: "Короновать регентство"
 LTB_crown_the_regency_desc: "Корона выше партий, нация выше ссор."
 LTB_restore_the_grand_duchy: "Восстановить Великое княжество"
 LTB_restore_the_grand_duchy_desc: "От Балтики до Чёрного моря — как когда-то."
 LTB_order_and_tradition: "Порядок и традиция"
 LTB_order_and_tradition_desc: "Что держалось веками, удержится вновь."
 LTB_free_elections_now: "Свободные выборы — сейчас"
 LTB_free_elections_now_desc: "Бюллетени, а не пули."
 LTB_landtag_democracy: "Ландтаговая демократия"
 LTB_landtag_democracy_desc: "Парламенты в Каунасе и Минске, единство — в Вильно."
 LTB_free_press_free_union: "Свободная пресса, вольный Союз"
 LTB_free_press_free_union_desc: "Цензура — удел империй."
 LTB_the_iron_wolf_calls: "Железный волк зовёт"
 LTB_the_iron_wolf_calls_desc: "Гедимину снился железный волк. Разбуди его."
 LTB_steel_and_blood: "Сталь и кровь"
 LTB_steel_and_blood_desc: "Нацию выкуют, а не обсудят."
 LTB_one_people_one_leader: "Один народ, один вождь"
 LTB_one_people_one_leader_desc: "Два народа, одна воля, один вождь."
 LTB_red_dawn_over_minsk: "Красный рассвет над Минском"
 LTB_red_dawn_over_minsk_desc: "Восточный ветер несёт перемены."
 LTB_soviets_of_workers: "Советы рабочих"
 LTB_soviets_of_workers_desc: "Вся власть трудовому народу."
 LTB_international_brigades: "Интернациональные бригады"
 LTB_international_brigades_desc: "Добровольцы мировой революции."
 LTB: "Литва-Беларусь"
 LTB_DEF: "Литва-Беларусь"
 LTB_ADJ: "Литовско-белорусский"
 NWW_LTB_DESC: "Союз Литвы и Беларуси."
 NWW_LTB_Ales_Garun:0 "Алесь Гарун"
 NWW_LTB_Michael_Zaretchky:0 "Михаил Зарецкий"
 NWW_LTB_Ivan_Melezh:0 "Иван Мележ"
 LTB_semi_agrarian_economy:0 "Полуаграрная экономика"
 LTB_semi_agrarian_economy_desc:0 "Большая часть Союза зависит от малопродуктивного сельского хозяйства и разрозненных мастерских. Для индустриализации нужны техника и связанные рынки."
 LTB_semi_agrarian_economy_1:0 "Полуаграрная экономика"
 LTB_semi_agrarian_economy_1_desc:0 "Механизация уже повышает производительность, но сельское хозяйство и мелкие мастерские всё ещё сдерживают промышленность."
 LTB_semi_agrarian_economy_2:0 "Полуаграрная экономика"
 LTB_semi_agrarian_economy_2_desc:0 "Кооперативы и электрификация постепенно высвобождают труд и ресурсы для промышленности."
 LTB_semi_agrarian_economy_3:0 "Полуаграрная экономика"
 LTB_semi_agrarian_economy_3_desc:0 "Остался последний этап промышленного плана, после которого аграрный штраф будет снят полностью."
 LTB_depression_legacy:0 "Последствия депрессии"
 LTB_depression_legacy_desc:0 "Великая депрессия оставила заводы без заказов, кредитов стало меньше, а доверие населения пошатнулось. Восстановление требует вложений."
 LTB_depression_legacy_1:0 "Последствия депрессии"
 LTB_depression_legacy_1_desc:0 "Общественные работы вернули часть производств к жизни, но последствия депрессии ещё ощущаются."
 LTB_disorganized_army:0 "Дезорганизованная армия"
 LTB_disorganized_army_desc:0 "Разобщённая администрация Союза не смогла создать единую систему командования вооружёнными силами."
 LTB_agricultural_mechanization:0 "Механизация сельского хозяйства"
 LTB_agricultural_mechanization_desc:0 "Тракторы, удобрения и кооперативные склады повысят урожайность и освободят рабочие руки для заводов."
 LTB_cooperative_farms:0 "Сельскохозяйственные кооперативы"
 LTB_cooperative_farms_desc:0 "Общие машины и склады сократят потери и наладят поставки продовольствия в города."
 LTB_rural_electrification:0 "Электрификация деревни"
 LTB_rural_electrification_desc:0 "Подключим сельскую местность и её мастерские к промышленной сети."
 LTB_depression_recovery:0 "Выход из депрессии"
 LTB_depression_recovery_desc:0 "Государственные заказы и общественные работы вернут бездействующие мастерские к жизни."
 LTB_factory_reconstruction:0 "Восстановление заводов"
 LTB_factory_reconstruction_desc:0 "Новое оборудование и стабильные заказы завершат восстановление производства после депрессии."
 LTB_minsk_machine_works:0 "Минский машиностроительный завод"
 LTB_minsk_machine_works_desc:0 "Будем производить станки, на которых создаётся всё остальное."
 LTB_armaments_plant:0 "Союзный оружейный завод"
 LTB_armaments_plant_desc:0 "Направим мощности на винтовки, боеприпасы и военные заказы."
 LTB_military_contracts:0 "Военные контракты"
 LTB_military_contracts_desc:0 "Обеспечим новую военную промышленность Союза долгосрочными заказами."
 LTB_union_industrial_plan:0 "Промышленный план Союза"
 LTB_union_industrial_plan_desc:0 "Согласуем вложения обеих республик и направим их на долгосрочные нужды Союза."
