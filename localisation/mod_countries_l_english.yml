l_english:
 NWW_1936_NAME: "No World War"
 NWW_1936_DESC: "January 1, 1936. The Great War ended twenty years ago, and the world holds its breath in an uneasy peace."
 NWW_GER_DESC: "The German Empire endures under Kaiser Wilhelm II."
 NWW_FRA_DESC: "France avoided a world war and preserved its people, industry and scientific schools. Yet the Third Republic is mired in cabinet crises, the depression has divided society and overseas territories demand a new settlement. Reform parliament, restore the crown, empower labour organisations or entrust the country to a military cabinet: the choice determines which France will face the next European conflict."
 NWW_ENG_DESC: "The British Empire."
 NWW_SOV_DESC: "The Union of Soviet Socialist Republics."
 NWW_ITA_DESC: "The Kingdom of Italy."
 NWW_JAP_DESC: "The Empire of Japan."
 NWW_USA_DESC: "The United States of America."
 NWW_CHI_DESC: "The Republic of China, whole and undivided."
 NWW_AUS_DESC: "The Austrian Republic."
 NWW_HUN_DESC: "The Kingdom of Hungary."
 NWW_TUR_DESC: "The Ottoman Empire."
 NWW_YUG_DESC: "The Kingdom of Yugoslavia."
 NWW_CRO_DESC: "The State of Croatia."
 NWW_POL_DESC:0 "Poland regained independence during the Great Tumult of 1918–1922 and occupied Galicia, but remained landlocked. Poznan, Danzig and Silesia belong to Germany. After Pilsudski’s death, Sanation is divided between the Castle and the Colonels; German investment supports industry at the price of dependence. Austria demands Galicia, while the Vilnius dispute obstructs agreement with Lithuania-Belarus. Will the republic preserve independence, bargain with Berlin, pursue national revolution or embrace the Red Vistula?"
 NWW_ROM_DESC: "The Kingdom of Romania."
 NWW_OTHER_DESC: "The rest of the world."
 GER_WILHELM_II_DESC: "Emperor and King of Prussia, the last Kaiser."
 GER_WILHELM_III_DESC: "The heir of the Hohenzollern throne."
