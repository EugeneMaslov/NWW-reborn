<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-labelledby="title desc">
  <title id="title">NWW Reborn</title>
  <desc id="desc">A stylized banner for the NWW Reborn mod: Lithuania, Belarus, Ukraine, and the Baltic front.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e1722"/>
      <stop offset="100%" stop-color="#1a2c3d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1c2d39"/>
      <stop offset="100%" stop-color="#0d1b26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d9be7c"/>
      <stop offset="100%" stop-color="#b18642"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="512" fill="url(#bg)"/>

  <g opacity="0.2">
    <path d="M0,80 H1024 M0,160 H1024 M0,240 H1024 M0,320 H1024 M0,400 H1024" stroke="#6d8793" stroke-width="1"/>
  </g>

  <rect x="140" y="80" width="744" height="352" rx="28" fill="url(#panel)" stroke="#d9be7c" stroke-width="4"/>

  <g fill="none" stroke="#d9be7c" stroke-opacity="0.5" stroke-width="3">
    <line x1="170" y1="120" x2="210" y2="120"/>
    <line x1="250" y1="120" x2="290" y2="120"/>
    <line x1="330" y1="120" x2="370" y2="120"/>
    <line x1="410" y1="120" x2="450" y2="120"/>
    <line x1="490" y1="120" x2="530" y2="120"/>
    <line x1="570" y1="120" x2="610" y2="120"/>
    <line x1="650" y1="120" x2="690" y2="120"/>
    <line x1="730" y1="120" x2="770" y2="120"/>

    <line x1="170" y1="392" x2="210" y2="392"/>
    <line x1="250" y1="392" x2="290" y2="392"/>
    <line x1="330" y1="392" x2="370" y2="392"/>
    <line x1="410" y1="392" x2="450" y2="392"/>
    <line x1="490" y1="392" x2="530" y2="392"/>
    <line x1="570" y1="392" x2="610" y2="392"/>
    <line x1="650" y1="392" x2="690" y2="392"/>
    <line x1="730" y1="392" x2="770" y2="392"/>
  </g>

  <g>
    <polygon points="512,146 612,256 512,366 412,256" fill="#183445" stroke="#d9be7c" stroke-width="4"/>
    <polygon points="512,166 588,256 512,346 436,256" fill="none" stroke="#d9be7c" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="512" y1="172" x2="512" y2="340" stroke="#d9be7c" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="442" y1="256" x2="582" y2="256" stroke="#d9be7c" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <text x="512" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f0e0ae">NWW Reborn</text>
  <text x="512" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c7dbe1" letter-spacing="2">LITHUANIA • BELARUS • UKRAINE • BALTIC FRONT</text>
  <text x="512" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#d9be7c">The Union breaks. The Free Territory rises. The map redraws itself.</text>
</svg>
