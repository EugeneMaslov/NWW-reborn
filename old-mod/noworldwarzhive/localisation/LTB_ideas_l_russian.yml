  Michael_Zaretchky_desc:0 "Первый президент Литовско-Белорусской Республики, выбранный 23 июля 1919 года на первый срок, в 1927 году продлил первый свой срок на 9 лет, потом в выборах 1936 года набрал 56% голосов и вышел на второй срок , следующие выборы только в 1946 году."