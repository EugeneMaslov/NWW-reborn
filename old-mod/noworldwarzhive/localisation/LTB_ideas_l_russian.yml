  LTB_fascism_1:0 "Прирост поддержки Левицкистов"
  LTB_fascism_1_desc:0 "Население ведется на пропаганду Левицкого"
  LTB_fascism_2:0 "Национальный совет"
  LTB_fascism_2_desc:0 "Национальный совет поможет новому главе государства в восстановлении страны после демократии"
  LTB_fascism_3:0 "Народная воля"
  LTB_fascism_3_desc:0 "Население хочет воевать, зачем лишать его такого удовольствия?"
  LTB_democratic_1:0 "Демократический рост"
