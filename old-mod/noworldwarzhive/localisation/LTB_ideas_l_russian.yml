  LTB_uni:0 "Виленский Университет"
  LTB_uni_desc:0 "Виленский Университет самый передовой в мире университет , благодаря которому мы не нуждаемся в сторонней помощи нашему государству."
  LTB_fort:0 "Улучшенная демографическая политика"
  LTB_fort_desc:0 "Новая демографическая политика, принятая президентом в 1924 году за 12 лет увеличила численность населения нашего государства в 3 раза , а в одном только Минске население стало выше, чем во всей Беларуси в 1924."
  LTB_pbp:0 "ПБДОВ"
  LTB_pbp_desc:0 "ПБДОВ (Польско-Белорусский договор о взаимопомощи) - союз, заключенный в 1928 году для объединенного развития и обороны против агрессоров с востока и запада."
  LTB_pbpr:0 "ЕАС"
