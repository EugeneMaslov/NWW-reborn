l_russian:
 LTB_1:0 "Рудники"
 LTB_1_desc:0 "Создание рудников по всей территории государтсва положительно скажется на нашей экономике"
 LTB_2:0 "Механизация"
 LTB_2_desc:0 "Механизированное производство создат почву для развития не только гражданской промышленности, но и военной"
 LTB_3:0 "Индустриализация"
 LTB_3_desc:0 "Нам стоит задуматься об увеличении количества предприятий на фоне быстрорастущей промышленности Советской России"
 LTB_4:0 "Капитализация"
 LTB_4_desc:0 "Нам стоит рассмотреть закон об увеличении процента частных предприятий"
 LTB_5:0 "Улучшение условий"
 LTB_5_desc:0 "Люди должны сами хотеть делать для армии и населения продукцию"
 LTB_6:0 "Армейский комплекс"
 LTB_6_desc:0 "Надо задать начало крупной военной промышленности для защиты нашей родины от восточных орд"
 LTB_7:0 "Мощь Беларуси"
 LTB_7_desc:0 "Беларусь - крупнейшая территория нашей объединенной страны, её история и потенциал даст будущее нашим народам"
 LTB_8:0 "Приватизация"
 LTB_8_desc:0 "Надо передать ещё больше земель под капиталистические нужды, это нам определенно будет выгодно"
 LTB_9:0 "НПР"
 LTB_9_desc:0 "Создать базы для последующего расширения заводов"
 LTB_10:0 "Машиностроение"
 LTB_10_desc:0 "Начинать надо с малого - станки и с/х транспорт поможет нам развить отсталые отрасли"
 LTB_11:0 "Ракетные технологии"
 LTB_11_desc:0 "Ракетные технологии помогут нашему государству во внешней политике"
 LTB_12:0 "СПД"
 LTB_12_desc:0 "Сильная промышленность - залог успеха"
 LTB_13:0 "Коррекция производства"
 LTB_13_desc:0 "Скорректировать производство для выпуска новых видов вооружений и продукции"
 LTB_14:0 "Танкостроение"
 LTB_14_desc:0 "Нашему государству следует учиться создавать танки, без них новая война с восточными ордами не сулит ничего хорошего"
 LTB_15:0 "Белмаш-1"
 LTB_15_desc:0 "Монополия Белмаш известна уже всем в стране, возможно, стоит им помочь)"
 LTB_16:0 "Автобусостроение"
 LTB_16_desc:0 "Наша промышленность должна производить хоть что-то, что нужно Западным и Восточным странам"
 LTB_17:0 "Гражданская позиция"
 LTB_17_desc:0 "Выступить за проведения реформ промышленности исходя из решений представительной власти"
 LTB_18:0 "Тимошенко-indust"
 LTB_18_desc:0 "Тимошенко, будучи хорошим генералом, в прошлом был хорошим бизнесменом. Почему бы не воспользоваться его знаниями в построении новых промышленных образований? "
 LTB_19:0 "Реформа образования"
 LTB_19_desc:0 "Система образования, хоть и не устаревшая, а принятая в 1923 году, всё равно устарела на фоне новых открытий ученых всего мира"
 LTB_20:0 "Технологии Пехоты"
 LTB_20_desc:0 "Стоит принять во внимание то, что наша армия по вооружению всё ещё на уровне 20-х годов, надо это исправить"
 LTB_21:0 "Перевооружение"
 LTB_21_desc:0 "Армию следует реформировать, так как орды с востока уже готовят свои войска на границе с нами"
 LTB_22:0 "Белорусская наука"
 LTB_22_desc:0 "Наука Белорусско-Литовского государства имеет большой потенциал, может займемся чем-то химическим?"
 LTB_23:0 "Минский Универститет"
 LTB_23_desc:0 "Стоит открыть университет, который будет не хуже Виленского, чтобы наши ученые умели больше возможностей"
 LTB_24:0 "Контрактная армия"
 LTB_24_desc:0 "Переход на контракт сократит нашу армию, но даст нам очень амбициозных солдат, которые будут бороться за свою страну до последнего"
 LTB_25:0 "Политика государства"
 LTB_25_desc:0 "Внешняя политика нашего государства очень хрупка, поляки, хоть и заключившие с нами союз, всё равно нас ненавидят, а агрессоры с Востока и Запада только способствуют этому"
 LTB_26:0 "Поддержка Левицкистов"
 LTB_26_desc:0 "Зачем нужна демократия, когда она не может контролировать важные аспекты государства"
 LTB_27:0 "Сохранение демократии"
 LTB_27_desc:0 "Наш строй совершеннен, мы будем дальше улучшать нашу демократию и создадим суверенное государство"
 LTB_28:0 "Реставрация монархии"
 LTB_28_desc:0 "Вся власть одному человеку - зачем нам эта ваша демократия?"
 LTB_29:0 "Поддержка Мележистов"
 LTB_29_desc:0 "Против чего боролись, на то и напоролись"
 LTB_30:0 "Свободные экономические зоны"
 LTB_30_desc:0 "Создать свободные экономические зоны для инвестиций со всего мира"
 LTB_31:0 "Закупка Французских станков"
 LTB_31_desc:0 "Их станки довольно гибкие, и мы можем воспользоваться ими как в военных, так и в мирных целях "
 LTB_32:0 "Закупка Советских станков"
 LTB_32_desc:0 "Советские станки хоть и не совершенны, да и вообще это наш внешнеполитический враг, но в мирных целях, определенно, их станки совершеннее других"
 LTB_33:0 "Закупка Немецких станков"
 LTB_33_desc:0 "Военная промышленность нуждается в совершенных станках, которые как раз производит Германия"
 LTB_34:0 "Сотрудничество в сфере авиации"
 LTB_34_desc:0 "Нам нужно обновить наш технопарк, для этого пригласим Германию, Италию, Совесткую Россию, США, Францию для обговорке объединенного развития авиации"
 LTB_35:0 "Разработка торфа в Полессе"
 LTB_35_desc:0 "Полессе богата болотами, почему бы не использовать торф для нужды государства?"
 LTB_36:0 "Итальянские советники"
 LTB_36_desc:0 "Пригласить Итальянских советников, они помогут в реформах нашего государства"
 LTB_37:0 "Укрепление национального сознания"
 LTB_37_desc:0 "Наш народ - непобедим. Мы будем бороться за каждый клочок земли"
 LTB_38:0 "Исследовательский договор с Италией"
 LTB_38_desc:0 "Итальянцы продвинулись далеко от нас в военном плане, может нам стоит сблизить наши интересы?"
 LTB_39:0 "Третья Белорусско-Советская"
 LTB_39_desc:0 "На этот раз нападение совершим МЫ"
 LTB_40:0 "Договор с Японией"
 LTB_40_desc:0 "Артиллерия Японии развита, может она согласиться продать нам пару образцов и заодно обговорить развитие?"
 LTB_41:0 "Вокруг враги, а мы слабы"
 LTB_41_desc:0 "Нам стоит понимать, что враги повсюду, и сменить нашу внешнию политику, ибо нашему государству не жить"
 LTB_42:0 "Средний рост экономики"
 LTB_42_desc:0 "Рост экономики уже средний, почему бы нам не объявить об этом всему миру?"
 LTB_43:0 "Мирный атом"
 LTB_43_desc:0 "100% в мирных целях"
 LTB_44:0 "Флотские технологии"
 LTB_44_desc:0 "Надо использовать выход к Балтийскому морю"
 LTB_45:0 "Развитие авиации"
 LTB_45_desc:0 "Авиацию не стоит недооценивать, если мы не будем её делать, то наши города станут пеплом"
 LTB_46:0 "Созвать совет националистической партии"
 LTB_46_desc:0 "Экстренный совет по будущему нового государства, который поможет новому канцлеру Литовско-Белорусской империи"
 LTB_47:0 "Высокий рост экономики"
 LTB_47_desc:0 "Экономика лучше большинства стран, что ещё желать?"
 LTB_48:0 "Военный мандат"
 LTB_48_desc:0 "Создание мандатов под военные нужды"
 LTB_49:0 "Союз с Румынией"
 LTB_49_desc:0 "Надо предложить Румынии стать нашим союзником"
 LTB_50:0 "Война с Румынией"
 LTB_50_desc:0 "Румыны дадут нашему альянсу выход к черному морю, что поможет нам в блокировке Советских конвоев"