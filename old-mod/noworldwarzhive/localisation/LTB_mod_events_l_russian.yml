l_russian:
 ltb.1.t:0 "Литовско-Белорусское государство предлагает вступить в альянс"
 ltb.1.d:0 "Литовско-Белорусское государство предлагает нам вступить в альянс против врагов с востока и запада"
 ltb.1.a:0 "Сплотимся ради единой цели"
 ltb.1.b:0 "Не стоит торопить события..."
 ltb.2.t:0 "Румыны соглашаются"
 ltb.2.d:0 "Румыны согласились на наши условия и вступают в альянс"
 ltb.2.a:0 "Теперь мы едины!"
 ltb.3.t:0 "Румыны отказываются"
 ltb.3.d:0 "Румыны отказались вступить в альянс и понесут за это наказание!"
 ltb.3.a:0 "Они знают нашу альтернативу"